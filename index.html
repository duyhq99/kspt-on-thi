 án A và B đều sai"],"a":2,"c":"TT 06/2025, Điều 12 khoản 1, 5","w":"Quyền điều khiển của Cấp điều độ phân phối tỉnh gồm **tần số của HTĐ phân phối khi vận hành độc lập** và **phụ tải của hệ thống điện phân phối** (Điều 12 TT 06/2025), nên A và B đều đúng.","xh":"","xb":"","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":0},{"m":"Bộ câu cũ ghi \"Cấp điều độ miền\" – không còn đúng.","id":"11f41466","t":6,"q":"Phương thức vận hành hệ thống phân phối điện năm do Cấp điều độ phân phối tỉnh lập, trình cơ quan nào phê duyệt?","o":["Cấp điều độ miền","Tổng công ty Điện lực hoặc Công ty Điện lực tỉnh","Cấp điều độ quốc gia","Tập đoàn Điện lực Việt Nam"],"a":1,"c":"TT 06/2025, Điều 70 khoản 2","w":"Đáp án đúng là **Tổng công ty Điện lực hoặc Công ty Điện lực tỉnh**, khớp với quy định được trích bên dưới.","xh":"Điều 70. Trình tự lập, phê duyệt Phương thức vận hành hệ thống phân","xb":"2. Trên cơ sở Phương thức vận hành hệ thống điện miền năm đã được phê duyệt, Cấp điều độ phân phối tỉnh có trách nhiệm lập, trình Tổng công ty Điện lực hoặc Công ty Điện lực tỉnh phê duyệt Phương thức vận hành hệ thống phân phối điện năm theo các nội dung đã đăng ký tại Điều 66 Thông tư này.","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"Bộ câu cũ ghi \"Cấp điều độ miền\" – không còn đúng.","id":"b071ef3e","t":6,"q":"Phương thức vận hành hệ thống phân phối điện tháng, tuần của tỉnh, thành phố do Cấp điều độ phân phối tỉnh lập, trình cơ quan nào phê duyệt?","o":["Cấp điều độ miền","Cấp điều độ quốc gia","Cục Điều tiết điện lực","Tổng công ty Điện lực hoặc Công ty Điện lực tỉnh"],"a":3,"c":"TT 06/2025, Điều 70 khoản 3","w":"Đáp án đúng là **Tổng công ty Điện lực hoặc Công ty Điện lực tỉnh**, khớp với quy định được trích bên dưới.","xh":"Điều 70. Trình tự lập, phê duyệt Phương thức vận hành hệ thống phân","xb":"3. Phương thức vận hành hệ thống phân phối điện tháng, Phương thức vận hành hệ thống phân phối điện tuần và các phương thức đặc biệt do Cấp điều độ phân phối tỉnh lập trên cơ sở Phương thức vận hành hệ thống điện miền tháng, tuần và các phương thức đặc biệt đã được duyệt, trình Tổng công ty Điện lực hoặc Công ty Điện lực tỉnh phê duyệt.","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"","id":"64f5298e","t":6,"q":"Trước ngày nào hàng năm, Đơn vị điều độ hệ thống điện quốc gia thông báo Phương thức vận hành HTĐ quốc gia năm tới đã được phê duyệt cho EVN, Cấp điều độ miền?","o":["Trước ngày 25 tháng 11","Trước ngày 01 tháng 12","Trước ngày 15 tháng 11","Trước ngày 10 tháng 12"],"a":1,"c":"TT 06/2025, Điều 71 khoản 1 điểm a","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Trước ngày 01 tháng 12**. Xem trích nguyên văn bên dưới.","xh":"Điều 71. Trình tự thông báo, công bố phương thức vận hành","xb":"a) Trước ngày 01 tháng 12 hàng năm, Cấp điều độ quốc gia có trách nhiệm thông báo Phương thức vận hành hệ thống điện quốc gia năm tới (năm N+1) được phê duyệt cho Tập đoàn Điện lực Việt Nam, Cấp điều độ miền và Đơn vị quản lý vận hành và công bố trên Trang thông tin điện tử;","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"","id":"cfa3635d","t":4,"q":"Rơ le 87 hoạt động theo nguyên lý nào?","o":["So lệch dòng điện","So sánh tổng trở","So sánh điện áp","Cả 3 đáp án trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Rơ le **87 là bảo vệ so lệch dòng điện**: so sánh dòng vào và dòng ra khỏi vùng được bảo vệ theo định luật Kirchhoff. Trong điều kiện bình thường hoặc sự cố ngoài vùng, hiệu hai dòng này bằng không, còn sự cố trong vùng thì xuất hiện dòng so lệch nên rơ le tác động. Nó không dùng so sánh tổng trở (đó là rơ le khoảng cách 21) hay so sánh điện áp.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"1b4bf30c","t":4,"q":"Thời gian tác động của rơ le 87 là bao nhiêu?","o":["0.0s","0.3-0.5s","1.0s","2.0s"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Rơ le 87 là bảo vệ so lệch nên **tác động tức thời (0,0 s)**, không cần phối hợp thời gian với bảo vệ khác. Các mốc 0,3–0,5 s, 1,0 s, 2,0 s là thời gian của bảo vệ có phối hợp thời gian như quá dòng.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"9b890299","t":4,"q":"Rơ le 87L bảo vệ cho thiết bị nào?","o":["Đường dây","Thanh cái","Máy biến thế","Cả 3 câu trên đều đúng"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"**87L** là rơ le so lệch **đường dây** (L là Line). 87B bảo vệ thanh cái, 87T bảo vệ máy biến áp, nên không thể nói cả ba.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"e0e31ca5","t":4,"q":"Rơ le 87L có mấy vùng bảo vệ?","o":["Có 1 vùng","Có 2 vùng","Có 3 vùng","Có 4 vùng"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L chỉ có **1 vùng bảo vệ**, giới hạn giữa các biến dòng ở hai đầu đường dây. Rơ le khoảng cách mới có nhiều vùng (vùng 1, 2, 3).","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"763b7af1","t":4,"q":"Vùng bảo vệ của rơ le 87L là phần nằm giữa:","o":["Tất cả các câu trên đều đúng","2 CT 2 đầu của đường dây đơn","3 CT 3 đầu của đường dây hình chữ T","Tất cả các CT của các đường dây có nhiều nhánh"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Vùng bảo vệ của 87L nằm **giữa các biến dòng ở các đầu đường dây**, dù đường dây đơn có 2 đầu, đường dây rẽ chữ T có 3 đầu, hay đường dây nhiều nhánh có nhiều đầu. Vì cả ba trường hợp đều đúng nên chọn \"tất cả\".","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"fa13dcad","t":4,"q":"Rơ le 87L có thể bảo vệ dự phòng cho máy đường dây kế tiếp?","o":["Không thể dự phòng","1 đường dây","2 đường dây","Tùy theo tính toán trị số cài đặt"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L chỉ bảo vệ trong vùng giữa các CT hai đầu, nên **không thể dự phòng** cho đường dây kế tiếp. Dự phòng cho đường dây kế tiếp là việc của bảo vệ khoảng cách vùng 2, vùng 3 hoặc quá dòng.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"f452b1d3","t":4,"q":"Rơ le 87L có tác động nhầm khi mất tín hiệu biến điện áp hay không?","o":["Không","Có","Tùy chỉnh định","Tất cả các câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L **không tác động nhầm khi mất tín hiệu biến điện áp** vì nó chỉ dùng dòng điện ở hai đầu, không dùng điện áp. Rơ le khoảng cách mới bị ảnh hưởng khi mất TU và thường phải khóa.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"9de21e9a","t":4,"q":"Rơ le 87L chưa được sử dụng rộng rãi vì sao?","o":["Giá thành cao","Phải có đường truyền","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"87L chưa được dùng rộng rãi vì **giá thành cao** và **phải có đường truyền** (cáp quang, kênh thông tin) trao đổi dòng điện giữa hai đầu. Cả hai lý do đều đúng.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"aa059d35","t":4,"q":"Rơ le 87L có tác động khi đường dây bị chạm đất 1 pha?","o":["Có","Không","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L **có tác động** khi đường dây chạm đất 1 pha trong vùng bảo vệ vì xuất hiện dòng so lệch giữa hai đầu. Nó nhạy với mọi dạng sự cố trong vùng.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"f7dec137","t":4,"q":"Rơ le 87L có tác động khi 2 pha của đường dây chạm nhau và không chạm đất?","o":["Có","Không","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L **có tác động** khi hai pha chạm nhau không chạm đất, vì dòng so lệch giữa hai đầu xuất hiện ở các pha bị sự cố. Không phụ thuộc vào việc có chạm đất hay không.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"45ccb035","t":4,"q":"Rơ le 87L có tác động khi 3 pha của đường dây chạm nhau và không chạm đất?","o":["Có","Không","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L **có tác động** khi 3 pha chạm nhau, vì sự cố 3 pha trong vùng tạo dòng so lệch lớn ở cả ba pha.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"8185f8f9","t":4,"q":"Rơ le 87L có vùng chết không?","o":["Không","Có","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87L **không có vùng chết** trong phạm vi giữa hai bộ biến dòng đầu đường dây, vì toàn bộ đoạn dây giữa các CT đều nằm trong vùng bảo vệ.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"ca61d040","t":4,"q":"Rơ le 87B bảo vệ cho thiết bị nào?","o":["Thanh cái","Đường dây","Máy biến thế","Cả 3 câu trên đều đúng"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"**87B** là rơ le so lệch **thanh cái** (B là Bus). 87L bảo vệ đường dây, 87T bảo vệ máy biến áp.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"c391fa25","t":4,"q":"Vì sao rơ le 87B phải được sử dụng làm bảo vệ chính tại các thanh cái 220kV và các thanh cái 110kV?","o":["Đảm bảo thời gian tối đa loại trừ sự cố tại thanh cái 220kV nhỏ hơn 100ms, đảm bảo thời gian tối đa loại trừ sự cố tại thanh cái 110kV nhỏ hơn 150ms","Đảm bảo thời gian tối đa loại trừ sự cố tại thanh cái 220kV nhỏ hơn 120ms, đảm bảo thời gian tối đa loại trừ sự cố tại thanh cái 110kV nhỏ hơn 150ms","Đảm bảo thời gian tối đa loại trừ sự cố tại thanh cái 220kV nhỏ hơn 100ms, đảm bảo thời gian tối đa loại trừ sự cố tại thanh cái 110kV nhỏ hơn 120ms","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Điều 12 TT 05/2025 quy định thời gian tối đa loại trừ sự cố bằng bảo vệ chính: **nhỏ hơn 100 ms ở thanh cái 220 kV** và **nhỏ hơn 150 ms ở thanh cái 110 kV**. Chỉ bảo vệ so lệch thanh cái 87B tác động đủ nhanh để đạt các mức này, nên bắt buộc dùng 87B làm bảo vệ chính. Phương án có 120 ms đổi lẫn mốc nên sai.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"","id":"84c2f869","t":4,"q":"Rơ le 87B có thể bảo vệ dự phòng cho các MBT và các đường dây đấu nối vào thanh cái đó hay không?","o":["Không","Có","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87B bảo vệ **trong vùng thanh cái**, nên **không** làm dự phòng cho máy biến áp và đường dây đấu nối vào thanh cái. Dự phòng cho các phần tử này là bảo vệ khoảng cách hoặc quá dòng của chính phần tử.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"2162b05a","t":4,"q":"Rơ le 87T bảo vệ cho thiết bị nào?","o":["Máy biến thế","Đường dây","Thanh cái","Cả 3 câu trên đều đúng"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"**87T** là rơ le so lệch **máy biến áp** (T là Transformer). Nó thường kèm hãm hài bậc 2 (dòng xung kích) và bậc 5 (quá kích từ).","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"84bbd1d4","t":4,"q":"Rơ le 87T có tác động khi MBT bị chạm đất 1 pha?","o":["Có","Không","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87T **có tác động** khi MBT chạm đất 1 pha trong vùng bảo vệ giữa các CT, vì xuất hiện dòng so lệch. Với cuộn dây nối sao, bảo vệ chạm đất hạn chế 64REF/50REF làm tăng độ nhạy cho dạng này.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"eece3acf","t":4,"q":"Rơ le 87T có tác động khi MBT bị sự cố 2 hay nhiều pha chạm nhau?","o":["Có","Không","Cả 2 câu trên đều đúng","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87T **có tác động** khi MBT sự cố hai hay nhiều pha chạm nhau, vì dòng so lệch giữa các phía của máy biến áp xuất hiện rõ ràng ở các pha bị sự cố.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"2bf66cdd","t":4,"q":"Rơ le 87T có tác động khi MBT bị sự cố trong cuộn Delta của MBT Y/Y/Delta mà cuộn Delta đó không đấu nối biến dòng vào mạch bảo vệ của rơ le 87T?","o":["Có","Không","Tùy theo dạng ngắn mạch","Cả 3 câu trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"87T **vẫn tác động** vì sự cố trong cuộn Delta làm dòng ở các cuộn Y thay đổi và mất cân bằng so với các phía còn có đấu CT, nên dòng so lệch xuất hiện dù Delta không có CT riêng. Phạm vi bảo vệ của 87T là cả máy biến áp, tính từ các CT ở những phía đã đấu vào rơ le.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"8334e2e0","t":4,"q":"Rơ le 50REF phía 110kV của MBT bảo vệ cho dạng sự cố nào trong MBT?","o":["Sự cố chạm đất cuộn dây phía 110kV","Sự cố chạm đất cuộn dây phía 22kV","Sự cố chạm pha cuộn dây phía 22kV","Sự cố chạm pha cuộn dây phía 110kV"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"**50REF** phía 110 kV là bảo vệ chạm đất hạn chế cho cuộn dây nối sao phía 110 kV, chỉ bảo vệ **sự cố chạm đất cuộn dây phía 110 kV**. Cuộn phía 22 kV hay sự cố chạm pha (không chạm đất) không thuộc phạm vi của nó.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"b8ae6fe2","t":4,"q":"Rơ le 50REF của MBT có bảo vệ cho sự cố chạm đất trong cuộn Delta 11kV không?","o":["Không","Có","Tùy theo tính toán trị số cài đặt","Các câu trên đều đúng"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"50REF chỉ dùng cho cuộn dây nối sao có trung tính nối đất. Cuộn **Delta 11 kV** không có dòng thứ tự không chạy ra điểm trung tính để đo, nên 50REF **không** bảo vệ chạm đất trong cuộn Delta.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"880b9856","t":4,"q":"Xác suất xảy ra ngắn mạch 1 pha là","o":["65%","5%","10%","20%"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Xác suất các dạng ngắn mạch: **1 pha 65%**, 2 pha chạm đất 20%, 2 pha 10%, 3 pha 5%. Ngắn mạch một pha chiếm đa số vì đa phần sự cố là chạm đất một pha do sét, cây, vật lạ.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"5b2ce22e","t":4,"q":"Xác suất xảy ra ngắn mạch 2 pha là","o":["10%","5%","20%","65%"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Xác suất ngắn mạch **2 pha (không chạm đất) là 10%**. Dãy xác suất: 1 pha 65% – 2 pha chạm đất 20% – 2 pha 10% – 3 pha 5%.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"4f724082","t":4,"q":"Xác suất xảy ra ngắn mạch 2 pha chạm đất là","o":["20%","5%","10%","65%"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Xác suất ngắn mạch **2 pha chạm đất là 20%**. Dãy xác suất: 1 pha 65% – 2 pha chạm đất 20% – 2 pha 10% – 3 pha 5%.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"874cebd6","t":4,"q":"Xác suất xảy ra ngắn mạch 3 pha là","o":["5%","10%","20%","65%"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Xác suất ngắn mạch **3 pha là 5%**, thấp nhất. Dãy xác suất: 1 pha 65% – 2 pha chạm đất 20% – 2 pha 10% – 3 pha 5%.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"108af875","t":4,"q":"Loại sự cố ngắn mạch nào có xác suất xảy ra nhiều nhất","o":["Ngắn mạch 1 pha","Ngắn mạch 2 pha","Ngắn mạch 2 pha chạm đất","Ngắn mạch 3 pha"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch **1 pha** có xác suất xảy ra nhiều nhất (**65%**), vì phần lớn sự cố là chạm đất một pha.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"811748db","t":4,"q":"Loại sự cố ngắn mạch nào có xác suất xảy ra ít nhất","o":["Ngắn mạch 3 pha","Ngắn mạch 1 pha","Ngắn mạch 2 pha","Ngắn mạch 2 pha chạm đất"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch **3 pha** có xác suất xảy ra ít nhất (**5%**), nhưng thường được dùng để tính dòng ngắn mạch lớn nhất chọn thiết bị.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"07942908","t":4,"q":"Loại ngắn mạch nào sau đây được gọi là ngắn mạch đối xứng","o":["Ngắn mạch 3 pha","Ngắn mạch 1 pha","Ngắn mạch 2 pha","Ngắn mạch 2 pha chạm đất"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch **3 pha** là ngắn mạch **đối xứng**, vì ba pha chịu ảnh hưởng như nhau, điện áp và dòng điện vẫn cân bằng. Các dạng 1 pha, 2 pha, 2 pha chạm đất là không đối xứng.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"f94339c6","t":4,"q":"Loại ngắn mạch nào sau đây được gọi là ngắn mạch không đối xứng","o":["Cả 3 đáp án trên đều đúng","Ngắn mạch 1 pha","Ngắn mạch 2 pha","Ngắn mạch 2 pha chạm đất"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch **1 pha, 2 pha và 2 pha chạm đất** đều là ngắn mạch **không đối xứng** vì ba pha không còn cân bằng. Cả ba phương án đều đúng nên chọn \"cả 3\".","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"5e661362","t":4,"q":"Mục đích của tính toán ngắn mạch:","o":["Cả 3 đáp án trên đều đúng","Chọn thiết bị điện","Tính toán trị số và phối hợp relay bảo vệ","Chọn phương án kết lưới hệ thống điện"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tính toán ngắn mạch phục vụ: **chọn thiết bị điện** (khả năng cắt, độ bền nhiệt, điện động), **tính trị số và phối hợp rơ le bảo vệ**, **chọn phương án kết lưới**. Cả ba mục đích đều đúng.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"f9831a61","t":4,"q":"Khi xảy ra ngắn mạch","o":["Tổng trở hệ thống giảm, dòng điện tăng, điện áp các điểm trong hệ thống giảm","Tổng trở hệ thống giảm, dòng điện tăng, điện áp các điểm trong hệ thống tăng","Tổng trở hệ thống tăng, dòng điện tăng, điện áp các điểm trong hệ thống giảm","Tất cả các đáp án trên đều sai"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Khi ngắn mạch, tổng trở từ nguồn đến điểm sự cố **giảm**, dòng điện **tăng** mạnh, và điện áp tại các điểm trong hệ thống **giảm**, mạnh nhất tại điểm sự cố. Phương án điện áp tăng hoặc tổng trở tăng đều trái với bản chất ngắn mạch.","xh":"","xb":"","k":"Giảm dòng ngắn mạch: vận hành MBA độc lập phía thứ cấp, tăng tổng trở (kháng điện, MBA tổng trở lớn), tách thanh cái.","old":0},{"m":"","id":"a9e9f6a0","t":4,"q":"Ngắn mạch đối xứng xuất hiện các thành phần","o":["Điện áp và dòng điện thứ tự nghịch","Điện áp và dòng điện thứ tự không","Đáp án A và B đều sai","Đáp án A và B đều đúng"],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch **đối xứng** (3 pha) chỉ có thành phần **thứ tự thuận**, không có thành phần thứ tự nghịch và thứ tự không vì hệ thống vẫn cân bằng. Do đó cả hai phát biểu A và B đều sai.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"f73c54d6","t":4,"q":"Ngắn mạch không đối xứng xuất hiện các thành phần nào","o":["Điện áp và dòng điện thứ tự nghịch","Điện áp và dòng điện thứ tự không","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch **không đối xứng** xuất hiện cả thành phần **thứ tự nghịch** và **thứ tự không** (cùng thứ tự thuận), nên A và B đều đúng. Thứ tự không chỉ có khi sự cố có chạm đất.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"09a8e2e4","t":4,"q":"Trong các trường hợp sau đây, trường hợp nào có dòng điện ngắn mạch 01 pha chạm đất lớn nhất:","o":["Hệ thống điện trung tính trực tiếp nối đất","Hệ thống điện trung tính nối đất qua điện trở","Hệ thống điện trung tính nối đất qua cuộn dập hồ quang","Hệ thống điện trung tính không nối đất"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Dòng chạm đất 1 pha **lớn nhất** khi **trung tính nối đất trực tiếp**, vì đường về của dòng sự cố có tổng trở rất nhỏ. Nối qua điện trở hoặc cuộn dập hồ quang làm giảm dòng, còn trung tính không nối đất thì dòng chỉ là dòng điện dung rất nhỏ.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"94bb6b66","t":4,"q":"Ngắn mạch được gọi là ngắn mạch đối xứng khi","o":["Điện áp các pha bằng nhau và lệch pha nhau 120o","Điện áp các pha bằng nhau và lệch pha nhau khác 120o","Điện áp các pha khác nhau và lệch pha nhau 120o","Điện áp các pha khác nhau và lệch pha nhau khác 120o"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Ngắn mạch đối xứng khi **điện áp các pha bằng nhau và lệch nhau 120°**, tức hệ ba pha vẫn cân bằng. Nếu độ lớn hoặc góc lệch thay đổi thì là không đối xứng.","xh":"","xb":"","k":"Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","old":0},{"m":"","id":"1feb0d08","t":4,"q":"Có thể dùng hệ thống đơn vị nào để tính toán ngắn mạch, chọn đáp án đúng nhất","o":["Hệ thống đơn vị có tên như Volt, Ampere, Ohm,...","Hệ thống đơn vị tương đối p.u. (Per Unit)","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"Tính ngắn mạch có thể dùng **hệ đơn vị có tên** (V, A, Ω, VA) hoặc **hệ đơn vị tương đối (p.u.)**, nên cả A và B đều đúng. Hệ p.u. tiện khi lưới có nhiều cấp điện áp, quy đổi qua Zcb = Ucb²/Scb.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"2ecf6344","t":12,"q":"Chương trình Aspen Oneliner được sử dụng để","o":["Tính toán ngắn mạch và phối hợp relay bảo vệ","Tính toán trào lưu công suất","Tính toán ổn định hệ thống điện","Tính toán vận hành kinh tế hệ thống điện"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"**Aspen OneLiner** là chương trình **tính toán ngắn mạch và phối hợp rơ le bảo vệ**. Tính trào lưu công suất là việc của PSS/E, PSS/SINCAL; tính ổn định cũng dùng phần mềm khác.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"0f6e3346","t":12,"q":"Tên của tập tin cơ sở dữ liệu hệ thống điện dạng nhị phân (binary data file) của chương trình Aspen Oneliner có phần mở rộng là","o":["ORL","DAT","CHF","SAV"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Theo bộ câu hỏi gốc, tập tin cơ sở dữ liệu hệ thống điện dạng nhị phân của Aspen OneLiner có đuôi **ORL** (trên phần mềm tên đuôi thường được viết là OLR). Khi thi chọn phương án ORL; DAT, CHF, SAV là đuôi của loại tập tin khác.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"d918fd69","t":12,"q":"Tên của tập tin chứa thư viện thông số đường dây của chương trình Aspen Oneliner có phần mở rộng là","o":["LTB","DAT","DRL","CHF"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tập tin thư viện thông số đường dây của Aspen OneLiner có đuôi **LTB** (Line Table). DRL là thư viện rơ le khoảng cách, RLY là thư viện đặc tuyến rơ le quá dòng.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"c6649cb5","t":12,"q":"Tên của tập tin chứa thư viện relay khoảng cách của chương trình Aspen Oneliner có phần mở rộng là","o":["DRL","DAT","CHF","LTB"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Thư viện rơ le khoảng cách của Aspen OneLiner có đuôi **DRL** (Distance Relay Library). LTB là thư viện đường dây, RLY là thư viện đặc tuyến quá dòng.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"293ccebd","t":12,"q":"Tên của tập tin chứa thư viện đường cong đặc tuyến relay quá dòng của chương trình Aspen Oneliner có phần mở rộng là","o":["RLY","ORL","DRL","LTB"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Thư viện đường cong đặc tuyến rơ le quá dòng của Aspen OneLiner có đuôi **RLY**. LTB là thư viện đường dây, DRL là thư viện rơ le khoảng cách, ORL là tập tin dữ liệu hệ thống.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"10efa0f1","t":12,"q":"Chương trình Aspen OneLiner cho phép mô phỏng máy biến áp 3 cuộn dây ở dạng nào","o":["Mạch hình sao (gồm 3 nút thực)","Mạch hình tam giác (gồm 3 nút thực và 1 nút giả dummy)","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"OneLiner mô phỏng MBA 3 cuộn dây dưới **dạng mạch hình sao (3 nút thực)** hoặc **mạch hình tam giác (3 nút thực và 1 nút giả dummy)**, nên A và B đều đúng.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"298e062b","t":12,"q":"Khi mô phỏng đường dây trên không/cáp ngầm, chương trình Aspen OneLiner cho phép mô phỏng theo cách nào","o":["Nhập tổng số điện trở, điện kháng dây dẫn ở đơn vị tương đối","Nhập chiều dài, loại dây và sử dụng thư viện đường dây","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"OneLiner cho phép mô phỏng đường dây trên không hoặc cáp ngầm bằng **nhập tổng điện trở, điện kháng ở đơn vị tương đối** hoặc bằng **nhập chiều dài, loại dây và dùng thư viện đường dây**. Cả hai cách đều đúng.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"bf69ef39","t":12,"q":"Lệnh View | Plain 1-line trong chương trình Aspen OneLiner thực hiện tác vụ gì","o":["Hiển thị sơ đồ 1 sợi mà không có bất kỳ thông số nào","Hiển thị sơ đồ 1 sợi với thông số nhánh","Hiển thị sơ đồ 1 sợi với thông số hỗ cảm","Hiển thị sơ đồ 1 sợi với thông tin Area, Zone"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **View | Plain 1-line** hiển thị **sơ đồ 1 sợi không có thông số nào**, chỉ có hình vẽ. Muốn thông số nhánh, hỗ cảm hoặc thông tin Area, Zone thì dùng các chế độ hiển thị khác.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"8a511d3f","t":8,"q":"Tại sao dự báo được phụ tải?","o":["Phụ tải có tính quy luật.","Phụ tải là đại lượng bất biến.","Phụ tải không phụ thuộc vào các yếu tố khách quan.","Phụ tải không thay đổi theo thời gian."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Phụ tải dự báo được vì **phụ tải có tính quy luật** theo thời gian (giờ trong ngày, ngày trong tuần, mùa) và theo các yếu tố như thời tiết, kinh tế. Phụ tải không bất biến và có thay đổi theo thời gian và các yếu tố khách quan.","xh":"","xb":"","k":"**F81**: Cấp điều độ quốc gia tính toán, xác định số lượng, vị trí, độ lớn, mức tần số cắt tải tự động theo tần số thấp **trước 01/9 hàng năm** (Điều 104); chỉ khôi phục phụ tải khi có lệnh điều độ.","old":0},{"m":"","id":"21f5a8bd","t":8,"q":"Yếu tố ảnh hưởng nhu cầu phụ tải dài hạn","o":["Tốc độ phát triển kinh tế - xã hội.","Lượng mưa.","Tỷ giá ngoại tệ.","Mật độ dân số bình quân."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Yếu tố ảnh hưởng nhu cầu phụ tải **dài hạn** là **tốc độ phát triển kinh tế – xã hội** (GDP, dân số, công nghiệp hóa). Thời tiết như lượng mưa hay nhiệt độ ảnh hưởng ngắn và trung hạn hơn.","xh":"","xb":"","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"52c57410","t":8,"q":"Yếu tố ảnh hưởng nhu cầu phụ tải trung hạn","o":["Nền nhiệt độ.","Lượng mưa.","El nino.","Hạn hán."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Yếu tố ảnh hưởng nhu cầu phụ tải **trung hạn** là **nền nhiệt độ** (mùa nóng, mùa lạnh) vì nhiệt độ quyết định tải điều hòa. Lượng mưa, El Nino, hạn hán không phải yếu tố ảnh hưởng chính ở mức này.","xh":"","xb":"","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"7e59fc93","t":8,"q":"Yếu tố ảnh hưởng nhu cầu phụ tải ngày tới","o":["Ngày trong tuần.","Trình độ phát triển khoa học – kỹ thuật.","El nino.","Hạn hán."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Yếu tố ảnh hưởng nhu cầu phụ tải **ngày tới** là **ngày trong tuần** (thứ Hai khác Chủ nhật, ngày làm việc khác ngày nghỉ). El Nino, hạn hán là yếu tố dài hạn; trình độ khoa học kỹ thuật cũng ảnh hưởng dài hạn.","xh":"","xb":"","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"","id":"081dc6b5","t":8,"q":"Yếu tố ảnh hưởng nhu cầu phụ tải tuần tới","o":["Nền nhiệt độ tuần tới.","El nino.","Lưu lượng nước về hồ.","Ngày trong tuần."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Với phụ tải **tuần tới**, yếu tố chính là **nền nhiệt độ của tuần tới**, vì nhiệt độ quyết định tải điều hòa cả tuần. Ngày trong tuần là yếu tố của dự báo ngày; El Nino và lưu lượng nước về hồ là yếu tố dài hạn.","xh":"","xb":"","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"09514474","t":8,"q":"Các yếu tố ảnh hưởng nhu cầu phụ tải giờ tới:","o":["Cả 3 đáp án trên.","Thời tiết giờ trước và giờ tới.","Phụ tải các giờ trước.","Sự kiện thể thao sắp diễn ra."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Phụ tải **giờ tới** chịu ảnh hưởng của **thời tiết giờ trước và giờ tới**, **phụ tải các giờ trước** và **sự kiện sắp diễn ra** (ví dụ trận đấu thể thao). Cả ba đều đúng.","xh":"","xb":"","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"6d5e15fc","t":8,"q":"Phương pháp dự báo phụ tải dài hạn (nhiều năm):","o":["Đàn hồi + chuyên gia.","Bình phương cực tiểu.","Hồi quy tuyến tính.","Neuron nhân tạo."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Dự báo phụ tải **dài hạn (nhiều năm)** dùng **hệ số đàn hồi kết hợp ý kiến chuyên gia**, vì phải gắn với tăng trưởng kinh tế. Hồi quy, bình phương cực tiểu và neuron nhân tạo hợp với dự báo ngắn hạn, khi có nhiều số liệu lịch sử.","xh":"","xb":"","k":"Chế độ DAS: **Disable** (không tự động), **Semi Auto** (hệ thống đưa phương án khôi phục, điều độ viên chọn rồi thực hiện), **Auto** (tự động thực thi). **Điểm dừng pháp lý**: điểm dừng dài hạn ở chế độ vận hành bình thường do Công ty Điện lực đề xuất.","old":0},{"m":"","id":"3f17f417","t":8,"q":"Các thông số đầu vào dự báo phụ tải ngày tới:","o":["Nhiệt độ, lượng mưa, ngày trong tuần, ngày nghỉ/ngày làm việc, phụ tải quá khứ.","Nhiệt độ, lượng mưa, ngày trong tuần, ngày nghỉ/ngày làm việc.","Nhiệt độ, lượng mưa, ngày trong tuần, ngày nghỉ/ngày làm việc, lưu lượng nước về các hồ.","Năm nhuận, nhiệt độ, lượng mưa, ngày trong tuần, ngày nghỉ/ngày làm việc."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Dự báo phụ tải ngày tới dùng đầu vào: nhiệt độ, lượng mưa, **ngày trong tuần, ngày nghỉ/ngày làm việc**, và phụ tải ngày quá khứ. Phương án đúng là phương án gồm đủ các thông số này, không thêm yếu tố vô lý như năm nhuận.","xh":"","xb":"","k":"**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","old":0},{"m":"","id":"e0a5fd6d","t":8,"q":"Thông thường công suất phụ tải nhỏ nhất trong tuần vào thời điểm nào:","o":["Rạng sáng thứ hai.","Rạng sáng chủ nhật.","Rạng sáng thứ 7.","Đêm thứ 6."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Phụ tải thấp nhất tuần thường vào **rạng sáng thứ Hai**: sau cả ngày Chủ nhật nghỉ, điện sản xuất và văn phòng ở mức thấp nhất, lại đúng giờ khuya.","xh":"","xb":"","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"","id":"5b3cb2e3","t":8,"q":"Dữ liệu được sử dụng làm đầu vào để dự báo phụ tải ngày tới:","o":["Tất cả đáp án trên.","Nhiệt độ lớn nhất, nhỏ nhất ngày quá khứ.","Nhiệt độ lớn nhất, nhỏ nhất ngày qua dự báo.","Sản lượng Pmin, Pmax ngày quá khứ."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Đầu vào dự báo phụ tải ngày tới gồm **nhiệt độ lớn nhất, nhỏ nhất của ngày quá khứ**, **nhiệt độ lớn nhất, nhỏ nhất theo dự báo**, và **sản lượng Pmin, Pmax ngày quá khứ**. Cả ba đều là đầu vào nên chọn \"tất cả\".","xh":"","xb":"","k":"**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","old":0},{"m":"","id":"14c7f717","t":8,"q":"Các tính toán ngắn hạn (phút tới, giờ tới) hoặc lập kế hoạch vận hành ngày, tuần trong bài toán EMS được thực hiện ở chế độ nào","o":["Study Mode","Real Time","Real Time hoặc Study Mode đều được.","Chế độ khác"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Các tính toán ngắn hạn (phút tới, giờ tới) hoặc lập kế hoạch vận hành ngày, tuần trong EMS chạy ở **Study Mode**. Real Time là chế độ giám sát trạng thái hệ thống đang vận hành theo thời gian thực.","xh":"","xb":"","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"","id":"ca005478","t":11,"q":"Chức năng SE của EMS chỉ thực hiện các tính toán thành công khi số lượng các tín hiệu từ SCADA chiếm bao nhiêu các thông số hệ thống điện đang vận hành thời gian thực.","o":["80%","70%","75%","85%"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Chức năng SE (State Estimation) của EMS chỉ tính thành công khi số tín hiệu SCADA chiếm **ít nhất 80%** các thông số của hệ thống đang vận hành (hệ thống phải quan sát được). Thiếu số đo thì bài toán không đủ dữ liệu để giải.","xh":"","xb":"","k":"","old":0},{"m":"","id":"9ea1a842","t":11,"q":"Sigma: là giá trị được đặt cho độ lệch chuẩn của tín hiệu do Scada. Giá trị nào sau đây thể hiện độ tin tưởng vào SCADA Key trong tính toán SE lớn nhất:","o":["0,5","0","4","7"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Sigma là độ lệch chuẩn gán cho tín hiệu SCADA: **sigma càng nhỏ thì càng tin tín hiệu**. Trong các giá trị, **0,5** là nhỏ nhất khác 0 nên thể hiện độ tin cậy lớn nhất. Giá trị 0 có ý nghĩa đặc biệt là bỏ qua tín hiệu.","xh":"","xb":"","k":"","old":0},{"m":"","id":"c00c65f3","t":11,"q":"Sigma: là giá trị được đặt cho độ lệch chuẩn của tín hiệu do Scada. Giá trị nào sau đây thể hiện SE bỏ qua giá trị SCADA Key trong tính toán:","o":["0","0,5","4","7"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Khi đặt **sigma = 0** thì SE **bỏ qua** giá trị SCADA đó trong tính toán. Giá trị sigma khác 0 càng nhỏ thì càng được tin tưởng.","xh":"","xb":"","k":"","old":0},{"m":"","id":"2ab31ebb","t":11,"q":"Trong EMS hiện tại “SE” được hiểu là?","o":["Đánh giá trạng thái","Xác định trạng thái","Thay đổi chế độ, cấu hình file tính toán","Phân tích chế độ"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"SE trong EMS là **State Estimation**, tức **đánh giá (ước lượng) trạng thái** hệ thống dựa trên số đo SCADA. Không phải \"xác định trạng thái\" hay phân tích chế độ.","xh":"","xb":"","k":"**SCADA** thu thập đo lường, trạng thái, điều khiển xa, cảnh báo. **DAS** tự động hóa lưới phân phối: **FLISR** (xác định vị trí, cô lập sự cố, khôi phục cấp điện). **DMS** gồm các ứng dụng như BLA, **DPF** (tính trào lưu công suất lưới phân phối), FL, FLISR, **PV** (giám sát điều kiện phối hợp bảo vệ), AFR.","old":0},{"m":"","id":"66362d63","t":12,"q":"Trong phần mềm PSS/E version 34 có bao nhiêu phương pháp giải bài toán chế độ xác lập:","o":["5","4","6","7"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Theo bộ câu hỏi, PSS/E phiên bản 34 có **5 phương pháp** giải bài toán chế độ xác lập (các biến thể Newton–Raphson, Gauss–Seidel). Đáp án cần nhớ là số 5.","xh":"","xb":"","k":"**Chế độ xác lập** (trào lưu công suất): giải bằng Newton–Raphson, Gauss–Seidel; P chảy từ nút góc pha lớn sang nhỏ, Q chảy từ nút điện áp cao sang thấp. **N-1**: kiểm tra mất một phần tử, không vi phạm giới hạn mang tải, điện áp.","old":0},{"m":"","id":"3e2e94aa","t":12,"q":"Tổng trở cơ bản của cấp điện áp của cấp điện áp 110kV có giá trị (ohm):","o":["121","118","119","120"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tổng trở cơ bản **Zcb = Ucb² / Scb**. Với Scb = 100 MVA: 110 kV có **Zcb = 110² / 100 = 121 Ω**. Các số 118, 119, 120 là số nhiễu gần kề.","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":0},{"m":"","id":"a87711bc","t":12,"q":"Tổng trở cơ bản của cấp điện áp của cấp điện áp 220kV có giá trị (ohm):","o":["484","450","470","480"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tổng trở cơ bản **Zcb = Ucb² / Scb**. Với Scb = 100 MVA: 220 kV có **Zcb = 220² / 100 = 484 Ω**.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0},{"m":"","id":"bb53bbda","t":12,"q":"Trong PSSE có bao nhiêu loại phụ tải:","o":["3","1","2","4"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"PSS/E mô hình phụ tải theo **3 loại**: công suất không đổi, dòng điện không đổi và tổng dẫn không đổi (ZIP).","xh":"","xb":"","k":"Phân loại cấp điện áp (TT 05, Điều 3): **hạ áp** đến 01 kV; **trung áp** trên 01 kV đến 35 kV; **cao áp** trên 35 kV đến 220 kV; **siêu cao áp** trên 220 kV. **Lưới điện phân phối** có cấp điện áp đến 110 kV; **lưới điện truyền tải** trên 110 kV.","old":0},{"m":"","id":"e21fcec6","t":12,"q":"Phương pháp tính toán tổn thất điện năng trên lưới truyền tải đang sử dụng là:","o":["Phương pháp Tmax, tmax","Phương pháp hệ số vượt trước","Phương pháp ngoại suy theo thời gian","Phương pháp chuyên gia"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tổn thất điện năng trên lưới truyền tải được tính theo **phương pháp Tmax, τmax**: dùng thời gian sử dụng công suất cực đại Tmax và thời gian tổn thất công suất lớn nhất τmax để quy đổi từ tổn thất công suất sang điện năng.","xh":"","xb":"","k":"**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","old":0},{"m":"","id":"cf88a22d","t":12,"q":"Loại tổn thất nào sau đây không thuộc tổn thất tính toán trên lưới truyền tải:","o":["Trộm điện (câu, móc trộm)","Tổn thất không tải của MBA","Tổn thất vầng quang","Tổn thất có tải của MBA"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tổn thất tính toán trên lưới truyền tải là tổn thất kỹ thuật: tổn thất **không tải và có tải của MBA**, **tổn thất vầng quang**. **Trộm điện (câu, móc trộm)** là tổn thất thương mại, không tính toán được bằng công thức kỹ thuật.","xh":"","xb":"","k":"**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","old":0},{"m":"","id":"531b2801","t":12,"q":"Điều kiện để 02 MBA vận hành song song:","o":["Cả 03 câu A, C, D","Cùng tổ đấu dây","Điện áp ngắn mạch Uk% tại nấc phân áp chính chênh lệch < 10%","các cặp nấc của 02 MBA chênh lệch về tỷ số biến k <= 0.5%"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Để hai MBA vận hành song song phải **cùng tổ đấu dây**, **điện áp ngắn mạch Uk% tại nấc phân áp chính chênh nhau không đáng kể**, và **tỷ số biến các cặp nấc chênh lệch ít**. Cả ba điều kiện đều đúng nên chọn đáp án gộp.","xh":"","xb":"","k":"Điều kiện vận hành song song MBA: cùng tổ đấu dây, tỉ số biến bằng nhau, Uk% gần nhau, tỉ lệ công suất không quá 3:1, cùng thứ tự pha.","old":0},{"m":"","id":"a6899ddf","t":12,"q":"Ứng dụng nào của phần mềm PSS/E để sử dụng tính toán biểu đồ điện áp","o":["Optimal Power Flow.","Power Flow.","Short Circuit.","Dynamics."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Theo bộ câu hỏi, ứng dụng **Optimal Power Flow (OPF)** của PSS/E dùng để tối ưu và tính biểu đồ điện áp. Power Flow tính chế độ xác lập, Short Circuit tính ngắn mạch, Dynamics tính ổn định động.","xh":"","xb":"","k":"**SCADA** thu thập đo lường, trạng thái, điều khiển xa, cảnh báo. **DAS** tự động hóa lưới phân phối: **FLISR** (xác định vị trí, cô lập sự cố, khôi phục cấp điện). **DMS** gồm các ứng dụng như BLA, **DPF** (tính trào lưu công suất lưới phân phối), FL, FLISR, **PV** (giám sát điều kiện phối hợp bảo vệ), AFR.","old":0},{"m":"","id":"d59b0b55","t":12,"q":"Ứng dụng nào thuộc phần mềm PSS/E","o":["Tất cả các ứng dụng trên.","Tính toán trào lưu công suất (PF).","Tính toán phân tích sự cố N-1 (CA).","Tính toán ngắn mạch (SC)."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"PSS/E có **tính trào lưu công suất (PF)**, **phân tích sự cố N-1 (CA – Contingency Analysis)**, **tính ngắn mạch (SC)**, nên chọn \"tất cả\".","xh":"","xb":"","k":"**SCADA** thu thập đo lường, trạng thái, điều khiển xa, cảnh báo. **DAS** tự động hóa lưới phân phối: **FLISR** (xác định vị trí, cô lập sự cố, khôi phục cấp điện). **DMS** gồm các ứng dụng như BLA, **DPF** (tính trào lưu công suất lưới phân phối), FL, FLISR, **PV** (giám sát điều kiện phối hợp bảo vệ), AFR.","old":0},{"m":"","id":"758e6952","t":12,"q":"Đại lượng nào sau đây không phải là điện áp cơ bản của hệ thống điện","o":["24kV","220kV","110kV","22kV"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Các cấp điện áp cơ bản trong hệ thống điện Việt Nam gồm 500 kV, 220 kV, 110 kV, 35 kV, 22 kV. **24 kV không phải cấp điện áp cơ bản**.","xh":"","xb":"","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":0},{"m":"","id":"f2feeaab","t":12,"q":"File nào sau đây không sử dụng trong tính toán phân tích sự cố N-1","o":["*.RAW","*.CON","*.MON","*.SUB"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Phân tích sự cố N-1 trong PSS/E dùng các file **.SAV** (chế độ), **.SUB** (vùng), **.MON** (giám sát), **.CON** (sự cố). File **.RAW** là file dữ liệu thô dùng để nhập chế độ ban đầu, không dùng trực tiếp cho N-1.","xh":"","xb":"","k":"Bộ phận tại cấp điều độ phân phối tỉnh: trực ban chỉ huy điều độ, phương thức ngắn hạn (Điều 124), phương thức dài hạn (Điều 125 – 9 nhiệm vụ), tính toán chỉnh định rơ le (Điều 126). Bộ phận phương thức dài hạn chủ trì điều tra, phân tích sự cố.","old":0},{"m":"","id":"f1f43263","t":12,"q":"Ngôn ngữ lập trình nào cho phép giao tiếp trực tiếp với phần mềm PSS/E","o":["IPLAN","VBA","PYTHON","Cả A và C đều đúng."],"a":3,"c":"Kiến thức chuyên môn (đã rà)","w":"PSS/E giao tiếp trực tiếp với **IPLAN** (ngôn ngữ riêng) và **Python** (psspy). VBA không phải ngôn ngữ chính để giao tiếp trực tiếp với PSS/E, nên chọn A và C.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"f38c8865","t":12,"q":"Biện pháp nào sau đây không giảm được dòng ngắn mạch trên hệ thống điện hiện nay","o":["Thay thiết bị đóng cắt chịu dòng ngắn mạch lớn hơn.","Thay đổi kết lưới.","Đặt kháng hạn dòng ngắn mạch.","Tách thanh cái phân đoạn."],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Giảm dòng ngắn mạch cần tăng tổng trở: **đổi kết lưới, đặt kháng hạn dòng, tách thanh cái phân đoạn**. **Thay thiết bị chịu dòng ngắn mạch lớn hơn** chỉ giúp thiết bị chịu được, không làm dòng ngắn mạch giảm.","xh":"","xb":"","k":"Giảm dòng ngắn mạch: vận hành MBA độc lập phía thứ cấp, tăng tổng trở (kháng điện, MBA tổng trở lớn), tách thanh cái.","old":0},{"m":"","id":"07084faf","t":12,"q":"Trong PSSE, khi lựa chọn đại lượng cơ bản Sbase được đặt:","o":["100 MVA","63 MVA","125 MVA","250 MVA"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Trong PSS/E, công suất cơ bản **Sbase** thường đặt **100 MVA**, đồng thời là giá trị tính Zcb (110 kV: 121 Ω; 220 kV: 484 Ω).","xh":"","xb":"","k":"**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","old":0},{"m":"","id":"6371cefc","t":12,"q":"Trong PSSE, muốn điều chỉnh điện áp có thể dùng cách sau:","o":["Cả 3 phương án trên","Thay đổi điện áp đầu cực máy phát","Thay đổi nấc máy biến áp","Đóng mở tụ bù"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Trong PSS/E có thể điều chỉnh điện áp bằng **thay đổi điện áp đầu cực máy phát**, **đổi nấc máy biến áp**, **đóng mở tụ bù**. Cả ba đều đúng.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"cfc8cb82","t":12,"q":"Trong PSSE, với MBA 3 cuộn dây có mấy trạng thái:","o":["5","2","3","4"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"MBA 3 cuộn dây trong PSS/E có **5 trạng thái** (status 0–4): ngừng, vận hành cả 3 cuộn, và cắt riêng từng cuộn dây thứ hai, thứ ba, thứ nhất.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"","id":"328d7e68","t":12,"q":"Một máy biến áp 2 cuộn dây có các thông số như sau: Công suất định mức Sdm = 63MVA; Điện áp định mức phía cao Uh = 115 ± 9x1.78% kV; Điện áp định mức phía hạ Ul = 15.75kV; Điện áp ngắn mạch UN = 12.5%. Tổng số nấc điều áp:","o":["19","9","18","20"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Dải phân áp **115 ± 9×1,78%** có 9 nấc dưới, 9 nấc trên và nấc giữa, tổng **9 + 9 + 1 = 19 nấc**.","xh":"","xb":"","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":0},{"m":"","id":"aef3996f","t":12,"q":"Để xem xét hệ thống mô phỏng trong chương trình PSSE có bị tách đảo (Island) hay không dùng lệnh:","o":["Tree","Rate","Vchk","Gout"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Tree** dùng để kiểm tra mô phỏng có bị tách đảo (Island) hay không. Rate, Vchk, Gout là lệnh khác (định mức, kiểm tra điện áp, xuất dữ liệu).","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"d96f43f0","t":12,"q":"Trong chương trình PSSE, để tách một bus ra thành hai bus dùng lệnh:","o":["Splt","Join","Move","Ltap"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Splt** (Split) tách một bus thành hai bus. Join là nhập, Move là chuyển, Ltap là thêm bus giữa.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"ada40c09","t":12,"q":"Trong chương trình PSSE, để thêm một bus mới giữa hai bus dùng lệnh:","o":["Ltap","Join","Splt","Move"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Ltap** thêm một bus mới nằm giữa hai bus (cắt đường dây tạo điểm rẽ). Join nhập bus, Splt tách bus, Move chuyển thiết bị.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"ed22fa78","t":12,"q":"Trong chương trình PSSE, để nhập hai bus thành một bus dùng lệnh:","o":["Join","Splt","Move","Ltap"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Join** nhập hai bus thành một bus. Splt làm ngược lại (tách bus).","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"447f693f","t":12,"q":"Trong chương trình PSSE, để chuyển thiết bị mô phỏng từ vị trí này sang nhận điện vị trí khác dùng lệnh:","o":["Move","Join","Splt","Ltap"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Move** chuyển thiết bị mô phỏng từ vị trí này sang nhận điện ở vị trí khác. Join, Splt, Ltap là lệnh về bus.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"1702a7fc","t":12,"q":"Trong chương trình PSSE, lệnh Contingency dùng để:","o":["Phân tích N-1","Xuất kết quả","Thay đổi chế độ, cấu hình file tính toán","Chuyển đổi phụ tải"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Contingency** trong PSS/E dùng để **phân tích N-1**, kiểm tra hệ thống khi mất một phần tử.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"be0cfb06","t":12,"q":"Trong chương trình PSSE, lệnh Changing dùng để:","o":["Thay đổi chế độ, cấu hình file tính toán","Xuất kết quả","Dùng để so sánh file đang mở với 1 file khác","Chuyển đổi phụ tải"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Changing** dùng để **thay đổi chế độ, cấu hình file tính toán**. So sánh hai file là Compare, xuất kết quả là Report.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"5f9bdd0b","t":12,"q":"Trong chương trình PSSE, lệnh Compare dùng để:","o":["Dùng để so sánh file đang mở với 1 file khác","Xem Thông tin về file","Thay đổi chế độ, cấu hình file tính toán","Chuyển đổi phụ tải"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Lệnh **Compare** dùng để **so sánh file đang mở với một file khác**, tìm sự khác biệt giữa hai chế độ.","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"690a223d","t":12,"q":"Trong chương trình PSSE khi đặt mã thanh cái là loại 1, khi đó thanh cái là:","o":["Thanh cái phụ tải (Không có nguồn phát)","Thanh cái máy phát hoặc nhà máy điện (gồm cả điều chỉnh điện áp hoặc cố định MVAr)","Thanh cái điều tần","Thanh cái cách ly"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Mã thanh cái **loại 1** trong PSS/E là **thanh cái phụ tải** (không có nguồn phát).","xh":"","xb":"","k":"**Điều chỉnh điện áp** (Điều 96) theo thứ tự: (1) thay đổi Q nguồn bù, máy phát gần → xa; (2) nấc MBA, **không tăng nấc khi điện áp phía cao áp đã thấp dưới −5%**; (3) huy động nguồn dự phòng; (4) thay đổi kết lưới; (5) sa thải phụ tải.","old":0},{"m":"","id":"a46372a4","t":12,"q":"Trong chương trình PSSE khi đặt mã thanh cái là loại 2, khi đó thanh cái là:","o":["Thanh cái máy phát hoặc nhà máy điện (gồm cả điều chỉnh điện áp hoặc cố định MVAr)","Thanh cái phụ tải (Không có nguồn phát)","Thanh cái điều tần","Thanh cái cách ly"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Mã thanh cái **loại 2** trong PSS/E là **thanh cái máy phát hoặc nhà máy điện** (điều chỉnh điện áp hoặc công suất phản kháng).","xh":"","xb":"","k":"Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","old":0},{"m":"","id":"0c16380a","t":12,"q":"Trong chương trình PSSE khi đặt mã thanh cái là loại 3, khi đó thanh cái là:","o":["Thanh cái điều tần","Thanh cái phụ tải (Không có nguồn phát)","Thanh cái máy phát hoặc nhà máy điện (gồm cả điều chỉnh điện áp hoặc cố định MVAr)","Thanh cái cách ly"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Mã thanh cái **loại 3** trong PSS/E là **thanh cái điều tần** (swing/slack bus), gánh phần công suất cân bằng toàn hệ thống.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"","id":"1fc42c47","t":12,"q":"Trong chương trình PSSE khi đặt mã thanh cái là loại 4, khi đó thanh cái là:","o":["Thanh cái cách ly","Thanh cái phụ tải (Không có nguồn phát)","Thanh cái máy phát hoặc nhà máy điện (gồm cả điều chỉnh điện áp hoặc cố định MVAr)","Thanh cái điều tần"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Mã thanh cái **loại 4** trong PSS/E là **thanh cái cách ly** (isolated), không nối vào hệ thống.","xh":"","xb":"","k":"**Nối đất trung tính** (TT 05, Điều 11, Bảng 7): 500, 220, 110 kV nối đất trực tiếp; **35 kV** trung tính cách ly hoặc nối đất qua trở kháng; **22 kV, 15 kV** nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây).","old":0},{"m":"","id":"d671f428","t":12,"q":"Hiện tượng vầng quang điện xuất hiện ở:","o":["Đường dây trên không 220kV","Cáp ngầm 220kV","Đường dây trên không 22kV","Cáp ngầm 110kV"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Vầng quang điện xuất hiện ở **đường dây trên không điện áp cao như 220 kV**, nơi cường độ điện trường quanh dây dẫn đủ lớn làm ion hóa không khí. Cáp ngầm có cách điện bao quanh nên không có vầng quang; 22 kV thì điện trường quá thấp.","xh":"","xb":"","k":"**Đóng lại đường dây trên không**: trên 35 đến 220 kV tối đa **02 lần** (kể cả TĐL); từ 35 kV trở xuống tối đa **03 lần**; ≤ 35 kV, trong 08 giờ sự cố thoáng qua lần thứ **04** thì khóa TĐL; không đóng điện đường dây trên 35 kV khi MC nhảy trong gió từ cấp **06**; đường dây cáp: không đóng lại khi bảo vệ trong phạm vi cáp tác động; hỗn hợp ≤ 35 kV: đóng lại 01 lần.","old":0},{"m":"","id":"5a18577e","t":12,"q":"Tác dụng phân pha đường dây trong lưới truyền tải là:","o":["Tất cả đều đúng","Giảm tổn thất","Giảm tổn thất vầng quang","Tăng khả năng truyền tải"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Phân pha đường dây (nhiều dây dẫn trên một pha) **giảm tổn thất vầng quang** vì giảm điện trường bề mặt, **giảm điện kháng nên tăng khả năng truyền tải**, và giảm tổn thất. Cả ba tác dụng đều đúng.","xh":"","xb":"","k":"Nguồn điện mặt trời, điện gió ≤01 MW đấu nối trung áp: giảm công suất tác dụng khi tần số vượt **50,5 Hz**; tự động kết nối lại sau khi tần số, điện áp ổn định **60 giây**. ĐMT hạ áp từ **20 kWp** phải đấu nối 3 pha; không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98.","old":0},{"m":"","id":"9598febe","t":12,"q":"Ứng dụng của đặc tính QV","o":["Tất cả các đáp án trên đều đúng","Xác định điểm giới hạn ổn định (dQ/dV=0)","Xác định lượng CSPK tối thiểu để đảm bảo ổn định điện áp","Xác định dạng và lượng CSPK"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Đặc tính QV dùng để **xác định điểm giới hạn ổn định điện áp** (dQ/dV = 0), **xác định lượng công suất phản kháng tối thiểu** cần để ổn định, và **xác định dạng, lượng CSPK cần bù**. Cả ba đúng.","xh":"","xb":"","k":"**SCADA** thu thập đo lường, trạng thái, điều khiển xa, cảnh báo. **DAS** tự động hóa lưới phân phối: **FLISR** (xác định vị trí, cô lập sự cố, khôi phục cấp điện). **DMS** gồm các ứng dụng như BLA, **DPF** (tính trào lưu công suất lưới phân phối), FL, FLISR, **PV** (giám sát điều kiện phối hợp bảo vệ), AFR.","old":0},{"m":"","id":"937386de","t":3,"q":"Định nghĩa nào sau đây đúng về điện áp danh định trong hệ thống điện","o":["Cao áp là cấp điện áp danh định trên 35 kV đến 220 kV.","Siêu cao áp là cấp điện áp danh định trên 220 kV.","Cả A và B đều đúng.","Cả A và B đều sai."],"a":2,"c":"Kiến thức chuyên môn (đã rà)","w":"**Cao áp** là cấp điện áp danh định **trên 35 kV đến 220 kV** và **siêu cao áp** là cấp **trên 220 kV**, nên cả A và B đều đúng.","xh":"","xb":"","k":"**Điện áp danh định lưới phân phối**: 110, 35, 22, 15, 10, 06 kV và 0,38 kV; truyền tải: 500, 220 kV.","old":0},{"m":"","id":"166a6bba","t":3,"q":"Tần số danh định của HTĐ quốc gia Việt Nam là:","o":["50Hz","60Hz","49Hz","55Hz"],"a":0,"c":"Kiến thức chuyên môn (đã rà)","w":"Tần số danh định của HTĐ quốc gia Việt Nam là **50 Hz**. 60 Hz là tần số lưới ở một số nước khác (Mỹ).","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"","id":"68acdf76","t":9,"q":"Theo Điều 159 TT 06/2025/TT-BCT, khi hòa điện trên hệ thống điện 500 kV, chênh lệch điện áp tối đa giữa 2 phía điểm hòa là:","o":["ΔU ≤ 5%","ΔU ≤ 10%","ΔU ≤ 15%","ΔU ≤ 20%"],"a":0,"c":"TT 06/2025, Điều 159 khoản 1","w":"Điều 159 TT 06/2025 quy định điều kiện hòa điện theo cấp điện áp: **500 kV** gồm góc lệch pha ≤ 15°, Δf ≤ 0,05 Hz, ΔU ≤ 5%; **220 kV** gồm góc lệch pha ≤ 30°, Δf ≤ 0,25 Hz, ΔU ≤ 10%. Điều kiện khép mạch vòng (Điều 160) là góc lệch pha ≤ 30° và ΔU ≤ 10%.","xh":"TT 06/2025/TT-BCT, Điều 159","xb":"Điều kiện hoà điện trên hệ thống điện có cấp điện áp 500 kV bao gồm: a) Góc lệch pha của điện áp giữa hai phía điểm hoà ≤ 15°; b) Chênh lệch tần số giữa hai phía điểm hoà Δf ≤ 0,05 Hz; c) Chênh lệch điện áp giữa hai phía điểm hoà ΔU ≤ 5%. Điều kiện hoà điện trên hệ thống điện có cấp điện áp 220 kV bao gồm: a) góc lệch pha ≤ 30°; b) Δf ≤ 0,25 Hz; c) ΔU ≤ 10%.","k":"**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","old":1},{"m":"","id":"c7e96cd0","t":9,"q":"Theo Điều 159 TT 06/2025/TT-BCT, khi hòa điện trên hệ thống điện 500 kV, chênh lệch tần số tối đa giữa 2 phía điểm hòa là:","o":["Δf ≤ 0.05Hz","Δf ≤ 0.1Hz","Δf ≤ 0.5Hz","Δf ≤ 1Hz"],"a":0,"c":"TT 06/2025, Điều 159 khoản 1","w":"Điều 159 TT 06/2025 quy định điều kiện hòa điện theo cấp điện áp: **500 kV** gồm góc lệch pha ≤ 15°, Δf ≤ 0,05 Hz, ΔU ≤ 5%; **220 kV** gồm góc lệch pha ≤ 30°, Δf ≤ 0,25 Hz, ΔU ≤ 10%. Đề không nêu cấp điện áp thì chọn theo cấp 500 kV, vì Δf ≤ 0,05 Hz chỉ ở cấp này.","xh":"TT 06/2025/TT-BCT, Điều 159","xb":"Điều kiện hoà điện trên hệ thống điện có cấp điện áp 500 kV bao gồm: a) Góc lệch pha của điện áp giữa hai phía điểm hoà ≤ 15°; b) Chênh lệch tần số giữa hai phía điểm hoà Δf ≤ 0,05 Hz; c) Chênh lệch điện áp giữa hai phía điểm hoà ΔU ≤ 5%. Điều kiện hoà điện trên hệ thống điện có cấp điện áp 220 kV bao gồm: a) góc lệch pha ≤ 30°; b) Δf ≤ 0,25 Hz; c) ΔU ≤ 10%.","k":"**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","old":1},{"m":"","t":9,"k":"","old":0,"c":"TT 06/2025, Điều 159 khoản 2","xh":"TT 06/2025/TT-BCT, Điều 159","xb":"Điều kiện hoà điện trên hệ thống điện có cấp điện áp 500 kV bao gồm: a) Góc lệch pha của điện áp giữa hai phía điểm hoà ≤ 15°; b) Chênh lệch tần số giữa hai phía điểm hoà Δf ≤ 0,05 Hz; c) Chênh lệch điện áp giữa hai phía điểm hoà ΔU ≤ 5%. Điều kiện hoà điện trên hệ thống điện có cấp điện áp 220 kV bao gồm: a) góc lệch pha ≤ 30°; b) Δf ≤ 0,25 Hz; c) ΔU ≤ 10%.","id":"h159f220","q":"Theo Điều 159 TT 06/2025/TT-BCT, khi hòa điện trên hệ thống điện 220 kV, chênh lệch tần số tối đa giữa 2 phía điểm hòa là:","o":["Δf ≤ 0,05 Hz","Δf ≤ 0,10 Hz","Δf ≤ 0,25 Hz","Δf ≤ 0,50 Hz"],"a":2,"w":"Ở **220 kV**, chênh lệch tần số tối đa khi hòa điện là **Δf ≤ 0,25 Hz** (Điều 159 TT 06/2025), rộng hơn mức 0,05 Hz của hệ thống 500 kV."},{"m":"","t":9,"k":"","old":0,"c":"TT 06/2025, Điều 159 khoản 2","xh":"TT 06/2025/TT-BCT, Điều 159","xb":"Điều kiện hoà điện trên hệ thống điện có cấp điện áp 500 kV bao gồm: a) Góc lệch pha của điện áp giữa hai phía điểm hoà ≤ 15°; b) Chênh lệch tần số giữa hai phía điểm hoà Δf ≤ 0,05 Hz; c) Chênh lệch điện áp giữa hai phía điểm hoà ΔU ≤ 5%. Điều kiện hoà điện trên hệ thống điện có cấp điện áp 220 kV bao gồm: a) góc lệch pha ≤ 30°; b) Δf ≤ 0,25 Hz; c) ΔU ≤ 10%.","id":"h159a220","q":"Theo Điều 159 TT 06/2025/TT-BCT, khi hòa điện trên hệ thống điện 220 kV, góc lệch pha của điện áp giữa 2 phía điểm hòa tối đa là:","o":["15°","30°","45°","60°"],"a":1,"w":"Ở **220 kV**, góc lệch pha tối đa khi hòa điện là **30°** (Điều 159 TT 06/2025); ở 500 kV chặt hơn, chỉ 15°. Điều kiện khép mạch vòng cũng là 30° (Điều 160)."},{"id":"t46_01","t":2,"q":"Theo Điều 220 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Chứng nhận vận hành được cấp mới có thời hạn sử dụng là:","o":["10 năm","05 năm","03 năm","15 năm"],"a":0,"c":"TT 06/2025, Điều 220 khoản 6 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 19","xb":"6. Chứng nhận vận hành được cấp mới có thời hạn sử dụng là 10 năm kể từ ngày cấp.","w":"Chứng nhận vận hành cấp mới có thời hạn **10 năm** kể từ ngày cấp (Điều 220 khoản 6, do TT 46/2025 sửa đổi).","m":"","k":"","old":0},{"id":"t46_02","t":2,"q":"Theo Điều 220 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), nhân viên vận hành tham gia kiểm tra đạt yêu cầu được cấp đổi Chứng nhận vận hành khi Chứng nhận còn thời hạn dưới:","o":["06 tháng","03 tháng","12 tháng","01 tháng"],"a":0,"c":"TT 06/2025, Điều 220 khoản 7 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 19","xb":"7. Khi Chứng nhận vận hành còn thời hạn dưới 06 tháng, nhân viên vận hành tham gia kiểm tra có kết quả đạt yêu cầu được cấp đổi Chứng nhận vận hành. Chứng nhận vận hành được cấp đổi có thời hạn sử dụng là 10 năm kể từ ngày cấp.","w":"Chứng nhận còn hạn **dưới 06 tháng** thì người kiểm tra đạt được **cấp đổi**, thời hạn mới 10 năm (Điều 220 khoản 7).","m":"","k":"","old":0},{"id":"t46_03","t":2,"q":"Theo Điều 220 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), đơn vị nào tổ chức kiểm tra và cấp Chứng nhận vận hành cho các chức danh tham gia trực tiếp công tác điều độ, vận hành tại Cấp điều độ phân phối tỉnh?","o":["Cấp điều độ miền","Cấp điều độ quốc gia","Cấp điều độ phân phối tỉnh","Tổng công ty Điện lực"],"a":0,"c":"TT 06/2025, Điều 220 khoản 2 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 19","xb":"2. Cấp điều độ miền có trách nhiệm tổ chức kiểm tra và cấp Chứng nhận vận hành theo mẫu tại Phụ lục I ban hành kèm theo Thông tư này cho các chức danh tham gia trực tiếp công tác điều độ, vận hành tại Cấp điều độ phân phối tỉnh, nhà máy điện, trạm điện, trung tâm điều khiển thuộc quyền điều khiển.","w":"**Cấp điều độ miền** kiểm tra và cấp Chứng nhận vận hành cho chức danh tại Cấp điều độ phân phối tỉnh (Điều 220 khoản 2).","m":"","k":"","old":0},{"id":"t46_04","t":2,"q":"Theo Phụ lục I TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Chứng nhận vận hành cấp cho Kỹ sư phương thức hệ thống phân phối điện có ký hiệu là:","o":["ĐĐ.Bx.02","ĐĐ.Bx.01","ĐĐ.Bx.03","ĐĐ.Ax.02"],"a":0,"c":"TT 06/2025, Phụ lục I Mục II khoản 3 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 21","xb":"3. Chứng nhận vận hành cấp cho các chức danh tham gia trực tiếp công tác điều độ tại Cấp điều độ phân phối tỉnh: a) Điều độ viên phân phối tỉnh có ký hiệu là ĐĐ.Bx.01; b) Kỹ sư phương thức hệ thống phân phối điện có ký hiệu là ĐĐ.Bx.02; c) Kỹ sư SCADA/DMS hệ thống phân phối điện có ký hiệu là ĐĐ.Bx.03.","w":"Ở Cấp điều độ phân phối tỉnh: Điều độ viên **ĐĐ.Bx.01**, Kỹ sư phương thức **ĐĐ.Bx.02**, Kỹ sư SCADA/DMS **ĐĐ.Bx.03**.","m":"","k":"","old":0},{"id":"t46_05","t":2,"q":"Theo Điều 220 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), với nhà máy điện, trạm điện thuộc quyền điều khiển của nhiều cấp điều độ, thẩm quyền kiểm tra và cấp Chứng nhận vận hành do ai thực hiện?","o":["Cấp điều độ cao nhất có quyền điều khiển","Cấp điều độ thấp nhất có quyền điều khiển","Đơn vị quản lý vận hành nhà máy, trạm điện","Tập đoàn Điện lực Việt Nam"],"a":0,"c":"TT 06/2025, Điều 220 khoản 4 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 19","xb":"4. Đối với nhà máy điện, trạm điện thuộc quyền điều khiển của nhiều cấp điều độ, thẩm quyền kiểm tra và cấp Chứng nhận vận hành cho các chức danh tham gia công tác vận hành do cấp điều độ cao nhất có quyền điều khiển thực hiện.","w":"Do **cấp điều độ cao nhất có quyền điều khiển** thực hiện (Điều 220 khoản 4).","m":"","k":"","old":0},{"id":"t46_06","t":2,"q":"Theo Điều 77 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), người trực tiếp chỉ huy điều độ hệ thống phân phối điện tỉnh, thành phố trực thuộc trung ương là:","o":["Điều độ viên phân phối tỉnh","Trưởng ca nhà máy điện","Trưởng kíp trạm điện","Kỹ sư phương thức hệ thống phân phối điện"],"a":0,"c":"TT 06/2025, Điều 77 khoản 2 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 17","xb":"2. Người trực tiếp chỉ huy điều độ hệ thống phân phối điện tỉnh, thành phố trực thuộc trung ương là Điều độ viên phân phối tỉnh. Nhân viên vận hành cấp dưới trực tiếp của Điều độ viên phân phối tỉnh bao gồm: a) Trưởng ca nhà máy điện có thiết bị thuộc quyền điều khiển; b) Trưởng kíp trạm điện (trực tại trạm điện hoặc tại trung tâm điều khiển trạm điện) có thiết bị thuộc quyền điều khiển; c) Nhân viên trực thao tác lưu động (trong trường hợp thao tác tại các thiết bị thuộc quyền điều khiển).","w":"Người chỉ huy trực tiếp là **Điều độ viên phân phối tỉnh**; cấp dưới là Trưởng ca nhà máy điện, Trưởng kíp trạm điện, nhân viên trực thao tác lưu động (Điều 77 khoản 2).","m":"","k":"","old":0},{"id":"t46_07","t":6,"q":"Theo Điều 67 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Cấp điều độ miền gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ quốc gia vào thời gian nào?","o":["Trước ngày 20 hàng tháng","Trước ngày 15 hàng tháng","Trước ngày 25 hàng tháng","Trước 08 ngày làm việc cuối cùng hàng tháng"],"a":0,"c":"TT 06/2025, Điều 67 khoản 2 điểm c (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 10","xb":"c) Trước ngày 20 hàng tháng, Cấp điều độ miền gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ quốc gia.","w":"Cấp điều độ miền gửi cho Cấp điều độ quốc gia **trước ngày 20 hàng tháng**; cấp tỉnh gửi cho cấp miền trước ngày 15 (Điều 67 khoản 2).","m":"","k":"","old":0},{"id":"t46_08","t":6,"q":"Theo Điều 71 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Cấp điều độ phân phối tỉnh thông báo cho Đơn vị quản lý vận hành Phương thức vận hành hệ thống phân phối điện của tháng tới đã được duyệt vào thời gian nào?","o":["Trước ngày 28 hàng tháng","Trước ngày 29 hàng tháng","Trước ngày 27 hàng tháng","Trước ngày 26 hàng tháng"],"a":0,"c":"TT 06/2025, Điều 71 khoản 2 điểm c (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 13","xb":"a) Trước ngày 26 hàng tháng, Cấp điều độ quốc gia có trách nhiệm thông báo Phương thức vận hành hệ thống điện quốc gia tháng được thông qua...; b) Trước ngày 27 hàng tháng, Cấp điều độ miền có trách nhiệm thông báo cho Cấp điều độ phân phối tỉnh, Đơn vị quản lý vận hành Phương thức vận hành hệ thống điện miền của tháng tới đã được duyệt; c) Trước ngày 28 hàng tháng, Cấp điều độ phân phối tỉnh có trách nhiệm thông báo cho Đơn vị quản lý vận hành Phương thức vận hành hệ thống phân phối điện của tháng tới đã được duyệt.","w":"Thông báo phương thức tháng: quốc gia **26**, miền **27**, tỉnh **28** hàng tháng (Điều 71 khoản 2, sửa đổi bởi TT 46/2025; bản gốc là 27, 28, 29).","m":"","k":"","old":0},{"id":"t46_09","t":9,"q":"Theo Điều 173 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), đối với sự cố trên hệ thống điện quốc gia thuộc diện báo cáo Bộ Công Thương, trong thời hạn bao lâu kể từ khi xảy ra sự cố phải gửi Báo cáo sự cố về Bộ Công Thương bằng email?","o":["36 giờ","24 giờ","48 giờ","72 giờ"],"a":0,"c":"TT 06/2025, Điều 173 khoản 5 điểm đ (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 18","xb":"- Trong thời hạn 36 giờ kể từ khi xảy ra sự cố, gửi Báo cáo sự cố về Bộ Công Thương bằng thư điện tử (email) theo mẫu quy định tại Phụ lục VIII ban hành kèm theo Thông tư này;","w":"Báo cáo sự cố gửi Bộ Công Thương bằng email trong **36 giờ** kể từ khi xảy ra sự cố. Ngoài ra, sự cố gây mất điện diện rộng hoặc sa thải từ **200 MW** trở lên phải báo ngay bằng tin nhắn hoặc email sau khi cô lập phần tử sự cố.","m":"","k":"","old":0},{"id":"t46_10","t":5,"q":"Theo Điều 52 TT 05/2025/TT-BCT (sửa đổi bởi TT 46/2025), các thử nghiệm chưa thực hiện được do nguồn năng lượng sơ cấp không sẵn sàng, khách hàng đấu nối phải hoàn thiện trong thời gian tối đa kể từ ngày hòa lưới lần đầu là:","o":["01 năm","06 tháng","02 năm","03 tháng"],"a":0,"c":"TT 05/2025, Điều 52 khoản 10 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 2 khoản 12","xb":"Đối với các thử nghiệm chưa thực hiện được do nguồn năng lượng sơ cấp không sẵn sàng quy định tại các điểm a, b, c, d và điểm đ khoản 2 Điều này, khách hàng có nhu cầu đấu nối phải hoàn thiện trong thời gian tối đa không quá thời hạn 01 năm kể từ ngày hòa lưới lần đầu.","w":"Thử nghiệm chưa làm được vì nguồn sơ cấp (gió, nắng, nước) chưa sẵn sàng phải hoàn thiện **tối đa 01 năm** kể từ ngày hòa lưới lần đầu.","m":"","k":"","old":0},{"id":"t46_11","t":5,
