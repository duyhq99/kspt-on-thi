"q":"Theo Điều 41 TT 05/2025/TT-BCT (sửa đổi bởi TT 46/2025), nhà máy điện gió, điện mặt trời có tổng công suất từ 10 MW đến 30 MW và đấu nối từ cấp điện áp 110 kV trở lên phải kết nối ổn định, tin cậy, bảo mật với hệ thống nào của Cấp điều độ có quyền điều khiển?","o":["Hệ thống AGC","Hệ thống DMS","Hệ thống thông tin quản lý đo đếm","Hệ thống thông tin thị trường điện"],"a":0,"c":"TT 05/2025, Điều 41 khoản 8 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 2 khoản 4","xb":"8. Nhà máy điện gió, nhà máy điện mặt trời có tổng công suất từ 10 MW đến 30 MW và đấu nối vào cấp điện áp từ 110 kV trở lên phải đầu tư các trang thiết bị, hệ thống điều khiển, tự động đảm bảo kết nối ổn định, tin cậy và bảo mật với hệ thống AGC của Cấp điều độ có quyền điều khiển phục vụ điều khiển từ xa công suất nhà máy theo lệnh điều độ của Cấp điều độ có quyền điều khiển.","w":"Phải kết nối với **hệ thống AGC** của cấp điều độ có quyền điều khiển để điều khiển từ xa công suất nhà máy.","m":"","k":"","old":0},{"id":"t46_12","t":5,"q":"Theo Điều 44 TT 05/2025/TT-BCT (sửa đổi bởi TT 46/2025), hệ thống pin lưu trữ năng lượng đấu nối vào hệ thống điện quốc gia từ cấp điện áp 110 kV trở lên và có công suất từ bao nhiêu trở lên phải kết nối với hệ thống AGC của Đơn vị điều độ hệ thống điện quốc gia?","o":["10 MW","01 MW","30 MW","50 MW"],"a":0,"c":"TT 05/2025, Điều 44 khoản 14 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 2 khoản 7","xb":"14. Hệ thống pin lưu trữ năng lượng đấu nối vào hệ thống điện quốc gia từ cấp điện áp 110 kV trở lên và có công suất từ 10 MW trở lên phải đầu tư các trang thiết bị, hệ thống điều khiển, tự động đảm bảo kết nối ổn định, tin cậy và bảo mật với hệ thống điều khiển công suất tổ máy (AGC) của Đơn vị điều độ hệ thống điện quốc gia phục vụ điều khiển xa công suất phát theo lệnh điều độ của Đơn vị điều độ hệ thống điện quốc gia.","w":"Pin lưu trữ từ **110 kV** trở lên và công suất từ **10 MW** trở lên phải kết nối AGC của Đơn vị điều độ hệ thống điện quốc gia.","m":"","k":"","old":0},{"id":"t46_13","t":5,"q":"Theo Điều 43 TT 05/2025/TT-BCT (sửa đổi bởi TT 46/2025), chủ đầu tư hệ thống điện mặt trời có công suất từ bao nhiêu trở lên và lựa chọn bán điện dư vào hệ thống điện quốc gia phải thỏa thuận với Đơn vị phân phối điện về thiết bị kết nối với hệ thống thu thập, giám sát, điều khiển của Cấp điều độ phân phối?","o":["100 kW","20 kWp","50 kW","01 MW"],"a":0,"c":"TT 05/2025, Điều 43 khoản 9 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 2 khoản 6","xb":"9. Chủ đầu tư hệ thống điện mặt trời có công suất từ 100 kW trở lên và lựa chọn bán điện dư vào hệ thống điện quốc gia có trách nhiệm thỏa thuận, thống nhất với Đơn vị phân phối điện về trang thiết bị, phương tiện kết nối với hệ thống thu thập, giám sát, điều khiển của Cấp điều độ phân phối.","w":"Từ **100 kW** trở lên và chọn bán điện dư thì phải thỏa thuận kết nối thu thập, giám sát, **điều khiển**; nếu không bán điện dư thì chỉ kết nối **giám sát**.","m":"","k":"","old":0},{"id":"t46_14","t":4,"q":"Theo Điều 27 TT 05/2025/TT-BCT (sửa đổi bởi TT 46/2025), đơn vị nào có trách nhiệm tổ chức xây dựng, ban hành hướng dẫn phạm vi, cách bố trí và yêu cầu kỹ thuật đối với các thiết bị rơ le bảo vệ cho tổ máy phát điện, máy biến áp, thanh cái, thiết bị bù và đường dây đấu nối vào lưới điện phân phối?","o":["Tập đoàn Điện lực Việt Nam","Đơn vị điều độ hệ thống điện quốc gia","Bộ Công Thương","Đơn vị truyền tải điện"],"a":0,"c":"TT 05/2025, Điều 27 khoản 8 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 2 khoản 2","xb":"8. Tập đoàn Điện lực Việt Nam có trách nhiệm tổ chức xây dựng và ban hành hướng dẫn phạm vi, cách bố trí và yêu cầu kỹ thuật đối với các thiết bị rơ le bảo vệ cho tổ máy phát điện, máy biến áp, thanh cái, thiết bị bù và đường dây đấu nối vào lưới điện phân phối, lấy ý kiến của các đơn vị điều độ phân phối và các đơn vị có liên quan, báo cáo Bộ Công Thương trước khi áp dụng.","w":"Với lưới **phân phối** do **EVN** ban hành hướng dẫn (lấy ý kiến các đơn vị điều độ phân phối); với lưới **truyền tải** do Đơn vị điều độ hệ thống điện quốc gia (Điều 26 khoản 9).","m":"","k":"","old":0},{"id":"t46_15","t":2,"q":"Theo Điều 35 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), ngoài các nội dung hiện có, khi dự báo nhu cầu phụ tải điện cần bổ sung nội dung nào sau đây?","o":["Đánh giá nhu cầu thực hiện các chương trình điều chỉnh phụ tải điện","Đánh giá nhu cầu thị trường điện","Đánh giá giá bán lẻ điện","Đánh giá khả năng đóng điện trạm mới"],"a":0,"c":"TT 06/2025, Điều 35 khoản 1 điểm l (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 4","xb":"l) Đánh giá nhu cầu thực hiện các chương trình điều chỉnh phụ tải điện.","w":"TT 46/2025 bổ sung điểm l khoản 1 Điều 35: **đánh giá nhu cầu thực hiện các chương trình điều chỉnh phụ tải điện**.","m":"","k":"","old":0},{"id":"n01","t":2,"q":"Theo Điều 5 khoản 1 TT 06/2025/TT-BCT, nguyên tắc nào sau đây KHÔNG thuộc các nguyên tắc cơ bản khi phân cấp quyền điều khiển?","o":["Theo số lượng khách hàng được cấp điện","Theo cấp điện áp của thiết bị điện","Theo công suất đặt và cấp điện áp đấu nối của nhà máy điện","Theo ranh giới quản lý thiết bị điện của Đơn vị quản lý vận hành"],"a":0,"c":"TT 06/2025, Điều 5 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 5","xb":"1. Phân cấp quyền điều khiển theo các nguyên tắc cơ bản sau: a) Tại một thời điểm, một thiết bị điện chỉ cho phép một cấp điều độ có quyền điều khiển; b) Theo cấp điện áp của thiết bị điện; c) Theo công suất đặt và cấp điện áp đấu nối của nhà máy điện; d) Theo ranh giới quản lý thiết bị điện của Đơn vị quản lý vận hành.","w":"Bốn nguyên tắc: một thiết bị một cấp điều khiển; theo cấp điện áp; theo công suất đặt và cấp điện áp đấu nối nhà máy; theo ranh giới quản lý thiết bị. **Số lượng khách hàng** không phải nguyên tắc.","m":"","k":"","old":0},{"id":"n02","t":2,"q":"Theo Điều 5 khoản 3 TT 06/2025/TT-BCT, việc ủy quyền quyền điều khiển cho điều độ cấp dưới hoặc Đơn vị quản lý vận hành phải được thực hiện như thế nào?","o":["Bằng văn bản có sự xác nhận của hai bên","Bằng lệnh điều độ miệng, ghi âm","Bằng thông báo của cấp điều độ cấp trên","Bằng thỏa thuận miệng giữa hai Điều độ viên"],"a":0,"c":"TT 06/2025, Điều 5 khoản 3","xh":"TT 06/2025/TT-BCT, Điều 5","xb":"Việc ủy quyền phải thực hiện bằng văn bản có sự xác nhận của hai bên.","w":"Ủy quyền phải **bằng văn bản, có xác nhận của hai bên**.","m":"","k":"","old":0},{"id":"n03","t":2,"q":"Theo Điều 5 khoản 3 TT 06/2025/TT-BCT, cấp điều độ có quyền điều khiển được phép ủy quyền điều khiển một thiết bị cho điều độ cấp dưới khi nào?","o":["Khi việc thay đổi chế độ vận hành của thiết bị đó không ảnh hưởng đến chế độ vận hành của hệ thống điện thuộc quyền điều khiển","Khi thiết bị đó ở cấp điện áp 110 kV trở xuống","Khi cấp điều độ cấp dưới có nhiều nhân viên hơn","Khi thiết bị đó đang bị sự cố"],"a":0,"c":"TT 06/2025, Điều 5 khoản 3","xh":"TT 06/2025/TT-BCT, Điều 5","xb":"3. Đối với một số thiết bị điện thuộc quyền điều khiển của một cấp điều độ mà việc thay đổi chế độ vận hành của thiết bị đó không ảnh hưởng đến chế độ vận hành của hệ thống điện thuộc quyền điều khiển, cho phép cấp điều độ có quyền điều khiển ủy quyền cho điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển thiết bị đó.","w":"Chỉ ủy quyền được với thiết bị mà **thay đổi chế độ vận hành không ảnh hưởng** chế độ vận hành của hệ thống điện thuộc quyền điều khiển.","m":"","k":"","old":0},{"id":"n04","t":2,"q":"Theo Điều 5 khoản 5 TT 06/2025/TT-BCT, chi tiết phân cấp quyền điều khiển, quyền kiểm tra phải được ban hành kèm theo văn bản nào?","o":["Quyết định phê duyệt sơ đồ đánh số thiết bị điện nhất thứ tại trạm điện hoặc nhà máy điện","Phiếu chỉnh định rơ le bảo vệ","Phương thức vận hành tháng","Biên bản thỏa thuận đấu nối"],"a":0,"c":"TT 06/2025, Điều 5 khoản 5","xh":"TT 06/2025/TT-BCT, Điều 5","xb":"5. Chi tiết phân cấp quyền điều khiển, kiểm tra phải được ban hành kèm theo quyết định phê duyệt về sơ đồ đánh số thiết bị điện nhất thứ tại trạm điện hoặc nhà máy điện được quy định tại Phụ lục II Thông tư này.","w":"Phân cấp chi tiết đi kèm **quyết định phê duyệt sơ đồ đánh số thiết bị nhất thứ** (Phụ lục II).","m":"","k":"","old":0},{"id":"n05","t":2,"q":"Theo Điều 6 khoản 2 TT 06/2025/TT-BCT, mọi sự thay đổi chế độ vận hành hệ thống điện hoặc thiết bị điện chỉ được tiến hành theo lệnh điều độ của cấp điều độ nào (trừ trường hợp quy định tại Điều 9)?","o":["Cấp điều độ có quyền điều khiển","Cấp điều độ cao nhất trong hệ thống","Cấp điều độ có quyền kiểm tra","Đơn vị quản lý vận hành thiết bị"],"a":0,"c":"TT 06/2025, Điều 6 khoản 2","xh":"TT 06/2025/TT-BCT, Điều 6","xb":"2. Mọi sự thay đổi chế độ vận hành hệ thống điện hoặc thiết bị điện chỉ được tiến hành theo lệnh điều độ của cấp điều độ có quyền điều khiển, trừ trường hợp quy định tại Điều 9 Thông tư này.","w":"Chỉ theo lệnh của **cấp điều độ có quyền điều khiển**; ngoại lệ là các trường hợp sự cố, khẩn cấp ở Điều 9.","m":"","k":"","old":0},{"id":"n06","t":2,"q":"Theo Điều 7 khoản 1 TT 06/2025/TT-BCT, quyền kiểm tra của điều độ cấp trên là quyền gì?","o":["Quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển","Quyền thay đổi chế độ vận hành của thiết bị điện","Quyền được nhận thông báo trước thông tin vận hành","Quyền ban hành phiếu chỉnh định rơ le"],"a":0,"c":"TT 06/2025, Điều 7 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 7","xb":"1. Quyền kiểm tra của điều độ cấp trên là quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển.","w":"Quyền kiểm tra là quyền **cho phép** cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển. Quyền thay đổi chế độ vận hành là quyền điều khiển (Điều 6).","m":"","k":"","old":0},{"id":"n07","t":2,"q":"Theo Điều 9 khoản 1 TT 06/2025/TT-BCT, khi xử lý sự cố hoặc đe dọa sự cố, cấp điều độ có quyền điều khiển được phép làm gì?","o":["Ra lệnh điều độ trước, sau đó báo cáo ngay cho cấp có quyền kiểm tra và thông báo cho đơn vị có quyền nắm thông tin","Chờ cấp có quyền kiểm tra cho phép rồi mới ra lệnh","Ra lệnh điều độ sau khi báo cáo xong cho cấp trên","Chỉ ra lệnh khi đã thông báo cho mọi đơn vị liên quan"],"a":0,"c":"TT 06/2025, Điều 9 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 9","xb":"1. Trường hợp xử lý sự cố hoặc đe dọa sự cố, cấp điều độ có quyền điều khiển được phép ra lệnh điều độ trước. Sau khi thực hiện lệnh điều độ, cấp điều độ có quyền điều khiển có trách nhiệm báo cáo ngay cho cấp điều độ có quyền kiểm tra và thông báo cho đơn vị có quyền nắm thông tin.","w":"Được **ra lệnh trước, báo cáo sau** cho cấp có quyền kiểm tra và thông báo cho đơn vị có quyền nắm thông tin.","m":"","k":"","old":0},{"id":"n08","t":9,"q":"Theo Điều 9 khoản 2 TT 06/2025/TT-BCT, trong trường hợp khẩn cấp không thể trì hoãn (cháy hoặc đe dọa tính mạng con người, an toàn thiết bị) ở nhà máy điện hoặc trạm điện, ai được phép tiến hành thao tác thiết bị theo quy trình liên quan?","o":["Nhân viên vận hành tại nhà máy điện, trạm điện, trung tâm điều khiển, và họ phải chịu trách nhiệm về thao tác của mình","Chỉ Điều độ viên cấp có quyền điều khiển","Chỉ Trưởng phòng Kỹ thuật của đơn vị quản lý vận hành","Không ai được thao tác khi chưa có lệnh điều độ"],"a":0,"c":"TT 06/2025, Điều 9 khoản 2","xh":"TT 06/2025/TT-BCT, Điều 9","xb":"2. Trường hợp khẩn cấp không thể trì hoãn được (cháy hoặc có nguy cơ đe doạ đến tính mạng con người hoặc an toàn thiết bị) ở nhà máy điện hoặc trạm điện, cho phép Nhân viên vận hành tại nhà máy điện, trạm điện, trung tâm điều khiển và cấp điều độ có quyền điều khiển tiến hành thao tác thiết bị theo các quy trình liên quan và phải chịu trách nhiệm về thao tác xử lý sự cố của mình.","w":"Nhân viên vận hành tại chỗ được thao tác theo quy trình, **tự chịu trách nhiệm**, rồi báo cáo ngay cho nhân viên vận hành cấp trên có quyền điều khiển.","m":"","k":"","old":0},{"id":"n09","t":9,"q":"Theo Điều 122 khoản 1 TT 06/2025/TT-BCT, tại bộ phận trực ban chỉ huy điều độ phân phối tỉnh, khi có từ 02 người trở lên thì phải bố trí như thế nào?","o":["Có 01 người làm phụ trách ca trực","Có 02 người cùng làm phụ trách ca trực","Có 01 Kỹ sư phương thức giám sát","Có 01 người của Cấp điều độ miền trực cùng"],"a":0,"c":"TT 06/2025, Điều 122 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 122","xb":"Trường hợp có từ 02 (hai) người trở lên thì phải có 01 (một) người làm phụ trách ca trực.","w":"Từ 02 người trở lên thì phải có **01 người làm phụ trách ca trực**.","m":"","k":"","old":0},{"id":"n10","t":9,"q":"Theo Điều 122 khoản 1 TT 06/2025/TT-BCT, ai quy định cụ thể số lượng Điều độ viên trực vận hành tại bộ phận trực ban chỉ huy điều độ phân phối tỉnh?","o":["Đơn vị phân phối điện","Cấp điều độ miền","Bộ Công Thương","Tập đoàn Điện lực Việt Nam"],"a":0,"c":"TT 06/2025, Điều 122 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 122","xb":"1. Tùy theo quy mô của hệ thống phân phối điện thuộc quyền điều khiển, mức độ trang bị công nghệ điều khiển, Đơn vị phân phối điện quy định cụ thể số lượng Điều độ viên trực vận hành tại bộ phận trực ban chỉ huy điều độ phân phối tỉnh.","w":"Do **Đơn vị phân phối điện** quy định, tùy quy mô hệ thống và mức độ trang bị công nghệ điều khiển.","m":"","k":"","old":0},{"id":"n11","t":4,"q":"Theo Điều 26 khoản 1 TT 05/2025/TT-BCT, hệ thống bảo vệ rơ le của mỗi phần tử trong hệ thống truyền tải điện phải được cấp nguồn như thế nào?","o":["Từ 02 nguồn điện một chiều độc lập","Từ 01 nguồn điện xoay chiều ổn định","Từ 01 nguồn một chiều có ắc quy dự phòng","Từ 03 nguồn độc lập"],"a":0,"c":"TT 05/2025, Điều 26 khoản 1","xh":"TT 05/2025/TT-BCT, Điều 26","xb":"Hệ thống bảo vệ phải được cấp nguồn từ 02 nguồn điện một chiều độc lập đảm bảo khi sự cố một trong hai nguồn một chiều thì hệ thống rơ le bảo vệ vẫn làm việc bình thường.","w":"Cấp từ **02 nguồn một chiều độc lập** để khi mất một nguồn, rơ le vẫn làm việc bình thường.","m":"","k":"","old":0},{"id":"n12","t":4,"q":"Theo Điều 26 khoản 7 TT 05/2025/TT-BCT, độ tin cậy tác động của hệ thống rơ le bảo vệ không được nhỏ hơn:","o":["99 %","95 %","98 %","99,9 %"],"a":0,"c":"TT 05/2025, Điều 26 khoản 7","xh":"TT 05/2025/TT-BCT, Điều 26","xb":"7. Độ tin cậy tác động của hệ thống rơ le bảo vệ không nhỏ hơn 99 %.","w":"Độ tin cậy tác động của hệ thống rơ le bảo vệ **không nhỏ hơn 99 %**.","m":"","k":"","old":0},{"id":"n13","t":4,"q":"Theo Điều 26 khoản 1 TT 05/2025/TT-BCT, mỗi phần tử của hệ thống điện (máy phát, máy biến áp, đường dây, thanh cái, thiết bị bù…) phải có hệ thống bảo vệ như thế nào?","o":["Riêng và độc lập với hệ thống bảo vệ của các phần tử khác","Dùng chung một hệ thống bảo vệ cho cả trạm","Dùng chung với phần tử liền kề để tiết kiệm","Chỉ cần bảo vệ dự phòng của phần tử cấp trên"],"a":0,"c":"TT 05/2025, Điều 26 khoản 1","xh":"TT 05/2025/TT-BCT, Điều 26","xb":"Mỗi phần tử hệ thống điện (máy phát, máy biến áp, đường dây, thanh cái, thiết bị bù…) phải có hệ thống bảo vệ riêng và độc lập với hệ thống bảo vệ của các phần tử hệ thống điện khác.","w":"Mỗi phần tử có **hệ thống bảo vệ riêng, độc lập** với phần tử khác.","m":"","k":"","old":0},{"id":"n14","t":4,"q":"Theo Điều 27 khoản 2 TT 05/2025/TT-BCT, đơn vị phân phối điện hoặc khách hàng sử dụng lưới điện phân phối chỉ được thay đổi thiết bị bảo vệ và giá trị cài đặt rơ le khi nào?","o":["Khi được sự đồng ý của Cấp điều độ có quyền điều khiển","Khi đã thông báo cho Cấp điều độ miền","Khi có biên bản thử nghiệm của đơn vị thí nghiệm","Được tự thay đổi trong phạm vi quản lý"],"a":0,"c":"TT 05/2025, Điều 27 khoản 2","xh":"TT 05/2025/TT-BCT, Điều 27","xb":"Đơn vị phân phối điện hoặc Khách hàng sử dụng lưới điện phân phối không tự ý thay đổi thiết bị bảo vệ và các giá trị cài đặt của thiết bị rơ le bảo vệ khi chưa được sự đồng ý của Cấp điều độ có quyền điều khiển.","w":"Không tự ý thay đổi khi **chưa được Cấp điều độ có quyền điều khiển đồng ý**.","m":"","k":"","old":0},{"id":"n15","t":4,"q":"Theo Điều 27 khoản 3 TT 05/2025/TT-BCT, đơn vị nào có trách nhiệm tính toán, kiểm tra và ban hành phiếu chỉnh định rơ le bảo vệ hoặc thông qua trị số chỉnh định trên lưới điện phân phối thuộc quyền điều khiển?","o":["Cấp điều độ có quyền điều khiển","Khách hàng sử dụng lưới điện phân phối","Nhà chế tạo rơ le","Đơn vị thí nghiệm"],"a":0,"c":"TT 05/2025, Điều 27 khoản 3","xh":"TT 05/2025/TT-BCT, Điều 27","xb":"Cấp điều độ có quyền điều khiển có trách nhiệm tính toán, kiểm tra và ban hành phiếu chỉnh định rơ le bảo vệ hoặc thông qua các trị số chỉnh định trên lưới điện phân phối thuộc quyền điều khiển","w":"**Cấp điều độ có quyền điều khiển** tính toán, kiểm tra, ban hành phiếu chỉnh định hoặc thông qua trị số chỉnh định.","m":"","k":"","old":0},{"id":"n16","t":4,"q":"Theo Điều 27 khoản 4 TT 05/2025/TT-BCT, khách hàng có trạm điện riêng được tự lắp đặt thiết bị hạn chế dòng điện ngắn mạch tại thanh cái đấu nối với lưới điện phân phối trong trường hợp nào?","o":["Chỉ khi có thỏa thuận với Đơn vị phân phối điện và Cấp điều độ có quyền điều khiển","Được tự lắp đặt khi đã báo cáo","Khi dòng ngắn mạch vượt 25 kA","Không có trường hợp ngoại lệ"],"a":0,"c":"TT 05/2025, Điều 27 khoản 4","xh":"TT 05/2025/TT-BCT, Điều 27","xb":"4. Khách hàng sử dụng lưới điện phân phối có trạm điện riêng không được tự ý lắp đặt thiết bị để hạn chế dòng điện ngắn mạch tại thanh cái đấu nối với lưới điện phân phối, trừ trường hợp có thỏa thuận với Đơn vị phân phối điện và Cấp điều độ có quyền điều khiển.","w":"Không được tự ý, **trừ khi có thỏa thuận** với Đơn vị phân phối điện và Cấp điều độ có quyền điều khiển.","m":"","k":"","old":0},{"id":"n17","t":4,"q":"Theo Điều 27 khoản 7 TT 05/2025/TT-BCT, đường dây 110 kV đấu nối nhà máy điện vào hệ thống điện quốc gia phải có bao nhiêu kênh thông tin liên lạc truyền tín hiệu rơ le bảo vệ và thời gian truyền tối đa là bao nhiêu?","o":["02 kênh, thời gian truyền không lớn hơn 20 ms","01 kênh, thời gian truyền không lớn hơn 20 ms","02 kênh, thời gian truyền không lớn hơn 50 ms","03 kênh, thời gian truyền không lớn hơn 10 ms"],"a":0,"c":"TT 05/2025, Điều 27 khoản 7 điểm a","xh":"TT 05/2025/TT-BCT, Điều 27","xb":"a) Các đường dây điện cấp điện áp 110 kV đấu nối nhà máy điện vào hệ thống điện quốc gia phải có 02 (hai) kênh thông tin liên lạc phục vụ cho việc truyền tín hiệu rơ le bảo vệ giữa hai đầu đường dây với thời gian truyền không lớn hơn 20 ms;","w":"Phải có **02 kênh** thông tin, thời gian truyền **không lớn hơn 20 ms**.","m":"","k":"","old":0},{"id":"m01","t":2,"q":"Theo Điều 4 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Cấp điều độ phân phối tỉnh do đơn vị nào đảm nhiệm?","o":["Đơn vị điều độ trực thuộc EVNHANOI, EVNHCMC và các Công ty Điện lực tỉnh","Đơn vị điều độ hệ thống điện quốc gia","Công ty Điện lực quận, huyện","Tổng công ty Truyền tải điện quốc gia"],"a":0,"c":"TT 06/2025, Điều 4 khoản 3 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 1","xb":"Cấp điều độ phân phối tỉnh do đơn vị điều độ trực thuộc Tổng công ty Điện lực Thành phố Hà Nội, Tổng công ty Điện lực Thành phố Hồ Chí Minh và các Công ty Điện lực tỉnh đảm nhiệm.","w":"Do **đơn vị điều độ trực thuộc EVNHANOI, EVNHCMC và các Công ty Điện lực tỉnh** đảm nhiệm, chịu sự chỉ huy trực tiếp về điều độ của Cấp điều độ miền tương ứng.","m":"","k":"","old":0},{"id":"m02","t":2,"q":"Theo Điều 12 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Cấp điều độ phân phối tỉnh có quyền điều khiển công suất phát của nhà máy điện có tổng công suất đặt như thế nào, đấu nối vào lưới nào?","o":["Từ 30 MW trở xuống, đấu nối vào lưới điện trung, hạ áp thuộc địa bàn tỉnh","Lớn hơn 30 MW, đấu nối vào lưới 110 kV","Từ 10 MW trở xuống, đấu nối vào lưới 110 kV","Mọi công suất, đấu nối vào lưới trung áp"],"a":0,"c":"TT 06/2025, Điều 12 khoản 4 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 2","xb":"4. Công suất phát của nhà máy điện có tổng công suất đặt từ 30 MW trở xuống, nguồn diesel hòa lưới và hệ thống nguồn điện khác đấu nối vào lưới điện trung, hạ áp thuộc địa bàn tỉnh, thành phố trực thuộc trung ương.","w":"Công suất phát của nhà máy **từ 30 MW trở xuống**, nguồn diesel hòa lưới và nguồn khác đấu nối **lưới trung, hạ áp** trong địa bàn tỉnh.","m":"","k":"","old":0},{"id":"m03","t":2,"q":"Theo Điều 17 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), quyền kiểm tra của Cấp điều độ phân phối tỉnh áp dụng đối với phần nào?","o":["Lưới điện phân phối thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh nhưng đã được ủy quyền điều khiển cho đơn vị quản lý vận hành","Lưới điện 500 kV, 220 kV thuộc địa bàn tỉnh","Lưới điện của khách hàng không nối vào lưới phân phối","Lưới điện thuộc quyền điều khiển của Cấp điều độ miền"],"a":0,"c":"TT 06/2025, Điều 17 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 3","xb":"Lưới điện phân phối thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh nhưng đã được ủy quyền điều khiển cho đơn vị quản lý vận hành.","w":"Quyền kiểm tra của cấp tỉnh là với **lưới phân phối thuộc quyền điều khiển của mình nhưng đã ủy quyền cho đơn vị quản lý vận hành**. Điều 17 cũ nêu cả cấp quận, huyện, nay bỏ.","m":"","k":"","old":0},{"id":"m04","t":6,"q":"Theo Điều 42 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), sau khi nhận được sơ đồ kết dây cơ bản của hệ thống điện miền đã được phê duyệt, Cấp điều độ phân phối tỉnh phê duyệt và công bố sơ đồ kết dây cơ bản của hệ thống phân phối điện trước ngày nào hàng năm?","o":["15 tháng 12","01 tháng 12","20 tháng 11","31 tháng 12"],"a":0,"c":"TT 06/2025, Điều 42 khoản 3 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 5","xb":"3. Sau khi nhận được sơ đồ kết dây cơ bản của hệ thống điện miền đã được phê duyệt, trước ngày 15 tháng 12 hàng năm, Cấp điều độ phân phối tỉnh có trách nhiệm phê duyệt và công bố sơ đồ kết dây cơ bản của hệ thống phân phối điện.","w":"Cấp tỉnh phê duyệt và công bố sơ đồ kết dây cơ bản **trước ngày 15 tháng 12** hàng năm.","m":"","k":"","old":0},{"id":"m05","t":6,"q":"Theo Điều 42 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), khi sơ đồ kết dây cơ bản không còn phù hợp, đơn vị nào phê duyệt sơ đồ kết dây mới của hệ thống phân phối điện thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh?","o":["Đơn vị phân phối điện, trong Phương thức vận hành","Cấp điều độ miền","Đơn vị điều độ hệ thống điện quốc gia","Bộ Công Thương"],"a":0,"c":"TT 06/2025, Điều 42 khoản 4 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 5","xb":"Đơn vị phân phối điện có trách nhiệm phê duyệt sơ đồ kết dây mới của hệ thống phân phối điện thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh trong Phương thức vận hành.","w":"**Đơn vị phân phối điện** phê duyệt sơ đồ kết dây mới của hệ thống phân phối điện trong Phương thức vận hành; Đơn vị điều độ hệ thống điện quốc gia phê duyệt phần của hệ thống điện quốc gia.","m":"","k":"","old":0},{"id":"m06","t":6,"q":"Theo Điều 51 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Đơn vị điều độ hệ thống điện quốc gia công bố thông tin đánh giá khả năng bảo đảm cung cấp điện cho các tháng còn lại trong năm trước ngày nào hàng tháng?","o":["Ngày 25","Ngày 27","Ngày 20","Ngày 28"],"a":0,"c":"TT 06/2025, Điều 51 khoản 2 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 6","xb":"2. Trước ngày 25 hàng tháng, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm công bố trên Trang thông tin điện tử các thông tin đánh giá khả năng bảo đảm cung cấp điện cho các tháng còn lại trong năm.","w":"Công bố **trước ngày 25 hàng tháng** (bản gốc ghi ngày 27).","m":"","k":"","old":0},{"id":"m07","t":6,"q":"Theo Điều 65 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Đơn vị điều độ hệ thống điện quốc gia xác định và công bố danh sách nhà máy, tổ máy cung cấp dịch vụ điều tần thứ cấp tháng tới trước ngày nào hàng tháng?","o":["Ngày 25","Ngày 27","Ngày 15","Ngày 20"],"a":0,"c":"TT 06/2025, Điều 65 khoản 5 điểm b (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 8","xb":"b) Trước ngày 25 hàng tháng, căn cứ thông tin do các đơn vị phát điện cung cấp, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm xác định và công bố Danh sách các nhà máy điện, tổ máy phát điện cung cấp dịch vụ điều tần thứ cấp tháng tới trên Trang thông tin điện tử.","w":"Công bố danh sách điều tần thứ cấp tháng tới **trước ngày 25 hàng tháng**.","m":"","k":"","old":0},{"id":"m08","t":6,"q":"Theo Điều 66 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), khi đăng ký phương thức vận hành, dự báo phụ tải hệ thống điện được lập cho phần hệ thống thuộc quyền nào của cấp điều độ?","o":["Quyền điều khiển","Quyền kiểm tra","Quyền nắm thông tin","Ranh giới địa giới hành chính"],"a":0,"c":"TT 06/2025, Điều 66 khoản 1 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 9","xb":"1. Dự báo phụ tải hệ thống điện thuộc quyền điều khiển;","w":"Dự báo phụ tải trong đăng ký phương thức vận hành là của hệ thống điện **thuộc quyền điều khiển**. Kế hoạch BDSC, công trình mới và chương trình thử nghiệm là các thiết bị thuộc **quyền kiểm tra của điều độ cấp trên**.","m":"","k":"","old":0},{"id":"m09","t":6,"q":"Theo Điều 66 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), dự kiến kế hoạch bảo dưỡng, sửa chữa lưới điện trong nội dung đăng ký phương thức vận hành là của thiết bị thuộc quyền nào?","o":["Quyền kiểm tra của điều độ cấp trên","Quyền điều khiển của chính cấp đăng ký","Quyền nắm thông tin","Mọi thiết bị trong địa bàn tỉnh"],"a":0,"c":"TT 06/2025, Điều 66 khoản 2 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 9","xb":"2. Dự kiến kế hoạch bảo dưỡng, sửa chữa lưới điện thuộc quyền kiểm tra của điều độ cấp trên;","w":"Kế hoạch BDSC, công trình điện mới và chương trình thử nghiệm đăng ký là của thiết bị **thuộc quyền kiểm tra của điều độ cấp trên**.","m":"","k":"","old":0},{"id":"m10","t":2,"q":"Theo Điều 75 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Cấp điều độ quốc gia là:","o":["Cấp chỉ huy điều độ cao nhất của hệ thống điện quốc gia","Cấp chỉ huy điều độ của hệ thống điện miền","Cấp giám sát hệ thống phân phối điện","Cấp trung gian giữa miền và tỉnh"],"a":0,"c":"TT 06/2025, Điều 75 khoản 1 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 16","xb":"1. Cấp điều độ quốc gia là cấp chỉ huy điều độ cao nhất của hệ thống điện quốc gia, là nơi ra lệnh điều độ tới Cấp điều độ miền, nhà máy điện thuộc quyền điều khiển, trạm điện thuộc quyền điều khiển và các Đơn vị quản lý vận hành trong hệ thống điện quốc gia.","w":"Là **cấp chỉ huy điều độ cao nhất**, ra lệnh tới Cấp điều độ miền, nhà máy điện, trạm điện thuộc quyền điều khiển và các Đơn vị quản lý vận hành.","m":"","k":"","old":0},{"id":"m11","t":2,"q":"Theo Điều 77 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Cấp điều độ phân phối tỉnh là nơi ra lệnh điều độ tới những đối tượng nào?","o":["Trạm điện, nhà máy điện thuộc quyền điều khiển và các Đơn vị quản lý vận hành khác trong hệ thống phân phối điện tỉnh","Cấp điều độ miền và Cấp điều độ quốc gia","Cấp điều độ phân phối quận, huyện","Chỉ các nhà máy điện lớn hơn 30 MW"],"a":0,"c":"TT 06/2025, Điều 77 khoản 1 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 17","xb":"1. Cấp điều độ phân phối tỉnh là nơi ra lệnh điều độ tới trạm điện và nhà máy điện thuộc quyền điều khiển và các Đơn vị quản lý vận hành khác trong hệ thống phân phối điện tỉnh.","w":"Ra lệnh tới **trạm điện, nhà máy điện thuộc quyền điều khiển và các Đơn vị quản lý vận hành khác** trong hệ thống phân phối điện tỉnh.","m":"","k":"","old":0},{"id":"m12","t":9,"q":"Theo Điều 77 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), nhân viên nào sau đây KHÔNG phải là nhân viên vận hành cấp dưới trực tiếp của Điều độ viên phân phối tỉnh?","o":["Điều độ viên miền","Trưởng ca nhà máy điện có thiết bị thuộc quyền điều khiển","Trưởng kíp trạm điện có thiết bị thuộc quyền điều khiển","Nhân viên trực thao tác lưu động"],"a":0,"c":"TT 06/2025, Điều 77 khoản 2 (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 17","xb":"a) Trưởng ca nhà máy điện có thiết bị thuộc quyền điều khiển; b) Trưởng kíp trạm điện (trực tại trạm điện hoặc tại trung tâm điều khiển trạm điện) có thiết bị thuộc quyền điều khiển; c) Nhân viên trực thao tác lưu động","w":"Cấp dưới trực tiếp gồm Trưởng ca nhà máy điện, Trưởng kíp trạm điện và nhân viên trực thao tác lưu động. **Điều độ viên miền** là cấp trên.","m":"","k":"","old":0},{"id":"m13","t":9,"q":"Theo Điều 173 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), sự cố dẫn đến sa thải phụ tải với quy mô công suất từ bao nhiêu trở lên thì phải gửi ngay thông tin cho Bộ Công Thương bằng tin nhắn hoặc email sau khi cô lập phần tử sự cố?","o":["200 MW","100 MW","300 MW","500 MW"],"a":0,"c":"TT 06/2025, Điều 173 khoản 5 điểm đ (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 18","xb":"sự cố dẫn đến sa thải phụ tải với quy mô công suất từ 200 MW trở lên, ngay sau khi cô lập phần tử bị sự cố trong hệ thống điện quốc gia, gửi báo cáo về thông tin sự cố cho Bộ Công Thương, thông qua hình thức tin nhắn hoặc thư điện tử (email)","w":"Từ **200 MW** trở lên thì gửi ngay thông tin sự cố bằng tin nhắn hoặc email; sau đó gửi Báo cáo sự cố bằng email trong 36 giờ.","m":"","k":"","old":0},{"id":"m14","t":9,"q":"Theo Điều 173 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), định kỳ trước ngày nào hàng tháng, Đơn vị điều độ hệ thống điện quốc gia tổng hợp báo cáo phân tích sự cố của tháng trước gửi Bộ Công Thương?","o":["Ngày 20","Ngày 15","Ngày 25","Ngày 05"],"a":0,"c":"TT 06/2025, Điều 173 khoản 5 điểm đ (sửa đổi bởi TT 46/2025)","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 18","xb":"Định kỳ trước ngày 20 hàng tháng, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm tổng hợp báo cáo phân tích các sự cố","w":"Báo cáo phân tích sự cố tổng hợp **trước ngày 20 hàng tháng** theo Phụ lục IX.","m":"","k":"","old":0},{"id":"m15","t":6,"q":"Theo Điều 49 TT 06/2025/TT-BCT, đánh giá khả năng bảo đảm cung cấp điện ngày được thực hiện cho bao nhiêu ngày tới và đơn vị tính toán là gì?","o":["02 ngày tới, đơn vị tính toán là nửa giờ","01 ngày tới, đơn vị tính toán là một giờ","07 ngày tới, đơn vị tính toán là nửa giờ","02 ngày tới, đơn vị tính toán là một giờ"],"a":0,"c":"TT 06/2025, Điều 49 khoản 3 điểm b","xh":"TT 06/2025/TT-BCT, Điều 49","xb":"b) Đánh giá khả năng bảo đảm cung cấp điện ngày được thực hiện cho 02 ngày tới, đơn vị tính toán là nửa giờ.","w":"Đánh giá ngày: **02 ngày tới, nửa giờ**.","m":"","k":"","old":0},{"id":"m16","t":6,"q":"Theo Điều 49 TT 06/2025/TT-BCT, khi khung thời gian từ thời điểm tính toán đến hết tháng hiện tại nhỏ hơn bao nhiêu ngày thì đánh giá cho các ngày còn lại của tháng và các tuần của tháng tới (M+1)?","o":["10 ngày","07 ngày","15 ngày","05 ngày"],"a":0,"c":"TT 06/2025, Điều 49 khoản 3 điểm a","xh":"TT 06/2025/TT-BCT, Điều 49","xb":"Trường hợp khung thời gian từ thời điểm tính toán đến hết tháng hiện tại nhỏ hơn 10 (mười) ngày, thực hiện đánh giá khả năng bảo đảm cung cấp điện của hệ thống điện cho các ngày còn lại của tháng hiện tại và các tuần của tháng tới (tháng M+1)","w":"Nếu còn **dưới 10 ngày** đến hết tháng thì đánh giá các ngày còn lại và các tuần của tháng M+1.","m":"","k":"","old":0},{"id":"m17","t":6,"q":"Theo Điều 51 TT 06/2025/TT-BCT, trước ngày nào hàng năm Đơn vị điều độ hệ thống điện quốc gia công bố thông tin đánh giá khả năng bảo đảm cung cấp điện cho năm tới (N+1), có xét đến năm N+2?","o":["Ngày 01 tháng 12","Ngày 01 tháng 11","Ngày 15 tháng 12","Ngày 31 tháng 12"],"a":0,"c":"TT 06/2025, Điều 51 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 51","xb":"1. Trước ngày 01 tháng 12 hàng năm, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm công bố trên Trang thông tin điện tử các thông tin đánh giá khả năng bảo đảm cung cấp điện cho 01 năm tới (N+1), có xét đến 01 năm tiếp theo (N+2).","w":"Công bố **trước ngày 01/12** hàng năm.","m":"","k":"","old":0},{"id":"m18","t":6,"q":"Theo Điều 51 TT 06/2025/TT-BCT, Đơn vị điều độ hệ thống điện quốc gia công bố thông tin đánh giá khả năng bảo đảm cung cấp điện cho tuần tới và các tuần còn lại của tháng vào thời điểm nào?","o":["Trước 15h00 thứ Sáu hàng tuần","Trước 10h00 thứ Hai hàng tuần","Trước 11h00 thứ Sáu hàng tuần","Trước 17h00 thứ Sáu hàng tuần"],"a":0,"c":"TT 06/2025, Điều 51 khoản 3","xh":"TT 06/2025/TT-BCT, Điều 51","xb":"3. Trước 15h00 thứ Sáu hàng tuần, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm công bố trên cổng thông tin điện tử các thông tin đánh giá khả năng bảo đảm cung cấp điện cho tuần tới và các tuần còn lại của tháng.","w":"**Trước 15h00 thứ Sáu hàng tuần**.","m":"","k":"","old":0},{"id":"m19","t":6,"q":"Theo Điều 51 TT 06/2025/TT-BCT, hàng ngày (ngày D), Đơn vị điều độ hệ thống điện quốc gia công bố đánh giá khả năng bảo đảm cung cấp điện ngắn hạn cho 02 ngày tới (D+1 đến D+2) trước thời điểm nào?","o":["16h00","10h00","15h00","17h00"],"a":0,"c":"TT 06/2025, Điều 51 khoản 4","xh":"TT 06/2025/TT-BCT, Điều 51","xb":"4. Trước 16h00 hàng ngày (ngày D), Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm công bố trên Trang thông tin điện tử các thông tin đánh giá khả năng bảo đảm cung cấp điện ngắn hạn cho 02 ngày tới (từ ngày D+1 đến ngày D+2).","w":"Công bố **trước 16h00 hàng ngày**.","m":"","k":"","old":0},{"id":"m20","t":6,"q":"Theo Điều 53 TT 06/2025/TT-BCT, Đơn vị quản lý vận hành lưới điện đăng ký kế hoạch bảo dưỡng, sửa chữa lưới điện với Cấp điều độ có quyền điều khiển trước ngày 01 tháng 8 hàng năm cho những năm nào?","o":["Năm tiếp theo (N+1) và định hướng cho năm N+2","Chỉ năm N+1","Năm N+1 đến N+5","Năm N+2 và N+3"],"a":0,"c":"TT 06/2025, Điều 53 khoản 1 điểm a","xh":"TT 06/2025/TT-BCT, Điều 53","xb":"Đơn vị quản lý vận hành lưới điện có trách nhiệm đăng ký kế hoạch bảo dưỡng, sửa chữa lưới điện thuộc phạm vi quản lý của mình với Cấp điều độ có quyền điều khiển cho năm tiếp theo (N+1) và định hướng cho năm sau đó (N+2)","w":"Lưới điện đăng ký **năm N+1 và định hướng N+2**; nhà máy điện đăng ký 02 năm (N+1, N+2) và dự kiến 03 năm tiếp theo (N+3 đến N+5).","m":"","k":"","old":0},{"id":"m21","t":6,"q":"Theo Điều 53 TT 06/2025/TT-BCT, trước ngày nào hàng năm Cấp điều độ có quyền điều khiển lập, phê duyệt, công bố kế hoạch bảo dưỡng, sửa chữa lưới điện và nhà máy điện năm tiếp theo?","o":["Ngày 01 tháng 12","Ngày 01 tháng 11","Ngày 15 tháng 12","Ngày 20 tháng 12"],"a":0,"c":"TT 06/2025, Điều 53 khoản 1 điểm b","xh":"TT 06/2025/TT-BCT, Điều 53","xb":"b) Trước ngày 01 tháng 12 hàng năm, Cấp điều độ có quyền điều khiển có trách nhiệm lập, phê duyệt, công bố kế hoạch bảo dưỡng, sửa chữa lưới điện và nhà máy điện năm tiếp theo thuộc phạm vi quyền điều khiển","w":"Phê duyệt, công bố kế hoạch BDSC năm **trước ngày 01/12**.","m":"","k":"","old":0},{"id":"m22","t":6,"q":"Theo Điều 53 TT 06/2025/TT-BCT, trước ngày nào hàng tháng (tháng M) Đơn vị quản lý vận hành gửi Cấp điều độ có quyền điều khiển bản đăng ký kế hoạch bảo dưỡng, sửa chữa tháng tiếp theo (M+1)?","o":["Ngày 15","Ngày 20","Ngày 10","Ngày 25"],"a":0,"c":"TT 06/2025, Điều 53 khoản 2 điểm a","xh":"TT 06/2025/TT-BCT, Điều 53","xb":"a) Trước ngày 15 hàng tháng (tháng M), trên cơ sở kế hoạch bảo dưỡng, sửa chữa năm đã được phê duyệt, Đơn vị quản lý vận hành có trách nhiệm gửi Cấp điều độ có quyền điều khiển","w":"Đăng ký BDSC tháng M+1 **trước ngày 15 hàng tháng**; cấp điều độ phê duyệt trước ngày 25.","m":"","k":"","old":0},{"id":"m23","t":6,"q":"Theo Điều 58 TT 06/2025/TT-BCT, khi bảo dưỡng, sửa chữa kéo dài hơn 06 ngày có khả năng kết thúc muộn hơn đăng ký, Đơn vị quản lý vận hành gửi Phiếu đăng ký điều chỉnh vào thời điểm nào?","o":["Trước 48 giờ trước khi kết thúc theo kế hoạch ban đầu","Trước 24 giờ","Trước 10 giờ","Trước 72 giờ"],"a":0,"c":"TT 06/2025, Điều 58 khoản 2 điểm a","xh":"TT 06/2025/TT-BCT, Điều 58","xb":"a) Trước 48 giờ trước khi kết thúc bảo dưỡng, sửa chữa theo kế hoạch ban đầu đối với bảo dưỡng, sửa chữa kéo dài hơn 06 ngày;","w":"Công tác kéo dài **> 06 ngày: trước 48 giờ**; **04 đến 06 ngày: trước 24 giờ**; **02 đến 03 ngày: trước 10 giờ**.","m":"","k":"","old":0},{"id":"m24","t":6,"q":"Theo Điều 58 TT 06/2025/TT-BCT, công tác bảo dưỡng, sửa chữa kéo dài từ 04 ngày đến 06 ngày, nếu có khả năng kết thúc muộn thì gửi Phiếu đăng ký điều chỉnh trước khi kết thúc theo kế hoạch ban đầu bao lâu?","o":["24 giờ","48 giờ","10 giờ","12 giờ"],"a":0,"c":"TT 06/2025, Điều 58 khoản 2 điểm b","xh":"TT 06/2025/TT-BCT, Điều 58","xb":"b) Trước 24 giờ trước khi kết thúc bảo dưỡng, sửa chữa theo kế hoạch ban đầu đối với bảo dưỡng, sửa chữa kéo dài từ 04 ngày đến 06 ngày;","w":"Kéo dài **04 đến 06 ngày: trước 24 giờ**.","m":"","k":"","old":0},{"id":"m25","t":6,"q":"Theo Điều 58 TT 06/2025/TT-BCT, công tác bảo dưỡng, sửa chữa kéo dài từ 02 ngày đến 03 ngày, nếu có khả năng kết thúc muộn thì gửi Phiếu đăng ký điều chỉnh trước khi kết thúc theo kế hoạch ban đầu bao lâu?","o":["10 giờ","24 giờ","48 giờ","02 giờ"],"a":0,"c":"TT 06/2025, Điều 58 khoản 2 điểm c","xh":"TT 06/2025/TT-BCT, Điều 58","xb":"c) Trước 10 giờ trước khi kết thúc bảo dưỡng, sửa chữa theo kế hoạch ban đầu đối với bảo dưỡng, sửa chữa kéo dài từ 02 ngày đến 03 ngày;","w":"Kéo dài **02 đến 03 ngày: trước 10 giờ**.","m":"","k":"","old":0},{"id":"m26","t":6,"q":"Theo Điều 58 TT 06/2025/TT-BCT, khi thời gian kết thúc bảo dưỡng, sửa chữa có khả năng SỚM hơn đăng ký, Đơn vị quản lý vận hành phải làm gì?","o":["Thông báo qua hệ thống thông tin điều độ hoặc bằng văn bản đến Cấp điều độ có quyền điều khiển ngay sau khi xác định thời gian dự kiến kết thúc","Chờ đến hết thời gian đăng ký rồi mới báo cáo","Chỉ gửi Phiếu đăng ký điều chỉnh trước 48 giờ","Không cần thông báo vì kết thúc sớm có lợi"],"a":0,"c":"TT 06/2025, Điều 58 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 58","xb":"Đơn vị quản lý vận hành có trách nhiệm thông báo qua hệ thống thông tin điều độ hoặc bằng văn bản đến Cấp điều độ có quyền điều khiển ngay sau khi xác định thời gian dự kiến kết thúc bảo dưỡng, sửa chữa","w":"Kết thúc **sớm**: thông báo **ngay** qua hệ thống thông tin điều độ hoặc bằng văn bản. Kết thúc **muộn**: gửi Phiếu đăng ký điều chỉnh theo mốc 48/24/10 giờ.","m":"","k":"","old":0},{"id":"m27","t":6,"q":"Theo Điều 57 TT 06/2025/TT-BCT, khi việc đăng ký bảo dưỡng, sửa chữa đột xuất không kịp theo khung thời gian quy định, Đơn vị quản lý vận hành làm gì?","o":["Liên hệ và đăng ký công tác trực tiếp với Cấp điều độ có quyền điều khiển","Không được thực hiện công tác","Chờ đến kỳ đăng ký tháng sau","Đăng ký với Cấp điều độ quốc gia"],"a":0,"c":"TT 06/2025, Điều 57 khoản 1","xh":"TT 06/2025/TT-BCT, Điều 57","xb":"Đơn vị quản lý vận hành có trách nhiệm liên hệ và đăng ký công tác trực tiếp với Cấp điều độ có quyền điều khiển.","w":"Đăng ký **trực tiếp với Cấp điều độ có quyền điều khiển**, cấp này xem xét và bố trí vào thời gian hợp lý.","m":"","k":"","old":0}],"topics":{"1":{"name":"Văn bản pháp lý và khái niệm cơ bản","dc":"Đề cương 1.1","core":["**Luật Điện lực 61/2024/QH15** (30/11/2024, hiệu lực 01/02/2025) thay Luật Điện lực 2004. Hai thông tư \"xương sống\": **TT 05/2025/TT-BCT** (lưới truyền tải, phân phối, đo đếm) và **TT 06/2025/TT-BCT** (điều độ, vận hành, thao tác, xử lý sự cố, khởi động đen, khôi phục HTĐ), cùng hiệu lực 01/02/2025.","**TT 46/2025/TT-BCT** (ký 06/8/2025, hiệu lực 22/9/2025) sửa đổi, bổ sung TT 04, 05, 06/2025. **TT 29/2026/TT-BCT** (hiệu lực 20/7/2026) quy định vận hành thị trường bán buôn điện cạnh tranh.","Các thông tư cũ **TT 39/2015, TT 40/2014, TT 44/2014, TT 28/2014** đã hết hiệu lực. Khi đề thi nhắc số hiệu cũ mà nội dung vẫn hỏi, chọn đáp án khớp TT 05, TT 06/2025.","Phân loại cấp điện áp (TT 05, Điều 3): **hạ áp** đến 01 kV; **trung áp** trên 01 kV đến 35 kV; **cao áp** trên 35 kV đến 220 kV; **siêu cao áp** trên 220 kV. **Lưới điện phân phối** có cấp điện áp đến 110 kV; **lưới điện truyền tải** trên 110 kV.","**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","**TT 46/2025/TT-BCT** (ký 06/8/2025, hiệu lực **22/9/2025**) sửa đổi TT 04, 05, 06/2025. Điểm đáng nhớ với kỹ sư phương thức: bỏ Cấp điều độ phân phối quận, huyện (Điều 4, 13, 41, 67…); đăng ký PT tháng **ngày 15 và 20**; PT tháng quốc gia phê duyệt **ngày 25**; thông báo PT tháng **26, 27, 28**; Chứng nhận vận hành **10 năm**; bãi bỏ TT 05 Điều 42 khoản 2, 7 (giảm công suất ở 50,5 Hz)."],"head":["Văn bản","Nội dung / số cần nhớ"],"rows":[["Luật Điện lực 61/2024/QH15","Ban hành 30/11/2024; hiệu lực 01/02/2025"],["TT 05/2025/TT-BCT","Lưới truyền tải, phân phối, đo đếm điện năng (tiêu chuẩn kỹ thuật, đấu nối)"],["TT 06/2025/TT-BCT","Điều độ, vận hành, thao tác, xử lý sự cố; hiệu lực 01/02/2025 (Điều 249)"],["TT 46/2025/TT-BCT","Sửa đổi TT 04, 05, 06/2025; ký 06/8/2025, hiệu lực 22/9/2025"],["TT 29/2026/TT-BCT","Thị trường bán buôn điện; hiệu lực 20/7/2026; chu kỳ giao dịch 30 phút"],["NĐ 57/2025; NĐ 58/2025; NĐ 243/2026","DPPA; điện NLTT, ĐMTMN; NĐ 243/2026 (26/6/2026) sửa đổi hai nghị định trên"],["QĐ 980/QĐ-NSMO","Kết nối SCADA với cấp điều độ"]],"traps":["Câu cũ hỏi theo \"TT 39-BCT\", \"TT 40-BCT\": nội dung nay nằm ở TT 05/2025, TT 06/2025; **số điều đã đổi**, nên nhớ nội dung hơn là số điều.","\"Trung áp **trên** 01 kV đến 35 kV\" (không phải \"từ 01 kV\"); \"cao áp **trên** 35 kV đến 220 kV\".","Lưới phân phối: **đến 110 kV**; lưới truyền tải: **trên 110 kV**. Vì vậy 110 kV thuộc lưới phân phối."]},"2":{"name":"Tổ chức điều độ, quyền điều khiển – kiểm tra – nắm thông tin","dc":"Đề cương 1.2.2","core":["Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","Nguyên tắc: tại một thời điểm một thiết bị chỉ thuộc quyền điều khiển của **một** cấp điều độ; ủy quyền điều khiển phải bằng **văn bản** có xác nhận hai bên (Điều 5).","**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","**Cấp miền có quyền kiểm tra** (Điều 16): lưới phân phối thuộc quyền điều khiển của tỉnh mà thay đổi kết lưới dẫn đến thay đổi chế độ vận hành bình thường của HTĐ miền; tổ máy của nhà máy ≤30 MW thuộc quyền điều khiển của tỉnh mà việc huy động làm thay đổi chế độ vận hành bình thường của HTĐ miền.","**Sự cố hoặc đe dọa sự cố** (Điều 9): cấp có quyền điều khiển được ra lệnh trước rồi báo cáo ngay cho cấp có quyền kiểm tra; khẩn cấp (cháy, đe dọa tính mạng) nhân viên vận hành được thao tác trước, báo cáo sau.","Bộ phận tại cấp điều độ phân phối tỉnh: trực ban chỉ huy điều độ, phương thức ngắn hạn (Điều 124), phương thức dài hạn (Điều 125 – 9 nhiệm vụ), tính toán chỉnh định rơ le (Điều 126). Bộ phận phương thức dài hạn chủ trì điều tra, phân tích sự cố.","Đào tạo kỹ sư phương thức: HTĐ miền **≥18 tháng** (Điều 233); HTĐ phân phối **≥12 tháng** (Điều 238); phải qua kiểm tra, sát hạch trước khi công nhận chức danh.","**Chứng nhận vận hành** (Điều 220, sửa đổi bởi TT 46/2025): thời hạn **10 năm**; cấp đổi khi còn hạn dưới **06 tháng**. Cấp điều độ quốc gia cấp cho chức danh tại cấp quốc gia, cấp miền; Cấp điều độ miền cấp cho chức danh tại cấp phân phối tỉnh; Kỹ sư phương thức hệ thống phân phối điện có ký hiệu **ĐĐ.Bx.02**. Người trực tiếp chỉ huy hệ thống phân phối tỉnh là **Điều độ viên phân phối tỉnh** (Điều 77)."],"head":["Quyền","Khái niệm ngắn","Điều (TT 06)"],"rows":[["Điều khiển","Thay đổi chế độ vận hành HTĐ/thiết bị điện","Điều 6"],["Kiểm tra","Cho phép cấp dưới/Đơn vị QLVH thực hiện quyền điều khiển","Điều 7"],["Nắm thông tin","Được nhận thông báo, cung cấp trước thông tin","Điều 8"],["Sự cố/đe dọa sự cố","Ra lệnh trước, báo cáo sau; khẩn cấp: nhân viên vận hành thao tác trước","Điều 9"],["Cấp phân phối tỉnh – điều khiển","Trung áp, 110 kV ủy quyền, MBA 110 kV, nguồn ≤30 MW, phụ tải","Điều 12"]],"traps":["Quyền kiểm tra **không** phải quyền \"thay đổi chế độ vận hành\"; hai câu hay bị hoán đổi nội dung giữa **điều khiển – kiểm tra – nắm thông tin**.","Đường dây 110 kV thuộc quyền điều khiển của tỉnh **khi được cấp miền ủy quyền**; còn MBA 110 kV thuộc quyền điều khiển của tỉnh (trừ MBA tại nhà máy điện thuộc cấp cao hơn).","Số nhiệm vụ bộ phận phương thức dài hạn: bộ câu cũ ghi 11, **TT 06/2025 là 9**."]},"3":{"name":"Tiêu chuẩn tần số, điện áp và chất lượng điện năng","dc":"Đề cương 1.2.2, 1.2.5","core":["**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","**Điện áp danh định lưới phân phối**: 110, 35, 22, 15, 10, 06 kV và 0,38 kV; truyền tải: 500, 220 kV.","**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","Ví dụ cấp 110 kV: bình thường **104,5 ÷ 121 kV**; sự cố **99 ÷ 121 kV**. Cấp 22 kV: bình thường **20,9 ÷ 24,2 kV**. Cấp 35 kV: bình thường 33,25 ÷ 38,5 kV; sự cố đơn lẻ 31,5 ÷ 38,5 kV.","**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","**Nhấp nháy điện áp**: 110 kV Plt 0,6 và Pst 0,8; trung áp và hạ áp Plt 0,8 và Pst 1,0.","**Hệ số chạm đất**: truyền tải ≤1,4; phân phối ≤1,4 (nối đất trực tiếp), ≤1,7 (cách ly hoặc nối đất qua trở kháng). **Độ tin cậy**: SAIDI, SAIFI chỉ xét mất điện kéo dài trên 05 phút.","Trong thời gian sự cố, điện áp tại nơi sự cố có thể giảm quá độ đến 0 ở pha sự cố hoặc tăng quá **110%** điện áp danh định ở pha không sự cố."],"head":["Cấp điện áp","Bình thường","Sự cố đơn lẻ"],"rows":[["500 kV","± 5%","theo Điều 6"],["220 kV","+10% / −5%","theo Điều 6"],["110 kV (thanh cái)","104,5 ÷ 121 kV","99 ÷ 121 kV (±10%)"],["35 kV","33,25 ÷ 38,5 kV","31,5 ÷ 38,5 kV"],["22 kV","20,9 ÷ 24,2 kV","19,8 ÷ 24,2 kV (±10%)"],["Điểm đấu nối khách hàng","± 5%","—"]],"traps":["Điện áp bình thường là **+10% / −5%** (bất đối xứng), sự cố là **±10%** – đừng lẫn.","Tần số: bình thường ±0,2 Hz; \"điều chỉnh khẩn trương\" ngoài ±0,5 Hz (TT 06); sa thải phụ tải khi dưới 49,5 Hz.","THD hạ áp 8% nhưng biến dạng **riêng lẻ** hạ áp 5%; THD 110 kV 3% nhưng riêng lẻ 1,5%."]},"4":{"name":"Nối đất trung tính, dòng ngắn mạch và rơ le bảo vệ","dc":"Đề cương 1.2.5, 2.2","core":["**Nối đất trung tính** (TT 05, Điều 11, Bảng 7): 500, 220, 110 kV nối đất trực tiếp; **35 kV** trung tính cách ly hoặc nối đất qua trở kháng; **22 kV, 15 kV** nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây).","**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","Dạng ngắn mạch: 3 pha (đối xứng, lớn nhất, dùng chọn thiết bị); 1 pha chạm đất (xác suất cao nhất, ~70–80%); 2 pha; 2 pha chạm đất. Ik = U/(√3·Z): điểm sự cố càng gần nguồn càng lớn.","**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","**Khoảng cách (21)**: vùng 1 = 80–85% ZL, t = 0; vùng 2 ≥ 120% ZL, t = 0,3–0,4 s. **Quá dòng**: Is ≥ (1,1–1,3)·Ilvmax/kv; độ nhạy Kn ≥ 1,5 (chính), ≥ 1,2 (dự phòng); bước phối hợp Δt khoảng 0,3–0,4 s.","Đặc tính IEC: **t = TMS·k/((I/Is)^α − 1)**; SI k = 0,14, α = 0,02; VI 13,5/1; EI 80/2; LTI 120/1.","Mã ANSI hay hỏi: 21 khoảng cách; 25 kiểm tra đồng bộ; 27/59 kém/quá áp; 46 thứ tự nghịch; 50/51 quá dòng; 67 có hướng; 79 tự động đóng lại; 81 tần số; 85 truyền cắt; 87 so lệch; 50BF chống hỏng máy cắt."],"head":["Cấp điện áp","Ik max (kA)","Thời gian loại trừ (bảo vệ chính)"],"rows":[["500 kV","50","80 ms"],["220 kV","50","100 ms"],["110 kV","31,5","150 ms"],["Trung áp","25","500 ms"],["Thanh cái 110 kV trạm 500/220 kV","40","—"]],"traps":["Thanh cái 110 kV của trạm **110/22 kV**: 31,5 kA; của trạm **220/110 kV**: 40 kA.","Trung áp: bảo vệ chính cắt trong **500 ms**, 110 kV: **150 ms**; đừng đảo hai số.","Hãm **hài bậc 2** chống dòng xung kích khi đóng MBA; hài bậc 5 chống quá kích từ."]},"5":{"name":"Đấu nối, hệ số công suất và yêu cầu kỹ thuật của nguồn, khách hàng","dc":"Đề cương 1.3, 1.5","core":["**Hệ số công suất**: Đơn vị phân phối điện, khách hàng nhận điện trực tiếp từ lưới truyền tải: cosφ ≥ **0,9** (nhận Q), ≥ **0,98** (phát Q) tại vị trí đo đếm chính. Khách hàng sản xuất, kinh doanh, dịch vụ có công suất cực đại **từ 40 kW**: cosφ ≥ 0,9 tại điểm đặt thiết bị đo đếm.","**Độ dao động phụ tải**: tốc độ thay đổi công suất tiêu thụ của khách hàng có trạm riêng trong 01 phút không vượt 10% công suất tiêu thụ. **Hệ thống tự động cắt tải sự cố**: độ tin cậy ≥ 99%.","Nhà máy điện lớn hơn 30 MW: thời gian duy trì phát điện theo dải tần số (Điều 40): **49 ÷ 51 Hz: liên tục**; trên 48 đến dưới 49 Hz: 30 phút; 47,5 ÷ 48 Hz: 10 phút; trên 51 ÷ 51,5 Hz: 30 phút; trên 51,5 ÷ 52 Hz: **01 phút**.","Nguồn điện mặt trời, điện gió ≤01 MW đấu nối trung áp: giảm công suất tác dụng khi tần số vượt **50,5 Hz**; tự động kết nối lại sau khi tần số, điện áp ổn định **60 giây**. ĐMT hạ áp từ **20 kWp** phải đấu nối 3 pha; không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98.","Nhà máy điện công suất lắp đặt **từ 10 MW** và trạm điện từ 110 kV trở lên phải trang bị Gateway/RTU kết nối SCADA."],"head":["Dải tần số","Thời gian duy trì tối thiểu (nhà máy > 30 MW)"],"rows":[["47,5 ÷ 48,0 Hz","10 phút"],["Trên 48 đến dưới 49 Hz","30 phút"],["49 ÷ 51 Hz","Phát liên tục"],["Trên 51 ÷ 51,5 Hz","30 phút"],["Trên 51,5 ÷ 52 Hz","01 phút"]],"traps":["\"Từ 40 kW\" (khách hàng sản xuất kinh doanh) và \"từ 20 kWp\" (ĐMT 3 pha) là hai ngưỡng khác nhau.","Ngưỡng nhà máy 30 MW (duy trì tần số, phân cấp quyền điều khiển) khác ngưỡng 10 MW (bắt buộc Gateway/RTU).","cosφ ≥ 0,9 khi **nhận** Q; ≥ 0,98 khi **phát** Q."]},"6":{"name":"Phương thức vận hành và kế hoạch bảo dưỡng, sửa chữa","dc":"Đề cương 1.3.1","core":["**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","**Sơ đồ kết dây cơ bản** (Điều 41, 42): tỉnh → miền trước **15/8**; miền → quốc gia trước **01/9**. Phê duyệt, công bố: quốc gia trước 20/11, miền trước 01/12, tỉnh trước **15/12**.","**Phương thức quốc gia năm** (Điều 68): 15/10 gửi EVN lấy ý kiến → 25/10 EVN thống nhất → 01/11 hoàn thiện → **15/11 trình Bộ Công Thương**. Tháng: 20 gửi EVN → 22 EVN thống nhất → **25** hoàn thiện, phê duyệt, công bố (TT 46/2025). Tuần: phê duyệt trước **11h00 thứ Sáu**.","**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: **26 → 27 → 28** (TT 46/2025); tuần: 15h → 16h → **17h00 thứ Sáu**; thông báo tại cấp tỉnh gửi **Đơn vị quản lý vận hành**. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**."],"head":["Nội dung","Tỉnh → Miền","Miền → Quốc gia"],"rows":[["PT vận hành năm","trước 01/8","trước 15/8"],["PT vận hành tháng","trước ngày 15","trước ngày 20"],["PT vận hành tuần","trước 10h00 thứ Ba","trước 10h00 thứ Tư"],["Sơ đồ kết dây cơ bản","trước 15/8","trước 01/9"],["Thông báo PT năm (từ trên xuống)","Miền → tỉnh: 10/12","Tỉnh → Đơn vị QLVH: 20/12 (QG → miền: 01/12)"],["Thông báo PT tháng (từ trên xuống)","Miền → tỉnh: 27 hàng tháng","Tỉnh → Đơn vị QLVH: 28 (QG → miền: 26)"]],"traps":["**Năm: 01/8 (tỉnh → miền) rồi 15/8 (miền → quốc gia)**. Mốc 15/7 là của cấp quận, huyện cũ, nay bỏ; câu cũ ghi \"tỉnh gửi miền 15/7\" là sai.","Thông báo phương thức năm: bộ câu cũ ghi miền thông báo tỉnh **25/11**; nay là **10/12**. Tỉnh thông báo **20/12** cho Đơn vị quản lý vận hành.","**Tháng (TT 46/2025): đăng ký tháng tỉnh → miền trước ngày 15, miền → quốc gia trước ngày 20.** Bộ câu cũ và bản gốc ghi \"09 và 08 ngày làm việc cuối tháng\". Phê duyệt PT tháng quốc gia nay là **ngày 25** (cũ 27); thông báo tháng 26 → 27 → 28 (cũ 27 → 28 → 29).","Tuần: tỉnh 10h00 thứ **Ba**, miền thứ **Tư**; BDSC tuần cũng **thứ Ba**; công bố dự báo tuần **thứ Sáu** (15h00), phê duyệt phương thức tuần quốc gia **thứ Sáu** (11h00)."]},"7":{"name":"Chế độ vận hành, mang tải, quá tải và điều chỉnh tần số, điện áp","dc":"Đề cương 1.2.5, 2.4.3","core":["**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","**Tần số** (TT 06, Điều 88–89): khi tần số ngoài 50 ± 0,5 Hz tất cả nhà máy điện (kể cả không tham gia điều tần) phải tham gia điều chỉnh; sau khi huy động hết dự phòng mà tần số vẫn có khả năng xuống dưới **49,5 Hz** thì sa thải phụ tải.","**Điều chỉnh điện áp** (Điều 96) theo thứ tự: (1) thay đổi Q nguồn bù, máy phát gần → xa; (2) nấc MBA, **không tăng nấc khi điện áp phía cao áp đã thấp dưới −5%**; (3) huy động nguồn dự phòng; (4) thay đổi kết lưới; (5) sa thải phụ tải.","**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","Mức giới hạn truyền tải đường dây là **giá trị nhỏ nhất** của: dòng định mức dây dẫn/thiết bị nối tiếp, giới hạn ổn định, giới hạn theo tiêu chuẩn điện áp (Điều 182).","Biện pháp **tăng** điện áp: đóng tụ bù ngang, cắt kháng bù ngang, tăng phát Q máy phát, điều chỉnh nấc phân áp phù hợp. Biện pháp **giảm** điện áp: ngược lại."],"head":["Chế độ","Mức mang tải đường dây, MBA cao áp, siêu cao áp"],"rows":[["Bình thường","Dưới 90% định mức"],["Cảnh báo","Từ 90% đến không vượt quá định mức"],["Khẩn cấp","Vượt định mức nhưng dưới 110% (cùng các điều kiện tần số, điện áp)"],["Cực kỳ khẩn cấp","Mất ổn định, rã lưới, mất điện diện rộng"]],"traps":["Bộ câu cũ ghi bình thường \"80–90%\" hoặc cảnh báo \"trên 90–100%\": theo TT 05/2025 là **dưới 90%** và **từ 90% đến ≤100%**.","Quá tải 45% là **80 phút**, 75% là **20 phút**, 30% là 120 phút, 60% là 45 phút – hay bị hoán đổi.","Không tăng nấc MBA khi cao áp **dưới −5%** (không phải −10%)."]},"8":{"name":"Dự báo phụ tải, biểu đồ phụ tải và sa thải F81","dc":"Đề cương 1.4","core":["**Sai số dự báo** (TT 06, Điều 43): năm, tháng, tuần **±6%**; ngày, chu kỳ giao dịch **±4%**; ngày Lễ, Tết và sự kiện biến động lớn **±10%**. Bộ câu cũ ghi ±3% và ±2% – đã lỗi thời.","**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","Nếu không gửi đúng hạn: năm – căn cứ dự báo năm trước; tháng – tháng trước hoặc dự báo năm; tuần – tuần trước hoặc dự báo tháng.","**Biểu đồ phụ tải**: hai đỉnh (trưa, tối); K1 = Ptb/Pmax; K2 = Pmin/Pmax. ĐMTMN làm lõm biểu đồ giao nhận buổi trưa. Pmax TP.HCM năm 2026 đạt 9.668 MW.","**F81**: Cấp điều độ quốc gia tính toán, xác định số lượng, vị trí, độ lớn, mức tần số cắt tải tự động theo tần số thấp **trước 01/9 hàng năm** (Điều 104); chỉ khôi phục phụ tải khi có lệnh điều độ."],"head":["Kỳ dự báo","Đơn vị phân phối gửi NSMO","NSMO công bố"],"rows":[["Năm (N+1, N+2)","Trước 01/8","Trong phương thức năm"],["Tháng (M+1)","Trước ngày 15","Trong phương thức tháng"],["Tuần","Trước 10h00 thứ Hai","Trước 15h00 thứ Sáu"],["Ngày (02 ngày tới)","—","Trước 10h00 hàng ngày"],["Chu kỳ giao dịch","—","Chậm nhất 10 phút trước chu kỳ tiếp theo"]],"traps":["**±6%** (năm, tháng, tuần) và **±4%** (ngày, chu kỳ giao dịch); ngày lễ **±10%**.","\"10h00 thứ Hai\" là hạn **gửi** dự báo tuần; \"15h00 thứ Sáu\" là hạn **công bố**; \"11h00 thứ Sáu\" là hạn **phê duyệt phương thức** tuần quốc gia.","Dự báo năm cho **hai năm** (N+1, N+2) – bộ câu cũ (quy trình dự báo cũ) có thêm 03 năm tiếp theo."]},"9":{"name":"Thao tác, xử lý sự cố và ca trực điều độ","dc":"Đề cương 1.3.4, 1.3.5, 2.4","core":["**Lệnh điều độ** bằng lời nói, tín hiệu điều khiển (SCADA) hoặc chữ viết; lời nói phải ghi âm lưu **≥ 01 năm**; lệnh điện tử (DIM) lưu **≥ 05 năm**; lệnh bằng tín hiệu điều khiển lưu ≥ 01 năm; người nhận lệnh phải nhắc lại. Kênh ưu tiên cao nhất: trực thông hoặc vô tuyến.","**Phiếu thao tác** bắt buộc, cấm thao tác theo trí nhớ. Được miễn phiếu (phải ghi sổ nhật ký trước khi thao tác): xử lý sự cố; ≤ **03** bước tại trung tâm điều khiển hoặc thao tác xa; ≤ **05** bước tại cấp điều độ có quyền điều khiển. Phiếu đã thực hiện lưu **≥ 03 tháng**; chuyển phiếu kế hoạch trước **≥ 45 phút**.","**Thao tác thử** MC, DCL, chuyển nấc MBA bằng điều khiển từ xa nếu **12 tháng** không thao tác. Hệ thống thao tác xa lưu sự kiện **≥ 03 tháng**. Hạn chế thao tác giờ cao điểm và giao nhận ca; không thao tác ngoài trời khi giông sét (trừ xử lý sự cố bằng xa).","**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","**Đóng lại đường dây trên không**: trên 35 đến 220 kV tối đa **02 lần** (kể cả TĐL); từ 35 kV trở xuống tối đa **03 lần**; ≤ 35 kV, trong 08 giờ sự cố thoáng qua lần thứ **04** thì khóa TĐL; không đóng điện đường dây trên 35 kV khi MC nhảy trong gió từ cấp **06**; đường dây cáp: không đóng lại khi bảo vệ trong phạm vi cáp tác động; hỗn hợp ≤ 35 kV: đóng lại 01 lần.","**Giao nhận ca**: có mặt trước ≥ **15 phút**; không giao ca khi đang sự cố, thao tác phức tạp, chưa hoàn thành công việc, người nhận ca không đủ tỉnh táo (Điều 81). Cô lập hoặc đưa rơ le bảo vệ vào lại chỉ khi có lệnh cấp điều độ có quyền điều khiển."],"head":["Nội dung","Giá trị"],"rows":[["Ghi âm lệnh lời nói","≥ 01 năm"],["Lưu lệnh điện tử (DIM)","≥ 05 năm"],["Lưu phiếu thao tác","≥ 03 tháng"],["Chuyển phiếu kế hoạch","≥ 45 phút trước thao tác"],["Miễn phiếu","Sự cố; ≤3 bước (TTĐK/xa); ≤5 bước (cấp điều độ)"],["Đóng lại 35÷220 kV / ≤35 kV","≤ 2 lần / ≤ 3 lần"],["Khép vòng","≤ 30° và ≤ 10%"],["Giao ca","Có mặt ≥ 15 phút"]],"traps":["≤**3** bước (TTĐK, thao tác xa) khác ≤**5** bước (cấp điều độ); sự cố luôn được miễn phiếu.","Ghi âm 01 **năm**; DIM 05 **năm**; phiếu 03 **tháng** – ba mốc thời gian lưu trữ khác nhau.","Đóng lại: đường dây **trên 35 kV** tối đa 2 lần, **từ 35 kV trở xuống** 3 lần (35 kV thuộc nhóm 3 lần)."]},"10":{"name":"Nguồn điện, thị trường điện, ĐMTMN và DPPA","dc":"Đề cương 1.5","core":["**Thị trường bán buôn điện** (TT 29/2026, hiệu lực 20/7/2026): chu kỳ giao dịch **30 phút**; đơn vị phát điện chào giá trước **11h30 ngày D-1**; giá thị trường gồm giá điện năng và giá công suất; thanh toán qua hợp đồng sai khác (CfD).","**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","NQ 253/2025/QH15 (11/12/2025): cơ chế, chính sách phát triển năng lượng quốc gia giai đoạn 2026–2030."],"head":["Nội dung","Số liệu"],"rows":[["Bán dư ĐMTMN","Bản gốc NĐ 58/2025: 20%; sau NĐ 243/2026: tối đa 50%"],["DPPA qua lưới quốc gia","Nguồn từ 10 MW; khách hàng ≥ 200.000 kWh/tháng"],["Giao thức ĐMTMN","Modbus TCP – 502; IEC 104 – 2404; 05 phút; lưu 07 ngày"],["Thị trường điện","Chu kỳ 30 phút; chào giá trước 11h30 D-1"]],"traps":["20% (NĐ 58 bản gốc) và 50% (sau NĐ 243/2026): đề mới ưu tiên 50%.","DPPA có **hai** hình thức; nguồn gió, mặt trời qua lưới quốc gia từ **10 MW**.","Modbus TCP cổng **502**; IEC 104 cổng **2404**."]},"11":{"name":"SCADA, DAS/DMS và viễn thông điều độ","dc":"Đề cương 1.6, 2.3","core":["**SCADA** thu thập đo lường, trạng thái, điều khiển xa, cảnh báo. **DAS** tự động hóa lưới phân phối: **FLISR** (xác định vị trí, cô lập sự cố, khôi phục cấp điện). **DMS** gồm các ứng dụng như BLA, **DPF** (tính trào lưu công suất lưới phân phối), FL, FLISR, **PV** (giám sát điều kiện phối hợp bảo vệ), AFR.","Chế độ DAS: **Disable** (không tự động), **Semi Auto** (hệ thống đưa phương án khôi phục, điều độ viên chọn rồi thực hiện), **Auto** (tự động thực thi). **Điểm dừng pháp lý**: điểm dừng dài hạn ở chế độ vận hành bình thường do Công ty Điện lực đề xuất.","**Yêu cầu kỹ thuật** (TT 05, Điều 30, 34): trạm từ 110 kV trở lên, nhà máy từ 10 MW trang bị Gateway/RTU; trạm 110 kV điều khiển từ Trung tâm điều khiển có **hai** kết nối; Trung tâm điều khiển phải có **hai** đường truyền (một làm việc, một dự phòng nóng); tổng công suất NLTT của một Trung tâm điều khiển không vượt công suất tổ máy lớn nhất trong HTĐ quốc gia.","**QĐ 980/QĐ-NSMO**: sẵn sàng kênh ≥ 98% (không thao tác xa), ≥ **99,9%** (có thao tác xa); tín hiệu số ≤ **10 ms**; đo lường ≤ 2 s. Thử nghiệm: point-to-point (từ thiết bị nhất thứ đến RTU/Gateway), rồi end-to-end (từ cấp điều độ). IEC 60870-5-104 truyền trên **TCP/IP**."],"head":["Chức năng DMS","Ý nghĩa"],"rows":[["FLISR","Xác định vị trí sự cố, cô lập, khôi phục cấp điện"],["DPF","Tính toán trào lưu công suất lưới phân phối"],["PV","Giám sát điều kiện phối hợp bảo vệ các thiết bị trên lưới"],["BLA","Phân tích tải nút"]],"traps":["Semi Auto: hệ thống **đề xuất**, người dùng **chọn**; Auto: tự thực thi.","Kỹ sư Phương thức **không** thao tác xa; thao tác xa do điều độ viên (2 người).","Gateway/RTU: nhà máy **từ 10 MW**; trạm **từ 110 kV**."]},"12":{"name":"Tính toán chế độ, phần mềm và công thức nhanh","dc":"Đề cương 2.1","core":["**Chế độ xác lập** (trào lưu công suất): giải bằng Newton–Raphson, Gauss–Seidel; P chảy từ nút góc pha lớn sang nhỏ, Q chảy từ nút điện áp cao sang thấp. **N-1**: kiểm tra mất một phần tử, không vi phạm giới hạn mang tải, điện áp.","**Công thức nhanh**: Iđm = Sđm/(√3·Uđm); ΔU = (P·R + Q·X)/U; ΔP = (P² + Q²)·R/U²; Ik = U/(√3·Z); k% = S/Sđm × 100%; K1 = Ptb/Pmax = A/(24·Pmax); Q tụ ∝ U².","Hệ đơn vị tương đối: Zcb = Ucb²/Scb; có thể dùng hệ đơn vị tương đối hoặc có tên. Các chương trình thường dùng: PSS/E, PSS/SINCAL, Aspen OneLiner (ngắn mạch, chỉnh định rơ le), EMS (state estimation – SE).","Điều kiện vận hành song song MBA: cùng tổ đấu dây, tỉ số biến bằng nhau, Uk% gần nhau, tỉ lệ công suất không quá 3:1, cùng thứ tự pha.","Giảm dòng ngắn mạch: vận hành MBA độc lập phía thứ cấp, tăng tổng trở (kháng điện, MBA tổng trở lớn), tách thanh cái.","Tổn thất: giảm bằng nâng điện áp vận hành, bù Q, cân bằng pha, chọn điểm mở tối ưu, chống quá tải."],"head":["Đại lượng","Công thức","Ví dụ"],"rows":[["Dòng định mức MBA","Iđm = Sđm/(√3·Uđm)","63 MVA: 22 kV (23 kV) ≈ 1.581 A; 110 kV (115 kV) ≈ 316 A"],["Sụt áp","ΔU = (P·R + Q·X)/U","—"],["Tổn thất công suất","ΔP = (P² + Q²)·R/U²","—"],["Hệ số phụ tải","K1 = A/(24·Pmax)","A: điện năng ngày"],["Mang tải","k% = S/Sđm","Cảnh báo ≥ 90%; quá tải > 100%"]],"traps":["Công thức sụt áp (ΔU) khác công thức tổn thất công suất (ΔP).","Điều kiện song song MBA: tỉ lệ công suất **không quá 3:1**, Uk% sai khác nhỏ.","Các câu về lệnh PSS/E, Aspen OneLiner nằm ở phần câu hỏi mở rộng; chủ yếu ghi nhớ tên tập tin, lệnh thao tác."]}},"nums":[["Tần số","Bình thường 50 ± 0,2 Hz; sự cố đơn lẻ 49–51 Hz, về 49,5–50,5 Hz trong 02 phút, về 49,8–50,2 Hz trong 05 phút","TT 05 Đ4"],["Tần số","Ngoài 50 ± 0,5 Hz: mọi NMĐ tham gia điều chỉnh; dưới 49,5 Hz sau khi huy động dự phòng: sa thả ớc ≥15 phút","TT 06 Đ81"],["Dự báo","Sai số: năm, tháng, tuần ±6%; ngày, chu kỳ ±4%; lễ, tết ±10%","TT 06 Đ43"],["Dự báo","Gửi: năm 01/8; tháng ngày 15; tuần 10h thứ Hai. Công bố: tuần 15h thứ Sáu; ngày 10h; chu kỳ: 10 phút trước","TT 06 Đ44–48"],["Dự báo","Năm: N+1, N+2, 104 tuần, 05 năm thống kê; tháng: 03 tháng gần nhất; tuần: 04 tuần gần nhất; chu kỳ: 01+07","TT 06 Đ44–48"],["PT vận hành","Đăng ký năm: tỉnh 01/8, miền 15/8; tháng: tỉnh ngày 15, miền ngày 20; tuần: 10h thứ Ba (tỉnh) và thứ Tư (miền)","TT 06 Đ67 (sửa đổi TT 46)"],["PT vận hành","Đăng ký năm: tỉnh 01/8, miền 15/8; tháng: tỉnh ngày 15, miền ngày 20; tuần: 10h thứ Ba (tỉnh) và thứ Tư (miền)","TT 06 Đ67 (sửa đổi TT 46)"],["Thông báo PT","Năm: QG 01/12 → miền 10/12 → tỉnh 20/12; tháng: 27 → 28 → 29","TT 06 Đ71"],["BDSC","Tháng: đăng ký ngày 15, công bố ngày 25; tuần: 10h thứ Ba; năm: công bố 01/12; trả thiết bị 48 giờ","TT 06 Đ53–56"],["Quyền ĐK tỉnh","Trung áp; 110 kV được ủy quyền; MBA 110 kV; nguồn ≤30 MW; phụ tải","TT 06 Đ12"],["Đào tạo KSPT","Miền ≥18 tháng; phân phối ≥12 tháng","TT 06 Đ233, 238"],["Bộ phận PTDH","Phương thức dài hạn tỉnh: 9 nhiệm vụ (chủ trì điều tra sự cố)","TT 06 Đ125"],["Nhà máy >30 MW","49–51 Hz liên tục; 48–49 Hz 30′; 47,5–48 Hz 10′; 51–51,5 Hz 30′; 51,5–52 Hz 01′","TT 05 Đ40"],["NLTT nhỏ","≤1 MW giảm P khi f>50,5 Hz; nối lại sau 60 giây; ĐMT hạ áp ≥20 kWp đấu 3 pha","TT 05 Đ42–43"],["Gateway/RTU","Trạm ≥110 kV, nhà máy ≥10 MW; Trung tâm điều khiển 2 đường truyền (1 làm việc, 1 dự phòng nóng)","TT 05 Đ30, 34"],["SCADA","Kênh sẵn sàng ≥98% / ≥99,9% (có thao tác xa); tín hiệu số ≤10 ms; IEC 104: TCP/IP, cổng 2404; Modbus TCP: 502","QĐ 980, 1570"],["ĐMTMN","Bán dư: 20% (NĐ 58 gốc) → tối đa 50% (NĐ 243/2026); thông báo lắp đặt ≥10 ngày làm việc","NĐ 58, 243"],["DPPA","2 hình thức; qua lưới quốc gia: nguồn ≥10 MW, khách hàng ≥200.000 kWh/tháng","NĐ 57/2025"],["Thị trường","Chu kỳ giao dịch 30 phút; chào giá trước 11h30 D-1","TT 29/2026"],["MBA","Iđm = S/(√3U): 63 MVA ≈ 1.581 A (22 kV), ≈ 316 A (110 kV); song song: cùng tổ đấu dây, tỉ số, Uk% gần nhau, tỉ lệ công suất ≤3:1","Kiến thức"],["Rơ le","Vùng 1: 80–85% ZL, 0 s; vùng 2: ≥120% ZL, 0,3–0,4 s; Kn ≥1,5 (chính), ≥1,2 (dự phòng); SI: k=0,14, α=0,02","Kiến thức"],["Chứng nhận vận hành","Hiệu lực 10 năm; cấp đổi khi còn hạn dưới 06 tháng; Kỹ sư phương thức HTPP: ĐĐ.Bx.02","TT 06 Đ220, Phụ lục I (TT 46)"]],"traps":["Phương thức vận hành năm: tỉnh gửi miền **01/8**, miền gửi quốc gia **15/8** (mốc 15/7 của cấp quận, huyện đã bỏ; câu cũ ghi 15/7 cho tỉnh).","Thông báo PT năm: QG **01/12**, miền **10/12**, tỉnh **20/12** (câu cũ ghi 25/11).","Phương thức phân phối năm, tháng, tuần do **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**, không phải Cấp điều độ miền.","Sai số dự báo: **±6%** (năm, tháng, tuần), **±4%** (ngày, chu kỳ giao dịch), **±10%** (lễ, tết); câu cũ ghi ±3% và ±2%.","Dự báo tuần: **gửi** 10h thứ Hai; **công bố** 15h thứ Sáu; phương thức tuần quốc gia **phê duyệt** 11h thứ Sáu.","Đăng ký tuần: tỉnh 10h **thứ Ba**, miền 10h **thứ Tư**; BDSC tuần điều chỉnh cũng 10h thứ Ba.","Mang tải: bình thường **<90%**; cảnh báo **90–100%**; khẩn cấp **>100% đến <110%** (câu cũ ghi 80–90%).","Quá tải MBA dầu: **45% – 80 phút**, **75% – 20 phút**, 30% – 120 phút, 60% – 45 phút, 100% – 10 phút.","Điện áp bình thường **+10/−5%** (bất đối xứng), sự cố **±10%**, 500 kV **±5%**, khách hàng **±5%**.","Không tăng nấc MBA khi điện áp phía cao áp thấp dưới **−5%**.","Ik: 110 kV **31,5 kA**, trung áp **25 kA**; thanh cái 110 kV trạm 220 kV **40 kA**; bảo vệ chính 150 ms (110 kV) và 500 ms (trung áp).","Nối đất: 35 kV **cách ly/qua trở kháng**; 22 kV **trực tiếp (3P3D)/lặp lại (3P4D)**; 110 kV trực tiếp.","Hệ số chạm đất phân phối: **1,4** (nối đất trực tiếp), **1,7** (cách ly/qua trở kháng).","Miễn phiếu thao tác: **3 bước** (TTĐK/thao tác xa) và **5 bước** (cấp điều độ); sự cố luôn được miễn.","Ghi âm **01 năm**; DIM **05 năm**; phiếu thao tác **03 tháng**; chuyển phiếu **45 phút**.","Đóng lại: 35–220 kV function buildExam(){

  var alloc={},used=0,rem=[];
  TIDS.forEach(function(t){var x=TOTALQ*sizes[t]/tot;alloc[t]=Math.floor(x);used+=alloc[t];rem.push([t,x-alloc[t]])});
  rem.sort(function(a,b){return b[1]-a[1]});for(var i=0;used<TOTALQ;i++,used++)alloc[rem[i%rem.length][0]]++;

  if(b.classList.contains('opt')&&b.hasAttribute('data-d')){
    var d=+b.getAttribute('data-d');
    if(route==='luyen-tap'&&run&&!run.fin)answer(d);
    else if(route==='thi-thu'&&exam&&!exam.fin){var id=exam.ids[exam.i];exam.picks[id]=exam.order[id][d];exam.confirm=false;keepScroll(render)}
    return}
  if(!act)return;
  if(act==='start'){var r=pickList(b.getAttribute('data-m'),+b.getAttribute('data-t'));startRun(r.ids,r.title)}
  else if(act==='go-exam'){go('thi-thu')}
  else if(act==='quit'){run=null;render();window.scrollTo(0,0)}
  else if(act==='next'){if(run.i<run.ids.length-1)run.i++;else run.fin=true;render();window.scrollTo(0,0)}
  else if(act==='prev'){if(run.i>0){run.i--;render();window.scrollTo(0,0)}}
  else if(act==='retry'){var ids=run.ids.filter(function(id){return run.picks[id]!==byId[id].a});startRun(shuffled(ids,rng((Math.random()*1e9)|0)),'Làm lại câu sai')}
  else if(act==='flag'){var id2=run.ids[run.i];if(S.flag[id2])delete S.flag[id2];else S.flag[id2]=1;save();keepScroll(render)}
  else if(act==='exam-start'){exam=buildExam();render();window.scrollTo(0,0)}
  else if(act==='exam-close'){exam=null;render();window.scrollTo(0,0)}
  else if(act==='goto'){exam.i=+b.getAttribute('data-i');exam.confirm=false;render();window.scrollTo(0,0)}
  else if(act==='rgoto'){exam.i=+b.getAttribute('data-i');render();var el=$('.qcard');if(el)el.scrollIntoView({block:'start'})}
  else if(act==='enext'){exam.i++;exam.confirm=false;render();window.scrollTo(0,0)}
  else if(act==='eprev'){exam.i--;exam.confirm=false;render();window.scrollTo(0,0)}
  else if(act==='eflag'){var i3=exam.ids[exam.i];if(exam.flag[i3])delete exam.flag[i3];else exam.flag[i3]=1;keepScroll(render)}
  else if(act==='esubmit'){exam.confirm=true;render();var fb=$('.fbody');if(fb)fb.scrollTop=0;window.scrollTo(0,0)}
  else if(act==='econfirm'){submitExam()}
  else if(act==='ecancel'){exam.confirm=false;render()}
  else if(act==='more'){bank.n+=20;$('#blist').innerHTML=bankItems(bankList())}
  else if(act==='ltab'){learn.tab=b.getAttribute('data-v');render()}
  else if(act==='reset'){confirmReset=true;render()}
  else if(act==='reset-no'){confirmReset=false;render()}
  else if(act==='reset-yes'){S.ans={};S.flag={};S.exams=[];save();confirmReset=false;render()}
});
app.addEventListener('toggle',function(e){var d=e.target;if(d.tagName==='DETAILS'&&d.open&&d.hasAttribute('data-id'))fillBank(d)},true);
app.addEventListener('input',function(e){
  if(e.target.id==='bq'){bank.q=e.target.value;bank.n=20;var l=bankList();$('#bcount').textContent=l.length+' câu';$('#blist').innerHTML=bankItems(l)}
  else if(e.target.id==='shuf'){S.shuffle=e.target.checked;save()}});
app.addEventListener('change',function(e){if(e.target.id==='bt'){bank.t=+e.target.value;bank.n=20;var l=bankList();$('#bcount').textContent=l.length+' câu';$('#blist').innerHTML=bankItems(l)}});
document.addEventListener('keydown',function(e){
  if(e.target.matches&&e.target.matches('input,select,textarea'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase();
  if(route==='luyen-tap'&&run&&!run.fin){
    var id=run.ids[run.i],rev=run.picks[id]!==undefined;
    if(!rev&&'1234abcd'.indexOf(k)>=0&&k.length===1){var d='1234'.indexOf(k);if(d<0)d='abcd'.indexOf(k);if(d>=0&&d<4)answer(d)}
    else if(rev&&(k==='enter'||k==='arrowright')){if(run.i<run.ids.length-1)run.i++;else run.fin=true;render();window.scrollTo(0,0)}
    else if(k==='arrowleft'&&run.i>0){run.i--;render();window.scrollTo(0,0)}}
});
if(!location.hash)history.replaceState(null,'','#luyen-tap');
loadSess();
if(exam&&!exam.fin&&leftSecs()<=0){submitExam();history.replaceState(null,'','#thi-thu')}
render();
})();

</script>
