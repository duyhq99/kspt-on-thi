:"83d01417","t":3,"q":"Theo Điều 8 TT 05/2025/TT-BCT, tổng độ biến dạng sóng hài điện áp(THD) tối đa cho phép đối với cấp điện áp trung áp là:","o":["3%","5%","1,5%","8%"],"a":1,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"THD điện áp tối đa ở cấp **trung áp là 5%** (110 kV là 3%, hạ áp là 8%). Bảng 4a, Điều 8 TT 05/2025.","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id":"0a2ce605","t":3,"q":"Theo Điều 8 TT 05/2025/TT-BCT, tổng độ biến dạng sóng hài điện áp(THD) tối đa cho phép đối với cấp điện áp hạ áp là:","o":["3%","5%","1,5%","8%"],"a":3,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"THD điện áp tối đa ở cấp **hạ áp là 8%**, mức cao nhất trong ba cấp (110 kV: 3%, trung áp: 5%). Bảng 4a, Điều 8 TT 05/2025.","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id":"323d6018","t":3,"q":"Theo Điều 8 TT 05/2025/TT-BCT, biến dạng riêng lẻ điện áp tối đa cho phép đối với cấp điện áp hạ áp là:","o":["3%","5%","1,5%","8%"],"a":1,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"Biến dạng **riêng lẻ** (từng bậc hài) tối đa ở cấp **hạ áp là 5%**. Dãy giá trị là 110 kV: 1,5%; trung áp: 3%; hạ áp: 5%. Đừng nhầm với THD tổng (3% – 5% – 8%).","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id":"ea48fae9","t":3,"q":"Theo Điều 8 TT 05/2025/TT-BCT, biến dạng riêng lẻ điện áp tối đa cho phép đối với cấp điện áp 110kV là:","o":["3%","5%","1,5%","8%"],"a":2,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"Biến dạng **riêng lẻ** tối đa ở cấp **110 kV là 1,5%**, thấp nhất trong ba cấp (trung áp 3%, hạ áp 5%). Con số 3% là THD tổng của 110 kV, không phải biến dạng riêng lẻ.","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id":"f1d5017c","t":3,"q":"Theo Điều 8 TT 05/2025/TT-BCT, biến dạng riêng lẻ điện áp tối đa cho phép đối với cấp điện áp trung áp là:","o":["3%","5%","1,5%","8%"],"a":0,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"Biến dạng **riêng lẻ** tối đa ở cấp **trung áp là 3%** (110 kV: 1,5%; hạ áp: 5%). Con số 5% là THD tổng của trung áp, không phải biến dạng riêng lẻ.","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id":"a2c1ec8f","t":3,"q":"Theo Điều 9 TT 05/2025/TT-BCT, trong điều kiện vận hành bình thường, mức nhấp nháy điện áp ngắn hạn Pst95% tại mọi điểm đấu nối không vượt quá quy định đối với cấp điện áp 110kV là bao nhiêu?","o":["0,8","0,6","1","0,4"],"a":0,"c":"TT 05/2025, Điều 9, Bảng 6","w":"Mức nhấp nháy ngắn hạn **Pst95% ở 110 kV là 0,8**, còn Plt95% là 0,6. Trung áp là Pst 1,0 và Plt 0,8. Pst đo trong 10 phút, Plt đo trong 02 giờ nên Plt luôn nhỏ hơn Pst (Bảng 6, Điều 9 TT 05/2025).","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":1},{"m":"","id":"1542a6b8","t":3,"q":"Theo Điều 9 TT 05/2025/TT-BCT, trong điều kiện vận hành bình thường, mức nhấp nháy điện áp dài hạn Plt95% tại mọi điểm đấu nối không vượt quá quy định đối với cấp điện áp 110kV là bao nhiêu?","o":["0,8","0,6","1","0,4"],"a":1,"c":"TT 05/2025, Điều 9, Bảng 6","w":"Mức nhấp nháy dài hạn **Plt95% ở 110 kV là 0,6** (Pst95% là 0,8). Plt luôn nhỏ hơn Pst cùng cấp điện áp. Bảng 6, Điều 9 TT 05/2025.","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":1},{"m":"","id":"6cb31e33","t":3,"q":"Theo Điều 9 TT 05/2025/TT-BCT, trong điều kiện vận hành bình thường, mức nhấp nháy điện áp dài hạn Plt95% tại mọi điểm đấu nối không vượt quá quy định đối với cấp điện áp Trung áp là bao nhiêu?","o":["0,8","0,6","1","0,4"],"a":0,"c":"TT 05/2025, Điều 9, Bảng 6","w":"Mức nhấp nháy dài hạn **Plt95% ở trung áp là 0,8** (Pst95% là 1,0). Ở 110 kV thì Plt là 0,6 và Pst là 0,8. Bảng 6, Điều 9 TT 05/2025.","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":1},{"m":"","id":"94a2a48b","t":3,"q":"Theo Điều 9 TT 05/2025/TT-BCT, trong điều kiện vận hành bình thường, mức nhấp nháy điện áp ngắn hạn Pst95% tại mọi điểm đấu nối không vượt quá quy định đối với cấp điện áp Trung áp là bao nhiêu?","o":["0,8","0,6","1","0,4"],"a":2,"c":"TT 05/2025, Điều 9, Bảng 6","w":"Mức nhấp nháy ngắn hạn **Pst95% ở trung áp là 1,0** (Plt95% là 0,8). Ở 110 kV thì Pst là 0,8. Bảng 6, Điều 9 TT 05/2025.","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":1},{"m":"","id":"2fbc1f80","t":4,"q":"Theo Điều 12 TT 05/2025/TT-BCT, dòng điện ngắn mạch lớn nhất cho phép trên lưới điện phân phối đối với cấp điện áp 110kV là bao nhiêu?","o":["31,5kA","25kA","40kA","50kA"],"a":0,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Dòng ngắn mạch lớn nhất cho phép trên lưới phân phối ở cấp **110 kV là 31,5 kA**, còn trung áp là 25 kA (Bảng 8, Điều 12 TT 05/2025). Các giá trị 40 kA, 50 kA lớn hơn mức quy định cho lưới phân phối.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":1},{"m":"","id":"cf8972e7","t":4,"q":"Theo Điều 12 TT 05/2025/TT-BCT, dòng điện ngắn mạch lớn nhất cho phép trên lưới điện phân phối đối với cấp điện áp Trung áp là bao nhiêu?","o":["31,5kA","25kA","40kA","50kA"],"a":1,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Dòng ngắn mạch lớn nhất cho phép trên lưới phân phối ở cấp **trung áp là 25 kA** (110 kV là 31,5 kA). Bảng 8, Điều 12 TT 05/2025.","xh":"","xb":"","k":"**TT 46/2025/TT-BCT** (ký 06/8/2025, hiệu lực 22/9/2025) sửa đổi, bổ sung TT 04, 05, 06/2025. **TT 29/2026/TT-BCT** (hiệu lực 20/7/2026) quy định vận hành thị trường bán buôn điện cạnh tranh.","old":1},{"m":"","id":"d63ae4b1","t":4,"q":"Theo Điều 12 TT 05/2025/TT-BCT, thời gian tối đa loại trừ sự cố của bảo vệ chính được quy định đối với cấp điện áp 110kV là bao nhiêu?","o":["150ms","500ms","120ms","100ms"],"a":0,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở **110 kV là 150 ms**, còn trung áp là 500 ms. Cấp điện áp càng cao, thời gian loại trừ càng ngắn để giữ ổn định hệ thống (Bảng 8, Điều 12 TT 05/2025).","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":1},{"m":"","id":"9bf4b766","t":4,"q":"Theo Điều 12 TT 05/2025/TT-BCT, thời gian tối đa loại trừ sự cố của bảo vệ chính được quy định đối với cấp điện áp Trung áp là bao nhiêu?","o":["150ms","500ms","120ms","100ms"],"a":1,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở cấp **trung áp là 500 ms** (110 kV là 150 ms), theo Bảng 8, Điều 12 TT 05/2025.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":1},{"m":"","id":"06cf569c","t":3,"q":"Theo Điều 13 TT 05/2025/TT-BCT, hệ số sự cố chạm đất của lưới điện phân phối không được vượt quá bao nhiêu với lưới điện có trung tính nối đất trực tiếp?","o":["1,4","1,7","1,3","1,5"],"a":0,"c":"TT 05/2025, Điều 13","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **1.4**. Xem trích nguyên văn bên dưới.","xh":"Điều 13. Hệ số chạm đất","xb":"2. Hệ số sự cố chạm đất của lưới điện phân phối không được vượt quá 1,4 đối với lưới điện có trung tính nối đất trực tiếp và 1,7 đối với lưới điện có trung tính cách ly hoặc lưới điện có trung tính nối đất qua trở kháng.","k":"**Hệ số chạm đất**: truyền tải ≤1,4; phân phối ≤1,4 (nối đất trực tiếp), ≤1,7 (cách ly hoặc nối đất qua trở kháng). **Độ tin cậy**: SAIDI, SAIFI chỉ xét mất điện kéo dài trên 05 phút.","old":1},{"m":"","id":"e402146c","t":3,"q":"Theo Điều 13 TT 05/2025/TT-BCT, hệ số sự cố chạm đất của lưới điện phân phối không được vượt quá bao nhiêu đối với lưới điện có trung tính cách ly hoặc lưới điện có trung tính nối đất qua trở kháng?","o":["1,4","1,7","1,3","1,5"],"a":1,"c":"TT 05/2025, Điều 13","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **1.7**. Xem trích nguyên văn bên dưới.","xh":"Điều 13. Hệ số chạm đất","xb":"2. Hệ số sự cố chạm đất của lưới điện phân phối không được vượt quá 1,4 đối với lưới điện có trung tính nối đất trực tiếp và 1,7 đối với lưới điện có trung tính cách ly hoặc lưới điện có trung tính nối đất qua trở kháng.","k":"**Hệ số chạm đất**: truyền tải ≤1,4; phân phối ≤1,4 (nối đất trực tiếp), ≤1,7 (cách ly hoặc nối đất qua trở kháng). **Độ tin cậy**: SAIDI, SAIFI chỉ xét mất điện kéo dài trên 05 phút.","old":1},{"m":"","id":"ef7290b1","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, độ lệch điện áp vận hành cho phép tại thanh cái trên lưới điện phân phối của Đơn vị phân phối điện so với điện áp danh định là:","o":["10% và - 05%","± 05%","5% và - 10%","± 10%"],"a":0,"c":"TT 05/2025, Điều 6","w":"Độ lệch điện áp vận hành cho phép tại **thanh cái** trên lưới điện phân phối của Đơn vị phân phối điện là **+10% và −05%** so với điện áp danh định (chế độ bình thường). Điểm đấu nối với khách hàng thì ±05%.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"1f65e875","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, độ lệch điện áp vận hành cho phép tại điểm đấu nối so với điện áp danh định tại điểm đấu nối với Khách hàng sử dụng điện là:","o":["10% và - 05%","± 05%","5% và - 10%","± 10%"],"a":1,"c":"TT 05/2025, Điều 6","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **± 05%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"d) Độ lệch điện áp vận hành cho phép tại điểm đấu nối vào lưới điện phân phối so với điện áp danh định như sau: - Tại điểm đấu nối với Khách hàng sử dụng điện là  05%; - Tại điểm đấu nối với nhà máy điện là + 10% và - 05%; …","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"eb5d9a78","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, độ lệch điện áp vận hành cho phép tại điểm đấu nối so với điện áp danh định tại điểm đấu nối với nhà máy điện là:","o":["10% và - 05%","± 05%","5% và - 10%","± 10%"],"a":0,"c":"TT 05/2025, Điều 6","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **10% và - 05%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"d) Độ lệch điện áp vận hành cho phép tại điểm đấu nối vào lưới điện phân phối so với điện áp danh định như sau: - Tại điểm đấu nối với Khách hàng sử dụng điện là  05%; - Tại điểm đấu nối với nhà máy điện là + 10% và - 05%; …","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"2429b6ce","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, trong chế độ sự cố hệ thống điện hoặc khôi phục sự cố, cho phép mức dao động điện áp trên lưới điện phân phối trong khoảng bao nhiêu so với điện áp danh định?","o":["10% và - 05%","± 05%","5% và - 10%","± 10%"],"a":3,"c":"TT 05/2025, Điều 6","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **± 10%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"3. Trong chế độ sự cố đơn lẻ của lưới điện truyền tải, sự cố hệ thống phân phối điện hoặc khôi phục sự cố của hệ thống phân phối điện, cho phép mức dao động điện áp trên lưới điện phân phối trong khoảng  10% so với điện áp danh định.","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"5d12b06c","t":2,"q":"Theo Điều 4 TT 06/2025/TT-BCT, điều độ hệ thống điện quốc gia được phân thành bao nhiêu cấp điều độ?","o":["3 cấp","4 cấp","2 cấp","1 cấp"],"a":0,"c":"TT 06/2025, Điều 4","w":"Điều độ HTĐ quốc gia được phân thành **03 cấp**: Cấp điều độ quốc gia, Cấp điều độ miền và Cấp điều độ phân phối (cấp điều độ phân phối tỉnh) theo Điều 4 TT 06/2025.","xh":"","xb":"","k":"Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","old":1},{"m":"","id":"af76c9a4","t":2,"q":"Theo Điều 6 TT 06/2025/TT-BCT, quyền điều khiển là gì?","o":["Quyền điều khiển là quyền thay đổi chế độ vận hành của hệ thống điện hoặc thiết bị điện thuộc quyền điều khiển.","Quyền điều khiển là quyền cho phép thay đổi chế độ vận hành của hệ thống điện hoặc thiết bị điện thuộc quyền điều khiển.","Quyền điều khiển là quyền thay đổi chế độ vận hành của hệ thống điện thuộc quyền điều khiển.","Cả 3 đáp án trên"],"a":0,"c":"TT 06/2025, Điều 6","w":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của hệ thống điện hoặc thiết bị điện. Mọi thay đổi chỉ được tiến hành theo lệnh điều độ của cấp điều độ có quyền điều khiển (Điều 6 TT 06/2025).","xh":"","xb":"","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":1},{"m":"","id":"6e91d25f","t":2,"q":"Theo Điều 9 TT 06/2025/TT-BCT, quyền điều khiển, kiểm tra và nắm thông tin trong các trường hợp sự cố hoặc đe dọa sự cố gồm có bao nhiêu khoản?","o":["1 khoản","2 khoản","3 khoản","4 khoản"],"a":1,"c":"TT 06/2025, Điều 9","w":"Điều 9 TT 06/2025 (Quyền điều khiển, kiểm tra và nắm thông tin trong trường hợp sự cố hoặc đe dọa sự cố) gồm **2 khoản**: khoản 1 cho phép cấp có quyền điều khiển ra lệnh trước rồi báo cáo; khoản 2 là trường hợp khẩn cấp không thể trì hoãn (cháy, đe dọa tính mạng, an toàn thiết bị) cho nhân viên vận hành thao tác ngay.","xh":"","xb":"","k":"**Sự cố hoặc đe dọa sự cố** (Điều 9): cấp có quyền điều khiển được ra lệnh trước rồi báo cáo ngay cho cấp có quyền kiểm tra; khẩn cấp (cháy, đe dọa tính mạng) nhân viên vận hành được thao tác trước, báo cáo sau.","old":1},{"m":"","id":"8b3c14d3","t":6,"q":"Theo Điều 67 TT 06/2025/TT-BCT, đối với đăng ký phương thức vận hành năm, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành năm tới cho Cấp điều độ miền vào thời gian nào?","o":["Trước ngày 01 tháng 8 hàng năm","Trước ngày 15 tháng 7 hàng năm","Trước ngày 15 tháng 8 hàng năm","Cả 3 đáp án trên đều sai"],"a":0,"c":"TT 06/2025, Điều 67","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Trước ngày 01 tháng 8 hàng năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 67. Trình tự đăng ký phương thức vận hành","xb":"b) Trước ngày 01 tháng 8 hàng năm, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành năm tới cho Cấp điều độ miền;","k":"**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","old":1},{"m":"","id":"b04e88ec","t":6,"q":"Theo Điều 67 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), đối với đăng ký phương thức vận hành tháng, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ miền vào thời gian nào?","o":["Trước ngày 15 hàng tháng","Trước ngày 20 hàng tháng","Trước 09 ngày làm việc cuối cùng hàng tháng","Trước ngày 10 hàng tháng"],"a":0,"c":"TT 06/2025, Điều 67 khoản 2 điểm b (sửa đổi bởi TT 46/2025)","w":"Sau khi TT 46/2025 sửa Điều 67 TT 06/2025, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ miền **trước ngày 15 hàng tháng**; Cấp điều độ miền gửi cho Cấp điều độ quốc gia **trước ngày 20 hàng tháng**. Lưu ý: bản gốc TT 06/2025 và bộ câu cũ ghi \"trước 09 ngày làm việc cuối cùng\", nay không còn đúng.","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 10","xb":"b) Trước ngày 15 hàng tháng, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ miền; c) Trước ngày 20 hàng tháng, Cấp điều độ miền gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ quốc gia.","k":"**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","old":1},{"m":"","id":"392b6b4d","t":6,"q":"Theo Điều 67 TT 06/2025/TT-BCT, đối với đăng ký phương thức vận hành tuần, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành 01 tuần tới cho Cấp điều độ miền vào thời gian nào?","o":["Trước 10h00 ngày thứ Ba hàng tuần","Trước 10h00 ngày thứ Hai hàng tuần","Trước 10h00 ngày thứ Tư hàng tuần","Trước 10h00 ngày thứ Sáu hàng tuần"],"a":0,"c":"TT 06/2025, Điều 67","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Trước 10h00 ngày thứ Ba hàng tuần**. Xem trích nguyên văn bên dưới.","xh":"Điều 67. Trình tự đăng ký phương thức vận hành","xb":"b) Trước 10h00 ngày thứ Ba hàng tuần, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành 01 tuần tới cho Cấp điều độ miền;","k":"**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","old":1},{"m":"","id":"66f4d8e2","t":6,"q":"Theo Điều 41 TT 06/2025/TT-BCT, cấp điều độ phân phối tỉnh có trách nhiệm lập và gửi dự kiến sơ đồ kết dây cơ bản hệ thống điện phân phối thuộc quyền điều khiển năm tới cho Cấp điều độ miền vào thời gian nào?","o":["Trước ngày 01 tháng 8 hàng năm","Trước ngày 15 tháng 8 hàng năm","Trước ngày 01 tháng 9 hàng năm","Trước ngày 20 tháng 11 hàng năm"],"a":1,"c":"TT 06/2025, Điều 41","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Trước ngày 15 tháng 8 hàng năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 41. Trình tự lập sơ đồ kết dây cơ bản","xb":"2. Trước ngày 15 tháng 8 hàng năm, Cấp điều độ phân phối tỉnh có trách nhiệm lập và gửi dự kiến sơ đồ kết dây cơ bản hệ thống phân phối điện thuộc quyền điều khiển năm tới cho Cấp điều độ miền.","k":"**Sơ đồ kết dây cơ bản** (Điều 41, 42): tỉnh → miền trước **15/8**; miền → quốc gia trước **01/9**. Phê duyệt, công bố: quốc gia trước 20/11, miền trước 01/12, tỉnh trước **15/12**.","old":1},{"m":"","id":"bca419e3","t":2,"q":"Theo Điều 7 TT 06/2025/TT-BCT, quyền kiểm tra của điều độ cấp trên là gì?","o":["Là quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển","Là quyền được nhận thông báo hoặc cung cấp trước thông tin về chế độ vận hành của thiết bị điện không thuộc quyền điều khiển, quyền kiểm tra nhưng làm thay đổi, ảnh hưởng đến chế độ vận hành của hệ thống điện hoặc thiết bị điện thuộc quyền điều khiển","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":0,"c":"TT 06/2025, Điều 7","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Là quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 7. Quyền kiểm tra của điều độ cấp trên","xb":"1. Quyền kiểm tra của điều độ cấp trên là quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển.","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":1},{"m":"","id":"dc7fc3f7","t":2,"q":"Theo Điều 8 TT 06/2025/TT-BCT, quyền nắm thông tin là gì?","o":["Là quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển","Là quyền được nhận thông báo hoặc cung cấp trước thông tin về chế độ vận hành của thiết bị điện không thuộc quyền điều khiển, quyền kiểm tra nhưng làm thay đổi, ảnh hưởng đến chế độ vận hành của hệ thống điện hoặc thiết bị điện thuộc quyền điều khiển","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":1,"c":"TT 06/2025, Điều 8","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Là quyền được nhận thông báo hoặc cung cấp trước thông tin về chế độ vận hành của thiết bị điện không thuộc quyền điều khiển, quyền kiểm tra nhưng làm thay đổi, ảnh hưởng đến chế độ vận hành của hệ thống điện hoặc thiết bị điện thuộc quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 8. Quyền nắm thông tin","xb":"Quyền nắm thông tin là quyền được nhận thông báo hoặc cung cấp trước thông tin về chế độ vận hành của thiết bị điện không thuộc quyền điều khiển, quyền kiểm tra nhưng làm thay đổi, ảnh hưởng đến chế độ vận hành của hệ thống điện hoặc thiết bị điện thuộc quyền điều khiển, trừ trường hợp quy định tại Điều 9 Thông tư này.","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":1},{"m":"","id":"69282466","t":1,"q":"Theo Điều 3 TT 06/2025/TT-BCT, đơn vị phân phối điện là đơn vị điện lực được cấp giấy phép hoạt động điện lực trong lĩnh vực phân phối và bán điện, bao gồm:","o":["Tổng công ty Điện lực","Công ty Điện lực tỉnh, thành phố trực thuộc Tổng công ty Điện lực (sau đây viết tắt là Công ty Điện lực tỉnh)","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":2,"c":"TT 06/2025, Điều 3","w":"Đơn vị phân phối điện gồm **Tổng công ty Điện lực** và **Công ty Điện lực tỉnh, thành phố trực thuộc Tổng công ty**, nên cả hai đáp án A và B đều đúng. Đây là các đơn vị được cấp giấy phép phân phối và bán điện.","xh":"","xb":"","k":"Các thông tư cũ **TT 39/2015, TT 40/2014, TT 44/2014, TT 28/2014** đã hết hiệu lực. Khi đề thi nhắc số hiệu cũ mà nội dung vẫn hỏi, chọn đáp án khớp TT 05, TT 06/2025.","old":1},{"m":"","id":"3c8b3778","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, khách hàng sử dụng lưới điện phân phối là tổ chức, cá nhân có trang thiết bị điện, lưới điện đấu nối vào lưới điện phân phối để sử dụng dịch vụ phân phối điện, bao gồm?","o":["Đơn vị phát điện","Đơn vị phân phối và bán lẻ điện","Khách hàng sử dụng điện","Cả 3 đáp án trên đều đúng"],"a":3,"c":"TT 05/2025, Điều 3","w":"Khách hàng sử dụng lưới điện phân phối gồm cả đơn vị phát điện, đơn vị phân phối và bán lẻ điện, và khách hàng sử dụng điện. Cả ba đều có thiết bị đấu nối vào lưới phân phối để dùng dịch vụ phân phối điện nên đáp án đúng là \"cả 3\".","xh":"","xb":"","k":"Các thông tư cũ **TT 39/2015, TT 40/2014, TT 44/2014, TT 28/2014** đã hết hiệu lực. Khi đề thi nhắc số hiệu cũ mà nội dung vẫn hỏi, chọn đáp án khớp TT 05, TT 06/2025.","old":1},{"m":"","id":"73290f2e","t":3,"q":"Theo Điều 4 TT 05/2025/TT-BCT, trong điều kiện bình thường, tần số hệ thống điện được dao động trong phạm vi bao nhiêu?","o":["± 0,2 Hz","± 0,5 Hz","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":0,"c":"TT 05/2025, Điều 4","w":"Điều kiện bình thường: tần số dao động **±0,2 Hz** quanh 50 Hz. Dải ±0,5 Hz dành cho tình trạng hệ thống chưa ổn định, nên A đúng, B không đúng với điều kiện bình thường.","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":1},{"m":"","id":"511b8e54","t":3,"q":"Theo Điều 4 TT 05/2025/TT-BCT, trong điều kiện hệ thống điện chưa ổn định, tần số hệ thống điện được dao động trong phạm vi bao nhiêu?","o":["± 0,2 Hz","± 0,5 Hz","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":1,"c":"TT 05/2025, Điều 4","w":"Khi hệ thống chưa ổn định, tần số được phép dao động **±0,5 Hz** quanh 50 Hz (rộng hơn dải ±0,2 Hz của chế độ bình thường). Vì vậy B đúng, A thuộc điều kiện bình thường.","xh":"","xb":"","k":"**Tần số** (TT 06, Điều 88–89): khi tần số ngoài 50 ± 0,5 Hz tất cả nhà máy điện (kể cả không tham gia điều tần) phải tham gia điều chỉnh; sau khi huy động hết dự phòng mà tần số vẫn có khả năng xuống dưới **49,5 Hz** thì sa thải phụ tải.","old":1},{"m":"","id":"a9de1aec","t":1,"q":"Theo Điều 17 TT 05/2025/TT-BCT, có bao nhiêu loại tổn thất điện năng lưới điện phân phối?","o":["1","2","3","4"],"a":1,"c":"TT 05/2025, Điều 17","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **2**. Xem trích nguyên văn bên dưới.","xh":"Điều 17. Tổn thất điện năng của lưới điện phân phối","xb":"2. Tổn thất điện năng phi kỹ thuật là tổn thất điện năng do ảnh hưởng của các yếu tố trong quá trình quản lý kinh doanh điện mà không phải do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối gây ra.","k":"**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","old":1},{"m":"","id":"29e3ed18","t":2,"q":"Cấp điều độ phân phối tỉnh là gì?","o":["là cấp chỉ huy, điều độ hệ thống điện phân phối trên địa bàn tỉnh, thành phố trực thuộc trung ương, chịu sự chỉ huy trực tiếp về điều độ của Cấp điều độ miền tương ứng. Cấp điều độ phân phối tỉnh do đơn vị điều độ trực thuộc Tổng công ty Điện lực Thành phố Hà Nội, Tổng công ty Điện lực Thành phố Hồ Chí Minh và các Công ty Điện lực tỉnh đảm nhiệm.","là cấp chỉ huy, giám sát hệ thống điện phân phối trên địa bàn tỉnh, thành phố trực thuộc trung ương.","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":0,"c":"TT 06/2025, Điều 4 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **là cấp chỉ huy, điều độ hệ thống điện phân phối trên địa bàn tỉnh, thành phố trực thuộc trung ương, chịu sự chỉ huy trực tiếp về điều độ của Cấp điều độ miền tương ứng. Cấp điều độ phân phối tỉnh do đơn vị điều độ trực thuộc Tổng công ty Điện lực Thành phố Hà Nội, Tổng công ty Điện lực Thành phố Hồ Chí Minh và các Công ty Điện lực tỉnh đảm nhiệm**. Xem trích nguyên văn bên dưới.","xh":"Điều 4. Tổ chức điều độ hệ thống điện quốc gia","xb":"3. Cấp điều độ phân phối a) Cấp điều độ phân phối tỉnh là cấp chỉ huy, điều độ hệ thống phân phối điện trên địa bàn tỉnh, thành phố trực thuộc trung ương, chịu sự chỉ huy trực tiếp về điều độ của Cấp điều độ miền tương ứng. Cấp điều độ phân phối tỉnh do đơn vị điều độ trực thuộc Tổng công ty Điện lực Thành phố Hà Nội, Tổng công ty Điện lực Thành phố Hồ Chí Minh và các Công ty Điện lực tỉnh đảm nhiệm;","k":"Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","old":0},{"m":"","id":"5550deed","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, cấp điện áp là một trong những giá trị của điện áp danh định được sử dụng trong hệ thống điện, cấp Hạ áp là?","o":["là cấp điện áp danh định đến 01 kV","là cấp điện áp danh định dưới 01 kV","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":0,"c":"TT 05/2025, Điều 3 khoản 4","w":"Cấp **hạ áp** là cấp điện áp danh định **đến 01 kV**, tức bao gồm cả 01 kV. Phương án \"dưới 01 kV\" loại 01 kV nên không đúng. Kết quả: trung áp là trên 01 kV đến 35 kV.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":1},{"m":"","id":"0f91b5ce","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, cấp điện áp là một trong những giá trị của điện áp danh định được sử dụng trong hệ thống điện, cấp Cao áp là?","o":["là cấp điện áp danh định trên 35 kV đến 220 kV","là cấp điện áp danh định từ 35 kV đến 220 kV","là cấp điện áp danh định trên 35 kV đến dưới 220 kV","Cả 3 đáp án trên đều sai"],"a":0,"c":"TT 05/2025, Điều 3 khoản 4","w":"Cấp **cao áp** là cấp điện áp danh định **trên 35 kV đến 220 kV**. Cận dưới là *trên* 35 kV vì 35 kV đã thuộc trung áp, và 220 kV được tính vào cao áp. Phương án \"từ 35 kV\" hay \"dưới 220 kV\" đều sai.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":1},{"m":"","id":"ca4adfef","t":2,"q":"Theo Điều 16 TT 06/2025/TT-BCT, tổ máy phát của nhà máy điện nhỏ thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh mà việc huy động tổ máy làm thay đổi chế độ vận hành bình thường của hệ thống điện miền thuộc quyền kiểm tra của:","o":["Cấp điều độ miền","Cấp điều độ quốc gia","Đơn vị quản lý vận hành của trạm điện hoặc nhà máy điện","Cấp điều độ phân phối tỉnh"],"a":0,"c":"TT 06/2025, Điều 16 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Cấp điều độ miền**. Xem trích nguyên văn bên dưới.","xh":"Điều 16. Quyền kiểm tra của Cấp điều độ miền","xb":"2. Tổ máy phát của là nhà máy điện có tổng công suất đặt từ 30 MW trở xuống thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh mà việc huy động tổ máy làm thay đổi chế độ vận hành bình thường của hệ thống điện miền.","k":"**Cấp miền có quyền kiểm tra** (Điều 16): lưới phân phối thuộc quyền điều khiển của tỉnh mà thay đổi kết lưới dẫn đến thay đổi chế độ vận hành bình thường của HTĐ miền; tổ máy của nhà máy ≤30 MW thuộc quyền điều khiển của tỉnh mà việc huy động làm thay đổi chế độ vận hành bình thường của HTĐ miền.","old":1},{"m":"","id":"99ee4be2","t":1,"q":"Theo Điều 17 TT 05/2025/TT-BCT, tổn thất điện năng kỹ thuật là gì?","o":["là tổn thất điện năng gây ra do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối.","là tổn thất điện năng do ảnh hưởng của các yếu tố trong quá trình quản lý kinh doanh điện mà không phải do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối gây ra.","là tổn thất điện năng gây ra do quá trình bảo dưỡng, sửa chữa không đúng cách đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối.","Cả 3 đáp án trên đều sai"],"a":0,"c":"TT 05/2025, Điều 17","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **là tổn thất điện năng gây ra do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối**. Xem trích nguyên văn bên dưới.","xh":"Điều 17. Tổn thất điện năng của lưới điện phân phối","xb":"1. Tổn thất điện năng kỹ thuật là tổn thất điện năng gây ra do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối.","k":"**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","old":1},{"m":"","id":"e6ce9066","t":1,"q":"Theo Điều 17 TT 05/2025/TT-BCT, tổn thất điện năng phi kỹ thuật là gì?","o":["là tổn thất điện năng gây ra do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối.","là tổn thất điện năng do ảnh hưởng của các yếu tố trong quá trình quản lý kinh doanh điện mà không phải do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối gây ra.","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":1,"c":"TT 05/2025, Điều 17","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **là tổn thất điện năng do ảnh hưởng của các yếu tố trong quá trình quản lý kinh doanh điện mà không phải do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối gây ra**. Xem trích nguyên văn bên dưới.","xh":"Điều 17. Tổn thất điện năng của lưới điện phân phối","xb":"2. Tổn thất điện năng phi kỹ thuật là tổn thất điện năng do ảnh hưởng của các yếu tố trong quá trình quản lý kinh doanh điện mà không phải do bản chất vật lý của đường dây dẫn điện, trang thiết bị điện trên lưới điện phân phối gây ra.","k":"**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","old":1},{"m":"","id":"65f27f9e","t":5,"q":"Theo Điều 40 TT 05/2025/TT-BCT, yêu cầu đối với tổ máy phát điện của nhà máy điện có tổng công suất lắp đặt lớn hơn 30 MW đấu nối vào lưới điện phân phối, thời gian tối thiểu duy trì vận hành phát điện với dải tần số 51,5 Hz đến 52 Hz là?","o":["Phát liên tục","1 phút","10 phút","30 phút"],"a":1,"c":"TT 05/2025, Điều 40","w":"Tổ máy nhà máy trên 30 MW phải duy trì phát ở dải **51,5–52 Hz** tối thiểu **01 phút** với nhà máy nhiệt điện (thủy điện là 03 phút). Tần số càng lệch xa 50 Hz thì thời gian bắt buộc duy trì càng ngắn: 49–51 Hz liên tục, 51–51,5 Hz là 30 phút.","xh":"","xb":"","k":"Nhà máy điện lớn hơn 30 MW: thời gian duy trì phát điện theo dải tần số (Điều 40): **49 ÷ 51 Hz: liên tục**; trên 48 đến dưới 49 Hz: 30 phút; 47,5 ÷ 48 Hz: 10 phút; trên 51 ÷ 51,5 Hz: 30 phút; trên 51,5 ÷ 52 Hz: **01 phút**.","old":1},{"m":"","id":"d704ecd3","t":5,"q":"Theo Điều 40 TT 05/2025/TT-BCT, yêu cầu đối với tổ máy phát điện của nhà máy điện có tổng công suất lắp đặt lớn hơn 30 MW đấu nối vào lưới điện phân phối, thời gian tối thiểu duy trì vận hành phát điện với dải tần số 51 Hz đến 51,5 Hz là?","o":["Phát liên tục","5 phút","10 phút","30 phút"],"a":3,"c":"TT 05/2025, Điều 40","w":"Nhà máy trên 30 MW đấu nối lưới phân phối phải duy trì phát điện ở dải **51 Hz đến 51,5 Hz tối thiểu 30 phút**. Dải 49–51 Hz thì phát liên tục. Tần số càng lệch xa thì thời gian bắt buộc duy trì càng ngắn.","xh":"","xb":"","k":"Nhà máy điện lớn hơn 30 MW: thời gian duy trì phát điện theo dải tần số (Điều 40): **49 ÷ 51 Hz: liên tục**; trên 48 đến dưới 49 Hz: 30 phút; 47,5 ÷ 48 Hz: 10 phút; trên 51 ÷ 51,5 Hz: 30 phút; trên 51,5 ÷ 52 Hz: **01 phút**.","old":1},{"m":"","id":"8cbeb97b","t":5,"q":"Theo Điều 40 TT 05/2025/TT-BCT, yêu cầu đối với tổ máy phát điện của nhà máy điện có tổng công suất lắp đặt lớn hơn 30 MW đấu nối vào lưới điện phân phối, thời gian tối thiểu duy trì vận hành phát điện với dải tần số 47,5 Hz đến 48 Hz là?","o":["Phát liên tục","5 phút","10 phút","30 phút"],"a":2,"c":"TT 05/2025, Điều 40","w":"Tổ máy nhà máy trên 30 MW phải duy trì vận hành ở dải **47,5–48 Hz** tối thiểu **10 phút**. Dải 49–51 Hz thì phát liên tục, tần số càng lệch xa thì thời gian duy trì càng ngắn.","xh":"","xb":"","k":"Nhà máy điện lớn hơn 30 MW: thời gian duy trì phát điện theo dải tần số (Điều 40): **49 ÷ 51 Hz: liên tục**; trên 48 đến dưới 49 Hz: 30 phút; 47,5 ÷ 48 Hz: 10 phút; trên 51 ÷ 51,5 Hz: 30 phút; trên 51,5 ÷ 52 Hz: **01 phút**.","old":1},{"m":"","id":"8704261f","t":4,"q":"Theo Điều 11 TT 05/2025/TT-BCT, chế độ nối đất trung tính trong hệ thống điện phân phối đối với cấp điện áp 22kV là gì?","o":["nối đất trực tiếp","Trung tính cách ly","Nối đất trực tiếp (03 pha 03 dây) hoặc nối đất lặp lại (03 pha 04 dây)","Trung tính cách ly hoặc nối đất qua trở kháng"],"a":2,"c":"TT 05/2025, Điều 11, Bảng 7","w":"Lưới 22 kV được nối đất trung tính **trực tiếp (03 pha 03 dây)** hoặc **nối đất lặp lại (03 pha 04 dây)** theo Bảng 7. Cách ly hoặc nối đất qua trở kháng là chế độ của lưới 35 kV.","xh":"","xb":"","k":"**Nối đất trung tính** (TT 05, Điều 11, Bảng 7): 500, 220, 110 kV nối đất trực tiếp; **35 kV** trung tính cách ly hoặc nối đất qua trở kháng; **22 kV, 15 kV** nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây).","old":1},{"m":"","id":"f36f5de4","t":5,"q":"Theo Điều 31 TT 05/2025/TT-BCT, khách hàng sử dụng điện để sản xuất, kinh doanh, dịch vụ có trạm biến áp riêng hoặc không có trạm biến áp riêng nhưng có công suất sử dụng cực đại từ 40 kW trở lên có trách nhiệm duy trì hệ số công suất tại điểm đặt thiết bị đo đếm điện","o":["0,98","0,9","0,85","0,95"],"a":1,"c":"TT 05/2025, Điều 31 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **0.9**. Xem trích nguyên văn bên dưới.","xh":"Điều 31. Yêu cầu Hệ số công suất","xb":"3. Khách hàng sử dụng điện để sản xuất, kinh doanh, dịch vụ có trạm điện riêng hoặc không có trạm điện riêng nhưng có công suất sử dụng cực đại từ 40 kW trở lên có trách nhiệm duy trì hệ số công suất (cos) tại điểm đặt thiết bị đo đếm điện năng theo hợp đồng mua bán điện không nhỏ hơn 0,9.","k":"**Hệ số công suất**: Đơn vị phân phối điện, khách hàng nhận điện trực tiếp từ lưới truyền tải: cosφ ≥ **0,9** (nhận Q), ≥ **0,98** (phát Q) tại vị trí đo đếm chính. Khách hàng sản xuất, kinh doanh, dịch vụ có công suất cực đại **từ 40 kW**: cosφ ≥ 0,9 tại điểm đặt thiết bị đo đếm.","old":1},{"m":"","id":"52f14526","t":5,"q":"Theo Điều 40 TT 05/2025/TT-BCT, yêu cầu đối với tổ máy phát điện của nhà máy điện có tổng công suất lắp đặt lớn hơn 30 MW đấu nối vào lưới điện phân phối, thời gian tối thiểu duy trì vận hành phát điện với dải tần số 49 Hz đến 51 Hz là?","o":["Phát liên tục","5 phút","10 phút","30 phút"],"a":0,"c":"TT 05/2025, Điều 40","w":"Nhà máy trên 30 MW đấu nối lưới phân phối phải **phát liên tục** khi tần số trong dải **49–51 Hz**. Chỉ khi tần số lên 51–51,5 Hz thì giới hạn thời gian (tối thiểu 30 phút) mới xuất hiện.","xh":"","xb":"","k":"Nhà máy điện lớn hơn 30 MW: thời gian duy trì phát điện theo dải tần số (Điều 40): **49 ÷ 51 Hz: liên tục**; trên 48 đến dưới 49 Hz: 30 phút; 47,5 ÷ 48 Hz: 10 phút; trên 51 ÷ 51,5 Hz: 30 phút; trên 51,5 ÷ 52 Hz: **01 phút**.","old":1},{"m":"","id":"d14788b8","t":2,"q":"Quyền điều khiển là gì?","o":["Quyền thay đổi chế độ vận hành hệ thống điện hoặc thiết bị thuộc Quyền điều khiển","Quyền thay đổi chế độ vận hành hệ thống điện","Quyền thay đổi kết dây cơ bản hệ thống điện","Quyền cho phép cấp điều độ cấp dưới thay đổi chế độ vận hành"],"a":0,"c":"TT 06/2025, Điều 6","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Quyền thay đổi chế độ vận hành hệ thống điện hoặc thiết bị thuộc Quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Quyền điều khiển","xb":"1. Quyền điều khiển là quyền thay đổi chế độ vận hành của hệ thống điện hoặc thiết bị điện.","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"8c803d59","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, phương án nào quy định đúng tiêu chuẩn điện áp thanh cái trên lưới điện 110kV ở chế độ vận hành bình thường","o":["Từ 104.5kV (-5%) đến 121kV (+10%)","Từ 99kV (-10%) đến 121kV (+10%)","Từ 99kV (-10%) đến 115.5kV (+5%)","Từ 104.5kV (-5%) đến 115.5kV (+5%)"],"a":0,"c":"TT 05/2025, Điều 6","w":"Chế độ bình thường lưới 110 kV, độ lệch điện áp thanh cái là **+10% / −5%**, tức **104,5 kV đến 121 kV** (110 × 0,95 = 104,5; 110 × 1,10 = 121). Phương án có 99 kV là mức −10% của chế độ sự cố, còn 115,5 kV là +5%, không đúng.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"a2ea49c2","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, trong chế độ sự cố hệ thống điện hoặc khôi phục sự cố, cho phép mức dao động điện áp điện áp thanh cái trên lưới điện 110kV là bao nhiêu","o":["Từ 104.5kV (-5%) đến 121kV (+10%)","Từ 99kV (-10%) đến 121kV (+10%)","Từ 99kV (-10%) đến 115.5kV (+5%)","Từ 104.5kV (-5%) đến 115.5kV (+5%)"],"a":1,"c":"TT 05/2025, Điều 6","w":"Khi sự cố hoặc khôi phục sự cố, độ lệch điện áp thanh cái 110 kV cho phép rộng hơn: **−10% / +10%**, tức **99 kV đến 121 kV** (110 × 0,9 = 99; 110 × 1,1 = 121). Chế độ bình thường chỉ −5%/+10%.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"dadad358","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, trong thời gian sự cố, điện áp tại nơi xảy ra sự cố và vùng lân cận có thể giảm quá độ đến giá trị bằng 0 ở pha bị sự cố hoặc tăng quá bao nhiêu % điện áp danh định ở các pha không bị sự cố cho đến khi sự cố bị loại trừ","o":["80%","90%","100%","110%"],"a":3,"c":"TT 05/2025, Điều 6","w":"Trong thời gian sự cố, điện áp ở các pha **không bị sự cố** có thể tăng quá độ tới **110%** điện áp danh định (pha sự cố có thể giảm về 0) cho đến khi sự cố được loại trừ. Các mức 80%, 90%, 100% đều thấp hơn mức quy định.","xh":"","xb":"","k":"Trong thời gian sự cố, điện áp tại nơi sự cố có thể giảm quá độ đến 0 ở pha sự cố hoặc tăng quá **110%** điện áp danh định ở pha không sự cố.","old":1},{"m":"","id":"6329ab1f","t":2,"q":"Các bộ phận trực tiếp tham gia công tác điều độ hệ thống điện miền, chọn đáp án sai:","o":["Bộ phận kế toán, kế hoạch.","Bộ phận trực ban chỉ huy điều độ miền.","Bộ phận phương thức ngắn hạn, dài hạn.","Bộ phận quản lý thiết bị thông tin và máy tính."],"a":0,"c":"TT 06/2025, Điều 114","w":"Các bộ phận trực tiếp tham gia điều độ HTĐ miền gồm: trực ban chỉ huy điều độ, phương thức ngắn hạn và dài hạn, quản lý thiết bị thông tin và máy tính. **Bộ phận kế toán, kế hoạch không trực tiếp tham gia điều độ** nên là đáp án sai cần chọn.","xh":"","xb":"","k":"Bộ phận tại cấp điều độ phân phối tỉnh: trực ban chỉ huy điều độ, phương thức ngắn hạn (Điều 124), phương thức dài hạn (Điều 125 – 9 nhiệm vụ), tính toán chỉnh định rơ le (Điều 126). Bộ phận phương thức dài hạn chủ trì điều tra, phân tích sự cố.","old":0},{"m":"","id":"fda4a7fb","t":2,"q":"Thời gian đào tạo kỹ sư phương thức hệ thống điện miền ít nhất:","o":["18 tháng.","9 tháng.","12 tháng.","24 tháng."],"a":0,"c":"TT 06/2025, Điều 233","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **18 tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 233. Quy định về đào tạo kỹ sư phương thức hệ thống điện miền","xb":"2. Thời gian đào tạo kỹ sư phương thức hệ thống điện miền ít nhất 18 tháng.","k":"Đào tạo kỹ sư phương thức: HTĐ miền **≥18 tháng** (Điều 233); HTĐ phân phối **≥12 tháng** (Điều 238); phải qua kiểm tra, sát hạch trước khi công nhận chức danh.","old":0},{"m":"","id":"2dd47d16","t":2,"q":"Thời gian đào tạo kỹ sư phương thức hệ thống điện phân phối tỉnh ít nhất:","o":["12 tháng.","9 tháng.","18 tháng.","24 tháng."],"a":0,"c":"TT 06/2025, Điều 238","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **12 tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 238. Quy định về đào tạo kỹ sư phương thức hệ thống phân phối","xb":"2. Thời gian đào tạo kỹ sư phương thức hệ thống phân phối điện ít nhất 12 tháng.","k":"Đào tạo kỹ sư phương thức: HTĐ miền **≥18 tháng** (Điều 233); HTĐ phân phối **≥12 tháng** (Điều 238); phải qua kiểm tra, sát hạch trước khi công nhận chức danh.","old":0},{"m":"","id":"60a5df1f","t":6,"q":"Đăng ký phương thức vận hành tháng của cấp điều độ phân phối tỉnh gửi cấp điều độ miền vào thời gian nào?","o":["Trước ngày 15 hàng tháng","Trước ngày 20 hàng tháng","Trước 09 ngày làm việc cuối cùng hàng tháng","Trước ngày 10 hàng tháng"],"a":0,"c":"TT 06/2025, Điều 67 khoản 2 điểm b (sửa đổi bởi TT 46/2025)","w":"Sau khi TT 46/2025 sửa Điều 67 TT 06/2025, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ miền **trước ngày 15 hàng tháng**; Cấp điều độ miền gửi cho Cấp điều độ quốc gia **trước ngày 20 hàng tháng**. Lưu ý: bản gốc TT 06/2025 và bộ câu cũ ghi \"trước 09 ngày làm việc cuối cùng\", nay không còn đúng.","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 10","xb":"b) Trước ngày 15 hàng tháng, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ miền; c) Trước ngày 20 hàng tháng, Cấp điều độ miền gửi đăng ký phương thức vận hành tháng tới cho Cấp điều độ quốc gia.","k":"**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","old":0},{"m":"","id":"ecd61b25","t":6,"q":"Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành 01 tuần tới cho cấp điều độ miền vào thời gian nào?","o":["Trước 10h thứ 3 hàng tuần","Trước 10h thứ 5 hàng tuần","Trước 10h thứ 6 hàng tuần","Trước 10h thứ 7 hàng tuần"],"a":0,"c":"TT 06/2025, Điều 67","w":"Đăng ký phương thức vận hành tuần phải gửi lên cấp điều độ miền **trước 10h thứ Ba hàng tuần**. Miền gửi quốc gia trước 10h00 thứ Tư.","xh":"","xb":"","k":"**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","old":0},{"m":"","id":"574607fc","t":7,"q":"Theo Điều 76 TT 05/2025/TT-BCT, khi mức mang tải của các đường dây và máy biến áp chính trong lưới điện 110kV dưới 90% giá trị định mức, HTĐ đang vận hành ở chế độ nào","o":["Không quy định","Chế độ vận hành bình thường","Chế độ cảnh báo","Chế độ mang tải cao"],"a":1,"c":"TT 05/2025, Điều 76","w":"Mức mang tải dưới **90%** giá trị định mức thì HTĐ ở **chế độ vận hành bình thường**. Từ 90% đến 100% là chế độ cảnh báo; vượt 100% là chế độ khẩn cấp (Điều 76 TT 05/2025).","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":1},{"m":"","id":"08c12869","t":3,"q":"Theo Điều 6 TT 05/2025/TT-BCT, phương án nào quy định đúng tiêu chuẩn điện áp thanh cái trên lưới điện 22kV ở chế độ vận hành bình thường","o":["Từ 20.9kV (-5%) đến 24.2kV (+10%)","Từ 19.9kV (-10%) đến 24.2kV (+10%)","Từ 19.9kV (-10%) đến 23.1kV (+5%)","Từ 20.9kV (-5%) đến 23.1kV (+5%)"],"a":0,"c":"TT 05/2025, Điều 6","w":"Chế độ bình thường lưới 22 kV, độ lệch điện áp thanh cái là **+10% / −5%**, tức **20,9 kV đến 24,2 kV** (22 × 0,95 = 20,9; 22 × 1,10 = 24,2). Phương án có 19,9 kV là mức −10% của chế độ sự cố, còn 23,1 kV là +5%, không đúng.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":1},{"m":"","id":"363c933b","t":6,"q":"Theo Điều 41 TT 06/2025/TT-BCT, thời điểm cấp điều độ phân phối tỉnh lập và gửi dự kiến sơ đồ kết dây cơ bản hệ thống điện phân phối thuộc quyền điều khiển năm tới cho cấp điều độ miền là khi nào ?","o":["Trước ngày 15 tháng 8 hàng năm","Trước ngày 20 tháng 11 hàng năm","Trước ngày 01 tháng 12 hàng năm","Trước ngày 15 tháng 11 hàng năm"],"a":0,"c":"TT 06/2025, Điều 41","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Trước ngày 15 tháng 8 hàng năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 41. Trình tự lập sơ đồ kết dây cơ bản","xb":"2. Trước ngày 15 tháng 8 hàng năm, Cấp điều độ phân phối tỉnh có trách nhiệm lập và gửi dự kiến sơ đồ kết dây cơ bản hệ thống phân phối điện thuộc quyền điều khiển năm tới cho Cấp điều độ miền.","k":"**Sơ đồ kết dây cơ bản** (Điều 41, 42): tỉnh → miền trước **15/8**; miền → quốc gia trước **01/9**. Phê duyệt, công bố: quốc gia trước 20/11, miền trước 01/12, tỉnh trước **15/12**.","old":1},{"m":"","id":"bfcf5a0a","t":2,"q":"Theo Điều 12 TT 06/2025/TT-BCT, cấp điều độ phân phối tỉnh có trách nhiệm điều chỉnh điện áp tại các nút nào:","o":["Cấp điện áp phân phối thuộc quyền điều khiển","Cấp điện áp 110 kV, 220 kV (trừ nút chính)","Cấp điện áp 110 kV nhà máy điện, 220 kV (trừ nút chính)","Cấp điện áp 110 kV, 220 kV nhà máy điện"],"a":0,"c":"TT 06/2025, Điều 12","w":"Cấp điều độ phân phối tỉnh chịu trách nhiệm điều chỉnh điện áp tại các nút **ở cấp điện áp phân phối thuộc quyền điều khiển**. Nút 110 kV, 220 kV (nhà máy điện hoặc không) thuộc cấp điều độ cao hơn.","xh":"","xb":"","k":"Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","old":1},{"m":"","id":"e5d1954d","t":2,"q":"Theo Điều 220 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), đơn vị nào có trách nhiệm tổ chức kiểm tra và cấp Chứng nhận vận hành cho các chức danh tham gia trực tiếp công tác điều độ, vận hành tại Cấp điều độ miền?","o":["Cấp điều độ Quốc gia.","Tập đoàn Điện lực Việt Nam.","Cục Điều tiết Điện lực.","Phương án B, C."],"a":0,"c":"TT 06/2025, Điều 220 khoản 1 (sửa đổi bởi TT 46/2025)","w":"Theo Điều 220 khoản 1 (đã sửa bởi TT 46/2025), **Cấp điều độ quốc gia** tổ chức kiểm tra và cấp Chứng nhận vận hành cho các chức danh tại Cấp điều độ quốc gia và Cấp điều độ miền. Cấp điều độ miền cấp cho chức danh tại Cấp điều độ phân phối tỉnh (khoản 2).","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 19","xb":"1. Cấp điều độ quốc gia có trách nhiệm tổ chức kiểm tra và cấp Chứng nhận vận hành theo mẫu tại Phụ lục I ban hành kèm theo Thông tư này cho các chức danh trực tiếp tham gia công tác điều độ, vận hành tại Cấp điều độ quốc gia, Cấp điều độ miền, nhà máy điện, trạm điện thuộc quyền điều khiển.","k":"Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","old":1},{"m":"","id":"f484f9bf","t":9,"q":"Theo Điều 160 TT 06/2025/TT-BCT, quy định đúng điều kiện cho phép khép mạch vòng trên hệ thống điện","o":["Góc lệch pha điện áp không quá 30 độ, chênh lệch điện áp không quá 10%","Đồng tần, đồng áp, đồng pha","Góc lệch pha điện áp không quá 15 độ, chênh lệch điện áp không quá 10%","Góc lệch pha điện áp không quá 30 độ, chênh lệch điện áp không quá 5%"],"a":0,"c":"TT 06/2025, Điều 160","w":"Điều kiện khép mạch vòng: ngoài cùng thứ tự pha và đồng vị pha, hai phía chênh lệch **không quá 30° về góc pha** và **không quá 10% về điện áp**. Phương án 15° / 05% quá chặt so với quy định, còn \"đồng tần, đồng áp, đồng pha\" là điều kiện hòa đồng bộ chứ không phải điều kiện khép vòng.","xh":"","xb":"","k":"**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","old":1},{"m":"","id":"7e711b01","t":7,"q":"Theo Điều 96 TT 06/2025/TT-BCT, biện pháp điều chỉnh nào làm tăng điện áp","o":["Đóng điện tụ bù ngang","Cắt điện tụ bù ngang","Cắt điện đường dây","Đóng điện kháng bù ngang"],"a":0,"c":"TT 06/2025, Điều 96","w":"**Đóng tụ bù ngang** đưa thêm công suất phản kháng vào lưới, làm điện áp **tăng**. Ngược lại, cắt tụ hoặc đóng kháng bù ngang làm điện áp giảm (Điều 96 TT 06/2025 về biện pháp điều chỉnh điện áp).","xh":"","xb":"","k":"Biện pháp **tăng** điện áp: đóng tụ bù ngang, cắt kháng bù ngang, tăng phát Q máy phát, điều chỉnh nấc phân áp phù hợp. Biện pháp **giảm** điện áp: ngược lại.","old":1},{"m":"","id":"02e8ab2d","t":2,"q":"Theo Điều 6 TT 06/2025/TT-BCT, quyền điều khiển được hiểu là quyền gì?","o":["Thay đổi chế độ vận hành của hệ thống điện hoặc thiết bị điện","Thay đổi trạng thái thiết bị đóng cắt","Tách thiết bị sửa chữa hoặc đưa vào vận hành","Thay đổi chế độ làm việc của thiết bị (thay đổi công suất phát P/Q, khởi động, ngừng tổ máy, đóng, cắt máy cắt và dao cách ly...)"],"a":0,"c":"TT 06/2025, Điều 6","w":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của hệ thống điện hoặc thiết bị điện. Mọi thay đổi chế độ vận hành chỉ được tiến hành theo lệnh điều độ của cấp điều độ có quyền điều khiển (Điều 6 TT 06/2025).","xh":"","xb":"","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":1},{"m":"","id":"de56f79d","t":7,"q":"Máy biến áp dầu được phép quá tải 30% trong thời gian bao nhiêu phút","o":["120","80","45","20"],"a":0,"c":"TT 06/2025, Điều 196","w":"Theo bảng quá tải ngắn hạn của MBA dầu: **30% trong 120 phút**, 45% trong 80 phút, 60% trong 45 phút, 75% trong 20 phút, 100% trong 10 phút. Các số 80, 45, 20 ứng với mức quá tải sâu hơn.","xh":"","xb":"","k":"**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","old":0},{"m":"","id":"9d9b9dcd","t":7,"q":"Máy biến áp dầu được phép quá tải 60% trong thời gian bao nhiêu phút","o":["120","80","45","20"],"a":2,"c":"TT 06/2025, Điều 196","w":"Theo bảng quá tải ngắn hạn MBA dầu (Điều 196): 30% / 120′, 45% / 80′, **60% / 45′**, 75% / 20′, 100% / 10′. Quá tải 60% chỉ được **45 phút**. Các mốc 80′, 20′ ứng với 45% và 75%.","xh":"","xb":"","k":"**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","old":0},{"m":"","id":"827ba9fc","t":2,"q":"Theo Điều 238 TT 06/2025/TT-BCT, thời gian đào tạo kỹ sư phương thức hệ thống điện phân phối là:","o":["Ít nhất 18 tháng.","Ít nhất 06 tháng.","Ít nhất 12 tháng.","Ít nhất 24 tháng."],"a":2,"c":"TT 06/2025, Điều 238","w":"Thời gian đào tạo Kỹ sư Phương thức hệ thống phân phối điện là **ít nhất 12 tháng** (Điều 238 TT 06/2025).","xh":"","xb":"","k":"Đào tạo kỹ sư phương thức: HTĐ miền **≥18 tháng** (Điều 233); HTĐ phân phối **≥12 tháng** (Điều 238); phải qua kiểm tra, sát hạch trước khi công nhận chức danh.","old":1},{"m":"","id":"789ba62f","t":4,"q":"Dòng ngắn mạch cho phép vận hành của thanh cái 110kV thuộc trạm biến áp 220/110kV là bao nhiêu","o":["40kA/1s","31.5kA/1s","50kA/1s","25kA/1s"],"a":0,"c":"TT 05/2025, Điều 12 khoản 1 điểm c","w":"Thanh cái 110 kV của trạm 500 kV, 220 kV trong lưới truyền tải được áp dụng dòng ngắn mạch lớn nhất cho phép **40 kA** (thời gian chịu 1 s), cao hơn mức 31,5 kA của lưới phân phối 110 kV (Điều 12 khoản 1 điểm c TT 05/2025).","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"","id":"57558ec7","t":4,"q":"Chế độ nối đất trung tính của lưới điện nào là chế độ trung tính cách ly hoặc nối đất qua trở kháng.","o":["35kV","500kV","220kV","110kV"],"a":0,"c":"TT 05/2025, Điều 11, Bảng 7","w":"Trung tính **cách ly hoặc nối đất qua trở kháng** áp dụng cho lưới **35 kV**. Lưới 110 kV trở lên nối đất trực tiếp, lưới 22 kV nối đất trực tiếp hoặc nối đất lặp lại (Bảng 7, Điều 11 TT 05/2025).","xh":"","xb":"","k":"**Nối đất trung tính** (TT 05, Điều 11, Bảng 7): 500, 220, 110 kV nối đất trực tiếp; **35 kV** trung tính cách ly hoặc nối đất qua trở kháng; **22 kV, 15 kV** nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây).","old":0},{"m":"","id":"0e2b1ec3","t":7,"q":"Mức giới hạn truyền tải đường dây truyền tải là giá trị nhỏ nhất trong các giá trị nào","o":["Tất cả các phương án trên đều đúng.","Dòng điện định mức của đường dây truyền tải được xác định theo dòng điện định mức nhỏ nhất của dây dẫn hoặc thiết bị điện nối tiếp trên đường dây có tính đến yếu tố ảnh hưởng của điều kiện môi trường vận hành của thiết bị.","Giới hạn theo điều kiện ổn định hệ thống điện.","Giới hạn theo tiêu chuẩn điện áp tại Quy định hệ thống điện truyền tải do Bộ Công Thương ban hành."],"a":0,"c":"TT 06/2025, Điều 182","w":"Giới hạn truyền tải của đường dây là **giá trị nhỏ nhất** trong ba giá trị: dòng điện định mức (theo thiết bị yếu nhất nối tiếp, có xét điều kiện môi trường), giới hạn ổn định hệ thống điện, và giới hạn theo tiêu chuẩn điện áp. Vì cả ba đều là thành phần nên đáp án đúng là \"tất cả\".","xh":"","xb":"","k":"Mức giới hạn truyền tải đường dây là **giá trị nhỏ nhất** của: dòng định mức dây dẫn/thiết bị nối tiếp, giới hạn ổn định, giới hạn theo tiêu chuẩn điện áp (Điều 182).","old":0},{"m":"","id":"c2f2700e","t":2,"q":"Theo Điều 12 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), lưới điện có cấp điện áp 35kV (trung áp) thuộc địa bàn tỉnh thuộc quyền điều khiển của cấp điều độ nào?","o":["Điều độ miền","Điều độ Quốc gia","Điều độ phân phối","Đơn vị quản lý vận hành trạm/NMĐ"],"a":2,"c":"TT 06/2025, Điều 12 khoản 2, 3 (sửa đổi bởi TT 46/2025)","w":"Lưới trung áp thuộc địa bàn tỉnh, thành phố trực thuộc trung ương (trong đó có 35 kV) thuộc quyền điều khiển của **Cấp điều độ phân phối tỉnh** (Điều 12 khoản 2, 3 đã sửa bởi TT 46/2025). Cấp miền điều khiển lưới truyền tải 220 kV và 500 kV, còn 110 kV do cấp miền ủy quyền cho cấp phân phối tỉnh. Cấp điều độ quận, huyện không còn được nêu.","xh":"","xb":"","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":1},{"m":"","id":"51f758b9","t":2,"q":"Theo Điều 125 TT 06/2025/TT-BCT, việc phối hợp với cấp điều độ miền lập phương thức vận hành cơ bản của hệ thống điện phân phối tỉnh thuộc quyền điều khiển là nhiệm vụ của bộ phận nào trong cấp điều độ phân phối tỉnh?","o":["Phương thức dài hạn","Phương thức ngắn hạn","Bộ phận trực ban chỉ huy điều độ miền.","Bộ phận tính toán và chỉnh định rơ le bảo vệ và tự động"],"a":0,"c":"TT 06/2025, Điều 125","w":"Việc phối hợp với cấp điều độ miền lập phương thức vận hành cơ bản của hệ thống phân phối tỉnh thuộc **bộ phận phương thức dài hạn** của Cấp điều độ phân phối tỉnh (Điều 125 TT 06/2025).","xh":"","xb":"","k":"Bộ phận tại cấp điều độ phân phối tỉnh: trực ban chỉ huy điều độ, phương thức ngắn hạn (Điều 124), phương thức dài hạn (Điều 125 – 9 nhiệm vụ), tính toán chỉnh định rơ le (Điều 126). Bộ phận phương thức dài hạn chủ trì điều tra, phân tích sự cố.","old":1},{"m":"","id":"cbc76ea3","t":3,"q":"Trong chế độ vận hành bình thường, tần số hệ thống điện được phép dao động trong phạm vi bao nhiêu so với tần số danh định","o":["± 0.2 Hz","± 0.25 Hz","± 0.1 Hz","± 0.5 Hz"],"a":0,"c":"TT 05/2025, Điều 4","w":"Ở chế độ bình thường tần số dao động **±0,2 Hz** quanh 50 Hz, tức 49,8–50,2 Hz. ±0,5 Hz là ngưỡng khi hệ thống chưa ổn định, còn ±0,1 Hz và ±0,25 Hz không phải quy định.","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"","id":"e1eaff05","t":4,"q":"Dòng ngắn mạch cho phép vận hành của thanh cái 110kV thuộc trạm biến áp 110kV/22kV là bao nhiêu","o":["50 kA","100 kA","31.5kA","40 kA"],"a":2,"c":"TT 05/2025, Điều 12","w":"Thanh cái 110 kV của trạm 110/22 kV thuộc lưới phân phối được áp dụng dòng ngắn mạch lớn nhất **31,5 kA**. Mức 40 kA chỉ áp dụng cho thanh cái 110 kV của trạm 500/220 kV trong lưới truyền tải.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"","id":"7c89805b","t":3,"q":"Điện áp cho phép vận hành của lưới điện ở cấp điện áp 110kV khi có sự cố đơn lẻ là:","o":["Từ 104.5kV (-5%) đến 121kV (+10%)","Từ 99kV (-10%) đến 121kV (+10%)","Từ 99kV (-10%) đến 115.5kV (+5%)","Từ 104.5kV (-5%) đến 115.5kV (+5%)"],"a":1,"c":"TT 05/2025, Điều 6","w":"Điện áp cho phép lưới 110 kV khi sự cố đơn lẻ là **−10% / +10%**, tức **99 kV đến 121 kV**. Mức bình thường là 104,5–121 kV (−5%/+10%).","xh":"","xb":"","k":"Ví dụ cấp 110 kV: bình thường **104,5 ÷ 121 kV**; sự cố **99 ÷ 121 kV**. Cấp 22 kV: bình thường **20,9 ÷ 24,2 kV**. Cấp 35 kV: bình thường 33,25 ÷ 38,5 kV; sự cố đơn lẻ 31,5 ÷ 38,5 kV.","old":0},{"m":"","id":"9bdf09f1","t":4,"q":"Theo Điều 12 TT 05/2025/TT-BCT, dòng điện ngắn mạch lớn nhất cho phép ở cấp điện áp 110kV là bao nhiêu?","o":["31.5 kA","25 kA","50 kA","40 kA"],"a":0,"c":"TT 05/2025, Điều 12","w":"Dòng ngắn mạch lớn nhất cho phép trên lưới phân phối ở cấp 110 kV là **31,5 kA** (trung áp là 25 kA). Mức 40 kA chỉ dành cho thanh cái 110 kV của trạm 500/220 kV trong lưới truyền tải.","xh":"","xb":"","k":"Các thông tư cũ **TT 39/2015, TT 40/2014, TT 44/2014, TT 28/2014** đã hết hiệu lực. Khi đề thi nhắc số hiệu cũ mà nội dung vẫn hỏi, chọn đáp án khớp TT 05, TT 06/2025.","old":1},{"m":"","id":"4e804b6f","t":4,"q":"Theo Điều 11 TT 05/2025/TT-BCT, chế độ nối đất trung tính ở cấp điện áp 110kV là:","o":["Nối đất trực tiếp","Nối đất qua trở kháng","Trung tính cách ly","Nối đất lặp lại"],"a":0,"c":"TT 05/2025, Điều 11, Bảng 7","w":"Lưới 110 kV **nối đất trực tiếp** (trung tính nối đất trực tiếp là chế độ chung cho lưới 110 kV trở lên). Cách ly hoặc nối đất qua trở kháng là chế độ của lưới 35 kV; nối đất lặp lại thuộc lưới 22 kV ba pha bốn dây (Bảng 7, Điều 11 TT 05/2025).","xh":"","xb":"","k":"**Nối đất trung tính** (TT 05, Điều 11, Bảng 7): 500, 220, 110 kV nối đất trực tiếp; **35 kV** trung tính cách ly hoặc nối đất qua trở kháng; **22 kV, 15 kV** nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây).","old":1},{"m":"","id":"27481617","t":9,"q":"Theo Điều 172 TT 06/2025/TT-BCT, trường hợp nào sau đây đúng về việc cô lập hoặc đưa các rơ le bảo vệ và tự động vào vận hành trở lại:","o":["Chỉ được thực hiện khi có mệnh lệnh cho phép của cấp điều độ có quyền điều khiển","Thí nghiệm điện tự thực hiện","Nhân viên vận hành trạm tự thực hiện.","Chỉ thực hiện khi trưởng trạm cho phép."],"a":0,"c":"TT 06/2025, Điều 172 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Chỉ được thực hiện khi có mệnh lệnh cho phép của cấp điều độ có quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 172. Theo dõi vận hành và khắc phục khiếm khuyết của các trang","xb":"3. Việc cô lập hoặc đưa các rơ le bảo vệ và tự động vào vận hành trở lại chỉ được thực hiện khi có mệnh lệnh cho phép của Cấp điều độ có quyền điều khiển. Mục 2 YÊU CẦU, NGUYÊN TẮC VÀ PHÂN CẤP XỬ LÝ SỰ CỐ HỆ THỐNG ĐIỆN QUỐC GIA","k":"**Giao nhận ca**: có mặt trước ≥ **15 phút**; không giao ca khi đang sự cố, thao tác phức tạp, chưa hoàn thành công việc, người nhận ca không đủ tỉnh táo (Điều 81). Cô lập hoặc đưa rơ le bảo vệ vào lại chỉ khi có lệnh cấp điều độ có quyền điều khiển.","old":1},{"m":"","id":"df9fa8ff","t":1,"q":"Cấp điện áp nào sau đây thuộc lưới điện phân phối bao gồm:","o":["500kV","220kV","22kV","Cả 3 đáp án trên đều sai"],"a":2,"c":"TT 05/2025, Điều 3 (lưới phân phối đến 110 kV)","w":"Lưới phân phối là lưới điện từ 110 kV trở xuống, nên trong các phương án chỉ có **22 kV** thuộc lưới phân phối. 220 kV và 500 kV là cấp điện áp của lưới truyền tải (Điều 3 TT 05/2025).","xh":"","xb":"","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":0},{"m":"","id":"faca72ea","t":3,"q":"Điện áp tại thanh cái cho phép vận hành trên lưới điện truyền tải trong điều kiện vận hành bình thường đối với cấp điện áp 35kV là:","o":["Từ 33.25kV (-5%) đến 38.5kV (+10%)","Từ 31.5kV (-10%) đến 38.5kV (+10%)","Từ 31.5kV (-10%) đến 36.75kV (+5%)","Từ 33.25kV (-5%) đến 36.75kV (+5%)"],"a":0,"c":"TT 05/2025, Điều 6","w":"Chế độ bình thường lưới 35 kV, độ lệch điện áp thanh cái là **+10% / −5%**, tức **33,25 kV đến 38,5 kV** (35 × 0,95 = 33,25; 35 × 1,10 = 38,5). Phương án có 31,5 kV là mức −10% của chế độ sự cố, còn 36,75 kV là +5%, không đúng.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"","id":"aecefd22","t":3,"q":"Điện áp tại thanh cái cho phép vận hành trên lưới điện truyền tải khi có sự cố đơn lẻ đối với cấp điện áp 35kV là:","o":["Từ 33.25kV (-5%) đến 38.5kV (+10%)","Từ 31.5kV (-10%) đến 38.5kV (+10%)","Từ 31.5kV (-10%) đến 36.75kV (+5%)","Từ 33.25kV (-5%) đến 36.75kV (+5%)"],"a":1,"c":"TT 05/2025, Điều 6","w":"Khi sự cố đơn lẻ, độ lệch điện áp thanh cái 35 kV cho phép rộng hơn: **−10% / +10%**, tức **31,5 kV đến 38,5 kV** (35 × 0,9 = 31,5; 35 × 1,1 = 38,5). Chế độ bình thường chỉ −5%/+10%.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"","id":"06f98fb0","t":11,"q":"Theo Điều 3 TT 05/2025/TT-BCT, AGC (Automatic Generation Control) là hệ thống thiết bị tự động điều chỉnh tăng giảm công suất tác dụng của:","o":["Tổ máy phát điện, nhà máy điện, cụm nhà máy điện hoặc hệ thống pin tích trữ","Chỉ riêng tổ máy phát điện","Công suất phản kháng của tổ máy phát điện","Điện áp đầu cực tổ máy phát điện"],"a":0,"c":"TT 05/2025, Điều 3 khoản 1","w":"**AGC** là hệ thống thiết bị tự động điều chỉnh tăng giảm **công suất tác dụng** của **tổ máy phát điện, nhà máy điện, cụm nhà máy điện hoặc hệ thống pin tích trữ**, nhằm đảm bảo vận hành an toàn, ổn định hệ thống điện (Điều 3 TT 05/2025). Bộ câu cũ chỉ ghi \"tổ máy phát điện\"; định nghĩa hiện hành rộng hơn. Đối tượng điều chỉnh là công suất tác dụng (P), không phải công suất phản kháng hay điện áp.","xh":"TT 05/2025/TT-BCT, Điều 3 khoản 1","xb":"AGC (viết tắt theo tiếng Anh: Automatic Generation Control) là hệ thống thiết bị tự động điều chỉnh tăng giảm công suất tác dụng của tổ máy phát điện, nhà máy điện, cụm nhà máy điện hoặc hệ thống pin tích trữ nhằm đảm bảo vận hành an toàn, ổn định hệ thống điện.","k":"Nguồn điện mặt trời, điện gió ≤01 MW đấu nối trung áp: giảm công suất tác dụng khi tần số vượt **50,5 Hz**; tự động kết nối lại sau khi tần số, điện áp ổn định **60 giây**. ĐMT hạ áp từ **20 kWp** phải đấu nối 3 pha; không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98.","old":1},{"m":"","id":"9ed99b88","t":7,"q":"Theo Điều 96 TT 06/2025/TT-BCT, các biện pháp điều chỉnh điện áp là:","o":["Cả 3 phương án A, B, C đều đúng.","Thay đổi Q của thiết bị bù, máy bù, máy phát","Điều chỉnh nấc máy biến áp","Huy động nguồn đang dự phòng"],"a":0,"c":"TT 06/2025, Điều 96","w":"Các biện pháp điều chỉnh điện áp trong quy trình điều độ gồm: thay đổi công suất phản kháng của thiết bị bù, máy bù, máy phát; điều chỉnh nấc phân áp máy biến áp; huy động nguồn đang dự phòng. Vì cả 3 phương án A, B, C đều là biện pháp hợp lệ nên chọn \"cả 3 đều đúng\" (Điều 96 TT 06/2025, thay TT 40/2014).","xh":"","xb":"","k":"Biện pháp **tăng** điện áp: đóng tụ bù ngang, cắt kháng bù ngang, tăng phát Q máy phát, điều chỉnh nấc phân áp phù hợp. Biện pháp **giảm** điện áp: ngược lại.","old":1},{"m":"","id":"6d4ac047","t":4,"q":"Theo Điều 12 TT 05/2025/TT-BCT, thời gian tối đa loại trừ sự cố của bảo vệ chính trong hệ thống điện trung áp là bao nhiêu ?","o":["50ms","100ms","150ms","500ms"],"a":3,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở lưới **trung áp là 500 ms**, dài hơn 150 ms của 110 kV (Bảng 8, Điều 12 TT 05/2025).","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":1},{"m":"Năm, tháng, tuần: ±6%. Bộ câu cũ ghi ±3% – đã lỗi thời.","id":"4e5c3837","t":8,"q":"Theo TT 06/2025, sai số dự báo phụ tải tuần tới nằm trong giới hạn:","o":["± 3%","± 5%","± 6%","± 2%"],"a":2,"c":"TT 06/2025, Điều 43 khoản 3 điểm a","w":"Đáp án đúng là **± 6%**, khớp với quy định được trích bên dưới.","xh":"Điều 43. Quy định chung về dự báo nhu cầu phụ tải điện","xb":"a) Dự báo phụ tải năm, tháng, tuần: sai số trong giới hạn ±6%;","k":"**Sai số dự báo** (TT 06, Điều 43): năm, tháng, tuần **±6%**; ngày, chu kỳ giao dịch **±4%**; ngày Lễ, Tết và sự kiện biến động lớn **±10%**. Bộ câu cũ ghi ±3% và ±2% – đã lỗi thời.","old":0},{"m":"Ngày, chu kỳ giao dịch: ±4%. Bộ câu cũ ghi ±2% – đã lỗi thời.","id":"0452480b","t":8,"q":"Theo TT 06/2025, sai số dự báo phụ tải ngày tới và chu kỳ giao dịch nằm trong giới hạn:","o":["± 2%","± 5%","± 4%","± 3%"],"a":2,"c":"TT 06/2025, Điều 43 khoản 3 điểm b","w":"Đáp án đúng là **± 4%**, khớp với quy định được trích bên dưới.","xh":"Điều 43. Quy định chung về dự báo nhu cầu phụ tải điện","xb":"b) Dự báo phụ tải ngày, chu kỳ giao dịch: sai số trong giới hạn ±4%;","k":"**Sai số dự báo** (TT 06, Điều 43): năm, tháng, tuần **±6%**; ngày, chu kỳ giao dịch **±4%**; ngày Lễ, Tết và sự kiện biến động lớn **±10%**. Bộ câu cũ ghi ±3% và ±2% – đã lỗi thời.","old":0},{"m":"15/7 là mốc cũ (cấp quận, huyện, đã bỏ ở TT 46/2025). Bộ câu cũ ghi 15/7 cho cấp tỉnh – sai theo TT 06/2025.","id":"dc7e6ab1","t":6,"q":"Đăng ký phương thức vận hành năm của Cấp điều độ phân phối tỉnh gửi Cấp điều độ miền vào thời gian nào?","o":["Trước ngày 01 tháng 8 hàng năm","Trước ngày 01 tháng 7 hàng năm","Trước ngày 15 tháng 7 hàng năm","Trước ngày 15 tháng 8 hàng năm"],"a":0,"c":"TT 06/2025, Điều 67 khoản 1 điểm b","w":"Đáp án đúng là **Trước ngày 01 tháng 8 hàng năm**, khớp với quy định được trích bên dưới.","xh":"Điều 67. Trình tự đăng ký phương thức vận hành","xb":"b) Trước ngày 01 tháng 8 hàng năm, Cấp điều độ phân phối tỉnh gửi đăng ký phương thức vận hành năm tới cho Cấp điều độ miền;","k":"**Đăng ký phương thức vận hành** (Điều 67, sửa đổi bởi TT 46/2025): năm – tỉnh → miền **trước 01/8**, miền → quốc gia **trước 15/8**; tháng – tỉnh → miền **trước ngày 15**, miền → quốc gia **trước ngày 20**; tuần – tỉnh → miền **trước 10h00 thứ Ba**, miền → quốc gia **10h00 thứ Tư**.","old":0},{"m":"Bộ câu cũ ghi 25/11 – đã đổi thành 10/12.","id":"e37bfad9","t":6,"q":"Trước ngày nào hàng năm, Cấp điều độ miền thông báo cho Cấp điều độ phân phối tỉnh Phương thức vận hành hệ thống điện miền năm tới đã được duyệt?","o":["Trước ngày 25 tháng 11","Trước ngày 15 tháng 11","Trước ngày 10 tháng 12","Trước ngày 01 tháng 12"],"a":2,"c":"TT 06/2025, Điều 71 khoản 1 điểm b","w":"Đáp án đúng là **Trước ngày 10 tháng 12**, khớp với quy định được trích bên dưới.","xh":"Điều 71. Trình tự thông báo, công bố phương thức vận hành","xb":"b) Trước ngày 10 tháng 12 hàng năm, Cấp điều độ miền có trách nhiệm thông báo cho Cấp điều độ phân phối tỉnh, Đơn vị quản lý vận hành Phương thức vận hành hệ thống điện miền năm tới đã được duyệt;","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"Bộ câu cũ ghi \"80–90%\".","id":"9a8f782f","t":7,"q":"Theo TT 05/2025, hệ thống điện ở chế độ vận hành bình thường khi mức mang tải của đường dây và máy biến áp cao áp, siêu cao áp:","o":["Từ 80% đến 90% giá trị định mức","Dưới 90% giá trị định mức","Trên 90% đến 100% giá trị định mức","Từ 85% đến 95% giá trị định mức"],"a":1,"c":"TT 05/2025, Điều 76 khoản 1 điểm c","w":"Đáp án đúng là **Dưới 90% giá trị định mức**, khớp với quy định được trích bên dưới.","xh":"Điều 76. Các chế độ vận hành của hệ thống điện","xb":"c) Mức mang tải của đường dây và máy biến áp trong lưới điện cao áp, siêu cao áp đều dưới 90 % giá trị định mức;","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":0},{"m":"","id":"2a55bd43","t":7,"q":"Theo TT 05/2025, hệ thống điện ở chế độ cảnh báo khi mức mang tải của đường dây và máy biến áp cao áp, siêu cao áp:","o":["Từ 90% trở lên nhưng không vượt quá giá trị định mức","Từ 85% đến 95% giá trị định mức","Dưới 90% giá trị định mức","Vượt quá giá trị định mức nhưng dưới 110%"],"a":0,"c":"TT 05/2025, Điều 76 khoản 2 điểm b","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Từ 90% trở lên nhưng không vượt quá giá trị định mức**. Xem trích nguyên văn bên dưới.","xh":"Điều 76. Các chế độ vận hành của hệ thống điện","xb":"b) Mức mang tải của các đường dây và máy biến áp trong lưới điện cao áp, siêu cao áp từ 90 % trở lên nhưng không vượt quá giá trị định mức;","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":0},{"m":"Bộ câu cũ ghi khẩn cấp là \"90–100%\" (thực tế là cảnh báo).","id":"05b19a37","t":7,"q":"Theo TT 05/2025, mức mang tải nào của thiết bị điện cao áp, siêu cao áp thuộc điều kiện của chế độ vận hành khẩn cấp?","o":["Vượt quá giá trị định mức nhưng dưới 110% giá trị định mức","Từ 90% đến 100% giá trị định mức","Dưới 90% giá trị định mức","Từ 80% đến 90% giá trị định mức"],"a":0,"c":"TT 05/2025, Điều 76 khoản 3 điểm c","w":"Đáp án đúng là **Vượt quá giá trị định mức nhưng dưới 110% giá trị định mức**, khớp với quy định được trích bên dưới.","xh":"Điều 76. Các chế độ vận hành của hệ thống điện","xb":"c) Mức mang tải của bất kỳ thiết bị điện nào trong lưới điện cao áp, siêu cao áp hoặc thiết bị điện đấu nối vào lưới điện cao áp, siêu cao áp vượt quá giá trị định mức nhưng dưới 110 % giá trị định mức mà thiết bị này khi bị sự cố do quá tải có thể dẫn đến chế độ vận hành cực kỳ khẩn cấp.","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":0},{"m":"","id":"dc2d3958","t":2,"q":"Quyền điều khiển của Cấp điều độ phân phối tỉnh bao gồm:","o":["Tần số hệ thống điện phân phối (khi vận hành độc lập)","Phụ tải hệ thống điện phân phối","Đáp án A và B đều đúng","Đáp
