**.","old":0},{"m":"","id":"5adb06dd","t":4,"q":"Thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở lưới trung áp là:","o":["500 ms","01 giây","150 ms","300 ms"],"a":0,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở **lưới trung áp là 500 ms**, dài hơn mức 150 ms của lưới 110 kV (Bảng 8, Điều 12 TT 05/2025). Dòng ngắn mạch lớn nhất cho phép tương ứng là 25 kA.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"","id":"4083dfe4","t":4,"q":"Dòng ngắn mạch lớn nhất cho phép áp dụng cho thanh cái 110 kV của các trạm điện 500 kV, 220 kV là:","o":["50 kA","25 kA","31,5 kA","40 kA"],"a":3,"c":"TT 05/2025, Điều 12 khoản 1 điểm c","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **40 kA**. Xem trích nguyên văn bên dưới.","xh":"Điều 12. Dòng điện ngắn mạch và thời gian loại trừ sự cố","xb":"c) Thanh cái 110 kV của các trạm điện 500 kV, 220 kV trong lưới điện truyền tải được áp dụng dòng điện ngắn mạch lớn nhất cho phép là 40 kA.","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"","id":"3ec04e2b","t":4,"q":"Đối với đường dây trung áp nhiều phân đoạn khó phối hợp bảo vệ, thời gian loại trừ sự cố của bảo vệ chính tại một số vị trí được phép lớn hơn quy định nhưng phải:","o":["Nhỏ hơn 02 giây","Nhỏ hơn 1,5 giây","Nhỏ hơn 700 ms","Nhỏ hơn 01 giây"],"a":3,"c":"TT 05/2025, Điều 12 khoản 4","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Nhỏ hơn 01 giây**. Xem trích nguyên văn bên dưới.","xh":"Điều 12. Dòng điện ngắn mạch và thời gian loại trừ sự cố","xb":"4. Đối với đường dây trung áp có nhiều phân đoạn, khó phối hợp bảo vệ giữa các thiết bị đóng cắt trên lưới điện, cho phép thời gian loại trừ sự cố của bảo vệ chính tại một số vị trí đóng cắt lớn hơn giá trị quy định tại khoản 1 Điều này nhưng phải nhỏ hơn 01 giây và phải đảm bảo an toàn cho thiết bị và lưới điện.","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"Mất điện từ 05 phút trở xuống tính vào MAIFI.","id":"b519bcc2","t":3,"q":"Chỉ số SAIDI, SAIFI của lưới điện phân phối chỉ xét các lần mất điện kéo dài:","o":["Trên 05 phút","Trên 01 phút","Từ 05 phút trở lên","Trên 03 phút"],"a":0,"c":"TT 05/2025, Điều 15","w":"Đáp án đúng là **Trên 05 phút**, khớp với quy định được trích bên dưới.","xh":"Điều 15. Độ tin cậy của lưới điện phân phối","xb":"a) SAIDI được tính bằng tổng số thời gian mất điện kéo dài trên 05 phút của Khách hàng sử dụng điện và Đơn vị bán lẻ điện mua điện của Đơn vị bán buôn điện chia cho tổng số Khách hàng sử dụng điện và Đơn vị bán lẻ điện mua điện của Đơn vị bán buôn điện, xác định theo công thức sau: n SAIDIt = T  K i =1 i i Kt SAIDIy =  SAIDIt t =1 Trong đó: - Ti: Thời gian mất điện lần thứ i trong tháng t (chỉ xét các lần mất điện có thời gian kéo dài trên 05 phút); …","k":"**Hệ số chạm đất**: truyền tải ≤1,4; phân phối ≤1,4 (nối đất trực tiếp), ≤1,7 (cách ly hoặc nối đất qua trở kháng). **Độ tin cậy**: SAIDI, SAIFI chỉ xét mất điện kéo dài trên 05 phút.","old":0},{"m":"","id":"cadb6328","t":11,"q":"Trạm điện từ 110 kV trở lên và nhà máy điện có công suất lắp đặt từ bao nhiêu MW trở lên phải trang bị Gateway/RTU và hai kết nối độc lập về SCADA của cấp điều độ có quyền điều khiển (trường hợp chưa kết nối Trung tâm điều khiển)?","o":["10 MW","01 MW","05 MW","30 MW"],"a":0,"c":"TT 05/2025, Điều 30 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **10 MW**. Xem trích nguyên văn bên dưới.","xh":"Điều 30. Yêu cầu về kết nối hệ thống SCADA","xb":"1. Trạm điện có cấp điện áp từ 110 kV trở lên, nhà máy điện có công suất lắp đặt từ 10MW trở lên (không phân biệt cấp điện áp đấu nối) và nhà máy điện đấu nối vào lưới điện chưa kết nối đến Trung tâm điều khiển phải được trang bị Gateway hoặc RTU và thiết lập hai kết nối độc lập về mặt vật lý với hệ thống SCADA của Cấp điều độ có quyền điều khiển.","k":"**Yêu cầu kỹ thuật** (TT 05, Điều 30, 34): trạm từ 110 kV trở lên, nhà máy từ 10 MW trang bị Gateway/RTU; trạm 110 kV điều khiển từ Trung tâm điều khiển có **hai** kết nối; Trung tâm điều khiển phải có **hai** đường truyền (một làm việc, một dự phòng nóng); tổng công suất NLTT của một Trung tâm điều khiển không vượt công suất tổ máy lớn nhất trong HTĐ quốc gia.","old":0},{"m":"Khi phát công suất phản kháng: không nhỏ hơn 0,98.","id":"5b84b07e","t":5,"q":"Đơn vị phân phối điện phải duy trì hệ số công suất tại vị trí đo đếm chính không nhỏ hơn bao nhiêu khi nhận công suất phản kháng?","o":["0,85","0,98","0,95","0,9"],"a":3,"c":"TT 05/2025, Điều 31 khoản 1","w":"Đáp án đúng là **0,9**, khớp với quy định được trích bên dưới.","xh":"Điều 31. Yêu cầu Hệ số công suất","xb":"1. Trong chế độ vận hành bình thường, Đơn vị phân phối điện và Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải phải duy trì hệ số công suất (cos) tại vị trí đo đếm chính không nhỏ hơn 0,9 trong trường hợp nhận công suất phản kháng và không nhỏ hơn 0,98 trong trường hợp phát công suất phản kháng.","k":"**Hệ số công suất**: Đơn vị phân phối điện, khách hàng nhận điện trực tiếp từ lưới truyền tải: cosφ ≥ **0,9** (nhận Q), ≥ **0,98** (phát Q) tại vị trí đo đếm chính. Khách hàng sản xuất, kinh doanh, dịch vụ có công suất cực đại **từ 40 kW**: cosφ ≥ 0,9 tại điểm đặt thiết bị đo đếm.","old":0},{"m":"","id":"c4ce0dbd","t":5,"q":"Khách hàng sản xuất, kinh doanh có công suất sử dụng cực đại từ bao nhiêu trở lên phải duy trì cosφ không nhỏ hơn 0,9?","o":["100 kW","50 kW","40 kW","20 kW"],"a":2,"c":"TT 05/2025, Điều 31 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **40 kW**. Xem trích nguyên văn bên dưới.","xh":"Điều 31. Yêu cầu Hệ số công suất","xb":"3. Khách hàng sử dụng điện để sản xuất, kinh doanh, dịch vụ có trạm điện riêng hoặc không có trạm điện riêng nhưng có công suất sử dụng cực đại từ 40 kW trở lên có trách nhiệm duy trì hệ số công suất (cos) tại điểm đặt thiết bị đo đếm điện năng theo hợp đồng mua bán điện không nhỏ hơn 0,9.","k":"**Hệ số công suất**: Đơn vị phân phối điện, khách hàng nhận điện trực tiếp từ lưới truyền tải: cosφ ≥ **0,9** (nhận Q), ≥ **0,98** (phát Q) tại vị trí đo đếm chính. Khách hàng sản xuất, kinh doanh, dịch vụ có công suất cực đại **từ 40 kW**: cosφ ≥ 0,9 tại điểm đặt thiết bị đo đếm.","old":0},{"m":"","id":"ea195e5d","t":5,"q":"Tốc độ thay đổi công suất tiêu thụ của khách hàng có trạm riêng trong 01 phút không được vượt quá:","o":["15%","10% công suất tiêu thụ","05%","20%"],"a":1,"c":"TT 05/2025, Điều 32","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **10% công suất tiêu thụ**. Xem trích nguyên văn bên dưới.","xh":"Điều 32. Độ dao động phụ tải điện","xb":"Tốc độ thay đổi công suất tiêu thụ của Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải hoặc của Khách hàng sử dụng lưới điện phân phối có trạm riêng trong 01 phút không được vượt quá 10 % công suất tiêu thụ khi đang vận hành ở chế độ bình thường, trừ trường hợp Khách hàng sử dụng điện có thể điều chỉnh nhu cầu sử dụng điện theo yêu cầu hoặc có thỏa thuận khác với Đơn vị điều độ hệ thống điện quốc gia.","k":"**Độ dao động phụ tải**: tốc độ thay đổi công suất tiêu thụ của khách hàng có trạm riêng trong 01 phút không vượt 10% công suất tiêu thụ. **Hệ thống tự động cắt tải sự cố**: độ tin cậy ≥ 99%.","old":0},{"m":"","id":"6debf184","t":5,"q":"Độ tin cậy của hệ thống tự động cắt tải sự cố phải không nhỏ hơn:","o":["95%","98%","99%","99,9%"],"a":2,"c":"TT 05/2025, Điều 33","w":"Hệ thống tự động cắt tải sự cố phải có độ tin cậy **không nhỏ hơn 99%** vì đây là lớp bảo vệ cuối để giữ ổn định hệ thống khi mất cân bằng công suất.","xh":"","xb":"","k":"**Độ dao động phụ tải**: tốc độ thay đổi công suất tiêu thụ của khách hàng có trạm riêng trong 01 phút không vượt 10% công suất tiêu thụ. **Hệ thống tự động cắt tải sự cố**: độ tin cậy ≥ 99%.","old":0},{"m":"","id":"4b244981","t":11,"q":"Trung tâm điều khiển phải có bao nhiêu đường truyền dữ liệu kết nối với hệ thống điều khiển của các nhà máy điện, trạm điện mà Trung tâm điều khiển thao tác xa?","o":["Hai đường (một làm việc, một dự phòng nóng)","Một đường","Ba đường","Tùy thỏa thuận"],"a":0,"c":"TT 05/2025, Điều 34 khoản 2","w":"Trung tâm điều khiển phải có **hai đường truyền dữ liệu**: một làm việc, một dự phòng nóng, để mất một đường vẫn không mất khả năng giám sát, điều khiển nhà máy, trạm.","xh":"","xb":"","k":"**Yêu cầu kỹ thuật** (TT 05, Điều 30, 34): trạm từ 110 kV trở lên, nhà máy từ 10 MW trang bị Gateway/RTU; trạm 110 kV điều khiển từ Trung tâm điều khiển có **hai** kết nối; Trung tâm điều khiển phải có **hai** đường truyền (một làm việc, một dự phòng nóng); tổng công suất NLTT của một Trung tâm điều khiển không vượt công suất tổ máy lớn nhất trong HTĐ quốc gia.","old":0},{"m":"Tần số 48–51 Hz; điện áp 85–110% Uđm.","id":"d6179339","t":5,"q":"Nguồn điện mặt trời ≤ 01 MW chỉ được tự động kết nối lại lưới khi tần số và điện áp duy trì trong dải cho phép tối thiểu:","o":["60 giây","10 giây","05 phút","30 giây"],"a":0,"c":"TT 05/2025, Điều 42 khoản 6","w":"Đáp án đúng là **60 giây**, khớp với quy định được trích bên dưới.","xh":"Điều 42. Yêu cầu đối với nguồn điện mặt trời, điện gió có công suất từ","xb":"c) Không tự động kết nối lại lưới điện khi chưa đảm bảo các điều kiện sau: - Tần số của lưới điện duy trì trong dải từ 48Hz đến 51Hz trong thời gian tối thiểu 60 giây; - Điện áp tất cả các pha tại điểm đấu nối duy trì trong dải từ 85% đến 110% điện áp định mức trong thời gian tối thiểu 60 giây;","k":"Nguồn điện mặt trời, điện gió ≤01 MW đấu nối trung áp: giảm công suất tác dụng khi tần số vượt **50,5 Hz**; tự động kết nối lại sau khi tần số, điện áp ổn định **60 giây**. ĐMT hạ áp từ **20 kWp** phải đấu nối 3 pha; không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98.","old":0},{"m":"","id":"d78c3585","t":5,"q":"Hệ thống điện mặt trời đấu nối hạ áp có công suất từ bao nhiêu trở lên phải đấu nối vào lưới 03 pha?","o":["10 kWp","20 kWp","05 kWp","50 kWp"],"a":1,"c":"TT 05/2025, Điều 43 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **20 kWp**. Xem trích nguyên văn bên dưới.","xh":"Điều 43. Yêu cầu đối với hệ thống điện mặt trời đấu nối vào lưới điện","xb":"c) Hệ thống điện mặt trời có công suất từ 20 kWp trở lên phải đấu nối vào lưới điện 03 pha.","k":"Nguồn điện mặt trời, điện gió ≤01 MW đấu nối trung áp: giảm công suất tác dụng khi tần số vượt **50,5 Hz**; tự động kết nối lại sau khi tần số, điện áp ổn định **60 giây**. ĐMT hạ áp từ **20 kWp** phải đấu nối 3 pha; không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98.","old":0},{"m":"","id":"d4bb241a","t":5,"q":"Hệ thống điện mặt trời đấu nối lưới hạ áp phải vận hành với yêu cầu nào về công suất phản kháng?","o":["Phát hoặc nhận Q với cosφ ≥ 0,85","Không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98","Phát Q với cosφ ≥ 0,9","Không có yêu cầu"],"a":1,"c":"TT 05/2025, Điều 43 khoản 5","w":"Điện mặt trời đấu nối hạ áp phải **không phát Q vào lưới** và **tiêu thụ Q với cosφ > 0,98**. Phát hoặc nhận Q theo cosφ ≥ 0,85–0,9 là yêu cầu của nguồn lớn hơn, không áp dụng cho hạ áp.","xh":"","xb":"","k":"Nguồn điện mặt trời, điện gió ≤01 MW đấu nối trung áp: giảm công suất tác dụng khi tần số vượt **50,5 Hz**; tự động kết nối lại sau khi tần số, điện áp ổn định **60 giây**. ĐMT hạ áp từ **20 kWp** phải đấu nối 3 pha; không phát Q vào lưới, tiêu thụ Q với cosφ > 0,98.","old":0},{"m":"","id":"a9f47dc7","t":2,"q":"Nguyên tắc phân cấp quyền điều khiển nào sau đây là đúng?","o":["Phân cấp chỉ theo ranh giới tài sản","Một thiết bị có thể do hai cấp điều độ cùng điều khiển","Phân cấp chỉ theo cấp điện áp","Tại một thời điểm, một thiết bị điện chỉ cho phép một cấp điều độ có quyền điều khiển"],"a":3,"c":"TT 06/2025, Điều 5 khoản 1","w":"Nguyên tắc phân cấp quyền điều khiển: **tại một thời điểm, một thiết bị điện chỉ do một cấp điều độ có quyền điều khiển**, các cấp khác chỉ có quyền kiểm tra theo điều kiện. Phân cấp không dựa riêng vào ranh giới tài sản hay cấp điện áp, và không có chuyện hai cấp cùng điều khiển một thiết bị.","xh":"","xb":"","k":"Nguyên tắc: tại một thời điểm một thiết bị chỉ thuộc quyền điều khiển của **một** cấp điều độ; ủy quyền điều khiển phải bằng **văn bản** có xác nhận hai bên (Điều 5).","old":0},{"m":"","id":"e266f150","t":2,"q":"Quyền kiểm tra của điều độ cấp trên là:","o":["Quyền nhận thông tin vận hành","Quyền cho phép điều độ cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển","Quyền thay đổi chế độ vận hành thiết bị","Quyền thao tác xa thiết bị"],"a":1,"c":"TT 06/2025, Điều 7","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Quyền cho phép điều độ cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 7. Quyền kiểm tra của điều độ cấp trên","xb":"1. Quyền kiểm tra của điều độ cấp trên là quyền cho phép điều độ cấp dưới hoặc Đơn vị quản lý vận hành thực hiện quyền điều khiển.","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"ea6978ea","t":2,"q":"Việc ủy quyền điều khiển thiết bị cho điều độ cấp dưới phải thực hiện như thế nào?","o":["Bằng văn bản có xác nhận của hai bên","Bằng lời nói qua kênh trực thông","Không cần thủ tục","Bằng email"],"a":0,"c":"TT 06/2025, Điều 5 khoản 3","w":"Việc ủy quyền điều khiển thiết bị cho điều độ cấp dưới phải làm **bằng văn bản có xác nhận của hai bên**, để rõ phạm vi quyền và trách nhiệm. Chỉ áp dụng cho thiết bị mà việc thay đổi chế độ vận hành không ảnh hưởng chế độ vận hành của hệ thống thuộc quyền điều khiển (Điều 5 khoản 3 TT 06/2025).","xh":"","xb":"","k":"Nguyên tắc: tại một thời điểm một thiết bị chỉ thuộc quyền điều khiển của **một** cấp điều độ; ủy quyền điều khiển phải bằng **văn bản** có xác nhận hai bên (Điều 5).","old":0},{"m":"","id":"c866a4ce","t":2,"q":"Cấp điều độ phân phối tỉnh có quyền điều khiển công suất phát của nhà máy điện đấu nối lưới trung, hạ áp có tổng công suất đặt:","o":["Từ 30 MW trở xuống","Từ 10 MW trở xuống","Từ 50 MW trở xuống","Mọi công suất"],"a":0,"c":"TT 06/2025, Điều 12 khoản 4","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Từ 30 MW trở xuống**. Xem trích nguyên văn bên dưới.","xh":"Điều 12. Quyền điều khiển của Cấp điều độ phân phối tỉnh","xb":"4. Công suất phát của nhà máy điện có tổng công suất đặt từ 30 MW trở xuống, nguồn diesel hòa lưới và hệ thống nguồn điện khác đấu nối vào lưới điện trung, hạ áp thuộc địa bàn tỉnh, thành phố trực thuộc trung ương, trừ các nhà máy điện có tổng công suất đặt từ 30 MW trở xuống quy định tại khoản 3 Điều 13 tại Thông tư này.","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":0},{"m":"","id":"25d1a457","t":2,"q":"Đường dây 110 kV thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh khi:","o":["Luôn luôn","Được Cấp điều độ miền ủy quyền điều khiển","Khi đường dây nằm trong địa bàn tỉnh","Khi được EVN phân cấp"],"a":1,"c":"TT 06/2025, Điều 12 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Được Cấp điều độ miền ủy quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 12. Quyền điều khiển của Cấp điều độ phân phối tỉnh","xb":"3. Đường dây cấp điện áp 110kV được Cấp điều độ miền ủy quyền điều khiển, máy biến áp 110kV (bao gồm cả thiết bị đóng cắt phía 110kV) trừ các máy biến áp 110 kV tại các nhà máy điện thuộc quyền điều khiển của các cấp điều độ cao hơn, lưới điện trung áp thuộc địa bàn tỉnh, thành phố trực thuộc trung ương, trừ trường hợp quy định tại khoản 1 Điều 13 Thông tư này.","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":0},{"m":"","id":"98d7914d","t":2,"q":"Cấp điều độ miền có quyền kiểm tra đối với lưới điện phân phối thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh trong trường hợp:","o":["Thay đổi kết lưới dẫn đến thay đổi chế độ vận hành bình thường của hệ thống điện miền","Không có quyền kiểm tra","Mọi thao tác trên lưới 22 kV","Chỉ khi xử lý sự cố"],"a":0,"c":"TT 06/2025, Điều 16","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Thay đổi kết lưới dẫn đến thay đổi chế độ vận hành bình thường của hệ thống điện miền**. Xem trích nguyên văn bên dưới.","xh":"Điều 16. Quyền kiểm tra của Cấp điều độ miền","xb":"1. Lưới điện phân phối thuộc quyền điều khiển của Cấp điều độ phân phối tỉnh mà việc thay đổi kết lưới dẫn đến thay đổi chế độ vận hành bình thường của hệ thống điện miền.","k":"**Cấp miền có quyền kiểm tra** (Điều 16): lưới phân phối thuộc quyền điều khiển của tỉnh mà thay đổi kết lưới dẫn đến thay đổi chế độ vận hành bình thường của HTĐ miền; tổ máy của nhà máy ≤30 MW thuộc quyền điều khiển của tỉnh mà việc huy động làm thay đổi chế độ vận hành bình thường của HTĐ miền.","old":0},{"m":"Ngày, chu kỳ giao dịch: ±4%; Lễ, Tết: ±10%.","id":"a3ae2a0d","t":8,"q":"Sai số dự báo phụ tải tháng, tuần theo TT 06/2025 phải nằm trong giới hạn:","o":["±10%","±4%","±3%","±6%"],"a":3,"c":"TT 06/2025, Điều 43 khoản 3","w":"Đáp án đúng là **±6%**, khớp với quy định được trích bên dưới.","xh":"Điều 43. Quy định chung về dự báo nhu cầu phụ tải điện","xb":"a) Dự báo phụ tải năm, tháng, tuần: sai số trong giới hạn ±6%;","k":"**Sai số dự báo** (TT 06, Điều 43): năm, tháng, tuần **±6%**; ngày, chu kỳ giao dịch **±4%**; ngày Lễ, Tết và sự kiện biến động lớn **±10%**. Bộ câu cũ ghi ±3% và ±2% – đã lỗi thời.","old":0},{"m":"","id":"0a02dca2","t":8,"q":"Sai số dự báo phụ tải ngày và chu kỳ giao dịch phải nằm trong giới hạn:","o":["±5%","±2%","±4%","±6%"],"a":2,"c":"TT 06/2025, Điều 43 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **±4%**. Xem trích nguyên văn bên dưới.","xh":"Điều 43. Quy định chung về dự báo nhu cầu phụ tải điện","xb":"b) Dự báo phụ tải ngày, chu kỳ giao dịch: sai số trong giới hạn ±4%;","k":"**Sai số dự báo** (TT 06, Điều 43): năm, tháng, tuần **±6%**; ngày, chu kỳ giao dịch **±4%**; ngày Lễ, Tết và sự kiện biến động lớn **±10%**. Bộ câu cũ ghi ±3% và ±2% – đã lỗi thời.","old":0},{"m":"","id":"aae1ff67","t":8,"q":"Đơn vị phân phối điện cung cấp số liệu dự báo nhu cầu phụ tải tháng cho Đơn vị điều độ HTĐ quốc gia trước thời điểm nào?","o":["Trước ngày 20 hàng tháng","Trước ngày 10 hàng tháng","Trước ngày 15 hàng tháng","Trước ngày 25 hàng tháng"],"a":2,"c":"TT 06/2025, Điều 45 khoản 5","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Trước ngày 15 hàng tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 45. Dự báo nhu cầu phụ tải điện tháng","xb":"5. Trình tự thực hiện a) Trước ngày 15 hàng tháng, Đơn vị phân phối điện, Đơn vị phân phối và bán lẻ điện, Đơn vị bán buôn điện, Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải có trách nhiệm cung cấp cho Đơn vị điều độ hệ thống điện quốc gia số liệu dự báo nhu cầu phụ tải điện tháng trong phạm vi quản lý theo quy định tại khoản 2 Điều này. …","k":"**F81**: Cấp điều độ quốc gia tính toán, xác định số lượng, vị trí, độ lớn, mức tần số cắt tải tự động theo tần số thấp **trước 01/9 hàng năm** (Điều 104); chỉ khôi phục phụ tải khi có lệnh điều độ.","old":0},{"m":"NSMO công bố kết quả trước 15h00 thứ Sáu.","id":"81b6b7c2","t":8,"q":"Số liệu dự báo phụ tải tuần của Đơn vị phân phối điện phải gửi trước thời điểm nào?","o":["Trước 10h00 thứ Ba","Trước 10h00 thứ Hai hàng tuần","Trước 15h00 thứ Sáu","Trước 16h00 thứ Tư"],"a":1,"c":"TT 06/2025, Điều 46 khoản 5","w":"Đáp án đúng là **Trước 10h00 thứ Hai hàng tuần**, khớp với quy định được trích bên dưới.","xh":"Điều 46. Dự báo nhu cầu phụ tải điện tuần","xb":"5. Trình tự thực hiện a) Trước 10h00 thứ Hai hàng tuần, Đơn vị phân phối điện, Đơn vị phân phối và bán lẻ điện và Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải có trách nhiệm cung cấp cho Đơn vị điều độ hệ thống điện quốc gia số liệu dự báo nhu cầu phụ tải điện tuần trong phạm vi quản lý theo quy định tại khoản 2 Điều này. …","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"","id":"8174aabf","t":8,"q":"Số liệu dự báo phụ tải tuần gồm điện năng, công suất chu kỳ 30 phút trong từng ngày của:","o":["02 tuần tiếp theo (Tuần W+1, Tuần W+2)","01 tháng tiếp theo","04 tuần tiếp theo","01 tuần tiếp theo"],"a":0,"c":"TT 06/2025, Điều 46 khoản 2","w":"Số liệu dự báo phụ tải tuần gồm điện năng và công suất chu kỳ 30 phút từng ngày của **02 tuần tiếp theo (W+1 và W+2)**. Dự báo ngày là cho 02 ngày tới, còn dự báo tháng là cho các tháng sau.","xh":"","xb":"","k":"**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","old":0},{"m":"","id":"6715d208","t":8,"q":"Dự báo nhu cầu phụ tải điện ngày được thực hiện cho:","o":["03 ngày tới","02 ngày tới","07 ngày tới","01 ngày tới"],"a":1,"c":"TT 06/2025, Điều 47","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **02 ngày tới**. Xem trích nguyên văn bên dưới.","xh":"Điều 47. Dự báo nhu cầu phụ tải điện ngày","xb":"1. Dự báo nhu cầu phụ tải điện ngày được thực hiện cho 02 ngày tới.","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"","id":"26d9a4a4","t":8,"q":"Đơn vị phân phối điện gửi kết quả dự báo nhu cầu phụ tải năm cho Đơn vị điều độ HTĐ quốc gia trước:","o":["Ngày 01 tháng 9","Ngày 01 tháng 6","Ngày 01 tháng 12","Ngày 01 tháng 8 hàng năm"],"a":3,"c":"TT 06/2025, Điều 44 khoản 5","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Ngày 01 tháng 8 hàng năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 44. Dự báo nhu cầu phụ tải điện năm","xb":"5. Trình tự thực hiện a) Trước ngày 01 tháng 8 hàng năm, Đơn vị phân phối điện, Đơn vị phân phối và bán lẻ điện, Đơn vị bán buôn điện, Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải có trách nhiệm cung cấp cho Đơn vị điều độ hệ thống điện quốc gia kết quả dự báo nhu cầu phụ tải điện năm trong phạm vi quản lý theo quy định tại khoản 2 Điều này. …","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"Cấp điều độ công bố trước ngày 25 hàng tháng.","id":"920e5e03","t":6,"q":"Đơn vị QLVH gửi đăng ký kế hoạch bảo dưỡng, sửa chữa tháng M+1 cho Cấp điều độ có quyền điều khiển trước:","o":["Ngày 10 tháng M","Ngày 25 tháng M","Ngày 20 tháng M","Ngày 15 tháng M"],"a":3,"c":"TT 06/2025, Điều 53 khoản 2","w":"Đáp án đúng là **Ngày 15 tháng M**, khớp với quy định được trích bên dưới.","xh":"Điều 53. Đăng ký, lập và phê duyệt kế hoạch bảo dưỡng, sửa chữa, thử","xb":"a) Trước ngày 15 hàng tháng (tháng M), trên cơ sở kế hoạch bảo dưỡng, sửa chữa năm đã được phê duyệt, Đơn vị quản lý vận hành có trách nhiệm gửi Cấp điều độ có quyền điều khiển: Bản đăng ký kế hoạch bảo dưỡng, sửa chữa nhà máy điện, lưới điện tháng tiếp theo (tháng M+1); Dự kiến điều chỉnh kế hoạch bảo dưỡng, sửa chữa (nếu có) cho các tháng còn lại trong năm; Phiếu đăng ký công tác nhà máy điện, lưới điện tháng M+1;","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"","id":"67c5df71","t":6,"q":"Khi kế hoạch BDSC Tuần W+1, W+2 có điều chỉnh/phát sinh so với kế hoạch tháng, Đơn vị QLVH gửi phiếu đăng ký trước:","o":["Không cần đăng ký lại","15h00 thứ Sáu tuần W","10h00 thứ Ba tuần W","10h00 thứ Hai tuần W"],"a":2,"c":"TT 06/2025, Điều 53 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **10h00 thứ Ba tuần W**. Xem trích nguyên văn bên dưới.","xh":"Điều 53. Đăng ký, lập và phê duyệt kế hoạch bảo dưỡng, sửa chữa, thử","xb":"b) Trường hợp kế hoạch bảo dưỡng, sửa chữa, thử nghiệm nguồn điện và lưới điện cho 02 tuần tiếp theo có điều chỉnh hoặc phát sinh so với kế hoạch tháng đã được phê duyệt, trước 10h00 thứ Ba tuần W, Đơn vị quản lý vận hành gửi Phiếu đăng ký công tác nhà máy điện, lưới điện cho 02 tuần tiếp theo (tuần W+1 và tuần W+2) đối với các công tác có điều chỉnh hoặc phát sinh tới Cấp điều độ có quyền điều khiển, trong đó phải ghi rõ lý do điều chỉnh hoặc phát sinh;","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"","id":"87591636","t":6,"q":"Cấp điều độ có quyền điều khiển lập, phê duyệt và công bố kế hoạch BDSC năm tiếp theo trước:","o":["Ngày 01 tháng 12 hàng năm","Ngày 01 tháng 8","Ngày 31 tháng 12","Ngày 01 tháng 10"],"a":0,"c":"TT 06/2025, Điều 53 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Ngày 01 tháng 12 hàng năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 53. Đăng ký, lập và phê duyệt kế hoạch bảo dưỡng, sửa chữa, thử","xb":"b) Trước ngày 01 tháng 12 hàng năm, Cấp điều độ có quyền điều khiển có trách nhiệm lập, phê duyệt, công bố kế hoạch bảo dưỡng, sửa chữa lưới điện và nhà máy điện năm tiếp theo thuộc phạm vi quyền điều khiển, đến các đơn vị đăng ký và các đơn vị quản lý vận hành bị ảnh hưởng bởi công tác.","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"","id":"cb3a0e5b","t":6,"q":"Thứ tự ưu tiên khi tách thiết bị để bảo dưỡng, sửa chữa:","o":["Theo thứ tự đăng ký","Theo cấp điện áp","Nhà máy điện ưu tiên cao hơn lưới điện","Lưới điện ưu tiên cao hơn nhà máy điện"],"a":2,"c":"TT 06/2025, Điều 54 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Nhà máy điện ưu tiên cao hơn lưới điện**. Xem trích nguyên văn bên dưới.","xh":"Điều 54. Tách thiết bị để bảo dưỡng, sửa chữa","xb":"1. Tách thiết bị để bảo dưỡng, sửa chữa nhà máy điện ưu tiên cao hơn so với lưới điện.","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"Thông báo trước thời điểm đưa trở lại ít nhất 04 giờ.","id":"f33fb5ae","t":6,"q":"Khi có thông báo suy giảm khả năng bảo đảm cung cấp điện, Đơn vị QLVH phải đưa thiết bị đang BDSC trở lại vận hành không chậm hơn bao lâu kể từ khi nhận yêu cầu?","o":["24 giờ","48 giờ","12 giờ","72 giờ"],"a":1,"c":"TT 06/2025, Điều 56 khoản 5","w":"Đáp án đúng là **48 giờ**, khớp với quy định được trích bên dưới.","xh":"Điều 56. Đăng ký tách thiết bị để bảo dưỡng, sửa chữa lưới điện và nhà","xb":"5. Khi có thông báo suy giảm khả năng bảo đảm cung cấp điện, Đơn vị quản lý vận hành có thể đưa thiết bị đang tách bảo dưỡng, sửa chữa trở lại vận hành trong thời gian sớm nhất so với kế hoạch đã được phê duyệt, bảo đảm không chậm hơn 48 giờ kể từ khi nhận được yêu cầu của Cấp điều độ có quyền điều khiển. Trường hợp này, Đơn vị quản lý vận hành phải thông báo cho Cấp điều độ có quyền điều khiển trước thời điểm dự kiến đưa thiết bị vận hành trở lại ít nhất 04 giờ.","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"","id":"a58ec345","t":6,"q":"Phiếu đăng ký công tác được gửi theo thứ tự ưu tiên hình thức nào?","o":["Email → Công văn → Trang thông tin điện tử","Trang thông tin điện tử → Email → Công văn","Điện thoại → Email → Công văn","Công văn → Email → Điện thoại"],"a":1,"c":"TT 06/2025, Điều 56 khoản 2","w":"Thứ tự ưu tiên gửi phiếu đăng ký công tác là **trang thông tin điện tử → email → công văn**. Ưu tiên kênh điện tử trước để nhanh và có lưu vết, công văn là phương án cuối.","xh":"","xb":"","k":"**Bảo dưỡng, sửa chữa** (Điều 53–56): tháng M+1 đăng ký trước **ngày 15**, cấp điều độ công bố trước **ngày 25**; tuần điều chỉnh trước **10h00 thứ Ba**; kế hoạch năm công bố trước **01/12**. Ưu tiên: nhà máy điện cao hơn lưới điện. Khi có thông báo suy giảm khả năng cung cấp điện, đưa thiết bị đang BDSC trở lại trong **48 giờ**.","old":0},{"m":"","id":"4025eafb","t":9,"q":"Lệnh điều độ được thực hiện bằng các hình thức nào?","o":["Tín hiệu điều khiển và email","Chỉ bằng lời nói","Lời nói, tín hiệu điều khiển, chữ viết","Lời nói và văn bản giấy"],"a":2,"c":"TT 06/2025, Điều 73","w":"Lệnh điều độ được thực hiện bằng **lời nói, tín hiệu điều khiển và chữ viết**. Email hay văn bản giấy riêng lẻ không phải danh sách đầy đủ của các hình thức theo Điều 73.","xh":"","xb":"","k":"**Lệnh điều độ** bằng lời nói, tín hiệu điều khiển (SCADA) hoặc chữ viết; lời nói phải ghi âm lưu **≥ 01 năm**; lệnh điện tử (DIM) lưu **≥ 05 năm**; lệnh bằng tín hiệu điều khiển lưu ≥ 01 năm; người nhận lệnh phải nhắc lại. Kênh ưu tiên cao nhất: trực thông hoặc vô tuyến.","old":0},{"m":"","id":"d7ece156","t":9,"q":"Lệnh điều độ bằng lời nói phải được ghi âm và lưu trữ trong thời gian ít nhất:","o":["06 tháng","05 năm","01 năm","03 tháng"],"a":2,"c":"TT 06/2025, Điều 74 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **01 năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 74. Yêu cầu khi thực hiện lệnh điều độ","xb":"b) Lệnh điều độ bằng lời nói phải ngắn gọn, rõ ràng, chính xác, được ghi âm tại các cấp điều độ và lưu trữ trong thời gian ít nhất 01 năm;","k":"**Lệnh điều độ** bằng lời nói, tín hiệu điều khiển (SCADA) hoặc chữ viết; lời nói phải ghi âm lưu **≥ 01 năm**; lệnh điện tử (DIM) lưu **≥ 05 năm**; lệnh bằng tín hiệu điều khiển lưu ≥ 01 năm; người nhận lệnh phải nhắc lại. Kênh ưu tiên cao nhất: trực thông hoặc vô tuyến.","old":0},{"m":"","id":"16739a59","t":9,"q":"Thời gian lưu trữ lệnh điều độ điện tử (qua hệ thống DIM) ít nhất là:","o":["02 năm","05 năm","01 năm","10 năm"],"a":1,"c":"TT 06/2025, Điều 74 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **05 năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 74. Yêu cầu khi thực hiện lệnh điều độ","xb":"b) Thời gian lưu trữ lệnh điều độ điện tử ít nhất là 05 năm;","k":"**Lệnh điều độ** bằng lời nói, tín hiệu điều khiển (SCADA) hoặc chữ viết; lời nói phải ghi âm lưu **≥ 01 năm**; lệnh điện tử (DIM) lưu **≥ 05 năm**; lệnh bằng tín hiệu điều khiển lưu ≥ 01 năm; người nhận lệnh phải nhắc lại. Kênh ưu tiên cao nhất: trực thông hoặc vô tuyến.","old":0},{"m":"","id":"8dca1ad0","t":9,"q":"Kênh thông tin ưu tiên cao nhất khi truyền lệnh điều độ bằng lời nói là:","o":["Điện thoại di động","Kênh trực thông hoặc kênh vô tuyến điện","Email","Điện thoại cố định"],"a":1,"c":"TT 06/2025, Điều 74 khoản 1 điểm d","w":"Khi truyền lệnh điều độ bằng lời nói, kênh được ưu tiên cao nhất là **kênh trực thông hoặc kênh thông tin vô tuyến điện** kết nối giữa cấp điều độ có quyền điều khiển và nhà máy điện, trạm điện. Các kênh khác chỉ dùng khi kênh ưu tiên không khả dụng.","xh":"","xb":"","k":"**Lệnh điều độ** bằng lời nói, tín hiệu điều khiển (SCADA) hoặc chữ viết; lời nói phải ghi âm lưu **≥ 01 năm**; lệnh điện tử (DIM) lưu **≥ 05 năm**; lệnh bằng tín hiệu điều khiển lưu ≥ 01 năm; người nhận lệnh phải nhắc lại. Kênh ưu tiên cao nhất: trực thông hoặc vô tuyến.","old":0},{"m":"","id":"7d91eb8e","t":7,"q":"Khi tần số hệ thống vượt ra ngoài giới hạn nào thì tất cả nhà máy điện (kể cả không tham gia điều tần) phải tham gia điều chỉnh?","o":["50 ± 1,0 Hz","49 ÷ 51 Hz","50 ± 0,2 Hz","50 ± 0,5 Hz"],"a":3,"c":"TT 06/2025, Điều 88 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **50 ± 0,5 Hz**. Xem trích nguyên văn bên dưới.","xh":"Điều 88. Quy định về điều khiển tần số","xb":"3. Khi tần số hệ thống điện vượt ra ngoài giới hạn 50±0,5 Hz, tất cả các nhà máy điện không tham gia điều chỉnh tần số sơ cấp, thứ cấp đều phải tham gia điều chỉnh theo khả năng của tổ máy để đưa tần số về phạm vi 50±0,5 Hz. Khi tần số hệ thống đã được đưa về giới hạn trên, tất cả các nhà máy điện đã tham gia điều chỉnh giữ nguyên công suất và thông báo cho cấp điều độ có quyền điều khiển để xác nhận mức phát công suất thực tế.","k":"**Tần số** (TT 06, Điều 88–89): khi tần số ngoài 50 ± 0,5 Hz tất cả nhà máy điện (kể cả không tham gia điều tần) phải tham gia điều chỉnh; sau khi huy động hết dự phòng mà tần số vẫn có khả năng xuống dưới **49,5 Hz** thì sa thải phụ tải.","old":0},{"m":"","id":"befbb2a9","t":7,"q":"Sau khi đã huy động nguồn dự phòng mà tần số vẫn có khả năng giảm xuống dưới bao nhiêu thì phải sa thải phụ tải?","o":["48,5 Hz","49,0 Hz","49,8 Hz","49,5 Hz"],"a":3,"c":"TT 06/2025, Điều 89 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **49,5 Hz**. Xem trích nguyên văn bên dưới.","xh":"Điều 89. Các biện pháp điều khiển tần số","xb":"3. Sa thải phụ tải: Sau khi đã huy động nguồn dự phòng mà tần số vẫn tiếp tục có khả năng giảm xuống dưới 49,5 Hz, cấp điều độ có quyền điều khiển phải thực hiện biện pháp sa thải phụ tải để bảo đảm vận hành ổn định hệ thống điện và đưa tần số lên trên 49,5 Hz.","k":"**Tần số** (TT 06, Điều 88–89): khi tần số ngoài 50 ± 0,5 Hz tất cả nhà máy điện (kể cả không tham gia điều tần) phải tham gia điều chỉnh; sau khi huy động hết dự phòng mà tần số vẫn có khả năng xuống dưới **49,5 Hz** thì sa thải phụ tải.","old":0},{"m":"","id":"051e762f","t":7,"q":"Cấp điều độ quốc gia tính toán, xác định số lượng, vị trí, độ lớn và mức tần số cắt tải tự động theo tần số thấp (F81) trước:","o":["Ngày 01 tháng 12","Ngày 01 tháng 6","Ngày 01 tháng 3","Ngày 01 tháng 9 hàng năm"],"a":3,"c":"TT 06/2025, Điều 104 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Ngày 01 tháng 9 hàng năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 104. Tự động cắt tải theo tần số thấp","xb":"2. Các phụ tải được đặt hệ thống tự động cắt tải theo tần số thấp sẽ được chia thành nhiều đợt riêng biệt. Trước ngày 01 tháng 9 hàng năm, Cấp điều độ quốc gia có trách nhiệm tính toán, xác định số lượng, vị trí, độ lớn và mức tần số thấp kèm theo dựa trên các thảo luận với các Đơn vị quản lý vận hành. Việc phân chia các đợt cắt tải sẽ được thực hiện theo các quy định liên quan nhằm đạt được sự cắt tải đồng bộ hợp lý trong hệ thống phân phối điện.","k":"**F81**: Cấp điều độ quốc gia tính toán, xác định số lượng, vị trí, độ lớn, mức tần số cắt tải tự động theo tần số thấp **trước 01/9 hàng năm** (Điều 104); chỉ khôi phục phụ tải khi có lệnh điều độ.","old":0},{"m":"","id":"8cc60385","t":2,"q":"Nhiệm vụ nào sau đây thuộc bộ phận phương thức ngắn hạn tại Cấp điều độ phân phối tỉnh theo TT 06/2025?","o":["Phê duyệt, tổng hợp và báo cáo cấp điều độ miền thông tin vận hành các nguồn đấu nối lưới phân phối, bao gồm ĐMTMN","Lập phương thức vận hành cơ bản","Quản lý hệ thống viễn thông","Tính toán chỉnh định rơ le"],"a":0,"c":"TT 06/2025, Điều 124 khoản 4","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Phê duyệt, tổng hợp và báo cáo cấp điều độ miền thông tin vận hành các nguồn đấu nối lưới phân phối, bao gồm ĐMTMN**. Xem trích nguyên văn bên dưới.","xh":"Điều 124. Nhiệm vụ của bộ phận phương thức ngắn hạn","xb":"4. Phê duyệt, tổng hợp và báo cáo cấp điều độ miền thông tin vận hành các nguồn điện đấu nối lưới điện phân phối thuộc phạm vi quản lý bao gồm điện mặt trời mái nhà theo các khung thời gian lập phương thức vận hành ngắn hạn;","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0},{"m":"","id":"c8b8df15","t":2,"q":"Bộ phận nào tại Cấp điều độ phân phối tỉnh chủ trì điều tra, phân tích sự cố trong hệ thống phân phối điện?","o":["Bộ phận rơ le bảo vệ","Bộ phận phương thức dài hạn","Bộ phận phương thức ngắn hạn","Bộ phận trực ban điều độ"],"a":1,"c":"TT 06/2025, Điều 125 khoản 7","w":"Tại Cấp điều độ phân phối tỉnh, **bộ phận phương thức dài hạn** chủ trì điều tra, phân tích sự cố trong hệ thống phân phối điện (Điều 125 khoản 7 TT 06/2025). Bộ phận phương thức ngắn hạn tập trung vào lập và điều chỉnh phương thức ngắn hạn.","xh":"","xb":"","k":"Bộ phận tại cấp điều độ phân phối tỉnh: trực ban chỉ huy điều độ, phương thức ngắn hạn (Điều 124), phương thức dài hạn (Điều 125 – 9 nhiệm vụ), tính toán chỉnh định rơ le (Điều 126). Bộ phận phương thức dài hạn chủ trì điều tra, phân tích sự cố.","old":0},{"m":"Tại Trung tâm điều khiển/điều khiển từ xa: không quá 03 bước.","id":"35bd6093","t":9,"q":"Thao tác tại cấp điều độ có quyền điều khiển được phép không lập phiếu (nhưng ghi sổ nhật ký trước khi thao tác) khi số bước thao tác không quá:","o":["07 bước","05 bước","03 bước","10 bước"],"a":1,"c":"TT 06/2025, Điều 133 khoản 3","w":"Tại cấp điều độ có quyền điều khiển, được phép thao tác không lập phiếu khi không quá **05 bước**, nhưng phải ghi sổ nhật ký trước khi thao tác. Tại trung tâm điều khiển hoặc điều khiển từ xa thì chỉ tới 03 bước.","xh":"","xb":"","k":"**Phiếu thao tác** bắt buộc, cấm thao tác theo trí nhớ. Được miễn phiếu (phải ghi sổ nhật ký trước khi thao tác): xử lý sự cố; ≤ **03** bước tại trung tâm điều khiển hoặc thao tác xa; ≤ **05** bước tại cấp điều độ có quyền điều khiển. Phiếu đã thực hiện lưu **≥ 03 tháng**; chuyển phiếu kế hoạch trước **≥ 45 phút**.","old":0},{"m":"","id":"1f7dcc22","t":9,"q":"Đơn vị QLVH phải thao tác thử máy cắt, dao cách ly, chuyển nấc MBA bằng điều khiển từ xa nếu thời gian không thao tác kéo dài quá:","o":["24 tháng","12 tháng","06 tháng","03 tháng"],"a":1,"c":"TT 06/2025, Điều 133 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **12 tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 133. Yêu cầu chung về thao tác thiết bị điện trong hệ thống điện","xb":"c) Thực hiện thao tác thử đóng cắt máy cắt, dao cách ly, chuyển nấc máy biến áp bằng điều khiển từ xa nếu thời gian không thao tác kéo dài quá 12 tháng và không gây gián đoạn cung cấp điện cho khách hàng;","k":"**Thao tác thử** MC, DCL, chuyển nấc MBA bằng điều khiển từ xa nếu **12 tháng** không thao tác. Hệ thống thao tác xa lưu sự kiện **≥ 03 tháng**. Hạn chế thao tác giờ cao điểm và giao nhận ca; không thao tác ngoài trời khi giông sét (trừ xử lý sự cố bằng xa).","old":0},{"m":"","id":"d87f759c","t":9,"q":"Phiếu thao tác đã thực hiện xong phải được lưu trữ ít nhất:","o":["03 tháng","01 tháng","06 tháng","01 năm"],"a":0,"c":"TT 06/2025, Điều 135 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **03 tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 135. Phiếu thao tác","xb":"3. Các phiếu thao tác lập ra phải được đánh số. Những phiếu thao tác đã thực hiện xong phải được lưu trữ ít nhất 03 tháng. Phiếu thao tác phải được lưu lại trong hồ sơ điều tra trong trường hợp thao tác có xảy ra sự cố hoặc tai nạn.","k":"**Phiếu thao tác** bắt buộc, cấm thao tác theo trí nhớ. Được miễn phiếu (phải ghi sổ nhật ký trước khi thao tác): xử lý sự cố; ≤ **03** bước tại trung tâm điều khiển hoặc thao tác xa; ≤ **05** bước tại cấp điều độ có quyền điều khiển. Phiếu đã thực hiện lưu **≥ 03 tháng**; chuyển phiếu kế hoạch trước **≥ 45 phút**.","old":0},{"m":"","id":"d87bceca","t":9,"q":"Phiếu thao tác theo kế hoạch phải được chuyển tới nhân viên vận hành trực tiếp thao tác ít nhất bao lâu trước thời gian dự kiến bắt đầu?","o":["30 phút","45 phút","60 phút","02 giờ"],"a":1,"c":"TT 06/2025, Điều 138 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **45 phút**. Xem trích nguyên văn bên dưới.","xh":"Điều 138. Thời gian và hình thức chuyển phiếu thao tác","xb":"1. Phiếu thao tác theo kế hoạch phải được chuyển tới nhân viên vận hành trực tiếp thao tác ít nhất 45 phút trước thời gian dự kiến bắt đầu thao tác.","k":"**Phiếu thao tác** bắt buộc, cấm thao tác theo trí nhớ. Được miễn phiếu (phải ghi sổ nhật ký trước khi thao tác): xử lý sự cố; ≤ **03** bước tại trung tâm điều khiển hoặc thao tác xa; ≤ **05** bước tại cấp điều độ có quyền điều khiển. Phiếu đã thực hiện lưu **≥ 03 tháng**; chuyển phiếu kế hoạch trước **≥ 45 phút**.","old":0},{"m":"","id":"95525d32","t":9,"q":"Hệ thống giám sát, điều khiển từ xa phải lưu trữ mọi sự kiện thao tác xa trong thời gian không dưới:","o":["01 năm","01 tháng","06 tháng","03 tháng"],"a":3,"c":"TT 06/2025, Điều 147 khoản 4","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **03 tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 147. Quy định chung về thao tác xa","xb":"4. Hệ thống giám sát, điều khiển từ xa tại các cấp điều độ, trung tâm điều khiển phải lưu trữ được mọi sự kiện thao tác xa, thời gian lưu trữ do đơn vị quy định nhưng không dưới 03 tháng.","k":"**Thao tác thử** MC, DCL, chuyển nấc MBA bằng điều khiển từ xa nếu **12 tháng** không thao tác. Hệ thống thao tác xa lưu sự kiện **≥ 03 tháng**. Hạn chế thao tác giờ cao điểm và giao nhận ca; không thao tác ngoài trời khi giông sét (trừ xử lý sự cố bằng xa).","old":0},{"m":"","id":"7159ffaa","t":9,"q":"Điều kiện nào KHÔNG thuộc điều kiện thực hiện thao tác xa?","o":["Khóa điều khiển tại tủ thiết bị ở vị trí Remote","RTU/Gateway tại trạm hoạt động tốt","Hệ thống thông tin truyền dữ liệu, tín hiệu điều khiển hoạt động tin cậy","Phải có nhân viên vận hành trực tại trạm trong mọi trường hợp"],"a":3,"c":"TT 06/2025, Điều 148","w":"Thao tác xa nhằm điều khiển thiết bị mà **không cần người trực tại trạm**, nên điều kiện \"phải có nhân viên vận hành trực tại trạm trong mọi trường hợp\" không thuộc điều kiện. Các điều kiện thật gồm: khóa điều khiển ở vị trí Remote, RTU/Gateway hoạt động tốt, kênh truyền thông tin, dữ liệu thông suốt.","xh":"","xb":"","k":"","old":0},{"m":"","id":"8c4fc43c","t":9,"q":"Thiết bị điện nhất thứ thuộc quyền điều khiển của đơn vị nào thì:","o":["Cấp điều độ quốc gia đánh số","Cấp điều độ miền đánh số cho mọi thiết bị","Đơn vị QLVH tự đánh số không cần phê duyệt","Đơn vị đó đánh số, phê duyệt và gửi sơ đồ đánh số về điều độ cấp trên"],"a":3,"c":"TT 06/2025, Điều 168 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Đơn vị đó đánh số, phê duyệt và gửi sơ đồ đánh số về điều độ cấp trên**. Xem trích nguyên văn bên dưới.","xh":"Điều 168. Phân cấp đặt tên, đánh số thiết bị điện nhất thứ","xb":"2. Thiết bị điện nhất thứ trong hệ thống điện quốc gia thuộc quyền điều khiển của đơn vị nào thì do đơn vị đó đánh số, phê duyệt và gửi sơ đồ đánh số đã được phê duyệt về điều độ cấp trên, trừ các nhà máy điện quy định tại khoản 3 Điều này.","k":"**Quyền điều khiển** là quyền thay đổi chế độ vận hành của HTĐ hoặc thiết bị điện (Điều 6). **Quyền kiểm tra** là quyền cho phép cấp dưới hoặc Đơn vị QLVH thực hiện quyền điều khiển (Điều 7). **Quyền nắm thông tin** là quyền được nhận thông báo/cung cấp trước thông tin về chế độ vận hành của thiết bị không thuộc quyền điều khiển, kiểm tra nhưng ảnh hưởng đến hệ thống (Điều 8).","old":0},{"m":"","id":"ebbdcbf1","t":9,"q":"Trong trường hợp khẩn cấp (cháy nổ, đe dọa tính mạng), nhân viên vận hành tại trạm được:","o":["Phải chờ lệnh của cấp điều độ","Thao tác cô lập phần tử sự cố không cần xin phép, sau đó báo cáo ngay cấp điều độ có quyền điều khiển","Chỉ được báo cáo, không được thao tác","Phải xin phép lãnh đạo đơn vị trước"],"a":1,"c":"TT 06/2025, Điều 175 khoản 3","w":"Khi khẩn cấp (cháy nổ, đe dọa tính mạng), nhân viên vận hành tại trạm được **thao tác cô lập phần tử sự cố ngay không cần xin phép**, sau đó báo cáo ngay cho cấp điều độ. Chờ lệnh hay xin phép lãnh đạo sẽ làm mất thời gian cứu người, cứu thiết bị.","xh":"","xb":"","k":"**Sự cố hoặc đe dọa sự cố** (Điều 9): cấp có quyền điều khiển được ra lệnh trước rồi báo cáo ngay cho cấp có quyền kiểm tra; khẩn cấp (cháy, đe dọa tính mạng) nhân viên vận hành được thao tác trước, báo cáo sau.","old":0},{"m":"","id":"d9674558","t":9,"q":"Khi sự cố đường dây trên không cấp điện áp trên 35 kV đến 220 kV, cho phép đóng lại đường dây không quá bao nhiêu lần (kể cả lần TĐL không thành công)?","o":["01 lần","02 lần","03 lần","04 lần"],"a":1,"c":"TT 06/2025, Điều 185 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **02 lần**. Xem trích nguyên văn bên dưới.","xh":"Điều 185. Quy định đóng lại đường dây trên không cấp điện áp trên 35","xb":"kV đến 220 kV sau sự cố 1. Khi có sự cố đường dây ở cấp điện áp từ trên 35 kV đến 220 kV, cho phép đóng lại đường dây không quá 02 (hai) lần, kể cả lần tự động đóng lại không thành công. Đối với các đường dây đi qua khu vực tập trung đông người hoặc khu dân cư, chỉ cho phép đóng lại đường dây lần thứ hai sau khi Đơn vị quản lý vận hành đã thực hiện kiểm tra, xác nhận đường dây đủ điều kiện vận hành và bảo đảm an toàn cho người, thiết bị điện. …","k":"**Đóng lại đường dây trên không**: trên 35 đến 220 kV tối đa **02 lần** (kể cả TĐL); từ 35 kV trở xuống tối đa **03 lần**; ≤ 35 kV, trong 08 giờ sự cố thoáng qua lần thứ **04** thì khóa TĐL; không đóng điện đường dây trên 35 kV khi MC nhảy trong gió từ cấp **06**; đường dây cáp: không đóng lại khi bảo vệ trong phạm vi cáp tác động; hỗn hợp ≤ 35 kV: đóng lại 01 lần.","old":0},{"m":"","id":"e9697298","t":9,"q":"Khi sự cố đường dây trên không cấp điện áp từ 35 kV trở xuống, cho phép đóng lại không quá bao nhiêu lần (kể cả lần TĐL không thành công)?","o":["05 lần","03 lần","04 lần","02 lần"],"a":1,"c":"TT 06/2025, Điều 188 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **03 lần**. Xem trích nguyên văn bên dưới.","xh":"Điều 188. Quy định đóng lại đường dây trên không cấp điện áp từ 35 kV","xb":"trở xuống 1. Khi sự cố đường dây, được phép đóng lại đường dây không quá 03 (ba) lần, kể cả lần tự động đóng lại không thành công. Đối với các đường dây đi qua khu vực dân cư, Đơn vị quản lý vận hành căn cứ vào tình hình thực tế để quyết định đóng điện trên cơ sở phải bảo đảm an toàn cho người, thiết bị điện và khả năng đóng lại thành công.","k":"**Đóng lại đường dây trên không**: trên 35 đến 220 kV tối đa **02 lần** (kể cả TĐL); từ 35 kV trở xuống tối đa **03 lần**; ≤ 35 kV, trong 08 giờ sự cố thoáng qua lần thứ **04** thì khóa TĐL; không đóng điện đường dây trên 35 kV khi MC nhảy trong gió từ cấp **06**; đường dây cáp: không đóng lại khi bảo vệ trong phạm vi cáp tác động; hỗn hợp ≤ 35 kV: đóng lại 01 lần.","old":0},{"m":"Đường dây trên 35 kV đến 220 kV: sau 03 lần.","id":"bbd246df","t":9,"q":"Đường dây ≤ 35 kV, trong 08 giờ đã có sự cố thoáng qua sau bao nhiêu lần đóng lại tốt thì phải khóa mạch tự đóng lại?","o":["05 lần","03 lần","04 lần","02 lần"],"a":2,"c":"TT 06/2025, Điều 188 khoản 4","w":"Đáp án đúng là **04 lần**, khớp với quy định được trích bên dưới.","xh":"Điều 188. Quy định đóng lại đường dây trên không cấp điện áp từ 35 kV","xb":"4. Trong thời gian 08 giờ, nếu đường dây đã xuất hiện sự cố thoáng qua sau 04 (bốn) lần đóng lại tốt (kể cả lần tự động đóng lại), Nhân viên vận hành phải khoá mạch rơ le tự đóng lại. Nếu trong 08 giờ tiếp theo không xuất hiện lại sự cố thì đưa rơ le tự đóng lại vào làm việc. Nếu trong 08 giờ tiếp theo lại xuất hiện sự cố, Nhân viên vận hành phải báo cáo với Cấp điều độ có quyền điều khiển để ra lệnh:","k":"**Đóng lại đường dây trên không**: trên 35 đến 220 kV tối đa **02 lần** (kể cả TĐL); từ 35 kV trở xuống tối đa **03 lần**; ≤ 35 kV, trong 08 giờ sự cố thoáng qua lần thứ **04** thì khóa TĐL; không đóng điện đường dây trên 35 kV khi MC nhảy trong gió từ cấp **06**; đường dây cáp: không đóng lại khi bảo vệ trong phạm vi cáp tác động; hỗn hợp ≤ 35 kV: đóng lại 01 lần.","old":0},{"m":"","id":"5deaac9a","t":9,"q":"Không cho phép đóng điện đường dây trên 35 kV khi máy cắt nhảy trong điều kiện gió từ cấp mấy trở lên?","o":["Cấp 06","Cấp 07","Cấp 05","Cấp 08"],"a":0,"c":"TT 06/2025, Điều 185 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Cấp 06**. Xem trích nguyên văn bên dưới.","xh":"Điều 185. Quy định đóng lại đường dây trên không cấp điện áp trên 35","xb":"3. Không cho phép đóng điện đường dây trong trường hợp máy cắt đường dây nhảy khi có gió cấp 06 trở lên, lũ lụt dẫn đến mức nước cao dẫn tới giảm khoảng cách an toàn so với thiết kế của đường dây đe dọa mất an toàn, hỏa hoạn ở những vùng đường dây đi qua hoặc các thiết bị không đủ tiêu chuẩn vận hành.","k":"**Đóng lại đường dây trên không**: trên 35 đến 220 kV tối đa **02 lần** (kể cả TĐL); từ 35 kV trở xuống tối đa **03 lần**; ≤ 35 kV, trong 08 giờ sự cố thoáng qua lần thứ **04** thì khóa TĐL; không đóng điện đường dây trên 35 kV khi MC nhảy trong gió từ cấp **06**; đường dây cáp: không đóng lại khi bảo vệ trong phạm vi cáp tác động; hỗn hợp ≤ 35 kV: đóng lại 01 lần.","old":0},{"m":"Quá tải 75%: 20 phút.","id":"058bec05","t":7,"q":"Nếu nhà chế tạo không quy định, MBA dầu được phép quá tải ngắn hạn 45% dòng định mức trong thời gian:","o":["45 phút","20 phút","80 phút","120 phút"],"a":2,"c":"TT 06/2025, Điều 196 khoản 1","w":"Đáp án đúng là **80 phút**, khớp với quy định được trích bên dưới.","xh":"Điều 196. Xử lý quá tải máy biến áp","xb":"a) Quá tải ngắn hạn đối với các máy biến áp dầu: Quá tải so với dòng điện định mức (%) 45 75 Thời gian quá tải (phút) 80 20 b) Quá tải ngắn hạn đối với các máy biến áp khô: Quá tải so với dòng điện định mức (%) 30 50 Thời gian quá tải (phút) 45 18 c) Quá tải lâu dài đối với các loại máy biến áp đều được phép cao hơn định mức tới 5% của nấc điện áp tương ứng nếu điện áp ở nấc đó không cao hơn điện áp định mức.","k":"**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","old":0},{"m":"","id":"476ba6df","t":7,"q":"Quá tải lâu dài cho phép đối với các loại MBA (khi điện áp nấc không cao hơn định mức) là:","o":["Không cho phép","Tới 10%","Tới 05% so với định mức của nấc tương ứng","Tới 15%"],"a":2,"c":"TT 06/2025, Điều 196 khoản 1 điểm c","w":"Quá tải **lâu dài** cho phép đối với các loại MBA, khi điện áp nấc không cao hơn định mức, là **tới 05% so với định mức của nấc tương ứng** (Điều 196 khoản 1 điểm c TT 06/2025). Khác với quá tải ngắn hạn là 30% đến 100% trong thời gian từ 120 phút xuống 10 phút.","xh":"","xb":"","k":"**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","old":0},{"m":"","id":"5e0be76e","t":1,"q":"Luật Điện lực hiện hành thay thế Luật Điện lực 2004 là:","o":["Luật Điện lực số 61/2024/QH15 ngày 30/11/2024","Luật số 24/2012/QH13","Luật số 03/2022/QH15","Luật số 28/2004/QH11"],"a":0,"c":"Luật Điện lực 61/2024/QH15","w":"Luật Điện lực hiện hành là **Luật số 61/2024/QH15 ngày 30/11/2024**, thay thế Luật Điện lực 2004 (số 28/2004/QH11). Phải nhớ số hiệu và năm để không nhầm với luật cũ.","xh":"","xb":"","k":"**Luật Điện lực 61/2024/QH15** (30/11/2024, hiệu lực 01/02/2025) thay Luật Điện lực 2004. Hai thông tư \"xương sống\": **TT 05/2025/TT-BCT** (lưới truyền tải, phân phối, đo đếm) và **TT 06/2025/TT-BCT** (điều độ, vận hành, thao tác, xử lý sự cố, khởi động đen, khôi phục HTĐ), cùng hiệu lực 01/02/2025.","old":0},{"m":"NĐ 135/2024 hết hiệu lực từ 03/3/2025.","id":"ab5ee6ef","t":1,"q":"Văn bản hiện hành quy định chi tiết Luật Điện lực về phát triển điện năng lượng tái tạo, điện năng lượng mới (bao gồm ĐMTMN tự sản xuất, tự tiêu thụ) là:","o":["Nghị định 58/2025/NĐ-CP (sửa đổi bởi NĐ 243/2026/NĐ-CP)","Nghị định 80/2024/NĐ-CP","Nghị định 135/2024/NĐ-CP","Quyết định 13/2020/QĐ-TTg"],"a":0,"c":"NĐ 58/2025/NĐ-CP","w":"Văn bản hiện hành quy định chi tiết Luật Điện lực về điện năng lượng tái tạo, điện năng lượng mới, gồm ĐMTMN tự sản xuất, tự tiêu thụ, là **Nghị định 58/2025/NĐ-CP, sửa đổi bởi NĐ 243/2026/NĐ-CP**. NĐ 135/2024 đã hết hiệu lực từ 03/3/2025.","xh":"","xb":"","k":"**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","old":0,"ex":1},{"m":"","id":"c1d9d9ce","t":10,"q":"Theo NĐ 58/2025 (trước khi sửa đổi), sản lượng điện dư của ĐMTMN tự sản xuất, tự tiêu thụ được bán vào hệ thống điện quốc gia không vượt quá:","o":["30%","10%","20% sản lượng điện thực phát","50%"],"a":2,"c":"NĐ 58/2025 (bản gốc)","w":"Theo NĐ 58/2025 bản gốc, điện dư của ĐMTMN tự sản xuất, tự tiêu thụ được bán vào hệ thống **không quá 20% sản lượng thực phát**. NĐ 243/2026 sau đó nâng lên 50%, vì vậy câu hỏi nhấn mạnh \"trước khi sửa đổi\".","xh":"","xb":"","k":"**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","old":0,"ex":1},{"m":"","id":"bdd824c2","t":10,"q":"Sau sửa đổi bởi NĐ 243/2026/NĐ-CP, tỷ lệ sản lượng điện dư ĐMTMN tự sản xuất, tự tiêu thụ được bán tối đa là:","o":["30%","50% sản lượng phát","20%","100%"],"a":1,"c":"NĐ 243/2026/NĐ-CP ngày 26/6/2026","w":"Sau khi NĐ 243/2026/NĐ-CP sửa đổi, tỷ lệ điện dư ĐMTMN được bán tối đa là **50% sản lượng phát**, tăng từ mức 20% của NĐ 58/2025 bản gốc.","xh":"","xb":"","k":"**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","old":0,"ex":1},{"m":"","id":"6cce7233","t":10,"q":"Giá mua điện dư từ ĐMTMN tự sản xuất, tự tiêu thụ được xác định theo:","o":["Giá FIT 8,38 UScent/kWh","Giá thỏa thuận tự do","Giá điện năng thị trường bình quân năm trước liền kề (không vượt giá trần khung giá ĐMT mặt đất không BESS)","Giá bán lẻ bậc 6"],"a":2,"c":"NĐ 243/2026 (theo hướng dẫn của Sở Công Thương TP.HCM)","w":"Điện dư ĐMTMN tự sản xuất, tự tiêu thụ được mua theo **giá điện năng thị trường bình quân năm trước liền kề** (không vượt giá trần theo quy định). Không dùng giá FIT, giá thỏa thuận tự do hay giá bán lẻ bậc thang.","xh":"","xb":"","k":"**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","old":0,"ex":1},{"m":"","id":"8193c523","t":10,"q":"Chủ đầu tư ĐMTMN tự sản xuất, tự tiêu thụ phải gửi thông báo trước ngày bắt đầu lắp đặt ít nhất:","o":["30 ngày","15 ngày","10 ngày làm việc","05 ngày làm việc"],"a":2,"c":"NĐ 243/2026 (theo hướng dẫn của Sở Công Thương TP.HCM)","w":"Chủ đầu tư ĐMTMN tự sản xuất, tự tiêu thụ phải gửi thông báo trước ngày bắt đầu lắp đặt **ít nhất 10 ngày làm việc**. Chú ý đơn vị là ngày làm việc, không phải ngày lịch.","xh":"","xb":"","k":"**ĐMTMN tự sản xuất, tự tiêu thụ**: NĐ 58/2025 (bản gốc) cho bán dư tối đa 20%; **NĐ 243/2026** (26/6/2026) nâng lên tối đa **50%** sản lượng phát. Giá mua điện dư theo giá điện năng thị trường bình quân năm trước liền kề. Chủ đầu tư thông báo trước ngày lắp đặt ít nhất **10 ngày làm việc**.","old":0,"ex":1},{"m":"NĐ 57/2025 thay NĐ 80/2024.","id":"21b2d169","t":1,"q":"Văn bản quy định cơ chế mua bán điện trực tiếp (DPPA) giữa đơn vị phát điện NLTT và khách hàng sử dụng điện lớn hiện hành là:","o":["Nghị định 57/2025/NĐ-CP (sửa đổi bởi NĐ 243/2026/NĐ-CP)","Nghị định 80/2024/NĐ-CP","Nghị định 135/2024/NĐ-CP","Thông tư 05/2025/TT-BCT"],"a":0,"c":"NĐ 57/2025/NĐ-CP","w":"Cơ chế mua bán điện trực tiếp (DPPA) hiện hành là **Nghị định 57/2025/NĐ-CP, sửa đổi bởi NĐ 243/2026/NĐ-CP**, thay NĐ 80/2024.","xh":"","xb":"","k":"**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","old":0,"ex":1},{"m":"","id":"470f6df8","t":10,"q":"Cơ chế DPPA theo NĐ 57/2025 có các hình thức nào?","o":["Chỉ qua lưới điện quốc gia","Qua đường dây kết nối riêng và qua lưới điện quốc gia","Chỉ qua đường dây riêng","Qua EVN làm bên mua trung gian"],"a":1,"c":"NĐ 57/2025/NĐ-CP","w":"DPPA (mua bán điện trực tiếp) theo NĐ 57/2025 có 2 hình thức: **qua đường dây kết nối riêng** và **qua lưới điện quốc gia**. Không phải chỉ một trong hai, và EVN không đóng vai bên mua trung gian trong cơ chế này.","xh":"","xb":"","k":"**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","old":0,"ex":1},{"m":"","id":"cabd8f09","t":10,"q":"Đơn vị phát điện gió, mặt trời tham gia DPPA qua lưới điện quốc gia phải có công suất đặt từ:","o":["30 MW trở lên","50 MW trở lên","01 MW trở lên","10 MW trở lên"],"a":3,"c":"NĐ 57/2025/NĐ-CP","w":"Đơn vị phát điện gió, mặt trời tham gia DPPA qua lưới điện quốc gia phải có công suất đặt **từ 10 MW trở lên**. Nguồn nhỏ hơn không đủ điều kiện tham gia hình thức này.","xh":"","xb":"","k":"**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","old":0,"ex":1},{"m":"Bộ Công Thương có thể điều chỉnh ngưỡng này.","id":"1dc0ff5a","t":10,"q":"Ngưỡng tiêu thụ bình quân của khách hàng sử dụng điện lớn tham gia DPPA qua lưới điện quốc gia đang áp dụng là:","o":["100.000 kWh/tháng","200.000 kWh/tháng","1.000.000 kWh/tháng","500.000 kWh/tháng"],"a":1,"c":"TT 29/2026/TT-BCT (khách hàng sử dụng điện lớn)","w":"Ngưỡng tiêu thụ bình quân của khách hàng sử dụng điện lớn tham gia DPPA qua lưới quốc gia hiện là **200.000 kWh/tháng**. Bộ Công Thương có thể điều chỉnh ngưỡng này.","xh":"","xb":"","k":"**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","old":0},{"m":"","id":"0aef2c7a","t":10,"q":"Trong DPPA qua lưới điện quốc gia, đơn vị phát điện bán toàn bộ sản lượng:","o":["Cho Công ty Mua bán điện theo giá trần","Trực tiếp cho khách hàng qua đường dây riêng","Cho EVN theo giá FIT","Lên thị trường điện giao ngay; hai bên ký hợp đồng kỳ hạn (CfD) với khách hàng"],"a":3,"c":"NĐ 57/2025/NĐ-CP","w":"Trong DPPA qua lưới quốc gia, đơn vị phát điện **bán toàn bộ sản lượng lên thị trường điện giao ngay**, rồi hai bên (phát điện và khách hàng) ký **hợp đồng kỳ hạn chênh lệch (CfD)** để chốt giá. Điện không bán cho EVN theo giá FIT hay giá trần.","xh":"","xb":"","k":"**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","old":0,"ex":1},{"m":"","id":"eb31d051","t":1,"q":"Nghị quyết của Quốc hội về cơ chế, chính sách phát triển năng lượng quốc gia giai đoạn 2026–2030 là:","o":["Nghị quyết 253/2025/QH15 ngày 11/12/2025","Nghị quyết 61/2024/QH15","Nghị quyết 98/2023/QH15","Nghị quyết 55-NQ/TW"],"a":0,"c":"NQ 253/2025/QH15","w":"Nghị quyết của Quốc hội về cơ chế, chính sách phát triển năng lượng quốc gia giai đoạn 2026–2030 là **Nghị quyết 253/2025/QH15 ngày 11/12/2025**. Số 61/2024/QH15 là Luật Điện lực, Nghị quyết 55-NQ/TW là của Bộ Chính trị.","xh":"","xb":"","k":"NQ 253/2025/QH15 (11/12/2025): cơ chế, chính sách phát triển năng lượng quốc gia giai đoạn 2026–2030.","old":0,"ex":1},{"m":"","id":"d865d8cf","t":10,"q":"Theo yêu cầu kỹ thuật kết nối ĐMTMN với hệ thống giám sát, điều khiển của EVN, dữ liệu công suất, điện năng phát lên lưới được lưu trữ với độ phân giải và thời gian lưu tối thiểu là:","o":["15 phút – 30 ngày","05 phút – tối thiểu 07 ngày","30 phút – 01 năm","01 phút – 07 ngày"],"a":1,"c":"QĐ 1570/QĐ-EVN ngày 31/12/2024","w":"Dữ liệu công suất, điện năng phát lên lưới của ĐMTMN được lưu với độ phân giải **05 phút**, tối thiểu **07 ngày**, theo QĐ 1570/QĐ-EVN.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0,"ex":1},{"m":"","id":"ec86a676","t":10,"q":"Khi mất kết nối với hệ thống giám sát, điều khiển của Công ty Điện lực, hệ thống ĐMTMN phải:","o":["Phát tối đa công suất","Chuyển sang chế độ không giới hạn","Tự ngắt khỏi lưới","Duy trì vận hành theo giá trị cài đặt/lệnh điều khiển đã nhận trước đó và lưu dữ liệu tại chỗ"],"a":3,"c":"QĐ 1570/QĐ-EVN","w":"Khi mất kết nối với hệ thống giám sát, điều khiển, ĐMTMN phải **duy trì vận hành theo giá trị cài đặt hoặc lệnh điều khiển đã nhận trước đó**. Không tự ý phát tối đa, bỏ giới hạn hay tự ngắt khỏi lưới.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0,"ex":1},{"m":"","id":"017f78c2","t":10,"q":"Các giao thức kết nối ĐMTMN với hệ thống GSĐK của Công ty Điện lực gồm:","o":["DNP3 và IEC 61850 MMS","Modbus RTU và OPC UA","Modbus TCP (port 502) và IEC 60870-5-104 (port 2404)","IEC 60870-5-101 và DNP3"],"a":2,"c":"QĐ 1570/QĐ-EVN","w":"Giao thức kết nối ĐMTMN với hệ thống GSĐK của Công ty Điện lực là **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**. Đây cũng là hai cổng mặc định của hai giao thức này.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0,"ex":1},{"m":"","id":"335ea60f","t":10,"q":"Ở cấp điều độ phân phối, thông tin vận hành ĐMTMN đấu nối lưới phân phối được tổng hợp và báo cáo cho:","o":["Công ty Mua bán điện","UBND cấp xã","Bộ Công Thương hàng ngày","Cấp điều độ miền theo các khung thời gian lập phương thức ngắn hạn"],"a":3,"c":"TT 06/2025, Điều 124 khoản 4","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Cấp điều độ miền theo các khung thời gian lập phương thức ngắn hạn**. Xem trích nguyên văn bên dưới.","xh":"Điều 124. Nhiệm vụ của bộ phận phương thức ngắn hạn","xb":"4. Phê duyệt, tổng hợp và báo cáo cấp điều độ miền thông tin vận hành các nguồn điện đấu nối lưới điện phân phối thuộc phạm vi quản lý bao gồm điện mặt trời mái nhà theo các khung thời gian lập phương thức vận hành ngắn hạn;","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0},{"m":"","id":"1ecd3f0d","t":8,"q":"Công suất cực đại HTĐ quốc gia năm 2025 đạt khoảng:","o":["60.120 MW","49.533 MW","45.434 MW","54.941 MW (tháng 8/2025)"],"a":3,"c":"Báo cáo tổng kết NSMO 2025","w":"Theo Báo cáo tổng kết của NSMO, công suất cực đại HTĐ quốc gia năm 2025 đạt khoảng **54.941 MW vào tháng 8/2025**. Các số còn lại là số nhiễu.","xh":"","xb":"","k":"**DPPA** (NĐ 57/2025, sửa bởi NĐ 243/2026): hai hình thức – qua **đường dây kết nối riêng** và qua **lưới điện quốc gia**. Qua lưới quốc gia: đơn vị phát điện gió, mặt trời công suất từ **10 MW**; khách hàng lớn từ **200.000 kWh/tháng**; đơn vị phát điện bán toàn bộ lên thị trường giao ngay, hai bên ký hợp đồng kỳ hạn (CfD).","old":0},{"m":"","id":"b3095c04","t":8,"q":"Công suất cực đại HTĐ miền Nam năm 2025 đạt khoảng:","o":["19.458 MW","22.139 MW (tháng 8/2025)","25.540 MW","28.094 MW"],"a":1,"c":"Báo cáo tổng kết NSMO 2025, Bảng 3","w":"Công suất cực đại HTĐ miền Nam năm 2025 đạt khoảng **22.139 MW (tháng 8/2025)** theo Bảng 3 Báo cáo tổng kết NSMO 2025. Số liệu miền Nam nhỏ hơn nhiều so với toàn quốc (54.941 MW).","xh":"","xb":"","k":"**Hệ số công suất**: Đơn vị phân phối điện, khách hàng nhận điện trực tiếp từ lưới truyền tải: cosφ ≥ **0,9** (nhận Q), ≥ **0,98** (phát Q) tại vị trí đo đếm chính. Khách hàng sản xuất, kinh doanh, dịch vụ có công suất cực đại **từ 40 kW**: cosφ ≥ 0,9 tại điểm đặt thiết bị đo đếm.","old":0},{"m":"","id":"eae00fef","t":11,"q":"Trạm 110 kV được điều khiển, thao tác xa từ Trung tâm điều khiển phải trang bị Gateway/RTU thiết lập:","o":["Hai kết nối với hệ thống điều khiển tại Trung tâm điều khiển","Một kết nối trực tiếp về điều độ miền","Không bắt buộc","Ba kết nối độc lập"],"a":0,"c":"TT 05/2025, Điều 30 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Hai kết nối với hệ thống điều khiển tại Trung tâm điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 30. Yêu cầu về kết nối hệ thống SCADA","xb":"2. Trạm điện có cấp điện áp từ 110 kV trở lên, nhà máy điện có công suất lắp đặt từ 10MW trở lên (không phân biệt cấp điện áp đấu nối) và nhà máy điện đấu nối vào lưới điện đã kết nối đến Trung tâm điều khiển phải được trang bị Gateway hoặc RTU được thiết lập một kết nối với hệ thống SCADA của Cấp điều độ có quyền điều khiển và hai kết nối với hệ thống điều khiển tại Trung tâm điều khiển. …","k":"**Yêu cầu kỹ thuật** (TT 05, Điều 30, 34): trạm từ 110 kV trở lên, nhà máy từ 10 MW trang bị Gateway/RTU; trạm 110 kV điều khiển từ Trung tâm điều khiển có **hai** kết nối; Trung tâm điều khiển phải có **hai** đường truyền (một làm việc, một dự phòng nóng); tổng công suất NLTT của một Trung tâm điều khiển không vượt công suất tổ máy lớn nhất trong HTĐ quốc gia.","old":0},{"m":"","id":"40e649d4","t":11,"q":"Trung tâm điều khiển kết nối SCADA với cấp điều độ có quyền điều khiển như thế nào khi có nhiều cấp điều độ?","o":["Kết nối trực tiếp về cấp điều độ có quyền điều khiển cao nhất; các cấp điều độ chia sẻ thông tin","Chỉ kết nối cấp thấp nhất","Kết nối song song tất cả các cấp","Không yêu cầu kết nối"],"a":0,"c":"TT 05/2025, Điều 34 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Kết nối trực tiếp về cấp điều độ có quyền điều khiển cao nhất; các cấp điều độ chia sẻ thông tin**. Xem trích nguyên văn bên dưới.","xh":"Điều 34. Yêu cầu đối với Trung tâm điều khiển","xb":"b) Yêu cầu về kết nối hệ thống SCADA - Có một kết nối với hệ thống SCADA của Cấp điều độ có quyền điều khiển. Trường hợp có nhiều cấp điều độ có quyền điều khiển, Trung tâm điều khiển sẽ kết nối trực tiếp về cấp điều độ có quyền điều khiển cao nhất, các cấp điều độ có trách nhiệm chia sẻ thông tin; - Có hai kết nối với thiết bị đầu cuối RTU hoặc Gateway, hệ thống điều khiển của nhà máy điện, trạm điện và thiết bị đóng cắt trên lưới điện do Trung tâm điều khiển thực hiện điều khiển từ xa.","k":"","old":0},{"m":"","id":"774521f3","t":11,"q":"Tổng công suất định mức các nhà máy NLTT thuộc một Trung tâm điều khiển không được vượt quá:","o":["30 MW","500 MW","Công suất trạm 220 kV lớn nhất","Công suất định mức tổ máy lớn nhất đang đấu nối trong HTĐ quốc gia"],"a":3,"c":"TT 05/2025, Điều 34 khoản 1 điểm d","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Công suất định mức tổ máy lớn nhất đang đấu nối trong HTĐ quốc gia**. Xem trích nguyên văn bên dưới.","xh":"Điều 34. Yêu cầu đối với Trung tâm điều khiển","xb":"d) Tổng công suất định mức của các nhà máy điện năng lượng tái tạo (gió, mặt trời) thuộc Trung tâm điều khiển không vượt quá công suất định mức của tổ máy phát điện lớn nhất đang đấu nối trong hệ thống điện Quốc gia do Đơn vị điều độ hệ thống điện quốc gia xác định.","k":"**Yêu cầu kỹ thuật** (TT 05, Điều 30, 34): trạm từ 110 kV trở lên, nhà máy từ 10 MW trang bị Gateway/RTU; trạm 110 kV điều khiển từ Trung tâm điều khiển có **hai** kết nối; Trung tâm điều khiển phải có **hai** đường truyền (một làm việc, một dự phòng nóng); tổng công suất NLTT của một Trung tâm điều khiển không vượt công suất tổ máy lớn nhất trong HTĐ quốc gia.","old":0},{"m":"","id":"6a8beaf4","t":11,"q":"Giao thức IEC 60870-5-104 truyền dữ liệu trên nền:","o":["CAN bus","Modbus RTU","RS-485 nối tiếp","TCP/IP"],"a":3,"c":"Kiến thức SCADA","w":"**IEC 60870-5-104** truyền dữ liệu trên **TCP/IP** (cổng 2404). Bản IEC 60870-5-101 mới chạy trên đường nối tiếp. CAN bus, Modbus RTU, RS-485 là kiểu truyền nối tiếp, không phải nền của giao thức 104.","xh":"","xb":"","k":"ĐMTMN kết nối hệ thống giám sát, điều khiển: giao thức **Modbus TCP (cổng 502)** và **IEC 60870-5-104 (cổng 2404)**; dữ liệu chu kỳ **05 phút**, lưu tối thiểu **07 ngày**; mất kết nối thì duy trì theo giá trị cài đặt trước đó. Thông tin vận hành ĐMTMN phân phối do cấp phân phối tỉnh tổng hợp, báo cáo cấp miền theo các khung thời gian lập phương thức ngắn hạn.","old":0},{"m":"","id":"87cbd1b0","t":11,"q":"Bước nào thường thực hiện trước khi đóng điện đưa RTU/Gateway mới vào vận hành chính thức?","o":["Tháo khóa Local/Remote","Thử nghiệm đối điểm (point-to-point) tín hiệu và thử thao tác xa không tải","Xóa cơ sở dữ liệu cũ","Đưa tuyến dây vào chế độ Auto ngay"],"a":1,"c":"Kiến thức SCADA – các bước đưa RTU/GW mới vào vận hành","w":"Trước khi đóng điện đưa RTU/Gateway mới vào vận hành chính thức phải **thử nghiệm đối điểm (point-to-point) tín hiệu** giữa thiết bị và trung tâm, rồi **thử thao tác xa không mang tải**. Không đưa tuyến dây vào Auto ngay, không xóa cơ sở dữ liệu cũ hay tháo khóa Local/Remote.","xh":"","xb":"","k":"**QĐ 980/QĐ-NSMO**: sẵn sàng kênh ≥ 98% (không thao tác xa), ≥ **99,9%** (có thao tác xa); tín hiệu số ≤ **10 ms**; đo lường ≤ 2 s. Thử nghiệm: point-to-point (từ thiết bị nhất thứ đến RTU/Gateway), rồi end-to-end (từ cấp điều độ). IEC 60870-5-104 truyền trên **TCP/IP**.","old":0},{"m":"","id":"fd3093f2","t":9,"q":"Thời gian lưu trữ lệnh điều độ bằng tín hiệu điều khiển (SCADA) ít nhất là:","o":["01 năm","05 năm","03 tháng","06 tháng"],"a":0,"c":"TT 06/2025, Điều 74 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **01 năm**. Xem trích nguyên văn bên dưới.","xh":"Điều 74. Yêu cầu khi thực hiện lệnh điều độ","xb":"b) Thời gian lưu trữ lệnh điều độ bằng tín hiệu điều khiển ít nhất là 01 năm.","k":"**Lệnh điều độ** bằng lời nói, tín hiệu điều khiển (SCADA) hoặc chữ viết; lời nói phải ghi âm lưu **≥ 01 năm**; lệnh điện tử (DIM) lưu **≥ 05 năm**; lệnh bằng tín hiệu điều khiển lưu ≥ 01 năm; người nhận lệnh phải nhắc lại. Kênh ưu tiên cao nhất: trực thông hoặc vô tuyến.","old":0},{"m":"","id":"c77acb34","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, dao động điện áp là sự biến đổi biên độ điện áp so với điện áp danh định trong thời gian bao lâu?","o":["Dài hơn 1 phút","Dài hơn 2 phút","Dài hơn 5 phút","Dài hơn 10 phút"],"a":0,"c":"TT 05/2025, Điều 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Dài hơn 1 phút**. Xem trích nguyên văn bên dưới.","xh":"Điều 3. Giải thích từ ngữ","xb":"10. Dao động điện áp là sự biến đổi biên độ điện áp so với điện áp danh định trong thời gian dài hơn 01 phút.","k":"**Dao động điện áp**: biến đổi biên độ điện áp trong thời gian dài hơn 01 phút. **Tổn thất điện năng** lưới phân phối có 2 loại: kỹ thuật (do bản chất vật lý của dây dẫn, thiết bị) và phi kỹ thuật (do quản lý kinh doanh) – TT 05, Điều 17.","old":1},{"m":"","id":"343f1522","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, cấp điện áp Trung áp là thuộc cấp điện áp danh định nào dưới đây?","o":["Từ 01 kV đến 35 kV","Trên 01 kV đến 35 kV","Từ 01 kV đến dưới 35 kV","Trên 01 kV dưới 35 kV"],"a":1,"c":"TT 05/2025, Điều 3 khoản 4","w":"Phân cấp điện áp danh định: hạ áp đến 01 kV; **trung áp trên 01 kV đến 35 kV**; cao áp trên 35 kV đến 220 kV; siêu cao áp trên 220 kV. Cận dưới là *trên* 01 kV và cận trên là *đến* 35 kV (đã bao gồm 35 kV).","xh":"","xb":"","k":"Phân loại cấp điện áp (TT 05, Điều 3): **hạ áp** đến 01 kV; **trung áp** trên 01 kV đến 35 kV; **cao áp** trên 35 kV đến 220 kV; **siêu cao áp** trên 220 kV. **Lưới điện phân phối** có cấp điện áp đến 110 kV; **lưới điện truyền tải** trên 110 kV.","old":1},{"m":"","id":"c2672ca5","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, khách hàng sử dụng lưới điện phân phối là tổ chức, cá nhân có trang thiết bị điện, lưới điện đấu nối vào lưới điện phân phối để sử dụng dịch vụ phân phối điện, bao gồm:","o":["Đơn vị phát điện","Đơn vị phân phối và bán lẻ điện","Khách hàng sử dụng điện.","Cả 3 đáp án trên."],"a":3,"c":"TT 05/2025, Điều 3","w":"Khách hàng sử dụng lưới điện phân phối gồm cả **đơn vị phát điện, đơn vị phân phối và bán lẻ điện, và khách hàng sử dụng điện**, vì cả ba đều có thiết bị đấu nối vào lưới phân phối để dùng dịch vụ phân phối. Vì vậy chọn đáp án \"Cả 3\".","xh":"","xb":"","k":"Các thông tư cũ **TT 39/2015, TT 40/2014, TT 44/2014, TT 28/2014** đã hết hiệu lực. Khi đề thi nhắc số hiệu cũ mà nội dung vẫn hỏi, chọn đáp án khớp TT 05, TT 06/2025.","old":1},{"m":"","id":"45a15b70","t":1,"q":"Theo Điều 3 TT 05/2025/TT-BCT, lưới điện phân phối là phần lưới điện bao gồm các đường dây và trạm điện có cấp điện áp:","o":["Dưới 110kV","Từ 110kV","Dưới 35kV","Đến 110kV"],"a":3,"c":"TT 05/2025, Điều 3 (lưới phân phối đến 110 kV)","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Đến 110kV**. Xem trích nguyên văn bên dưới.","xh":"Điều 3. Giải thích từ ngữ","xb":"35. Lưới điện phân phối là phần lưới điện bao gồm toàn bộ các đường dây và trạm điện có cấp điện áp đến 110 kV.","k":"**Cấp phân phối tỉnh có quyền điều khiển** (Điều 12): tần số HTĐ phân phối khi vận hành độc lập; điện áp lưới trung áp; đường dây 110 kV được cấp miền ủy quyền và MBA 110 kV (gồm thiết bị đóng cắt phía 110 kV, trừ MBA tại nhà máy điện thuộc cấp cao hơn); công suất phát của nhà máy điện ≤30 MW, diesel hòa lưới, nguồn đấu nối trung hạ áp; **phụ tải** hệ thống phân phối.","old":1},{"m":"","id":"fdf96351","t":3,"q":"Theo Điều 7 TT 05/2025/TT-BCT, trong chế độ làm việc bình thường, thành phần thứ tự nghịch của điện áp pha không vượt quá bao nhiêu % điện áp danh định đối với cấp điện áp 110 kV?","o":["3%","5%","1,5%","8%"],"a":0,"c":"TT 05/2025, Điều 7","w":"Thành phần thứ tự nghịch của điện áp pha trong chế độ bình thường không vượt quá **03%** điện áp danh định đối với cao áp và siêu cao áp (110 kV là cao áp). Trung áp và hạ áp được phép tới 05%. Quy định nay ở Điều 7 TT 05/2025 (Cân bằng pha).","xh":"","xb":"","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":1},{"m":"","id":"37be7a49","t":3,"q":"Theo Điều 7 TT 05/2025/TT-BCT, trong chế độ làm việc bình thường, thành phần thứ tự nghịch của điện áp pha không vượt quá bao nhiêu % điện áp danh định đối với cấp điện áp trung áp và hạ áp?","o":["3%","5%","1,5%","8%"],"a":1,"c":"TT 05/2025, Điều 7","w":"Đối với **trung áp và hạ áp**, thành phần thứ tự nghịch của điện áp pha không vượt quá **05%**. Cao áp và siêu cao áp chặt hơn (03%) vì lưới truyền tải cần chất lượng điện áp tốt hơn. Điều 7 TT 05/2025.","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id":"4cdf3327","t":3,"q":"Theo Điều 8 TT 05/2025/TT-BCT, tổng độ biến dạng sóng hài điện áp(THD) tối đa cho phép đối với cấp điện áp 110kV là:","o":["3%","5%","1,5%","8%"],"a":0,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"THD điện áp tối đa tại cấp **110 kV là 3%**. Dãy giá trị theo cấp điện áp là 110 kV: **3%**, trung áp: **5%**, hạ áp: **8%**. Điện áp càng thấp, mức biến dạng cho phép càng rộng (Bảng 4a, Điều 8 TT 05/2025).","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":1},{"m":"","id"
