<style>
/* Ôn thi KSPT, bản 2. Tông xanh chàm EVNHCMC (cùng bảng màu với chatbot tra cứu), nền trắng, thẻ bo tròn, bóng nhẹ.
   Không dùng viền đỏ. Xanh lá chỉ cho "đúng", đỏ chỉ cho "sai". Vàng điện chỉ làm điểm nhấn nhỏ. */
:root{
  --bg:#F3F5FB; --panel:#FFFFFF; --panel2:#F7F8FD; --ink:#141B3D; --ink2:#5B6585; --line:#E4E8F2; --line2:#D2D9EA;
  --brand:#2B388B; --brand-d:#1C2566; --brand-2:#4A5BD0; --brand-soft:#ECEEFB; --brand-soft2:#DFE3F8; --on-brand:#FFFFFF; --link:#2B388B;
  --gold:#F2A900; --gold-soft:#FFF4D6;
  --good:#0F7A55; --good-bg:#E3F6EE; --good-line:#9ED8BF; --bad:#C0262D; --bad-bg:#FDECEC; --bad-line:#F0A9AD; --warn:#7A4B00; --warn-bg:#FFF4D6;
  --focus:#4A5BD0; --hdr-bg:#FFFFFF;
  --shadow:0 1px 2px rgba(28,37,102,.05),0 8px 24px rgba(28,37,102,.07);
  --shadow-lg:0 2px 4px rgba(28,37,102,.06),0 16px 40px rgba(28,37,102,.12);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:68px; --r:16px;
}

:root[data-theme="dark"]{
  --bg:#0D1220; --panel:#151C30; --panel2:#1A2238; --ink:#E9EEF8; --ink2:#9AA9C4; --line:#27304F; --line2:#36416A;
  --brand:#4A5BD0; --brand-d:#94A0FF; --brand-2:#7F8DFA; --brand-soft:#1D2552; --brand-soft2:#262F66; --link:#A9B3FF;
  --gold-soft:#3A2D10; --good:#5FD3A0; --good-bg:#0F2F24; --good-line:#1E6B50; --bad:#FF9096; --bad-bg:#3D1F22; --bad-line:#7A3036;
  --warn:#F3CD7A; --warn-bg:#3A2D10; --focus:#9AA6FF; --hdr-bg:#101730;
  --shadow:none; --shadow-lg:none; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav-h) + 12px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--font);margin:0;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono)}
strong{font-weight:600}
.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr-bg);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(28,37,102,.03),0 6px 18px rgba(28,37,102,.05)}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:var(--nav-h);padding-block:8px}
.brand{display:flex;align-items:center;gap:14px;white-space:nowrap;color:var(--ink);text-decoration:none;min-width:0}
.logo-chip{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:4px 10px}
.logo-chip img{display:block;height:34px;width:auto}
.logo-chip .mk{display:none;height:34px}
.brand .sep{width:1px;height:30px;background:var(--line2);flex:none}
.brand b{display:block;font-weight:800;font-size:1.08rem;letter-spacing:-.01em;line-height:1.15;color:var(--brand-d)}
.brand small{display:block;font:500 .72rem/1.2 var(--font);color:var(--ink2);margin-top:3px}
.sp{flex:1}
.nav{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:.92rem;white-space:nowrap;min-height:44px}
.nav a .ic{width:18px;height:18px}
.nav a:hover{color:var(--brand-d);background:var(--brand-soft)}
.nav a[aria-current="page"]{color:var(--on-brand);background:var(--brand);box-shadow:0 4px 12px rgba(43,56,139,.28)}
.themebtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--brand-d);display:grid;place-items:center;padding:0}
.themebtn:hover{background:var(--brand-soft)}
.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .sun{display:block}
:root[data-theme="dark"] .themebtn .moon{display:none}


/* ---------- type & layout ---------- */
main{max-width:1120px;margin:0 auto;padding-block:32px 80px}
h1,h2,h3{text-wrap:balance;letter-spacing:-.018em;line-height:1.25;margin:0;color:var(--ink)}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.28rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.lead{color:var(--ink2);max-width:64ch;font-size:1.04rem}
.stack{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.label{font:600 .72rem/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{color:var(--ink2);font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line2);color:var(--brand-d);border-radius:12px;padding:10px 18px;font-weight:600;line-height:1.3;min-height:44px}
.btn:hover:not([disabled]){background:var(--brand-soft);border-color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:0 4px 12px rgba(43,56,139,.25)}
.btn.pri:hover:not([disabled]){background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 14px;min-height:44px;font-size:.88rem}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover:not([disabled]){background:var(--bad-bg);border-color:var(--bad)}
.chip{font:600 .72rem/1 var(--font);padding:7px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--brand-soft);color:var(--link);border-color:transparent}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:36px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;
  background:radial-gradient(900px 380px at 100% 0%,rgba(122,141,255,.38),transparent 60%),linear-gradient(135deg,#2B388B 0%,#1C2566 100%);box-shadow:var(--shadow-lg)}
.hero .star{position:absolute;right:-70px;top:50%;transform:translateY(-50%);width:400px;height:400px;opacity:.07;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .label{color:#fff;background:rgba(255,255,255,.16);display:inline-block;padding:7px 12px;border-radius:999px;letter-spacing:.04em}
.hero h1{color:#fff;font-size:2.15rem;margin-top:14px;max-width:18ch}
.hero .lead{color:#D9DEFB;margin-top:14px;max-width:52ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn.gold{background:#FFD23F;border-color:#FFD23F;color:#1C2566;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn.gold:hover:not([disabled]){background:#FFE07A;border-color:#FFE07A}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff}
.btn.ghost:hover:not([disabled]){background:rgba(255,255,255,.22);border-color:#fff}
.cdbox{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:20px 26px;text-align:center;min-width:190px;backdrop-filter:blur(4px)}
.cdbox .label{background:none;padding:0;color:#D9DEFB}
.cdbox b{display:block;font:800 3.4rem/1 var(--mono);color:#FFD23F;font-variant-numeric:tabular-nums;margin:10px 0 6px}
.cdbox span.s{font-size:.86rem;color:#D9DEFB}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.sico{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.sico .ic{width:22px;height:22px}
.sico.g{background:var(--good-bg);color:var(--good)}
.sico.r{background:var(--bad-bg);color:var(--bad)}
.sico.y{background:var(--gold-soft);color:#9A6A00}
.stat .label{display:block}
.stat b{display:block;font:700 1.7rem/1.15 var(--font);font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
.stat b small{font-size:.9rem;color:var(--ink2);font-weight:500}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}.bar .r{background:var(--bad)}.bar .a{background:var(--brand-2)}
.acts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.act{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-height:76px;width:100%}
.act:hover:not([disabled]){border-color:var(--brand-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.act[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.act .ico{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.act .ico .ic{width:22px;height:22px}
.act.soft .ico{background:var(--brand-soft);color:var(--brand)}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;color:var(--ink);line-height:1.3}
.act .tx small{display:block;color:var(--ink2);font-size:.84rem;line-height:1.4;margin-top:2px}
.act .go{color:var(--ink2);flex:none}
.tcard{display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .18s ease-out,box-shadow .18s ease-out,border-color .18s ease-out}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.tcard .top-row{display:flex;gap:14px;align-items:flex-start}
.tcard h3{font-size:.98rem;line-height:1.45;padding-top:3px}
.tcard .num{font:700 .95rem/1 var(--font);color:var(--brand);background:var(--brand-soft);border-radius:12px;min-width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.tcard .meta{display:flex;justify-content:space-between;gap:8px;font:500 .78rem/1.3 var(--font);color:var(--ink2);font-variant-numeric:tabular-nums}
.sched{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.sched>div{min-width:0;display:flex;gap:14px}
.sched .sico{margin-top:2px}
.sched b{display:block;font-weight:700;margin-top:4px;color:var(--brand-d)}

/* ---------- question card ---------- */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:22px;min-width:0;box-shadow:var(--shadow-lg)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qmeta .sp{flex:none;margin-left:auto}
.qtext{font-size:1.22rem;font-weight:600;line-height:1.55;letter-spacing:-.008em;overflow-wrap:anywhere}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.opt{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;min-height:56px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.opt:hover:not([disabled]){border-color:var(--brand-2);background:var(--brand-soft)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font:700 .88rem/32px var(--font);text-align:center}
.opt .t{flex:1;min-width:0;padding-top:4px}
.opt .tag{flex:none;display:inline-flex;align-items:center;gap:5px;font:700 .72rem/1 var(--font);align-self:center;padding:7px 10px;border-radius:999px}
.opt .tag .ic{width:14px;height:14px;stroke-width:3}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:var(--on-brand)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.ok .tag{background:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.bad .tag{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.6}
.verdict{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;font-weight:600}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict .flag{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--font);padding:8px 12px;border-radius:999px;background:currentColor;flex:none}
.verdict .flag span{color:var(--panel);display:inline-flex;align-items:center;gap:6px}
.verdict .flag .ic{width:14px;height:14px;stroke-width:3}
.expl{display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--line);padding-top:22px}
.expl .blk{display:flex;flex-direction:column;gap:6px}
.expl .blk p{max-width:68ch;overflow-wrap:anywhere}
.quote{border-left:4px solid var(--brand-2);background:var(--brand-soft);border-radius:0 12px 12px 0;padding:12px 16px;color:var(--ink2);font-size:.93rem;overflow-wrap:anywhere}
.quote .h{font:700 .8rem/1.4 var(--font);color:var(--ink);display:block;margin-bottom:2px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.9rem}
details.more summary{cursor:pointer;color:var(--link);font-weight:600;font-size:.93rem;min-height:32px}
details.more p{margin-top:8px;color:var(--ink2);font-size:.93rem}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.runhead{display:flex;flex-direction:column;gap:12px}
.runhead .row{justify-content:space-between}
.runhead h2{font-size:1.08rem}
.timer{display:inline-flex;align-items:center;gap:8px;font:700 1.15rem/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--brand-d);background:var(--brand-soft);border-radius:999px;padding:9px 15px}
.timer.low{color:var(--bad);background:var(--bad-bg)}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav-h) + 1px);z-index:10;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.qgrid button{height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);font:600 .84rem/1 var(--font);font-variant-numeric:tabular-nums;position:relative}
.qgrid button:hover{border-color:var(--brand-2)}
.qgrid button.done{background:var(--brand-soft);border-color:var(--brand-soft2);color:var(--link)}
.qgrid button.cur{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.qgrid button.fl::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.qgrid button.ok{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.qgrid button.no{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.score{font:800 3.6rem/1 var(--font);font-variant-numeric:tabular-nums;color:var(--brand-d)}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- search, lists, tables ---------- */
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input,.search select{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line2);border-radius:12px;padding:10px 16px;min-height:50px;min-width:0}
.search input:focus,.search select:focus{border-color:var(--brand-2)}
.search input{flex:1 1 240px}
.search select{flex:1 1 220px}
.bitem{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bitem[open]{border-color:var(--line2)}
.bitem>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:48px;border-radius:14px}
.bitem>summary::-webkit-details-marker{display:none}
.bitem>summary:hover{background:var(--panel2)}
.bitem[open]>summary{border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.bitem .qs{font-weight:600;overflow-wrap:anywhere}
.bitem .ans{color:var(--good);font-size:.93rem;font-weight:600;overflow-wrap:anywhere}
.bitem .body{padding:18px;display:flex;flex-direction:column;gap:16px}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap;width:max-content;max-width:100%}
.seg button{border:0;background:none;padding:9px 18px;min-height:44px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:.92rem}
.seg button:hover{background:var(--brand-soft);color:var(--brand-d)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .74rem/1.2 var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--brand-d);background:var(--brand-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
ul.core{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:9px}
ul.core li{max-width:70ch;overflow-wrap:anywhere}
ul.core li::marker{color:var(--brand-2)}

.toggle{display:flex;gap:10px;align-items:center;font-size:.92rem;color:var(--ink2);cursor:pointer;min-height:44px}

.foot{color:var(--ink2);font-size:.86rem;max-width:72ch}

a","Quy trình an toàn điện"],"a":2,"c":"TT 06/2025/TT-BCT","w":"TT 06/2025/TT-BCT quy định về **điều độ, vận hành, thao tác, xử lý sự cố, khởi động đen và khôi phục hệ thống điện quốc gia**, gộp nội dung của ba quy trình cũ về điều độ, thao tác và xử lý sự cố.","xh":"","xb":"","k":"**Luật Điện lực 61/2024/QH15** (30/11/2024, hiệu lực 01/02/2025) thay Luật Điện lực 2004. Hai thông tư \"xương sống\": **TT 05/2025/TT-BCT** (lưới truyền tải, phân phối, đo đếm) và **TT 06/2025/TT-BCT** (điều độ, vận hành, thao tác, xử lý sự cố, khởi động đen, khôi phục HTĐ), cùng hiệu lực 01/02/2025.","old":0},{"m":"Từ ngày này TT 40/2014 (quy trình điều độ) và TT 44/2014 (quy trình thao tác) hết hiệu lực.","id":"62476e1d","t":1,"q":"Thông tư 06/2025/TT-BCT có hiệu lực từ ngày:","o":["01/02/2025","01/01/2025","06/8/2025","20/7/2026"],"a":0,"c":"TT 06/2025, Điều 249 khoản 1","w":"Đáp án đúng là **01/02/2025**, khớp với quy định được trích bên dưới.","xh":"Điều 249. Hiệu lực thi hành","xb":"1. Thông tư này có hiệu lực kể từ ngày 01 tháng 02 năm 2025, các Thông tư hết hiệu lực thi hành kể từ ngày Thông tư này có hiệu lực gồm:","k":"**Luật Điện lực 61/2024/QH15** (30/11/2024, hiệu lực 01/02/2025) thay Luật Điện lực 2004. Hai thông tư \"xương sống\": **TT 05/2025/TT-BCT** (lưới truyền tải, phân phối, đo đếm) và **TT 06/2025/TT-BCT** (điều độ, vận hành, thao tác, xử lý sự cố, khởi động đen, khôi phục HTĐ), cùng hiệu lực 01/02/2025.","old":0},{"m":"TT 46 chỉ sửa đổi, bổ sung; TT 05 và TT 06 vẫn là văn bản gốc.","id":"5f2c9637","t":1,"q":"Thông tư 46/2025/TT-BCT (ký 06/8/2025, hiệu lực 22/9/2025) có nội dung:","o":["Quy định vận hành thị trường bán buôn điện cạnh tranh","Thay thế hoàn toàn Thông tư 05/2025/TT-BCT","Sửa đổi, bổ sung Thông tư 04, 05, 06/2025/TT-BCT","Quy định mua bán điện trực tiếp"],"a":2,"c":"TT 46/2025/TT-BCT","w":"TT 46/2025/TT-BCT (ký 06/8/2025, hiệu lực 22/9/2025) **sửa đổi, bổ sung TT 04, 05, 06/2025/TT-BCT**. Thông tư này chỉ chỉnh sửa, không thay thế các thông tư gốc.","xh":"","xb":"","k":"**TT 46/2025/TT-BCT** (ký 06/8/2025, hiệu lực 22/9/2025) sửa đổi, bổ sung TT 04, 05, 06/2025. **TT 29/2026/TT-BCT** (hiệu lực 20/7/2026) quy định vận hành thị trường bán buôn điện cạnh tranh.","old":0},{"m":"Cấp quốc gia và cấp miền đều do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm.","id":"9a2573dd","t":2,"q":"Cấp điều độ miền do đơn vị nào đảm nhiệm?","o":["Tổng công ty Truyền tải điện quốc gia","Tập đoàn Điện lực Việt Nam","Đơn vị điều độ hệ thống điện quốc gia","Tổng công ty Điện lực"],"a":2,"c":"TT 06/2025, Điều 4 khoản 2","w":"Đáp án đúng là **Đơn vị điều độ hệ thống điện quốc gia**, khớp với quy định được trích bên dưới.","xh":"Điều 4. Tổ chức điều độ hệ thống điện quốc gia","xb":"2. Cấp điều độ miền là cấp chỉ huy, điều độ hệ thống điện miền, chịu sự chỉ huy trực tiếp của Cấp điều độ quốc gia. Cấp điều độ miền do Đơn vị điều độ hệ thống điện quốc gia đảm nhiệm.","k":"Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","old":0},{"m":"","id":"59eae9d7","t":2,"q":"Cấp điều độ phân phối tỉnh ở TP. Hồ Chí Minh do đơn vị nào đảm nhiệm?","o":["Công ty Điện lực khu vực","Tổng công ty Truyền tải điện quốc gia","Trung tâm Điều độ HTĐ miền Nam","Đơn vị điều độ trực thuộc Tổng công ty Điện lực TP. Hồ Chí Minh"],"a":3,"c":"TT 06/2025, Điều 4 khoản 3 điểm a","w":"Tại TP. Hồ Chí Minh, Cấp điều độ phân phối tỉnh do **đơn vị điều độ trực thuộc Tổng công ty Điện lực TP. Hồ Chí Minh** đảm nhiệm, tức Trung tâm Điều độ HTĐ TP.HCM. Cấp này chịu chỉ huy trực tiếp của Cấp điều độ miền.","xh":"","xb":"","k":"Điều độ HTĐ quốc gia có **03 cấp chính**: quốc gia (A0), miền (A1, A2, A3), phân phối (cấp điều độ phân phối tỉnh). Cấp quốc gia và cấp miền do Đơn vị điều độ HTĐ quốc gia (NSMO) đảm nhiệm; cấp phân phối tỉnh do đơn vị điều độ thuộc Tổng công ty Điện lực/Công ty Điện lực tỉnh đảm nhiệm, chịu sự chỉ huy trực tiếp của cấp điều độ miền. Từ TT 46/2025 (hiệu lực 22/9/2025) không còn nêu Cấp điều độ phân phối quận, huyện.","old":0},{"m":"Đây là ngoại lệ so với điều kiện thông thường (phải được cấp có quyền kiểm tra đồng ý trước).","id":"ed11a9c3","t":2,"q":"Trong xử lý sự cố hoặc đe dọa sự cố, cấp điều độ có quyền điều khiển được:","o":["Chỉ ra lệnh sau khi lập phiếu thao tác","Chờ cấp trên chỉ đạo, không được tự ra lệnh","Ra lệnh điều độ trước, sau đó báo cáo ngay cho cấp có quyền kiểm tra và thông báo cho đơn vị có quyền nắm thông tin","Chỉ ra lệnh sau khi được cấp có quyền kiểm tra đồng ý"],"a":2,"c":"TT 06/2025, Điều 9 khoản 1","w":"Đáp án đúng là **Ra lệnh điều độ trước, sau đó báo cáo ngay cho cấp có quyền kiểm tra và thông báo cho đơn vị có quyền nắm thông tin**, khớp với quy định được trích bên dưới.","xh":"Điều 9. Quyền điều khiển, kiểm tra và nắm thông tin trong các trường","xb":"hợp sự cố hoặc đe dọa sự cố 1. Trường hợp xử lý sự cố hoặc đe dọa sự cố, cấp điều độ có quyền điều khiển được phép ra lệnh điều độ trước. Sau khi thực hiện lệnh điều độ, cấp điều độ có quyền điều khiển có trách nhiệm báo cáo ngay cho cấp điều độ có quyền kiểm tra và thông báo cho đơn vị có quyền nắm thông tin.","k":"**Sự cố hoặc đe dọa sự cố** (Điều 9): cấp có quyền điều khiển được ra lệnh trước rồi báo cáo ngay cho cấp có quyền kiểm tra; khẩn cấp (cháy, đe dọa tính mạng) nhân viên vận hành được thao tác trước, báo cáo sau.","old":0},{"m":"","id":"2059c80f","t":2,"q":"Trường hợp khẩn cấp không thể trì hoãn (cháy hoặc đe dọa tính mạng, an toàn thiết bị) tại trạm điện, nhân viên vận hành được:","o":["Chỉ được thao tác khi có phiếu thao tác được duyệt","Tự thao tác thiết bị theo quy trình, chịu trách nhiệm về thao tác của mình, sau đó báo cáo ngay cấp có quyền điều khiển","Không được thao tác, chờ điều độ viên","Chỉ được thao tác khi có lệnh điều độ bằng văn bản"],"a":1,"c":"TT 06/2025, Điều 9 khoản 2","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Tự thao tác thiết bị theo quy trình, chịu trách nhiệm về thao tác của mình, sau đó báo cáo ngay cấp có quyền điều khiển**. Xem trích nguyên văn bên dưới.","xh":"Điều 9. Quyền điều khiển, kiểm tra và nắm thông tin trong các trường","xb":"2. Trường hợp khẩn cấp không thể trì hoãn được (cháy hoặc có nguy cơ đe doạ đến tính mạng con người hoặc an toàn thiết bị) ở nhà máy điện hoặc trạm điện, cho phép Nhân viên vận hành tại nhà máy điện, trạm điện, trung tâm điều khiển và cấp điều độ có quyền điều khiển tiến hành thao tác thiết bị theo các quy trình liên quan và phải chịu trách nhiệm về thao tác xử lý sự cố của mình. …","k":"**Sự cố hoặc đe dọa sự cố** (Điều 9): cấp có quyền điều khiển được ra lệnh trước rồi báo cáo ngay cho cấp có quyền kiểm tra; khẩn cấp (cháy, đe dọa tính mạng) nhân viên vận hành được thao tác trước, báo cáo sau.","old":0},{"m":"Bẫy: bộ câu hỏi cũ (theo TT 40/2014) ghi 11 nhiệm vụ; theo TT 06/2025 là 9.","id":"31eb9cb8","t":2,"q":"Bộ phận phương thức dài hạn tại Cấp điều độ phân phối tỉnh có bao nhiêu nhiệm vụ chính?","o":["12 nhiệm vụ","09 nhiệm vụ","07 nhiệm vụ","11 nhiệm vụ"],"a":1,"c":"TT 06/2025, Điều 125","w":"Theo Điều 125 TT 06/2025, bộ phận phương thức dài hạn tại Cấp điều độ phân phối tỉnh có **09 nhiệm vụ chính**. Lưu ý: văn bản cũ (TT 40/2014, đã hết hiệu lực) ghi 11 nhiệm vụ nên dễ nhầm.","xh":"","xb":"","k":"Bộ phận tại cấp điều độ phân phối tỉnh: trực ban chỉ huy điều độ, phương thức ngắn hạn (Điều 124), phương thức dài hạn (Điều 125 – 9 nhiệm vụ), tính toán chỉnh định rơ le (Điều 126). Bộ phận phương thức dài hạn chủ trì điều tra, phân tích sự cố.","old":0},{"m":"Sau đó phải về 49,5÷50,5 Hz trong 02 phút và về 49,8÷50,2 Hz trong 05 phút.","id":"622e3420","t":3,"q":"Khi xảy ra sự cố đơn lẻ, dải tần số cho phép (trạng thái chưa ổn định) là:","o":["49,5 Hz ÷ 50,5 Hz","47,5 Hz ÷ 52 Hz","49 Hz ÷ 51 Hz","48,5 Hz ÷ 51,5 Hz"],"a":2,"c":"TT 05/2025, Điều 4, Bảng 1","w":"Khi sự cố đơn lẻ, tần số được phép dao động trong dải **49 Hz đến 51 Hz**, sau đó phải được đưa dần về dải hẹp hơn theo thời gian (Bảng 1, Điều 4 TT 05/2025).","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"","id":"0ae8dec3","t":3,"q":"Sau sự cố đơn lẻ, tần số phải được đưa về dải 49,8 Hz ÷ 50,2 Hz trong thời gian tối đa:","o":["10 phút","05 phút","02 phút","15 phút"],"a":1,"c":"TT 05/2025, Điều 4, Bảng 1","w":"Sau sự cố đơn lẻ, tần số có thể xuống 49–51 Hz rồi phải được đưa về từng dải hẹp hơn theo thời gian: về **49,5–50,5 Hz trong 02 phút**, về **49,8–50,2 Hz trong 05 phút**. Dải 49,8–50,2 Hz là dải chặt nhất nên được cho thời gian dài nhất, 05 phút. Con số 02 phút là của dải 49,5–50,5 Hz, đây là chỗ dễ nhầm.","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"Nhớ: 500 kV ±5%; 220 kV +10/−5%; thanh cái phân phối +10/−5%; điểm đấu nối khách hàng ±5%.","id":"a1bcc2ec","t":3,"q":"Độ lệch điện áp vận hành cho phép ở chế độ bình thường tại thanh cái 500 kV là:","o":["± 10%","+ 10% và − 05%","+ 05% và − 10%","± 05%"],"a":3,"c":"TT 05/2025, Điều 6","w":"Ở chế độ bình thường, độ lệch điện áp cho phép tại thanh cái **500 kV là ±05%**. Với 220 kV và thanh cái phân phối là +10%/−05%.","xh":"","xb":"","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"","id":"9abcec3b","t":3,"q":"Độ lệch điện áp vận hành cho phép ở chế độ bình thường tại thanh cái 220 kV là:","o":["+ 05% và − 10%","± 10%","± 05%","+ 10% và − 05%"],"a":3,"c":"TT 05/2025, Điều 6","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **+ 10% và − 05%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"b) Độ lệch điện áp vận hành cho phép trên lưới điện 220kV so với điện áp danh định là + 10% và - 05%;","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"Lưới phân phối: ≤1,4 (trung tính nối đất trực tiếp), ≤1,7 (trung tính cách ly hoặc nối đất qua trở kháng).","id":"25fba1b9","t":3,"q":"Hệ số chạm đất của lưới điện truyền tải ở các cấp điện áp không được vượt quá:","o":["1,4","1,3","1,7","1,5"],"a":0,"c":"TT 05/2025, Điều 13 khoản 1","w":"Đáp án đúng là **1,4**, khớp với quy định được trích bên dưới.","xh":"Điều 13. Hệ số chạm đất","xb":"1. Hệ số chạm đất của lưới điện truyền tải ở các cấp điện áp không được vượt quá 1,4.","k":"**Hệ số chạm đất**: truyền tải ≤1,4; phân phối ≤1,4 (nối đất trực tiếp), ≤1,7 (cách ly hoặc nối đất qua trở kháng). **Độ tin cậy**: SAIDI, SAIFI chỉ xét mất điện kéo dài trên 05 phút.","old":0},{"m":"","id":"49c578f9","t":3,"q":"Khi sự cố, điện áp ở pha không bị sự cố được phép tăng quá bao nhiêu % điện áp danh định cho đến khi sự cố được loại trừ?","o":["110%","105%","115%","120%"],"a":0,"c":"TT 05/2025, Điều 6","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **110%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"6. Trong thời gian sự cố, điện áp tại nơi xảy ra sự cố và vùng lân cận có thể giảm quá độ đến giá trị bằng 0 ở pha bị sự cố hoặc tăng quá 110% điện áp danh định ở các pha không bị sự cố cho đến khi sự cố được loại trừ.","k":"Trong thời gian sự cố, điện áp tại nơi sự cố có thể giảm quá độ đến 0 ở pha sự cố hoặc tăng quá **110%** điện áp danh định ở pha không sự cố.","old":0},{"m":"500 kV: 50 kA – 80 ms; 220 kV: 50 kA – 100 ms; 110 kV: 31,5 kA – 150 ms; trung áp: 25 kA – 500 ms.","id":"5ca10cf2","t":4,"q":"Dòng điện ngắn mạch lớn nhất cho phép và thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở cấp 220 kV là:","o":["50 kA – 100 ms","50 kA – 80 ms","31,5 kA – 150 ms","40 kA – 100 ms"],"a":0,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Ở cấp **220 kV**, dòng ngắn mạch lớn nhất cho phép là **50 kA** và thời gian tối đa loại trừ sự cố bằng bảo vệ chính là **100 ms** (Bảng 8, Điều 12 TT 05/2025).","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA**.","old":0},{"m":"Hài bậc 2 → dòng xung kích khi đóng MBA; hài bậc 5 → quá kích từ.","id":"4ef8a19a","t":4,"q":"Bảo vệ so lệch máy biến áp (87T) có chức năng hãm hài bậc 2 nhằm tránh tác động nhầm khi:","o":["Quá kích từ máy biến áp","Mất tín hiệu biến điện áp","Ngắn mạch ngoài vùng bảo vệ","Đóng xung kích máy biến áp (dòng từ hóa)"],"a":3,"c":"Kiến thức rơ le bảo vệ","w":"Dòng từ hóa khi **đóng xung kích máy biến áp** chứa nhiều thành phần hài bậc 2 và có thể trông giống dòng so lệch. Chức năng hãm hài bậc 2 khóa rơ le 87T trong trường hợp này để không tác động nhầm.","xh":"","xb":"","k":"**Rơ le so lệch**: 87T (MBA) hãm hài bậc 2 (xung kích) và bậc 5 (quá kích từ); 87L (đường dây, cần kênh truyền); 87B (thanh cái). **64REF/50REF** bảo vệ chạm đất hạn chế cuộn dây nối sao. Rơ le hơi (Buchholz), dòng dầu bảo vệ nội bộ thùng dầu.","old":0},{"m":"Vùng 2 ≥120% ZL, t = 0,3÷0,4 s. Vùng 1 chỉ 80–85% để bù sai số TI, TU, thông số đường dây, điện trở sự cố.","id":"fae30cc3","t":4,"q":"Bảo vệ khoảng cách (21) thường chỉnh định vùng 1 và thời gian như sau:","o":["100% tổng trở đường dây, 0 s","120% tổng trở đường dây, 0,3 ÷ 0,4 s","50% tổng trở đường dây, 0,5 s","80 ÷ 85% tổng trở đường dây, tác động tức thời (0 s)"],"a":3,"c":"Kiến thức rơ le bảo vệ","w":"Vùng 1 của bảo vệ khoảng cách chỉnh định khoảng **80–85% tổng trở đường dây** và tác động **tức thời (0 s)**, để chừa dự phòng cho sai số biến dòng, biến điện áp và thông số đường dây, tránh tác động vượt qua cuối đường dây.","xh":"","xb":"","k":"**Khoảng cách (21)**: vùng 1 = 80–85% ZL, t = 0; vùng 2 ≥ 120% ZL, t = 0,3–0,4 s. **Quá dòng**: Is ≥ (1,1–1,3)·Ilvmax/kv; độ nhạy Kn ≥ 1,5 (chính), ≥ 1,2 (dự phòng); bước phối hợp Δt khoảng 0,3–0,4 s.","old":0},{"m":"Kn = Ik min cuối vùng / dòng khởi động.","id":"7f3cf227","t":4,"q":"Hệ số độ nhạy Kn tối thiểu của bảo vệ quá dòng là:","o":["≥ 1,0 cho mọi trường hợp","≥ 1,5 (bảo vệ chính); ≥ 1,2 (bảo vệ dự phòng)","≥ 2,0 cho mọi trường hợp","≥ 1,2 (chính); ≥ 1,5 (dự phòng)"],"a":1,"c":"Kiến thức rơ le bảo vệ","w":"Độ nhạy Kn = dòng ngắn mạch nhỏ nhất cuối vùng bảo vệ / dòng khởi động. Yêu cầu tối thiểu là **Kn ≥ 1,5 với bảo vệ chính** và **Kn ≥ 1,2 với bảo vệ dự phòng** để rơ le vẫn tác động chắc chắn khi sự cố nhẹ nhất.","xh":"","xb":"","k":"**Khoảng cách (21)**: vùng 1 = 80–85% ZL, t = 0; vùng 2 ≥ 120% ZL, t = 0,3–0,4 s. **Quá dòng**: Is ≥ (1,1–1,3)·Ilvmax/kv; độ nhạy Kn ≥ 1,5 (chính), ≥ 1,2 (dự phòng); bước phối hợp Δt khoảng 0,3–0,4 s.","old":0},{"m":"t = TMS·k/((I/Is)^α − 1). VI: 13,5/1; EI: 80/2; LTI: 120/1.","id":"333c989c","t":4,"q":"Đặc tính quá dòng thời gian phụ thuộc chuẩn IEC (Standard Inverse) có hằng số:","o":["k = 0,14 ; α = 0,02","k = 80 ; α = 2","k = 120 ; α = 1","k = 13,5 ; α = 1"],"a":0,"c":"IEC 60255","w":"Đặc tính quá dòng thời gian phụ thuộc IEC Standard Inverse có **k = 0,14 và α = 0,02**, theo công thức t = TMS·k / ((I/Is)^α − 1).","xh":"","xb":"","k":"Đặc tính IEC: **t = TMS·k/((I/Is)^α − 1)**; SI k = 0,14, α = 0,02; VI 13,5/1; EI 80/2; LTI 120/1.","old":0},{"m":"87B so lệch thanh cái; 79 tự động đóng lại; 21 khoảng cách; 81 tần số; 67 quá dòng có hướng; 46 thứ tự nghịch; 25 kiểm tra đồng bộ.","id":"a61f57de","t":4,"q":"Mã ANSI 50BF là chức năng:","o":["Chống hư hỏng máy cắt","Bảo vệ so lệch thanh cái","Tự động đóng lại","Bảo vệ khoảng cách"],"a":0,"c":"Mã ANSI/IEEE","w":"**50BF** là bảo vệ chống hư hỏng máy cắt (Breaker Failure): khi máy cắt không cắt được sau lệnh của bảo vệ, 50BF tác động cắt các máy cắt kế cận để loại trừ sự cố.","xh":"","xb":"","k":"Mã ANSI hay hỏi: 21 khoảng cách; 25 kiểm tra đồng bộ; 27/59 kém/quá áp; 46 thứ tự nghịch; 50/51 quá dòng; 67 có hướng; 79 tự động đóng lại; 81 tần số; 85 truyền cắt; 87 so lệch; 50BF chống hỏng máy cắt.","old":0},{"m":"Khi phát công suất phản kháng: không nhỏ hơn 0,98.","id":"4b4cdc4d","t":5,"q":"Tại điểm đấu nối với lưới điện truyền tải, hệ số công suất khi Đơn vị phân phối điện nhận công suất phản kháng không nhỏ hơn:","o":["0,98","0,95","0,85","0,9"],"a":3,"c":"TT 05/2025, Điều 31 khoản 1","w":"Đáp án đúng là **0,9**, khớp với quy định được trích bên dưới.","xh":"Điều 31. Yêu cầu Hệ số công suất","xb":"1. Trong chế độ vận hành bình thường, Đơn vị phân phối điện và Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải phải duy trì hệ số công suất (cos) tại vị trí đo đếm chính không nhỏ hơn 0,9 trong trường hợp nhận công suất phản kháng và không nhỏ hơn 0,98 trong trường hợp phát công suất phản kháng.","k":"**Hệ số công suất**: Đơn vị phân phối điện, khách hàng nhận điện trực tiếp từ lưới truyền tải: cosφ ≥ **0,9** (nhận Q), ≥ **0,98** (phát Q) tại vị trí đo đếm chính. Khách hàng sản xuất, kinh doanh, dịch vụ có công suất cực đại **từ 40 kW**: cosφ ≥ 0,9 tại điểm đặt thiết bị đo đếm.","old":0},{"m":"","id":"92de148f","t":5,"q":"Theo TT 05/2025, nhà máy điện có công suất lắp đặt trên 30 MW, khi tần số hệ thống từ 49 Hz đến 51 Hz thì:","o":["Phải tách khỏi lưới","Chỉ duy trì tối đa 10 phút","Phải phát điện liên tục","Chỉ duy trì tối đa 30 phút"],"a":2,"c":"TT 05/2025, Điều 40","w":"Dải 49–51 Hz là dải tần số cho phép sau sự cố đơn lẻ. Nhà máy trên 30 MW phải **phát điện liên tục** trong dải này để không làm hệ thống mất thêm nguồn khi đang yếu. Tách lưới hoặc chỉ duy trì giới hạn vài chục phút sẽ làm tình trạng sự cố nặng thêm.","xh":"","xb":"","k":"Nhà máy điện lớn hơn 30 MW: thời gian duy trì phát điện theo dải tần số (Điều 40): **49 ÷ 51 Hz: liên tục**; trên 48 đến dưới 49 Hz: 30 phút; 47,5 ÷ 48 Hz: 10 phút; trên 51 ÷ 51,5 Hz: 30 phút; trên 51,5 ÷ 52 Hz: **01 phút**.","old":0},{"m":"","id":"46897ef6","t":6,"q":"Trước ngày nào hàng năm, Đơn vị điều độ HTĐ quốc gia hoàn thành và gửi EVN lấy ý kiến về Phương thức vận hành HTĐ quốc gia năm tới?","o":["Ngày 25 tháng 10","Ngày 15 tháng 11","Ngày 01 tháng 11","Ngày 15 tháng 10"],"a":3,"c":"TT 06/2025, Điều 68 khoản 1 điểm a","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Ngày 15 tháng 10**. Xem trích nguyên văn bên dưới.","xh":"Điều 68. Trình tự lập, phê duyệt Phương thức vận hành hệ thống điện","xb":"a) Trước ngày 15 tháng 10 hàng năm, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm hoàn thành và gửi lấy ý kiến Tập đoàn Điện lực Việt Nam bằng văn bản về Phương thức vận hành hệ thống điện quốc gia năm tới;","k":"**Phương thức quốc gia năm** (Điều 68): 15/10 gửi EVN lấy ý kiến → 25/10 EVN thống nhất → 01/11 hoàn thiện → **15/11 trình Bộ Công Thương**. Tháng: 20 gửi EVN → 22 EVN thống nhất → **27** công bố. Tuần: phê duyệt trước **11h00 thứ Sáu**.","old":0},{"m":"Chuỗi: 15/10 gửi EVN → 25/10 EVN thống nhất → 01/11 hoàn thiện → 15/11 trình Bộ Công Thương.","id":"07590fe1","t":6,"q":"Trước ngày nào hàng năm, Đơn vị điều độ HTĐ quốc gia trình Bộ Công Thương phê duyệt Phương thức vận hành HTĐ quốc gia năm tới?","o":["Ngày 15 tháng 12","Ngày 01 tháng 12","Ngày 01 tháng 11","Ngày 15 tháng 11"],"a":3,"c":"TT 06/2025, Điều 68 khoản 1 điểm d","w":"Đáp án đúng là **Ngày 15 tháng 11**, khớp với quy định được trích bên dưới.","xh":"Điều 68. Trình tự lập, phê duyệt Phương thức vận hành hệ thống điện","xb":"d) Trước ngày 15 tháng 11 hàng năm, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm trình Bộ Công Thương phê duyệt Phương thức vận hành hệ thống điện quốc gia năm tới.","k":"**Phương thức quốc gia năm** (Điều 68): 15/10 gửi EVN lấy ý kiến → 25/10 EVN thống nhất → 01/11 hoàn thiện → **15/11 trình Bộ Công Thương**. Tháng: 20 gửi EVN → 22 EVN thống nhất → **27** công bố. Tuần: phê duyệt trước **11h00 thứ Sáu**.","old":0},{"m":"20: gửi EVN lấy ý kiến; 22: EVN thống nhất; 27: phê duyệt và công bố.","id":"91388820","t":6,"q":"Theo Điều 68 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), Phương thức vận hành hệ thống điện quốc gia tháng tới được Đơn vị điều độ hệ thống điện quốc gia hoàn thiện, phê duyệt trước ngày:","o":["20 hàng tháng","22 hàng tháng","25 hàng tháng","27 hàng tháng"],"a":2,"c":"TT 06/2025, Điều 68 khoản 2 điểm c (sửa đổi bởi TT 46/2025)","w":"Theo Điều 68 khoản 2 điểm c TT 06/2025 đã sửa bởi TT 46/2025, Đơn vị điều độ hệ thống điện quốc gia hoàn thiện, phê duyệt Phương thức vận hành tháng tới **trước ngày 25 hàng tháng** (bản gốc và bộ câu cũ ghi ngày 27).","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 11","xb":"c) Trước ngày 25 hàng tháng, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm hoàn thiện, phê duyệt Phương thức vận hành hệ thống điện quốc gia cho tháng tới, báo cáo Bộ Công Thương.","k":"**Phương thức quốc gia năm** (Điều 68): 15/10 gửi EVN lấy ý kiến → 25/10 EVN thống nhất → 01/11 hoàn thiện → **15/11 trình Bộ Công Thương**. Tháng: 20 gửi EVN → 22 EVN thống nhất → **27** công bố. Tuần: phê duyệt trước **11h00 thứ Sáu**.","old":0},{"m":"Không nhầm với 15h00 thứ Sáu: thời điểm NSMO công bố kết quả dự báo phụ tải tuần.","id":"bac5a865","t":6,"q":"Phương thức vận hành HTĐ quốc gia tuần tới được hoàn thiện và phê duyệt trước thời điểm:","o":["10h00 ngày thứ Hai hàng tuần","11h00 ngày thứ Sáu hàng tuần","15h00 ngày thứ Sáu hàng tuần","10h00 ngày thứ Ba hàng tuần"],"a":1,"c":"TT 06/2025, Điều 68 khoản 3","w":"Đáp án đúng là **11h00 ngày thứ Sáu hàng tuần**, khớp với quy định được trích bên dưới.","xh":"Điều 68. Trình tự lập, phê duyệt Phương thức vận hành hệ thống điện","xb":"3. Phương thức vận hành hệ thống điện quốc gia tuần tới Trước 11h00 ngày thứ 6 hàng tuần, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm hoàn thiện và phê duyệt Phương thức vận hành hệ thống điện quốc gia cho tuần tới và gửi Tập đoàn Điện lực Việt Nam, báo cáo Bộ Công Thương.","k":"**Phương thức quốc gia năm** (Điều 68): 15/10 gửi EVN lấy ý kiến → 25/10 EVN thống nhất → 01/11 hoàn thiện → **15/11 trình Bộ Công Thương**. Tháng: 20 gửi EVN → 22 EVN thống nhất → **27** công bố. Tuần: phê duyệt trước **11h00 thứ Sáu**.","old":0},{"m":"Chuỗi thông báo năm: quốc gia 01/12 → miền 10/12 → tỉnh 20/12.","id":"3392f6be","t":6,"q":"Theo Điều 71 TT 06/2025/TT-BCT (sửa đổi bởi TT 46/2025), trước ngày nào hàng năm, Cấp điều độ phân phối tỉnh thông báo Phương thức vận hành hệ thống phân phối điện năm tới đã được duyệt cho Đơn vị quản lý vận hành?","o":["Ngày 01 tháng 12","Ngày 25 tháng 11","Ngày 10 tháng 12","Ngày 20 tháng 12"],"a":3,"c":"TT 06/2025, Điều 71 khoản 1 điểm c (sửa đổi bởi TT 46/2025)","w":"Đáp án đúng là **Ngày 20 tháng 12**, khớp với quy định được trích bên dưới.","xh":"TT 46/2025/TT-BCT, Điều 3 khoản 12","xb":"c) Trước ngày 20 tháng 12 hàng năm, Cấp điều độ phân phối tỉnh có trách nhiệm thông báo cho Đơn vị quản lý vận hành Phương thức vận hành hệ thống phân phối điện năm tới đã được duyệt.","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"Bẫy: bộ câu hỏi cũ ghi 25/11 (theo TT 40/2014) – nay đã đổi.","id":"077aa111","t":6,"q":"Trước ngày nào hàng năm, Cấp điều độ miền thông báo cho Cấp điều độ phân phối tỉnh Phương thức vận hành HTĐ miền năm tới đã được duyệt?","o":["Ngày 01 tháng 12","Ngày 25 tháng 11","Ngày 20 tháng 12","Ngày 10 tháng 12"],"a":3,"c":"TT 06/2025, Điều 71 khoản 1 điểm b","w":"Đáp án đúng là **Ngày 10 tháng 12**, khớp với quy định được trích bên dưới.","xh":"Điều 71. Trình tự thông báo, công bố phương thức vận hành","xb":"b) Trước ngày 10 tháng 12 hàng năm, Cấp điều độ miền có trách nhiệm thông báo cho Cấp điều độ phân phối tỉnh, Đơn vị quản lý vận hành Phương thức vận hành hệ thống điện miền năm tới đã được duyệt;","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"Năm, tháng, tuần: Cấp điều độ phân phối tỉnh lập, trình Tổng công ty Điện lực/Công ty Điện lực tỉnh phê duyệt. Ngày: tỉnh tự lập và phê duyệt.","id":"1b049ccf","t":6,"q":"Phương thức vận hành hệ thống phân phối điện ngày do cấp nào lập và phê duyệt?","o":["Cấp điều độ phân phối tỉnh","Tổng công ty Điện lực","Cấp điều độ miền","Cấp điều độ quốc gia"],"a":0,"c":"TT 06/2025, Điều 70 khoản 4","w":"Đáp án đúng là **Cấp điều độ phân phối tỉnh**, khớp với quy định được trích bên dưới.","xh":"Điều 70. Trình tự lập, phê duyệt Phương thức vận hành hệ thống phân","xb":"4. Phương thức vận hành hệ thống phân phối điện ngày do Cấp điều độ phân phối tỉnh lập và phê duyệt trên cơ sở phương thức vận hành hệ thống phân phối điện tuần đã được duyệt.","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"","id":"db6f3f0f","t":6,"q":"Phương thức vận hành hệ thống điện miền năm do cấp nào lập và phê duyệt?","o":["Cấp điều độ miền, trên cơ sở Phương thức vận hành HTĐ quốc gia năm đã được phê duyệt","Bộ Công Thương","Tập đoàn Điện lực Việt Nam","Cấp điều độ quốc gia"],"a":0,"c":"TT 06/2025, Điều 69 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Cấp điều độ miền, trên cơ sở Phương thức vận hành HTĐ quốc gia năm đã được phê duyệt**. Xem trích nguyên văn bên dưới.","xh":"Điều 69. Trình tự lập, phê duyệt Phương thức vận hành hệ thống điện","xb":"miền 1. Trên cơ sở Phương thức vận hành hệ thống điện quốc gia năm đã được phê duyệt, Cấp điều độ miền có trách nhiệm lập và phê duyệt Phương thức vận hành hệ thống điện miền năm theo các nội dung đã đăng ký tại Điều 66 Thông tư này.","k":"**Thông báo phương thức năm** (Điều 71): quốc gia **01/12** → miền **10/12** → tỉnh **20/12**. Tháng: 27 → 28 → 29. Phương thức phân phối năm, tháng, tuần do cấp tỉnh lập, **Tổng công ty/Công ty Điện lực tỉnh phê duyệt**; ngày do cấp tỉnh lập và phê duyệt (Điều 70).","old":0},{"m":"Thứ tự: (1) Q nguồn bù gần→xa; (2) nấc MBA; (3) huy động nguồn dự phòng; (4) thay đổi kết lưới; (5) sa thải phụ tải.","id":"51b4a682","t":7,"q":"Theo thứ tự các biện pháp điều chỉnh điện áp (TT 06/2025), biện pháp ĐẦU TIÊN là:","o":["Điều chỉnh nấc phân áp máy biến áp","Sa thải phụ tải","Huy động thêm nguồn điện đang dự phòng","Thay đổi nguồn công suất phản kháng của thiết bị bù ngang, máy bù, máy phát theo thứ tự từ gần đến xa"],"a":3,"c":"TT 06/2025, Điều 96","w":"Đáp án đúng là **Thay đổi nguồn công suất phản kháng của thiết bị bù ngang, máy bù, máy phát theo thứ tự từ gần đến xa**, khớp với quy định được trích bên dưới.","xh":"Điều 96. Các biện pháp điều chỉnh điện áp","xb":"1. Thay đổi nguồn công suất phản kháng đang vận hành của thiết bị bù ngang (tụ điện, kháng điện), máy bù đồng bộ, máy bù tĩnh, máy phát điện theo thứ tự từ gần đến xa điểm cần điều chỉnh điện áp.","k":"**Điều chỉnh điện áp** (Điều 96) theo thứ tự: (1) thay đổi Q nguồn bù, máy phát gần → xa; (2) nấc MBA, **không tăng nấc khi điện áp phía cao áp đã thấp dưới −5%**; (3) huy động nguồn dự phòng; (4) thay đổi kết lưới; (5) sa thải phụ tải.","old":0},{"m":"Lý do: tăng nấc hút thêm Q từ lưới cao áp, làm điện áp cao áp tụt thêm, có nguy cơ sụp đổ điện áp.","id":"29a57674","t":7,"q":"Không được điều chỉnh nấc máy biến áp để TĂNG điện áp phía hạ áp hoặc trung áp khi điện áp phía cao áp đã thấp dưới:","o":["− 03% so với điện áp danh định","− 10% so với điện áp danh định","− 05% so với điện áp danh định","− 15% so với điện áp danh định"],"a":2,"c":"TT 06/2025, Điều 96 khoản 2","w":"Đáp án đúng là **− 05% so với điện áp danh định**, khớp với quy định được trích bên dưới.","xh":"Điều 96. Các biện pháp điều chỉnh điện áp","xb":"2. Điều chỉnh nấc phân áp máy biến áp cho phù hợp với tình hình thực tế và quy định vận hành của thiết bị. Không thực hiện điều chỉnh nấc máy biến áp (bằng tay hoặc tự động) để tăng điện áp phía hạ áp hoặc trung áp khi điện áp phía cao áp đã thấp dưới -5% so với điện áp danh định.","k":"**Điều chỉnh điện áp** (Điều 96) theo thứ tự: (1) thay đổi Q nguồn bù, máy phát gần → xa; (2) nấc MBA, **không tăng nấc khi điện áp phía cao áp đã thấp dưới −5%**; (3) huy động nguồn dự phòng; (4) thay đổi kết lưới; (5) sa thải phụ tải.","old":0},{"m":"30%/120′; 45%/80′; 60%/45′; 75%/20′; 100%/10′.","id":"0c80eb5a","t":7,"q":"Theo TT 06/2025, quá tải ngắn hạn của máy biến áp dầu (khi nhà chế tạo không quy định) 30% dòng định mức được phép trong:","o":["80 phút","120 phút","45 phút","20 phút"],"a":1,"c":"TT 06/2025, Điều 196 khoản 1 điểm a","w":"Theo bảng quá tải ngắn hạn của MBA dầu: **30% dòng định mức trong 120 phút**, 45% trong 80 phút, 60% trong 45 phút, 75% trong 20 phút, 100% trong 10 phút.","xh":"","xb":"","k":"**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","old":0},{"m":"","id":"2976246f","t":7,"q":"Máy biến áp dầu được phép quá tải ngắn hạn 100% dòng định mức trong thời gian:","o":["80 phút","45 phút","20 phút","10 phút"],"a":3,"c":"TT 06/2025, Điều 196 khoản 1 điểm a","w":"Bảng quá tải ngắn hạn của MBA dầu (Điều 196): **30% / 120′, 45% / 80′, 60% / 45′, 75% / 20′, 100% / 10′**. Quá tải càng sâu thì thời gian cho phép càng ngắn, nên quá tải 100% chỉ được **10 phút**. Các mốc 80′, 45′, 20′ ứng với 45%, 60%, 75%.","xh":"","xb":"","k":"**Quá tải ngắn hạn MBA dầu** (Điều 196): 30% – 120 phút; **45% – 80 phút**; 60% – 45 phút; **75% – 20 phút**; 100% – 10 phút. MBA khô: 20% – 60′; 30% – 45′; 40% – 32′; 50% – 18′; 60% – 5′. **Quá tải lâu dài**: được cao hơn định mức tới **5%** của nấc tương ứng nếu điện áp nấc không cao hơn định mức.","old":0},{"m":"","id":"628a7f32","t":8,"q":"Dự báo nhu cầu phụ tải điện năm được thực hiện cho:","o":["03 năm tiếp theo (N+1 đến N+3)","Chỉ năm tới (N+1)","05 năm tiếp theo","01 năm tới (N+1) và 01 năm tiếp theo (N+2)"],"a":3,"c":"TT 06/2025, Điều 44 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **01 năm tới (N+1) và 01 năm tiếp theo (N+2)**. Xem trích nguyên văn bên dưới.","xh":"Điều 44. Dự báo nhu cầu phụ tải điện năm","xb":"1. Dự báo nhu cầu phụ tải điện năm được thực hiện cho 01 năm tới (năm N+1) và 01 năm tiếp theo (năm N+2).","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"","id":"dedba6c2","t":8,"q":"Số liệu thống kê phục vụ dự báo nhu cầu phụ tải điện năm lấy trong ít nhất bao nhiêu năm trước gần nhất?","o":["10 năm","02 năm","05 năm","03 năm"],"a":2,"c":"TT 06/2025, Điều 44 khoản 3 điểm c","w":"Dự báo nhu cầu phụ tải **năm** dùng số liệu thống kê của **05 năm** gần nhất để thấy xu hướng tăng trưởng dài hạn. Mốc 02–03 năm quá ngắn, mốc 10 năm không phải quy định.","xh":"","xb":"","k":"**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","old":0},{"m":"104 tuần = 2 năm (N+1, N+2).","id":"a403f950","t":8,"q":"Số liệu dự báo nhu cầu phụ tải điện năm gồm biểu đồ ngày điển hình của bao nhiêu tuần, chu kỳ bao nhiêu phút?","o":["52 tuần, chu kỳ 60 phút","52 tuần, chu kỳ 30 phút","104 tuần, chu kỳ 30 phút","104 tuần, chu kỳ 15 phút"],"a":2,"c":"TT 06/2025, Điều 44 khoản 2 điểm a","w":"Đáp án đúng là **104 tuần, chu kỳ 30 phút**, khớp với quy định được trích bên dưới.","xh":"Điều 44. Dự báo nhu cầu phụ tải điện năm","xb":"a) Số liệu dự báo nhu cầu phụ tải điện từng tháng về điện năng, công suất cực đại, biểu đồ ngày điển hình của 104 tuần với chu kỳ 30 phút/lần của Đơn vị phân phối điện, Đơn vị phân phối và bán lẻ điện, Khách hàng sử dụng điện nhận điện trực tiếp từ lưới điện truyền tải và tại các trạm biến áp 110 kV trong hệ thống điện;","k":"**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","old":0},{"m":"","id":"52bd2b97","t":8,"q":"Dự báo nhu cầu phụ tải điện ngày được thực hiện cho 02 ngày tới; Đơn vị điều độ HTĐ quốc gia công bố kết quả trước thời điểm nào hàng ngày?","o":["11h00","09h00","10h00","15h00"],"a":2,"c":"TT 06/2025, Điều 47","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **10h00**. Xem trích nguyên văn bên dưới.","xh":"Điều 47. Dự báo nhu cầu phụ tải điện ngày","xb":"4. Trước 10h00 hàng ngày, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm hoàn thành và công bố trên Trang thông tin điện tử kết quả dự báo nhu cầu phụ tải điện ngày theo quy định tại khoản 3 Điều này.","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"Đơn vị phân phối gửi dự báo tuần: trước 10h00 thứ Hai.","id":"7aefbd33","t":8,"q":"Đơn vị điều độ HTĐ quốc gia công bố kết quả dự báo nhu cầu phụ tải điện tuần trước thời điểm:","o":["11h00 thứ Sáu hàng tuần","10h00 thứ Ba hàng tuần","15h00 thứ Sáu hàng tuần","10h00 thứ Hai hàng tuần"],"a":2,"c":"TT 06/2025, Điều 46 khoản 5 điểm b","w":"Đáp án đúng là **15h00 thứ Sáu hàng tuần**, khớp với quy định được trích bên dưới.","xh":"Điều 46. Dự báo nhu cầu phụ tải điện tuần","xb":"b) Trước 15h00 thứ Sáu hàng tuần, căn cứ vào số liệu về dự báo nhu cầu phụ tải điện được các đơn vị cung cấp, Đơn vị điều độ hệ thống điện quốc gia có trách nhiệm hoàn thành và công bố trên Trang thông tin điện tử kết quả dự báo nhu cầu phụ tải điện tuần theo quy định tại khoản 4 Điều này.","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"Công bố chậm nhất 10 phút trước chu kỳ giao dịch tiếp theo.","id":"7710c5dd","t":8,"q":"Dự báo nhu cầu phụ tải điện chu kỳ giao dịch được thực hiện cho:","o":["01 chu kỳ giao dịch tới và 07 chu kỳ giao dịch tiếp theo","24 chu kỳ giao dịch của ngày","01 chu kỳ giao dịch tới","04 chu kỳ giao dịch tiếp theo"],"a":0,"c":"TT 06/2025, Điều 48 khoản 1","w":"Đáp án đúng là **01 chu kỳ giao dịch tới và 07 chu kỳ giao dịch tiếp theo**, khớp với quy định được trích bên dưới.","xh":"Điều 48. Dự báo nhu cầu phụ tải điện chu kỳ giao dịch","xb":"1. Dự báo nhu cầu phụ tải điện chu kỳ giao dịch được thực hiện cho 01 (một) chu kỳ giao dịch tới và 07 (bảy) chu kỳ giao dịch tiếp theo.","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"","id":"d7d2d4cc","t":8,"q":"Trong những ngày nghỉ Lễ, Tết và các sự kiện gây biến động lớn đến phụ tải, sai số dự báo cho phép là:","o":["± 10%","± 4%","± 8%","± 6%"],"a":0,"c":"TT 06/2025, Điều 43 khoản 3 điểm c","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **± 10%**. Xem trích nguyên văn bên dưới.","xh":"Điều 43. Quy định chung về dự báo nhu cầu phụ tải điện","xb":"c) Trong những ngày nghỉ Lễ, Tết và các sự kiện có thể gây biến động lớn đến nhu cầu phụ tải điện: sai số dự báo trong giới hạn ±10%.","k":"**Sai số dự báo** (TT 06, Điều 43): năm, tháng, tuần **±6%**; ngày, chu kỳ giao dịch **±4%**; ngày Lễ, Tết và sự kiện biến động lớn **±10%**. Bộ câu cũ ghi ±3% và ±2% – đã lỗi thời.","old":0},{"m":"","id":"e23b63aa","t":8,"q":"Số liệu thống kê phục vụ dự báo nhu cầu phụ tải điện tuần lấy từ bao nhiêu tuần trước gần nhất?","o":["08 tuần","02 tuần","06 tuần","04 tuần"],"a":3,"c":"TT 06/2025, Điều 46 khoản 3 điểm b","w":"Dự báo phụ tải **tuần** dùng số liệu **04 tuần** trước gần nhất vì phụ tải tuần biến động nhanh theo thời tiết và lịch làm việc, nên chỉ cần chuỗi số liệu gần. Khác với dự báo năm dùng 05 năm.","xh":"","xb":"","k":"**Số liệu đầu vào**: năm – biểu đồ ngày điển hình của **104 tuần**, chu kỳ 30 phút, thống kê ≥ **05 năm**, GDP 02 năm tới; tháng – số liệu từng tuần, thống kê cùng kỳ năm trước và **03 tháng** gần nhất; tuần – 02 tuần tiếp theo, thống kê **04 tuần** gần nhất, dự báo thời tiết.","old":0},{"m":"","id":"f923f38a","t":8,"q":"Số liệu dự báo của Đơn vị phân phối điện gửi cho Đơn vị điều độ HTĐ quốc gia gồm dự báo tổng hợp toàn đơn vị và:","o":["Dự báo tại từng trạm biến áp 110 kV","Dự báo tại từng tuyến 22 kV","Dự báo tại từng khách hàng lớn","Chỉ dự báo tổng hợp, không cần chi tiết"],"a":0,"c":"TT 06/2025, Điều 43 khoản 2 điểm a","w":"Số liệu dự báo của Đơn vị phân phối điện gửi Đơn vị điều độ HTĐ quốc gia gồm **dự báo tổng hợp toàn đơn vị** và **dự báo tại từng trạm biến áp 110 kV**, để cấp điều độ có số liệu ở mức trạm.","xh":"","xb":"","k":"**Đối tượng và hạn gửi**: Đơn vị phân phối điện gửi dự báo tổng hợp toàn đơn vị **và từng trạm 110 kV** cho NSMO. Năm (N+1, N+2): trước **01/8**; tháng (M+1): trước **ngày 15**; tuần: trước **10h00 thứ Hai**. NSMO công bố tuần trước **15h00 thứ Sáu**; ngày (02 ngày tới) trước **10h00**; chu kỳ giao dịch (01 + 07 chu kỳ) chậm nhất 10 phút trước chu kỳ tiếp theo.","old":0},{"m":"Tháng: căn cứ số liệu tháng trước hoặc dự báo năm. Năm: căn cứ dự báo của năm trước.","id":"1dc850ae","t":8,"q":"Nếu Đơn vị phân phối điện không gửi số liệu dự báo phụ tải tuần đúng hạn, Đơn vị điều độ HTĐ quốc gia dự báo căn cứ vào:","o":["Không dự báo cho đơn vị đó","Số liệu của cùng kỳ năm trước","Số liệu thực tế của năm trước","Số liệu dự báo của tuần trước hoặc kết quả dự báo phụ tải tháng"],"a":3,"c":"TT 06/2025, Điều 46 khoản 5 điểm a","w":"Khi Đơn vị phân phối điện không gửi số liệu dự báo tuần đúng hạn, Đơn vị điều độ HTĐ quốc gia dự báo căn cứ **số liệu dự báo của tuần trước hoặc kết quả dự báo phụ tải tháng** (Điều 46 khoản 5 TT 06/2025).","xh":"","xb":"","k":"Nếu không gửi đúng hạn: năm – căn cứ dự báo năm trước; tháng – tháng trước hoặc dự báo năm; tuần – tuần trước hoặc dự báo tháng.","old":0},{"m":"Không giao ca khi đang sự cố, đang thao tác phức tạp hoặc chưa hoàn thành công việc.","id":"5906bcda","t":9,"q":"Nhân viên vận hành phải có mặt trước giờ giao nhận ca ít nhất:","o":["30 phút","15 phút","05 phút","10 phút"],"a":1,"c":"TT 06/2025, Điều 81","w":"Đáp án đúng là **15 phút**, khớp với quy định được trích bên dưới.","xh":"Điều 81. Quy định về giao, nhận ca","xb":"1. Quy định về nhận ca a) Nhân viên vận hành phải có mặt trước giờ giao nhận ca ít nhất 15 phút để tìm hiểu những sự việc xảy ra từ ca hiện tại và ca gần nhất của người nhận ca để nắm được rõ tình trạng vận hành của trạm điện, nhà máy điện, hệ thống điện thuộc quyền điều khiển;","k":"**Giao nhận ca**: có mặt trước ≥ **15 phút**; không giao ca khi đang sự cố, thao tác phức tạp, chưa hoàn thành công việc, người nhận ca không đủ tỉnh táo (Điều 81). Cô lập hoặc đưa rơ le bảo vệ vào lại chỉ khi có lệnh cấp điều độ có quyền điều khiển.","old":0},{"m":"Tại cấp điều độ có quyền điều khiển: không quá 05 bước (điểm c). Xử lý sự cố: luôn được miễn phiếu (điểm a).","id":"e4d6c82a","t":9,"q":"Thao tác không cần lập phiếu (nhưng phải ghi đầy đủ vào sổ nhật ký vận hành trước khi thao tác) khi số bước thao tác không quá 03 bước và được thực hiện:","o":["Tại cấp điều độ có quyền điều khiển","Trực tiếp tại trạm điện","Tại trung tâm điều khiển hoặc bằng điều khiển từ xa","Ở mọi nơi"],"a":2,"c":"TT 06/2025, Điều 133 khoản 3 điểm b","w":"Thao tác không cần lập phiếu khi không quá 03 bước và thực hiện **tại trung tâm điều khiển hoặc bằng điều khiển từ xa**. Tại cấp điều độ có quyền điều khiển thì được tới 05 bước (Điều 133 khoản 3 TT 06/2025).","xh":"","xb":"","k":"**Phiếu thao tác** bắt buộc, cấm thao tác theo trí nhớ. Được miễn phiếu (phải ghi sổ nhật ký trước khi thao tác): xử lý sự cố; ≤ **03** bước tại trung tâm điều khiển hoặc thao tác xa; ≤ **05** bước tại cấp điều độ có quyền điều khiển. Phiếu đã thực hiện lưu **≥ 03 tháng**; chuyển phiếu kế hoạch trước **≥ 45 phút**.","old":0},{"m":"","id":"a927ca53","t":9,"q":"Việc thao tác thử đóng cắt máy cắt, dao cách ly, chuyển nấc MBA bằng điều khiển từ xa phải thực hiện nếu thời gian không thao tác kéo dài quá:","o":["12 tháng","03 tháng","24 tháng","06 tháng"],"a":0,"c":"TT 06/2025, Điều 133 khoản 1 điểm c","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **12 tháng**. Xem trích nguyên văn bên dưới.","xh":"Điều 133. Yêu cầu chung về thao tác thiết bị điện trong hệ thống điện","xb":"c) Thực hiện thao tác thử đóng cắt máy cắt, dao cách ly, chuyển nấc máy biến áp bằng điều khiển từ xa nếu thời gian không thao tác kéo dài quá 12 tháng và không gây gián đoạn cung cấp điện cho khách hàng;","k":"**Thao tác thử** MC, DCL, chuyển nấc MBA bằng điều khiển từ xa nếu **12 tháng** không thao tác. Hệ thống thao tác xa lưu sự kiện **≥ 03 tháng**. Hạn chế thao tác giờ cao điểm và giao nhận ca; không thao tác ngoài trời khi giông sét (trừ xử lý sự cố bằng xa).","old":0},{"m":"","id":"7bba3ea0","t":9,"q":"Điều kiện khép mạch vòng trong hệ thống điện (ngoài đồng vị pha, cùng thứ tự pha) là góc lệch pha điện áp và chênh lệch điện áp giữa hai phía không quá:","o":["15° và 05%","30° và 20%","45° và 10%","30° và 10%"],"a":3,"c":"TT 06/2025, Điều 160","w":"Trước khi khép vòng phải đảm bảo cùng thứ tự pha, đồng vị pha, và hai phía chênh nhau không quá **30° về góc pha** và **10% về điện áp**. Vượt ngưỡng thì dòng cân bằng khi khép vòng quá lớn, có thể làm rơ le tác động hoặc hư hỏng thiết bị.","xh":"","xb":"","k":"**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","old":0},{"m":"","id":"d3a34fc4","t":9,"q":"Khi cắt điện đường dây, thứ tự cắt máy cắt hai đầu là:","o":["Tùy ý","Cắt máy cắt phía xa nguồn trước, phía gần nguồn sau","Cắt đồng thời hai phía","Cắt máy cắt phía gần nguồn trước"],"a":1,"c":"TT 06/2025, Điều 154","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **Cắt máy cắt phía xa nguồn trước, phía gần nguồn sau**. Xem trích nguyên văn bên dưới.","xh":"Điều 154. Thao tác cắt điện đường dây","xb":"2. Lần lượt cắt tất cả các máy cắt các đầu đường dây hoặc nhánh rẽ theo trình tự phía xa nguồn điện trước, phía gần nguồn điện sau;","k":"**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","old":0},{"m":"Đóng điện MBA: đóng từ phía có điện (nguồn) trước.","id":"d7332d06","t":9,"q":"Khi cắt điện máy biến áp, thứ tự cắt máy cắt các phía là:","o":["Phía hạ áp → trung áp → cao áp","Cắt đồng thời ba phía","Phía cao áp → trung áp → hạ áp","Phía trung áp → hạ áp → cao áp"],"a":0,"c":"TT 06/2025, Điều 152","w":"Đáp án đúng là **Phía hạ áp → trung áp → cao áp**, khớp với quy định được trích bên dưới.","xh":"Điều 152. Thao tác cắt điện máy biến áp","xb":"4. Cắt máy cắt các phía hạ áp, trung áp, cao áp máy biến áp theo nguyên tắc bảo đảm an toàn cho máy biến áp (tránh quá áp) và lưới điện (tránh điện áp thấp);","k":"**Trình tự**: cắt MBA – hạ → trung → cao áp; đóng MBA – phía có điện trước; cắt đường dây – MC phía xa nguồn trước; đóng đường dây hình tia – đầu có điện trước. **Khép mạch vòng**: đồng vị pha, cùng thứ tự pha, góc lệch ≤ 30°, chênh lệch điện áp ≤ 10%.","old":0},{"m":"","id":"3eec9c05","t":9,"q":"Việc thao tác ngoài trời khi có giông sét:","o":["Được thực hiện bình thường","Chỉ cấm đối với thiết bị 110 kV","Chỉ cần thêm một người giám sát","Không được thực hiện, trừ trường hợp xử lý sự cố bằng điều khiển từ xa"],"a":3,"c":"TT 06/2025, Điều 145","w":"Khi có giông sét, thao tác thiết bị ngoài trời **không được thực hiện**, trừ xử lý sự cố bằng điều khiển từ xa. Lý do là an toàn: sét đánh lan truyền dễ gây nguy hiểm cho người ở hiện trường. Điều khiển từ xa thì người thao tác không đứng cạnh thiết bị nên được phép khi cần cắt sự cố.","xh":"","xb":"","k":"**Thao tác thử** MC, DCL, chuyển nấc MBA bằng điều khiển từ xa nếu **12 tháng** không thao tác. Hệ thống thao tác xa lưu sự kiện **≥ 03 tháng**. Hạn chế thao tác giờ cao điểm và giao nhận ca; không thao tác ngoài trời khi giông sét (trừ xử lý sự cố bằng xa).","old":0},{"m":"","id":"7de47b35","t":10,"q":"Thông tư 29/2026/TT-BCT (hiệu lực 20/7/2026) quy định về:","o":["Điều độ, vận hành, thao tác, xử lý sự cố","Mua bán điện trực tiếp (DPPA)","Điện mặt trời mái nhà tự sản xuất, tự tiêu thụ","Vận hành thị trường bán buôn điện cạnh tranh"],"a":3,"c":"TT 29/2026/TT-BCT","w":"TT 29/2026/TT-BCT (hiệu lực 20/7/2026) quy định về **vận hành thị trường bán buôn điện cạnh tranh**. Nội dung điều độ, thao tác, xử lý sự cố thuộc TT 06/2025; DPPA thuộc NĐ 57/2025; ĐMTMN tự sản xuất thuộc NĐ 58/2025 và NĐ 243/2026.","xh":"","xb":"","k":"**TT 46/2025/TT-BCT** (ký 06/8/2025, hiệu lực 22/9/2025) sửa đổi, bổ sung TT 04, 05, 06/2025. **TT 29/2026/TT-BCT** (hiệu lực 20/7/2026) quy định vận hành thị trường bán buôn điện cạnh tranh.","old":0},{"m":"Đơn vị phát điện chào giá trước 11h30 ngày D-1.","id":"355e2f24","t":10,"q":"Chu kỳ giao dịch trong thị trường bán buôn điện cạnh tranh hiện hành là:","o":["15 phút","60 phút","05 phút","30 phút"],"a":3,"c":"TT 29/2026/TT-BCT","w":"Theo TT 29/2026/TT-BCT, chu kỳ giao dịch trong thị trường bán buôn điện cạnh tranh là **30 phút** (48 chu kỳ mỗi ngày).","xh":"","xb":"","k":"**Thị trường bán buôn điện** (TT 29/2026, hiệu lực 20/7/2026): chu kỳ giao dịch **30 phút**; đơn vị phát điện chào giá trước **11h30 ngày D-1**; giá thị trường gồm giá điện năng và giá công suất; thanh toán qua hợp đồng sai khác (CfD).","old":0},{"m":"98% đối với kênh không có thao tác xa; hệ thống SCADA trung tâm: 99,9%.","id":"ca50b618","t":11,"q":"Theo QĐ 980/QĐ-NSMO, mức độ sẵn sàng tối thiểu của kênh truyền khi có thao tác xa là:","o":["99,9%","99%","95%","98%"],"a":0,"c":"QĐ 980/QĐ-NSMO","w":"Theo QĐ 980/QĐ-NSMO, kênh truyền có thao tác xa phải đạt mức sẵn sàng tối thiểu **99,9%**, cao hơn kênh không có thao tác xa vì thao tác xa cần kênh luôn thông suốt.","xh":"","xb":"","k":"**QĐ 980/QĐ-NSMO**: sẵn sàng kênh ≥ 98% (không thao tác xa), ≥ **99,9%** (có thao tác xa); tín hiệu số ≤ **10 ms**; đo lường ≤ 2 s. Thử nghiệm: point-to-point (từ thiết bị nhất thứ đến RTU/Gateway), rồi end-to-end (từ cấp điều độ). IEC 60870-5-104 truyền trên **TCP/IP**.","old":0},{"m":"Tín hiệu đo lường: chu kỳ cập nhật ≤2 giây.","id":"ff8d0d57","t":11,"q":"Theo QĐ 980/QĐ-NSMO, thời gian đáp ứng của tín hiệu số (từ RTU/Gateway) không vượt quá:","o":["100 ms","10 ms","2 giây","1 giây"],"a":1,"c":"QĐ 980/QĐ-NSMO","w":"Theo QĐ 980/QĐ-NSMO, thời gian đáp ứng của tín hiệu số (từ RTU/Gateway) không vượt quá **10 ms**. Tín hiệu đo lường thì quy định chu kỳ cập nhật riêng, không quá 2 giây.","xh":"","xb":"","k":"**QĐ 980/QĐ-NSMO**: sẵn sàng kênh ≥ 98% (không thao tác xa), ≥ **99,9%** (có thao tác xa); tín hiệu số ≤ **10 ms**; đo lường ≤ 2 s. Thử nghiệm: point-to-point (từ thiết bị nhất thứ đến RTU/Gateway), rồi end-to-end (từ cấp điều độ). IEC 60870-5-104 truyền trên **TCP/IP**.","old":0},{"m":"Phía 115 kV: ≈ 316 A.","id":"0c06c8de","t":12,"q":"Dòng điện định mức phía 22 kV (23 kV) của máy biến áp 63 MVA xấp xỉ:","o":["316 A","2.000 A","1.581 A","1.200 A"],"a":2,"c":"Iđm = Sđm/(√3·Uđm)","w":"**Iđm = Sđm / (√3 · Uđm)** = 63 MVA / (√3 × 23 kV) ≈ **1,581 kA, tức 1.581 A** (dấu chấm là dấu phân cách hàng nghìn). Phía 115 kV thì chỉ khoảng 316 A.","xh":"","xb":"","k":"Dòng định mức MBA – Iđm = Sđm/(√3·Uđm) – 63 MVA: 22 kV (23 kV) ≈ 1.581 A; 110 kV (115 kV) ≈ 316 A","old":0},{"m":"ΔU = (P·R + Q·X)/U là công thức sụt áp.","id":"b8c48640","t":12,"q":"Công thức tính tổn thất công suất trên đường dây là:","o":["ΔP = (P + Q)·X/U","ΔP = (P² + Q²)·R/U²","ΔP = (P·R + Q·X)/U","ΔP = P·U/R"],"a":1,"c":"Công thức cơ bản","w":"Tổn thất công suất trên đường dây: **ΔP = (P² + Q²)·R / U²**. Tổn thất tỷ lệ với bình phương công suất truyền tải và với điện trở R, giảm khi tăng điện áp.","xh":"","xb":"","k":"Tổn thất công suất – ΔP = (P² + Q²)·R/U² – —","old":0},{"m":"K2 = Pmin/Pmax.","id":"d78c479b","t":12,"q":"Hệ số phụ tải K1 (load factor) được tính theo công thức:","o":["K1 = Pmax/Ptb","K1 = Pmin/Pmax","K1 = Pmax − Pmin","K1 = Ptb/Pmax = A/(24·Pmax)"],"a":3,"c":"Kiến thức phụ tải","w":"Hệ số phụ tải **K1 = Ptb / Pmax = A / (24·Pmax)**, với A là điện năng ngày. K1 càng gần 1 thì biểu đồ phụ tải càng phẳng.","xh":"","xb":"","k":"Hệ số phụ tải – K1 = A/(24·Pmax) – A: điện năng ngày","old":0},{"m":"Điện áp giảm còn 95% thì Q tụ còn ≈ 90%.","id":"e2a4e62d","t":12,"q":"Công suất phản kháng của tụ bù thay đổi theo điện áp đặt vào theo quy luật:","o":["Tỉ lệ nghịch với điện áp","Không phụ thuộc điện áp","Tỉ lệ với bình phương điện áp: Q = Qđm·(U/Uđm)²","Tỉ lệ thuận với điện áp"],"a":2,"c":"Kiến thức cơ bản","w":"Công suất phản kháng của tụ bù **tỉ lệ với bình phương điện áp**: Q = Qđm·(U/Uđm)². Điện áp giảm thì tụ phát Q giảm nhanh hơn, đúng lúc lưới cần Q nhất.","xh":"","xb":"","k":"Điều kiện vận hành song song MBA: cùng tổ đấu dây, tỉ số biến bằng nhau, Uk% gần nhau, tỉ lệ công suất không quá 3:1, cùng thứ tự pha.","old":0},{"m":"","id":"37f4a8ba","t":3,"q":"Trong chế độ vận hành bình thường, tần số hệ thống điện quốc gia được phép dao động trong phạm vi nào so với tần số danh định 50 Hz?","o":["±0,5 Hz","±1,0 Hz","±0,1 Hz","±0,2 Hz"],"a":3,"c":"TT 05/2025, Điều 4 khoản 1","w":"Chế độ bình thường: tần số danh định **50 Hz, dao động ±0,2 Hz**, tức từ 49,8 đến 50,2 Hz. ±0,5 Hz là ngưỡng khác (ngoài 50 ± 0,5 Hz mọi nhà máy phải tham gia điều chỉnh).","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"Sau đó 05 phút để đưa về 49,8 ÷ 50,2 Hz.","id":"e4d62698","t":3,"q":"Khi sự cố đơn lẻ, thời gian để đưa tần số về phạm vi 49,5 Hz ÷ 50,5 Hz (trạng thái chưa ổn định) là bao lâu?","o":["02 phút","10 phút","05 phút","10 giây"],"a":0,"c":"TT 05/2025, Điều 4, Bảng 1","w":"Sau sự cố đơn lẻ, tần số phải về dải **49,5 Hz đến 50,5 Hz trong 02 phút**, rồi về dải 49,8 đến 50,2 Hz trong 05 phút (Bảng 1, Điều 4 TT 05/2025).","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"","id":"f0108d19","t":3,"q":"Một lần tần số vượt quá giới hạn được phép được tính khi tần số vượt giới hạn trong khoảng thời gian tối thiểu bao lâu?","o":["Từ 05 giây trở lên","Từ 01 giây trở lên","Từ 10 giây trở lên","Từ 01 phút trở lên"],"a":0,"c":"TT 05/2025, Điều 4 khoản 2","w":"Một lần tần số vượt giới hạn chỉ được tính khi nó vượt giới hạn **từ 05 giây trở lên**. Dao động ngắn hơn 05 giây không tính là một lần vi phạm.","xh":"","xb":"","k":"**Tần số** danh định 50 Hz; bình thường **50 ± 0,2 Hz**. Sự cố đơn lẻ: được phép **49 ÷ 51 Hz**, về **49,5 ÷ 50,5 Hz trong 02 phút**, về **49,8 ÷ 50,2 Hz trong 05 phút**. Một lần tần số vượt giới hạn tính khi vượt từ 05 giây trở lên.","old":0},{"m":"","id":"06b877c7","t":3,"q":"Các cấp điện áp danh định trong hệ thống phân phối điện theo TT 05/2025 gồm:","o":["35 kV, 22 kV, 15 kV, 10 kV và 0,38 kV","110 kV, 22 kV và 0,4 kV","110 kV, 35 kV, 22 kV, 15 kV, 10 kV, 06 kV và 0,38 kV","220 kV, 110 kV, 22 kV và 0,4 kV"],"a":2,"c":"TT 05/2025, Điều 6 khoản 1","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **110 kV, 35 kV, 22 kV, 15 kV, 10 kV, 06 kV và 0,38 kV**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"b) Trong hệ thống phân phối điện bao gồm 110 kV, 35 kV, 22 kV, 15 kV, 10 kV, 06 kV và 0,38 kV.","k":"**Điện áp danh định lưới phân phối**: 110, 35, 22, 15, 10, 06 kV và 0,38 kV; truyền tải: 500, 220 kV.","old":0},{"m":"","id":"35ef5f36","t":3,"q":"Độ lệch điện áp vận hành cho phép tại thanh cái trên lưới điện phân phối của Đơn vị phân phối điện (chế độ bình thường) là:","o":["±10%","+05% và −10%","±05%","+10% và −05%"],"a":3,"c":"TT 05/2025, Điều 6 khoản 2 điểm c","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **+10% và −05%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"c) Độ lệch điện áp vận hành cho phép tại thanh cái trên lưới điện phân phối của Đơn vị phân phối điện so với điện áp danh định là + 10% và - 05%;","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"","id":"6c3a8e13","t":3,"q":"Độ lệch điện áp cho phép tại điểm đấu nối với Khách hàng sử dụng điện trên lưới phân phối (chế độ bình thường) là:","o":["±10%","+10% và −05%","±05%","±03%"],"a":2,"c":"TT 05/2025, Điều 6 khoản 2 điểm d","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **±05%**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"d) Độ lệch điện áp vận hành cho phép tại điểm đấu nối vào lưới điện phân phối so với điện áp danh định như sau: - Tại điểm đấu nối với Khách hàng sử dụng điện là  05%; - Tại điểm đấu nối với nhà máy điện là + 10% và - 05%; …","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"","id":"5aa04049","t":3,"q":"Trong chế độ sự cố đơn lẻ hoặc khôi phục sự cố hệ thống phân phối, mức dao động điện áp cho phép trên lưới phân phối là:","o":["±20%","±05%","±10% so với điện áp danh định","±15%"],"a":2,"c":"TT 05/2025, Điều 6 khoản 3","w":"Quy định nêu rõ nội dung này nên đáp án đúng là **±10% so với điện áp danh định**. Xem trích nguyên văn bên dưới.","xh":"Điều 6. Điện áp","xb":"3. Trong chế độ sự cố đơn lẻ của lưới điện truyền tải, sự cố hệ thống phân phối điện hoặc khôi phục sự cố của hệ thống phân phối điện, cho phép mức dao động điện áp trên lưới điện phân phối trong khoảng  10% so với điện áp danh định.","k":"**Độ lệch điện áp bình thường**: 500 kV ±5%; 220 kV +10/−5%; thanh cái lưới phân phối +10/−5%; điểm đấu nối khách hàng ±5%; điểm đấu nối nhà máy +10/−5%. **Sự cố đơn lẻ hoặc khôi phục** lưới phân phối: ±10%.","old":0},{"m":"","id":"72aa3d11","t":3,"q":"Theo TT 05/2025, cấp điện áp Trung áp là cấp điện áp danh định:","o":["Trên 01 kV đến 35 kV","Trên 01 kV đến 110 kV","Từ 01 kV đến 35 kV","Trên 01 kV đến dưới 35 kV"],"a":0,"c":"TT 05/2025, Điều 3 khoản 4","w":"Phân cấp điện áp danh định: hạ áp đến 01 kV; **trung áp trên 01 kV đến 35 kV**; cao áp trên 35 kV đến 220 kV; siêu cao áp trên 220 kV. Lưới 22 kV của TP.HCM là trung áp. Lưu ý cận dưới là *trên* 01 kV, không phải *từ* 01 kV.","xh":"","xb":"","k":"Phân loại cấp điện áp (TT 05, Điều 3): **hạ áp** đến 01 kV; **trung áp** trên 01 kV đến 35 kV; **cao áp** trên 35 kV đến 220 kV; **siêu cao áp** trên 220 kV. **Lưới điện phân phối** có cấp điện áp đến 110 kV; **lưới điện truyền tải** trên 110 kV.","old":0},{"m":"Cao áp và siêu cao áp: 03%.","id":"53d0e7cf","t":3,"q":"Trong chế độ vận hành bình thường, thành phần thứ tự nghịch của điện áp pha không được vượt quá bao nhiêu đối với cấp trung áp và hạ áp?","o":["03%","05% điện áp danh định","1,5%","08%"],"a":1,"c":"TT 05/2025, Điều 7","w":"Đáp án đúng là **05% điện áp danh định**, khớp với quy định được trích bên dưới.","xh":"Điều 7. Cân bằng pha","xb":"1. Trong chế độ vận hành bình thường, thành phần thứ tự nghịch của điện áp pha không được vượt quá 03% điện áp danh định đối với cấp điện áp cao áp và siêu cao áp, hoặc 05 % điện áp danh định đối với cấp điện áp trung áp và hạ áp.","k":"**Chế độ vận hành HTĐ** (TT 05, Điều 76): **bình thường** – mang tải đường dây, MBA cao áp, siêu cao áp **dưới 90%** định mức; **cảnh báo** – từ **90%** trở lên nhưng không vượt định mức (hoặc dự phòng thấp, điện áp ngoài dải bình thường, nguy cơ thiên tai); **khẩn cấp** – vượt định mức nhưng dưới 110%, tần số hoặc điện áp ngoài dải bình thường nhưng trong dải sự cố đơn lẻ; **cực kỳ khẩn cấp** – mất ổn định, rã lưới.","old":0},{"m":"110 kV: 3,0%; hạ áp: 8,0%.","id":"662f5a07","t":3,"q":"Tổng biến dạng sóng hài điện áp (THD) tối đa cho phép ở cấp trung áp là:","o":["8,0%","3,0%","5,0%","6,5%"],"a":2,"c":"TT 05/2025, Điều 8, Bảng 4a","w":"THD điện áp tối đa ở cấp **trung áp là 5,0%** (110 kV: 3,0%; hạ áp: 8,0%), theo Bảng 4a Điều 8 TT 05/2025.","xh":"","xb":"","k":"**Cân bằng pha**: thứ tự nghịch ≤3% (cao áp, siêu cao áp); ≤5% (trung áp, hạ áp). **Sóng hài điện áp (THD)**: 500, 220 kV 3,0%; 110 kV 3,0% (riêng lẻ 1,5%); trung áp 5,0% (riêng lẻ 3,0%); hạ áp 8,0% (riêng lẻ 5,0%).","old":0},{"m":"","id":"25eb2e88","t":4,"q":"Chế độ nối đất trung tính lưới 22 kV theo TT 05/2025 là:","o":["Nối đất qua cuộn dập hồ quang","Nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây)","Trung tính cách ly","Nối đất qua trở kháng"],"a":1,"c":"TT 05/2025, Điều 11, Bảng 7","w":"Lưới 22 kV được nối đất trung tính **trực tiếp (3 pha 3 dây)** hoặc **nối đất lặp lại (3 pha 4 dây)** theo Bảng 7. Các cách nối đất qua trở kháng, cuộn dập hồ quang hoặc cách ly không phải chế độ quy định cho lưới 22 kV này.","xh":"","xb":"","k":"**Nối đất trung tính** (TT 05, Điều 11, Bảng 7): 500, 220, 110 kV nối đất trực tiếp; **35 kV** trung tính cách ly hoặc nối đất qua trở kháng; **22 kV, 15 kV** nối đất trực tiếp (3 pha 3 dây) hoặc nối đất lặp lại (3 pha 4 dây).","old":0},{"m":"","id":"c7638748","t":4,"q":"Dòng điện ngắn mạch lớn nhất cho phép và thời gian tối đa loại trừ sự cố bằng bảo vệ chính ở cấp 110 kV là:","o":["40 kA – 150 ms","50 kA – 100 ms","31,5 kA – 150 ms","25 kA – 500 ms"],"a":2,"c":"TT 05/2025, Điều 12, Bảng 8","w":"Ngắn mạch lớn nhất cho phép và thời gian loại trừ bằng bảo vệ chính: **110 kV là 31,5 kA – 150 ms**; **trung áp là 25 kA – 500 ms**. Cấp điện áp cao hơn thì thời gian loại trừ phải nhanh hơn.","xh":"","xb":"","k":"**Ik max và thời gian loại trừ sự cố bằng bảo vệ chính** (Điều 12, Bảng 8): 500 kV – 50 kA – 80 ms; 220 kV – 50 kA – 100 ms; **110 kV – 31,5 kA – 150 ms**; **trung áp – 25 kA – 500 ms**. Thanh cái 110 kV của trạm 500, 220 kV: **40 kA
